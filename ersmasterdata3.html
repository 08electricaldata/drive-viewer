<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pending Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f2f6ff;
}

/* ===== HEADER ===== */
.header-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #003f88;
  color: white;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  flex-wrap: wrap;
}

.header-bar button {
  background: white;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
}

.header-title {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

.version-info {
  background: rgba(255,255,255,0.2);
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.status-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
  margin-right: 4px;
}

/* ===== CONTENT ===== */
.container {
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  padding: 15px;
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.controls button,
.controls select {
  padding: 8px 14px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.controls select {
  background: white;
  color: #003f88;
  border: 1px solid #ccc;
}

/* ===== SUMMARY TOTAL ONLY ===== */
.summary-row{
  display:flex;
  justify-content:flex-end;
  margin: 0 0 12px;
}
.summary-card{
  background:#fff;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
  padding:8px 14px;
  min-width:140px;
  text-align:center;
  font-size:14px;
  font-weight:bold;
  color:#003f88;
}
.summary-card span{
  margin-right:6px;
}
.summary-card strong{
  font-size:18px;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}

/* STICKY HEADERS */
thead tr:nth-child(1) th {
  position: sticky;
  top: 56px;
  background: #003f88;
  color: white;
  z-index: 20;
}
thead tr:nth-child(2) th {
  position: sticky;
  top: 92px;
  background: #eaf1ff;
  z-index: 15;
}

tr:hover {
  background: #eef5ff;
  cursor: pointer;
}

.filter-row input {
  width: 100%;
  padding: 4px;
  font-size: 12px;
  box-sizing: border-box;
}

.section-row {
  background: #dbe9ff !important;
  font-weight: 600;
}

/* Problems column wrap */
th[data-col="Problems"],
td[data-col="Problems"]{
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  max-width: 360px;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media print {
  .header-bar, .controls, .filter-row { display: none; }
}
</style>
</head>

<body>

<div class="header-bar">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="openMotorOH()">🛠️ Motor O/H Data</button>
  <button onclick="openMotorPM()">🧾 Motor PM Status</button>
  <div class="header-title">PENDING DASHBOARD</div>
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</div>

<div class="container">
  <div class="card">

    <div class="controls">
      <select id="typeSelect">
        <option value="rewinding">Rewinding</option>
        <option value="overhauling">Overhauling</option>
        <option value="scrap">SCRAP</option>
      </select>
      <button onclick="exportExcel()">📄 Export Excel</button>
    </div>

    <div class="summary-row">
      <div class="summary-card">
        <span>Total</span>
        <strong id="totalCount">0</strong>
      </div>
    </div>

    <table id="dataTable">
      <thead>
        <tr id="headerRow"></tr>
        <tr class="filter-row" id="filterRow"></tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>
</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING SETUP ===== */
const VERSION_URL = 'https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json';
const AUTO_RELOAD_INTERVAL = 5 * 60 * 1000;

let currentVersion = '1.0.0';

const JSON_FILES_BASE = {
  rewinding: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/rewinding.json",
  overhauling: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/overhauling.json",
  scrap: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/scrap.json"
};

let currentData = [];
let headers = [];
let currentType = 'rewinding';

const select = document.getElementById("typeSelect");
const versionDisplayEl = document.getElementById("versionDisplay");
const headerRow = document.getElementById("headerRow");
const filterRow = document.getElementById("filterRow");

const desiredDisplayCols = [
  "W.O No",
  "kW",
  "Make",
  "Frame Size",
  "Mounting",
  "RPM",
  "Sl No",
  "Equipment details",
  "Problems",
  "Job Completion Dat"
];

const excludedNames = ["voltage","area","storage","remarks","priority","columno","priorityassigned"];

function normalize(s){
  return String(s || "").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
}

function buildDataUrl(type){
  return `${JSON_FILES_BASE[type]}?v=${currentVersion}`;
}

async function getVersion(){
  try {
    const res = await fetch(VERSION_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('Version fetch failed');
    const data = await res.json();
    currentVersion = data.version || '1.0.0';
    versionDisplayEl.textContent = currentVersion;
    console.log('Loaded version:', currentVersion);
  } catch(err) {
    console.warn('Failed to fetch version, using default:', err);
    currentVersion = '1.0.0';
    versionDisplayEl.textContent = currentVersion;
  }
}

async function loadData(type){
  currentType = type;
  try{
    const url = buildDataUrl(type);
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const json = await res.json();

    const rows = Array.isArray(json.data) ? json.data : [];

    currentData = rows
      .slice()
      .sort((a, b) => {
        const aRow = Number(a.rowNumber ?? 0);
        const bRow = Number(b.rowNumber ?? 0);

        if (aRow && bRow) return bRow - aRow; // newest first
        return 0;
      });

    if(currentData.length === 0){
      headers = [];
      render();
      return;
    }

    headers = Object.keys(currentData[0] || {});
    render();
  }catch(err){
    console.error("Error loading data:", err);
    currentData = [];
    headers = [];
    alert("Error loading data. Please refresh the page.");
    render();
  }
}

function findKeyMatch(displayName){
  const n = normalize(displayName);

  for(const h of headers){
    if(normalize(h) === n) return h;
  }

  for(const h of headers){
    if(normalize(h).includes(n) || n.includes(normalize(h))) return h;
  }

  const tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  for(const h of headers){
    const hn = normalize(h);
    if(tokens.every(t => hn.includes(t))) return h;
  }

  return null;
}

function buildOrderedKeys(){
  const orderedKeys = [];

  for(const display of desiredDisplayCols){
    if(display.toLowerCase() === "job completion dat" && currentType === 'scrap'){
      if(headers && headers.length > 11 && headers[11]) {
        orderedKeys.push(headers[11]);
        continue;
      }
    }

    if(display.toLowerCase() === "problems"){
      const candidateNames = [
        "Motor Location Update On",
        "Motor Location Update",
        "Motor Location",
        "Motor Location Updated On",
        "motorlocationupdateon",
        "problem",
        "problems",
        "issue",
        "description"
      ];

      let found = null;
      for(const c of candidateNames){
        found = findKeyMatch(c);
        if(found) break;
      }
      orderedKeys.push(found || findKeyMatch(display) || null);
      continue;
    }

    orderedKeys.push(findKeyMatch(display) || null);
  }

  return orderedKeys.map(k => {
    if(!k) return k;
    const kn = normalize(k);
    for(const ex of excludedNames){
      if(kn.includes(ex)) return null;
    }
    return k;
  });
}

function getVisibleKeysAndLabels(){
  const mappedOrderedKeys = buildOrderedKeys();
  const allNull = mappedOrderedKeys.every(k => k === null);

  let keysForTable = [];
  let labelsForTable = [];

  if(allNull){
    keysForTable = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    labelsForTable = keysForTable.slice();
  } else {
    for(let i = 0; i < desiredDisplayCols.length; i++){
      const key = mappedOrderedKeys[i];
      if(key === null) continue;
      keysForTable.push(key);
      labelsForTable.push(desiredDisplayCols[i]);
    }
  }

  return { keysForTable, labelsForTable };
}

function buildHeaderAndFilterRow(keys, labels){
  headerRow.innerHTML = "";
  filterRow.innerHTML = "";

  keys.forEach((key, index) => {
    const display = labels[index] || key;

    const th = document.createElement("th");
    th.textContent = display;
    th.setAttribute("data-col", display);
    headerRow.appendChild(th);

    const filterCell = document.createElement("th");
    const input = document.createElement("input");
    input.placeholder = "🔍";
    input.dataset.key = key;
    input.dataset.label = display;

    input.addEventListener("keyup", render);
    filterCell.appendChild(input);
    filterRow.appendChild(filterCell);
  });
}

function columnFilterMatches(row, key, filterValue){
  if(!filterValue) return true;
  const v = String(row[key] ?? "").toLowerCase();
  return v.includes(filterValue.toLowerCase());
}

function applyColumnFilters(data){
  const filterInputs = [...document.querySelectorAll("#filterRow input")];
  if (filterInputs.length === 0) return data;

  return data.filter(row => {
    return filterInputs.every(input => {
      const key = input.dataset.key;
      const filterValue = (input.value || "").trim();
      return columnFilterMatches(row, key, filterValue);
    });
  });
}

function render(){
  const { keysForTable, labelsForTable } = getVisibleKeysAndLabels();
  const filteredData = applyColumnFilters(currentData);

  buildHeaderAndFilterRow(keysForTable, labelsForTable);

  const tbody = document.querySelector("#dataTable tbody");
  if(!filteredData || filteredData.length === 0){
    tbody.innerHTML = "<tr><td colspan='" + keysForTable.length + "' style='padding:12px;text-align:center'>No Data</td></tr>";
    document.getElementById("totalCount").innerText = 0;
    return;
  }

  tbody.innerHTML = "";
  filteredData.forEach(row => {
    const tr = document.createElement("tr");

    keysForTable.forEach((key, i) => {
      const td = document.createElement("td");
      let val = row[key] ?? "";

      const label = labelsForTable[i] || key;
      const normalizedHeader = normalize(label);

      if(String(val).toUpperCase().includes("COMPLETED")){
        td.innerHTML = `<span class="badge completed">${escapeHtml(val)}</span>`;
      } else if(/problem|issue|description|motorlocation|remarks|comment/.test(normalizedHeader)){
        td.setAttribute("data-col", "Problems");
        td.textContent = val;
      } else {
        td.setAttribute("data-col", label);
        td.textContent = val;
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  document.getElementById("totalCount").innerText = filteredData.length;
}

function exportExcel(){
  const { keysForTable, labelsForTable } = getVisibleKeysAndLabels();
  const visibleData = applyColumnFilters(currentData);

  let csv = [];
  csv.push(labelsForTable.map(label => `"${escapeCSV(label)}"`).join(","));

  visibleData.forEach(row => {
    const line = keysForTable.map(key => {
      const val = row[key] ?? "";
      return `"${escapeCSV(String(val))}"`;
    }).join(",");
    csv.push(line);
  });

  const a = document.createElement("a");
  const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = "pending_dashboard.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeCSV(s){
  return s.replace(/"/g,'""');
}

function goHome() {
  window.location.href = "https://08electricaldata.github.io/";
}
function goBack() {
  history.back();
}
function openMotorOH(){
  window.location.href = "https://08electricaldata.github.io/drive-viewer/motoroh.html";
}
function openMotorPM(){
  window.location.href = "https://08electricaldata.github.io/drive-viewer/motorpm.html";
}

/* Initialize: fetch version first, then load data */
async function init(){
  await getVersion();
  await loadData(select.value);

  setInterval(async () => {
    console.log('Auto-refreshing data...');
    await getVersion();
    await loadData(select.value);
  }, AUTO_RELOAD_INTERVAL);
}

select.addEventListener("change", () => loadData(select.value));
init();
</script>

</body>
</html>
