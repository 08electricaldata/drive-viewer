<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
  margin: 0; 
  background: #f2f6ff; 
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.header-bar {
  position: sticky; 
  top: 0; 
  z-index: 1000;
  background: #003f88;
  padding: 8px 8px;
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.header-left {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
}

.header-title { 
  flex: 1; 
  text-align: center; 
  padding: 0 10px;
}

.header-title h2 { 
  margin: 0; 
  color: #ffffff; 
  font-size: 16px;
  font-weight: 600;
}

.header-title small { 
  display: none; 
  font-size: 11px; 
  font-weight: 600;
  color: #e0e0e0;
}

.icon-btn {
  background: #ffffff;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.icon-btn:active {
  transform: scale(0.95);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.container { 
  padding: 10px 8px; 
  max-width: 100%;
  margin: 0 auto;
}

.card {
  background: #fff; 
  padding: 14px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  margin-bottom: 10px;
}

.card h3 {
  margin: 0 0 12px 0;
  color: #003f88;
  font-size: 16px;
  font-weight: 600;
  word-break: break-word;
}

.label { 
  font-weight: 600; 
  color: #003f88; 
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}

.grid p {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
  word-break: break-word;
}

.grid p span {
  display: block;
  margin-bottom: 2px;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.action-btn {
  padding: 10px 8px;
  background: #003f88;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  white-space: normal;
  text-align: center;
  word-break: break-word;
  line-height: 1.2;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.action-btn:active {
  transform: scale(0.98);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.action-btn:disabled {
  background: #cccccc;
  cursor: not-allowed;
  opacity: 0.6;
}

.badge {
  color: #d32f2f;
  font-weight: 600;
  margin-top: 6px;
  font-size: 12px;
  padding: 4px 6px;
  background: #ffebee;
  border-radius: 4px;
  border-left: 3px solid #d32f2f;
}

.loading {
  text-align: center;
  padding: 40px 20px;
  font-size: 14px;
  color: #003f88;
}

.not-found {
  text-align: center;
  padding: 40px 20px;
  font-size: 14px;
  color: #d32f2f;
}

@media(max-width:480px){
  .header-bar {
    padding: 6px 6px;
  }

  .icon-btn {
    padding: 6px 8px;
    font-size: 12px;
  }

  .container {
    padding: 8px 6px;
  }

  .card {
    padding: 12px;
    border-radius: 8px;
  }

  .card h3 {
    font-size: 15px;
    margin-bottom: 10px;
  }

  .grid {
    gap: 10px;
  }

  .grid p {
    font-size: 12px;
  }

  .label {
    font-size: 12px;
  }

  .action-row {
    gap: 6px;
  }

  .action-btn {
    padding: 9px 6px;
    font-size: 11px;
  }
}

@media(min-width: 768px){
  .container {
    max-width: 600px;
  }

  .grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="header-bar">
  <div class="header-left">
    <button class="icon-btn" onclick="goHome()">🏠</button>
    <button class="icon-btn" onclick="goBack()">⬅</button>
    <button class="icon-btn" onclick="addJob()">➕</button>
  </div>
  <div class="header-title">
    <h2>Equipment Info</h2>
    <small>By Rakesh Chandra Sethy</small>
  </div>
</div>

<div class="container">
  <div id="content" class="loading">Loading data…</div>
</div>

<script>
const DRIVE_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

const DRAWING_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drawings/drawings.json";

const PLC_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/plc/plc.json";

const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/";

let drawingAvailableMap = {};
let plcAvailableMap = {};

// SLD maps
let sldBoardMap = {}; // normalized breakerId -> boardId (for boards_sld.json)
let sldLTMap = {};    // normalized drive token -> boardId (for lt_sld.json)

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

function goHome(){ location.href="https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }

/* ===== ADD JOB ===== */
function addJob(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;
  location.href =
  "https://08electricaldata.github.io/qrsubmit.html?id=" +
  encodeURIComponent(id);
}

/* ===== DRAWING OPEN (on-demand check) ===== */
async function openDrawings(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // If we already checked availability for this id
  if(drawingAvailableMap.hasOwnProperty(id)){
    if(drawingAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
    return;
  }

  // Otherwise check DRAWING_JSON on demand
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    let hasDrawing = false;
    j.rows.forEach(item=>{
      const iid = normalize(item.id);
      if(iid !== id) return;

      const found = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      if(found) hasDrawing = true;
    });

    drawingAvailableMap[id] = hasDrawing;

    if(hasDrawing){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
  }catch(e){
    alert("Error checking drawings");
  }
}

/* ===== PLC OPEN (on-demand check) ===== */
async function openPLC(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  if(plcAvailableMap.hasOwnProperty(id)){
    if(plcAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
    return;
  }

  try{
    const j = await (await fetch(PLC_JSON)).json();
    const exists = Object.keys(j.drives || {}).some(k => normalize(k) === id);
    plcAvailableMap[id] = exists;

    if(exists){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
  }catch(e){
    alert("Error checking PLC availability");
  }
}

/* ===== MOTOR DATA OPEN (on-demand check) ===== */
async function openMotorData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  try{
    const j = await (await fetch(DRIVE_JSON)).json();
    const c = j.rows.find(
      r => normalize(`${r[1]}-${r[2]}`) === id
    );

    if(c){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/motordata.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Motor Data Available");
    }
  }catch(e){
    alert("Error checking Motor Data");
  }
}

/* ===== PLC LADDER OPEN (on-demand check) ===== */
async function openPLCLadder(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  if(plcAvailableMap.hasOwnProperty(id)){
    if(plcAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/plcladder.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Ladder Available");
    }
    return;
  }

  try{
    const j = await (await fetch(PLC_JSON)).json();
    const exists = Object.keys(j.drives || {}).some(k => normalize(k) === id);
    plcAvailableMap[id] = exists;

    if(exists){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/plcladder.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Ladder Available");
    }
  }catch(e){
    alert("Error checking PLC ladder availability");
  }
}

/* ===== SLD OPEN (on-demand check) ===== */
async function openSLD(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Priority 1: boards_sld.json (breakerId mapping)
  if(sldBoardMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/mobile/sld.html?id=" +
      encodeURIComponent(sldBoardMap[id]);
    return;
  }

  // Priority 2: lt_sld.json (drive mapping)
  if(sldLTMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/mobile/sld3.html?id=" +
      encodeURIComponent(sldLTMap[id]);
    return;
  }

  // If we already have map entries but not this id, show not found
  const mapsHaveEntries = Object.keys(sldBoardMap).length > 0 || Object.keys(sldLTMap).length > 0;
  if(mapsHaveEntries && !sldBoardMap[id] && !sldLTMap[id]){
    alert("No LOC found for this ID.");
    return;
  }

  // Otherwise load SLD maps on demand then check again
  try{
    await preloadSLD();
    if(sldBoardMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/sld.html?id=" +
        encodeURIComponent(sldBoardMap[id]);
      return;
    }
    if(sldLTMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/sld3.html?id=" +
        encodeURIComponent(sldLTMap[id]);
      return;
    }
    alert("No LOC found for this ID.");
  }catch(e){
    alert("Error checking LOC availability");
  }
}

/* ===== PRELOAD DRAWINGS ===== */
async function preloadDrawings(){
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    j.rows.forEach(item=>{
      const id = normalize(item.id);
      if(!id) return;

      const hasDrawing = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      drawingAvailableMap[id] = hasDrawing;
    });
  }catch(e){}
}

/* ===== PRELOAD PLC ===== */
async function preloadPLC(){
  try{
    const j = await (await fetch(PLC_JSON)).json();
    Object.keys(j.drives || {}).forEach(id=>{
      plcAvailableMap[normalize(id)] = true;
    });
  }catch(e){}
}

/* ===== PRELOAD SLDs (robust) ===== */
async function preloadSLD(){
  const BOARDS_SLD_JSON =
    "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/sld/boards_sld.json";
  const LT_SLD_JSON =
    "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/sld/lt_sld.json";

  // Helper to split and normalize tokens from a possibly multiline/compound string
  function extractTokens(value){
    if(!value) return [];
    return String(value)
      .split(/[\n,\/;]+/) // split by newline, comma, slash, semicolon
      .map(t=>t.trim())
      .filter(Boolean)
      .map(t=>normalize(t));
  }

  // 1) Parse boards_sld.json -> map breakerId (from outgoings/incomers/busCouplers/linePT/busPT etc) to boardId
  try{
    const jb = await (await fetch(BOARDS_SLD_JSON)).json();
    const boardsObj = jb.boards || jb.rows || jb;
    if(boardsObj && typeof boardsObj === "object"){
      Object.keys(boardsObj).forEach(boardKey=>{
        const board = boardsObj[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        const arraysToScan = [
          "outgoings", "incomers", "dgIncomers", "emergencyIncomers",
          "busCouplers", "busPT", "linePT", "devices", "feeders"
        ];

        arraysToScan.forEach(field=>{
          const arr = board[field];
          if(Array.isArray(arr)){
            arr.forEach(entry=>{
              if(!entry) return;
              const possible = entry.breakerId || entry.breaker || entry.id || entry.BREAKERID || "";
              const tokens = extractTokens(possible);
              tokens.forEach(tok => sldBoardMap[tok] = boardId);
            });
          }
        });

        // broad scan for token-like strings inside the board
        try{
          const txt = JSON.stringify(board);
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              if(t.length > 2) sldBoardMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // silent
  }

  // 2) Parse lt_sld.json -> boards -> sections -> items -> driveid tokens map to boardId
  try{
    const jl = await (await fetch(LT_SLD_JSON)).json();
    const boards = jl.boards || jl.rows || jl;
    if(boards && typeof boards === "object"){
      Object.keys(boards).forEach(boardKey=>{
        const board = boards[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        const sections = board.sections || board.section || {};
        Object.values(sections).forEach(sectionArr=>{
          if(!Array.isArray(sectionArr)) return;
          sectionArr.forEach(item=>{
            if(!item) return;
            const drv = item.driveid || item.driveId || item.drive || item.DRIVEID || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        });

        const devices = board.devices || board.feeders || [];
        if(Array.isArray(devices)){
          devices.forEach(d=>{
            if(!d) return;
            const drv = d.driveid || d.driveId || d.drive || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        }

        // broad scan for tokens inside board JSON
        try{
          const txt = JSON.stringify(board);
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              if(t.length > 2) sldLTMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // silent
  }
}

function parseDate(v){
  if(!v) return null;
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const[d,m,y]=v.split("/");
    return new Date(y,m-1,d);
  }
  return new Date(v);
}

function fmt(d){
  if(!d || isNaN(d)) return "NO RECORDS";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* ===== LAST DATES ===== */
async function lastDates(id,map){
  const res={};
  Object.keys(map).forEach(k=>res[k]=null);

  for(const y of HISTORY_YEARS){
    try{
      const j = await (await fetch(HISTORY_BASE + y + ".json")).json();
      j.rows.forEach(r=>{
        if(normalize(`${r[2]}-${r[3]}`) !== id) return;

        const job = normalize(r[7]);
        const d = parseDate(r[4]);

        Object.entries(map).forEach(([k,v])=>{
          if(job === normalize(v) && (!res[k] || d > res[k])) {
            res[k] = d;
          }
        });
      });
    }catch(e){}
  }

  Object.keys(res).forEach(
    k => res[k] = res[k] ? fmt(res[k]) : "NO RECORDS"
  );
  return res;
}

function formatDDMMYYYY(v){
  if(!v) return "NO RECORDS";
  const d = new Date(v);
  if(isNaN(d)) return v;
  const day = String(d.getDate()).padStart(2,"0");
  const month = String(d.getMonth()+1).padStart(2,"0");
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
}

/* ===== LOAD DATA ===== */
async function loadData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  const j = await (await fetch(DRIVE_JSON)).json();
  const c = j.rows.find(
    r => normalize(`${r[1]}-${r[2]}`) === id
  );

  if(!c){
    content.innerHTML =
      "<div class='not-found'>Equipment data not found… opening history…</div>";
    setTimeout(()=>{
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" +
        encodeURIComponent(id);
    }, 800);
    return;
  }

  const TYPE = normalize(c[1]);

  if(TYPE === "TRANSFORMER") showTransformer(c,id);
  else if(TYPE === "BREAKER") showBreaker(c,id);
  else showMotor(c,id);
}

/* ===== APPLY BUTTON STATE ===== */
function applyButtonState(id){
  const drawBtn = document.getElementById("drawBtn");
  const plcBtn = document.getElementById("plcBtn");
  const sldBtn = document.getElementById("sldBtn");

  // Only disable if we explicitly know availability=false
  if(drawBtn && drawingAvailableMap.hasOwnProperty(id) && !drawingAvailableMap[id]){
    drawBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="No Drawing";
    drawBtn.parentNode.insertBefore(badge, drawBtn.nextSibling);
  }

  if(plcBtn && plcAvailableMap.hasOwnProperty(id) && !plcAvailableMap[id]){
    plcBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="No PLC Data";
    plcBtn.parentNode.insertBefore(badge, plcBtn.nextSibling);
  }

  if(sldBtn){
    const boardKnown = sldBoardMap.hasOwnProperty(id);
    const ltKnown = sldLTMap.hasOwnProperty(id);
    if(boardKnown || ltKnown){
      const hasBoard = !!sldBoardMap[id];
      const hasLT = !!sldLTMap[id];
      if(!hasBoard && !hasLT){
        sldBtn.disabled = true;
        const badge = document.createElement("div");
        badge.className="badge";
        badge.innerText="No LOC";
        sldBtn.parentNode.insertBefore(badge, sldBtn.nextSibling);
      }
    }
  }
}

function openHistory(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" +
  encodeURIComponent(id);
}

/* ===== MOTOR ===== */
async function showMotor(c,id){
  content.innerHTML = `
  <div class="card">
    <h3>${c[1]} – ${c[2]}</h3>
    <div class="grid">
      <p><span class="label">Rating:</span> ${c[5]} KW</p>
      <p><span class="label">FLC:</span> ${c[10]} A</p>
      <p><span class="label">SFU:</span> ${c[14]}</p>
      <p><span class="label">Fuse:</span> ${c[15]}</p>
      <p><span class="label">Contactor:</span> ${c[16]}</p>
      <p><span class="label">Relay/VFD:</span> ${c[17]}</p>
      <p><span class="label">CT (M):</span> ${c[18]}</p>
      <p><span class="label">CT (P):</span> ${c[19]}</p>
      <p><span class="label">Aux Contactor:</span> ${c[20]}</p>
      <p><span class="label">Ammeter:</span> ${c[21]}</p>
      <p><span class="label">Ind Lamp:</span> ${c[22]}</p>
      <p><span class="label">Spare Motors:</span> ${c[23]}</p>
      <p><span class="label">Motor Repl:</span> ${formatDDMMYYYY(c[37])}</p>
      <p><span class="label">Motor PM:</span> ${formatDDMMYYYY(c[38])}</p>
      <p><span class="label">Module PM:</span> ${formatDDMMYYYY(c[39])}</p>
      <p><span class="label">VFD PM:</span> ${formatDDMMYYYY(c[40])}</p>
      <p><span class="label">Low Current:</span> ${c[41]} A</p>

    </div>

    <div class="action-row">

      <button class="action-btn" onclick="openPLCLadder()">⚙ Ladder</button>
      <button class="action-btn" onclick="openMotorData()">🛠 Motor</button>
      <button class="action-btn" id="sldBtn" onclick="openSLD()">🗺️ LOC</button>
      <button class="action-btn" onclick="addJob()">➕ Job</button>
    </div>
  </div>`;

  applyButtonState(id);

/* ===== TRANSFORMER ===== */
async function showTransformer(c,id){
  const t = await lastDates(id,{
    pm:"TRANSFORMER PM",
    oh:"TRANSFORMER O/H",
    leak:"TRANSFORMER L/A",
    top:"OIL TUPOP",
    chk:"T/F OIL CHECK"
  });
