<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Industrial LT MCC Layout - Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  font-family:Arial, sans-serif;
  margin:0;
  background:#f2f6ff;
  padding:0;
}

/* HEADER - Mobile optimized */
.header{
  background:#003f88;
  color:white;
  padding:12px 14px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  position:sticky;
  top:0;
  z-index:200;
  display:flex;
  align-items:center;
  gap:10px;
}

.header-left{
  display:flex;
  gap:8px;
}

.header-content{
  flex:1;
  text-align:center;
}

.header-title{
  font-size:16px;
  font-weight:700;
  margin:0;
}

.subtitle{
  font-size:11px;
  margin-top:2px;
  font-weight:500;
  opacity:.9;
}

/* NAV BUTTONS - Mobile stacked */
.nav-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.nav-btn{
  background:white;
  color:#003f88;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:all .2s ease;
  flex:1;
  min-width:80px;
}

.nav-btn:active{
  background:#ffd633;
  transform:scale(0.98);
}

/* PAGE WRAPPER */
.page{
  padding:12px;
  max-width:100%;
}

/* CONTROLS */
.controls{
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  display:flex;
  gap:8px;
  align-items:center;
}

.controls input, .controls select{
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
  background:white;
  font-size:14px;
  flex:1;
}

/* BOARD AREA - Vertical stack on mobile */
#boardWrapper{
  overflow:auto;
  padding:0;
}

#boardContainer{
  display:flex;
  flex-direction:column;
  gap:12px;
  align-items:stretch;
}

/* SECTIONS - Mobile optimized */
.section{
  background:white;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  width:100%;
  min-height:auto;
}

.section-title{
  background:#003f88;
  color:white;
  text-align:center;
  font-weight:bold;
  padding:10px;
  font-size:13px;
  letter-spacing:.5px;
  flex-shrink:0;
  border-radius:8px 8px 0 0;
}

/* CELLS CONTAINER */
.section-cells{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:8px;
  padding:8px;
}

@media (max-width:600px){
  .section-cells{
    grid-template-columns:repeat(2, 1fr);
  }
}

@media (max-width:400px){
  .section-cells{
    grid-template-columns:1fr;
  }
}

/* BASE CELL */
.cell{
  border:3px solid #333;
  padding:10px;
  font-size:11px;
  border-radius:6px;
  cursor:default;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  min-height:100px;
  
  box-shadow:0 4px 8px rgba(0,0,0,.2);
  transition:all .2s ease;
}

.cell:active{
  transform:scale(0.98);
  box-shadow:0 2px 4px rgba(0,0,0,.15);
}

.cell.clickable{
  cursor:pointer;
}

.cell.clickable:active{
  transform:scale(0.95);
}

.incomer-box, .breaker-font{
  font-size:12px;
  font-weight:bold;
}

/* STATUS - SWAPPED: OFF is GREEN, ON is RED */
.status-on{
  border:4px solid #cc0000 !important;
  background: linear-gradient(180deg, rgba(255,200,200,0.15), rgba(255,255,255,0.05));
  box-shadow:0 6px 14px rgba(170,0,0,0.22), inset 0 4px 8px rgba(200,0,0,0.08);
  animation:glowPulseRed 2s infinite;
}

@keyframes glowPulseRed{
  0%{box-shadow:0 6px 14px rgba(170,0,0,0.15), inset 0 4px 8px rgba(200,0,0,0.06);}
  50%{box-shadow:0 10px 20px rgba(200,0,0,0.25), inset 0 6px 12px rgba(220,0,0,0.10);}
  100%{box-shadow:0 6px 14px rgba(170,0,0,0.15), inset 0 4px 8px rgba(200,0,0,0.06);}
}

.status-off{
  border:4px solid #00aa00 !important;
  background: linear-gradient(180deg, rgba(200,255,200,0.15), rgba(255,255,255,0.05));
  box-shadow:0 6px 14px rgba(0,150,0,0.22), inset 0 4px 8px rgba(0,120,0,0.10);
  animation:glowPulseGreen 2s infinite;
}

@keyframes glowPulseGreen{
  0%{box-shadow:0 6px 14px rgba(0,150,0,0.15), inset 0 4px 8px rgba(0,120,0,0.06);}
  50%{box-shadow:0 10px 20px rgba(0,180,0,0.25), inset 0 6px 12px rgba(0,140,0,0.10);}
  100%{box-shadow:0 6px 14px rgba(0,150,0,0.15), inset 0 4px 8px rgba(0,120,0,0.06);}
}

/* Colors for feeder types */
.incomer{ background:#ff4d4d; color:#fff; }
.coupler{ background:#ffd633; color:#000; }
.outgoing-breaker{ background:#ff944d; color:#000; }
.outgoing-dol{ background:#1e90ff; color:#ffffff; }
.outgoing-mccb{ background:#b366ff; color:#fff; }
.outgoing-sfu{ background:#0d9488; color:#ffffff; }
.outgoing-acb{ background:#7b0f1a; color:#ffffff; }
.control-transformer{ background:#557a2b; color:#ffffff; }
.spare{ background:#e0e0e0; color:#333; }
.spare-dol{ background: linear-gradient(180deg,#fff3e0,#ffd6b3); color:#6b3f00; border:2px dashed #ffb86b; }
.spare-sfu{ background: linear-gradient(180deg,#e9f8ff,#cfefff); color:#004862; border:2px dashed #5fbfe6; }

/* COUPLER BRIDGE - Hidden on mobile */
.coupler-bridge{
  display:none;
}

/* PRINT STYLES */
@media print {
  .nav-buttons, .controls { display:none !important; }
  .header { box-shadow:none; }
  .section { box-shadow:none; }
  body { background:white; padding:0; }
  .page { padding:8px; }
  .section-cells { gap:4px; }
  .cell { min-height:80px; }
}

/* TABLET VIEW */
@media (min-width:768px){
  .section-cells{
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  }
  
  .header-title{
    font-size:18px;
  }
  
  .cell{
    min-height:110px;
    font-size:12px;
  }
}

/* SMALL PHONE */
@media (max-width:360px){
  .header{
    padding:10px 8px;
    gap:6px;
  }
  
  .header-title{
    font-size:14px;
  }
  
  .nav-btn{
    padding:6px 10px;
    font-size:11px;
  }
  
  .page{
    padding:8px;
  }
  
  .controls{
    padding:8px;
    gap:4px;
  }
  
  .section-cells{
    gap:6px;
    padding:6px;
  }
  
  .cell{
    min-height:90px;
    padding:8px;
    font-size:10px;
    border:2px solid #333;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header" role="banner">
  <div class="header-left">
    <button class="nav-btn" onclick="goBack()">⬅ Back</button>
    <button class="nav-btn" onclick="goHome()">🏠 Home</button>
  </div>
  <div class="header-content">
    <div class="header-title" id="title">LT MCC Layout</div>
    <div class="subtitle">By Rakesh Chandra Sethy</div>
  </div>
</div>

<!-- PAGE -->
<div class="page">
  
  <!-- CONTROLS -->
  <div class="controls" role="region" aria-label="actions">
    <button class="nav-btn" onclick="downloadExcel()" style="flex:0.5">📊 Excel</button>
    <button class="nav-btn" onclick="printA4()" style="flex:0.5">🖨️ Print</button>
    <button class="nav-btn" onclick="refresh()" style="flex:0.5">⤻ Refresh</button>
  </div>

  <!-- BOARD AREA -->
  <div id="boardWrapper">
    <div id="boardContainer" role="region" aria-label="Board layout"></div>
  </div>

</div>

<script>
function goHome(){
  window.location.href="https://08electricaldata.github.io/index_mob.html";
}

function goBack(){
  window.history.back();
}

const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/sld/lt_sld.json";

function getParam(n){
  return new URL(location.href).searchParams.get(n);
}

function norm(s){
  if(!s && s!==0) return "";
  return String(s).toUpperCase().replace(/[\s\-]+/g,'').replace(/_/g,'');
}

function escapeHtml(str){
  if(!str) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function parseDriveId(raw){
  if(raw === null || raw === undefined) return { displayText: "", linkId: null };
  const s = String(raw).trim();
  const m = s.match(/<\s*([^>]+)\s*>/);
  if(m){
    const linkId = m[1].trim();
    const display = s.replace(/<\s*[^>]+\s*>/g, "").replace(/\s+/g," ").trim();
    return { displayText: display || linkId, linkId: linkId };
  } else {
    return { displayText: s, linkId: null };
  }
}

/* Excel export helpers */
function hexToARGB(hex){
  if(!hex) return "FFFFFFFF";
  hex = hex.trim();
  if(hex[0]==='#') hex = hex.slice(1);
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  hex = hex.toUpperCase();
  return "FF" + hex;
}

function visualColorForDeviceByClasses(classes){
  if(classes.includes('incomer')) return '#ff4d4d';
  if(classes.includes('coupler')) return '#ffd633';
  if(classes.includes('outgoing-breaker')) return '#ff944d';
  if(classes.includes('outgoing-dol')) return '#1e90ff';
  if(classes.includes('outgoing-mccb')) return '#b366ff';
  if(classes.includes('outgoing-sfu')) return '#0d9488';
  if(classes.includes('outgoing-acb')) return '#7b0f1a';
  if(classes.includes('control-transformer')) return '#557a2b';
  if(classes.includes('spare-dol')) return '#ffd6b3';
  if(classes.includes('spare-sfu')) return '#e9f8ff';
  if(classes.includes('spare')) return '#e0e0e0';
  return '#ffffff';
}

function statusBorderColorByClasses(classes){
  return classes.includes('status-on') ? '#cc0000' : '#00aa00';
}

function loadScript(src, timeoutMs = 10000){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    let timedOut = false;
    const to = setTimeout(()=>{ timedOut = true; s.onerror = s.onload = null; s.remove(); reject(new Error('timeout')); }, timeoutMs);
    s.onload = ()=>{ if(timedOut) return; clearTimeout(to); resolve(); };
    s.onerror = (e)=>{ if(timedOut) return; clearTimeout(to); reject(new Error('error')); };
    s.src = src;
    document.head.appendChild(s);
  });
}

async function ensureXLSX(){
  if(window.XLSX) return window.XLSX;
  const cdns = [
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.7/dist/xlsx.full.min.js",
    "https://unpkg.com/xlsx@0.18.7/dist/xlsx.full.min.js"
  ];
  let lastErr = null;
  for(const url of cdns){
    try{
      await loadScript(url, 10000);
      if(window.XLSX) return window.XLSX;
    }catch(e){ lastErr = e; }
  }
  throw new Error('Failed to load SheetJS');
}

function exportAsHtmlXls(filename, sections){
  let html = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>';
  html += 'table{ border-collapse:collapse; } td, th { border:1px solid #444; padding:6px; vertical-align:middle; text-align:center; } ';
  html += '</style></head><body>';
  html += '<table><thead><tr>';
  for(const sec of sections){
    html += '<th style="background:#003f88;color:#fff;">' + escapeHtml(sec.title) + '</th>';
  }
  html += '</tr></thead><tbody>';
  const maxRows = Math.max(0, ...sections.map(s=>s.cells.length));
  for(let r=0;r<maxRows;r++){
    html += '<tr>';
    for(const sec of sections){
      const cell = sec.cells[r];
      if(!cell){ html += '<td></td>'; continue; }
      const bg = visualColorForDeviceByClasses(cell.classes);
      const borderColor = statusBorderColorByClasses(cell.classes);
      const style = 'background:' + bg + '; border:2px solid ' + borderColor + ';';
      const content = escapeHtml(cell.text).replace(/\n/g,'<br/>');
      html += '<td style="' + style + '">' + content + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></body></html>';

  const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.xls') ? filename : (filename + '.xls');
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000);
}

async function downloadExcel(){
  const boardId = getParam('id');
  if(!boardId){ alert('Board id missing in URL'); return; }

  const secEls = Array.from(document.querySelectorAll('#boardContainer > .section'));
  if(secEls.length === 0){
    alert('Nothing rendered yet to export.');
    return;
  }
  
  const sections = secEls.map((secEl, idx)=> {
    const titleEl = secEl.querySelector('.section-title');
    const title = titleEl ? titleEl.innerText : ('SECTION ' + (idx+1));
    const cells = Array.from(secEl.querySelectorAll('.cell')).map(c => ({ text: c.innerText || c.textContent || '', classes: Array.from(c.classList || []) }));
    return { title, cells };
  });

  try{
    await ensureXLSX();
    const ws = {};
    const colsCount = sections.length;
    const maxRows = Math.max(0, ...sections.map(s=>s.cells.length));
    const range = { s: { c:0, r:0 }, e: { c: Math.max(0, colsCount-1), r: Math.max(0, maxRows) } };
    ws['!cols'] = sections.map(()=> ({ wch: 28 }) );

    sections.forEach((sec, cidx)=>{
      const addr = XLSX.utils.encode_cell({c:cidx, r:0});
      ws[addr] = { v: sec.title, t: 's', s: {
        font: { bold: true, color: { rgb: hexToARGB('#FFFFFF') } },
        fill: { fgColor: { rgb: hexToARGB('#003f88') } },
        alignment: { horizontal:'center', vertical:'center', wrapText:true }
      }};
      for(let r=0;r<maxRows;r++){
        const a = XLSX.utils.encode_cell({c:cidx, r: r+1});
        const cell = sec.cells[r];
        if(!cell){
          ws[a] = { v:"", t:'s', s: { alignment: { horizontal:'center', vertical:'center' } } };
          continue;
        }
        const bg = visualColorForDeviceByClasses(cell.classes);
        const border = statusBorderColorByClasses(cell.classes);
        ws[a] = { v: cell.text, t: 's', s: {
          alignment:{ horizontal:'center', vertical:'center', wrapText:true },
          fill: { fgColor: { rgb: hexToARGB(bg) } },
          border: {
            top: { style:'thin', color:{ rgb: hexToARGB(border) } },
            bottom: { style:'thin', color:{ rgb: hexToARGB(border) } },
            left: { style:'thin', color:{ rgb: hexToARGB(border) } },
            right: { style:'thin', color:{ rgb: hexToARGB(border) } }
          },
          font: { bold:true, color:{ rgb: hexToARGB('#222222') } }
        }};
      }
    });

    ws['!ref'] = XLSX.utils.encode_range(range);
    const rows = [{ hpt:22 }];
    for(let i=0;i<maxRows;i++) rows.push({ hpt:48 });
    ws['!rows'] = rows;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Board-' + boardId);
    const filename = 'Board-' + boardId + '.xlsx';
    XLSX.writeFile(wb, filename);
  }catch(err){
    console.warn('SheetJS failed, falling back:', err);
    try{
      const filename = 'Board-' + boardId + '.xls';
      exportAsHtmlXls(filename, sections);
    }catch(e2){
      alert('Failed to generate Excel');
    }
  }
}

function printA4(){
  const container = document.getElementById('boardContainer');
  if(!container){ alert('Board not found'); return; }

  const sections = Array.from(document.querySelectorAll('#boardContainer > .section')).map(s=>s.cloneNode(true));
  if(sections.length === 0){ alert('No sections to print.'); return; }

  let headHtml = '';
  document.querySelectorAll('style').forEach(s=> headHtml += '<style>' + s.innerHTML + '</style>');
  headHtml += '<style> @page { size: A4; margin: 10mm; } .nav-buttons, .controls { display:none !important; } </style>';

  const newWin = window.open('', '_blank');
  if(!newWin){ alert('Popup blocked'); return; }

  const headerHtml = document.querySelector('.header').outerHTML;
  const titleText = escapeHtml(document.getElementById('title').innerText || '');
  const bodyHtml = '<div style="padding:12px;">' + headerHtml + '<div style="margin-top:12px;font-weight:700;text-align:center;">' + titleText + '</div>';
  const sectionsHtml = sections.map(s=> '<div style="margin-bottom:12px;">' + s.outerHTML + '</div>').join('');

  newWin.document.open();
  newWin.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Print</title>' + headHtml + '</head><body>' + bodyHtml + sectionsHtml + '</body></html>');
  newWin.document.close();

  setTimeout(()=>{ newWin.focus(); newWin.print(); }, 800);
}

function refresh(){
  location.reload();
}

/* MAIN LOAD */
async function load(){
  const boardId = getParam("id");
  if(!boardId) return;

  document.getElementById("title").innerText = "LT MCC - " + boardId;

  try{
    const res = await fetch(JSON_URL);
    const data = await res.json();

    const board = data.boards[boardId];
    if(!board) return;

    const container = document.getElementById("boardContainer");
    container.innerHTML = "";

    const sections = Object.keys(board.sections)
      .sort((a,b) => Number(a)-Number(b));

    sections.forEach((sec, index) => {
      const secDiv = document.createElement("div");
      secDiv.className = "section";

      const title = document.createElement("div");
      title.className = "section-title";
      title.innerText = "SECTION " + sec;
      secDiv.appendChild(title);

      const cellsContainer = document.createElement("div");
      cellsContainer.className = "section-cells";

      const devices = (board.sections[sec] || [])
        .sort((a,b) => (a.level || "").localeCompare(b.level || ""));

      devices.forEach(d => {
        const cell = document.createElement("div");
        cell.className = "cell";

        if(d.status && String(d.status).toUpperCase() === "ON"){
          cell.classList.add("status-on");
        } else {
          cell.classList.add("status-off");
        }

        const feeder = norm(d.feederType);
        const breaker = norm(d.breakerType);
        const drive = norm(d.DriveType || d.deviceType || "");

        const parsedDriveId = parseDriveId(d.driveid);
        const displayDriveRaw = (parsedDriveId.displayText || "").toUpperCase();

        if(feeder === "INCOMER"){
          cell.classList.add("incomer", "incomer-box", "breaker-font");
        }
        else if(feeder === "BUSCOUPLER"){
          cell.classList.add("coupler", "breaker-font");
        }
        else if(feeder === "OUTGOING"){
          if(displayDriveRaw.includes("ACB")){
            cell.classList.add("outgoing-acb", "breaker-font");
          }
          else if(breaker === "ACB"){
            cell.classList.add("outgoing-acb", "breaker-font");
          }
          else if(breaker){
            cell.classList.add("outgoing-breaker", "breaker-font");
          }
          else {
            if(drive === "DOL"){
              cell.classList.add("outgoing-dol");
            }
            else if(drive === "MCCB"){
              cell.classList.add("outgoing-mccb");
            }
            else if(drive === "SFU"){
              cell.classList.add("outgoing-sfu");
            }
            else if(drive === "ACB"){
              cell.classList.add("outgoing-acb", "breaker-font");
            }
            else if(drive === "CONTROLTRANSFORMER" || drive === "CT"){
              cell.classList.add("control-transformer");
            }
            else{
              cell.classList.add("outgoing-dol");
            }
          }
        }
        else{
          if(drive === "DOL"){
            cell.classList.add("spare", "spare-dol");
          } else if(drive === "SFU"){
            cell.classList.add("spare", "spare-sfu");
          } else {
            cell.classList.add("spare");
          }
        }

        if(d.DriveType && norm(d.DriveType).includes("CONTROLTRANSFORMER")){
          cell.classList.remove("outgoing-dol","outgoing-sfu","outgoing-mccb","outgoing-breaker","outgoing-acb");
          cell.classList.add("control-transformer");
        } else if(d.deviceType && norm(d.deviceType).includes("CONTROLTRANSFORMER")){
          cell.classList.remove("outgoing-dol","outgoing-sfu","outgoing-mccb","outgoing-breaker","outgoing-acb");
          cell.classList.add("control-transformer");
        }

        const parsed = parsedDriveId;
        const displayDrive = escapeHtml(parsed.displayText || "");
        const linkDrive = parsed.linkId;

        let contentText;
        const hasDriveOrDevice = Boolean(d.DriveType || d.deviceType);

        if(cell.classList.contains("spare") && !hasDriveOrDevice && !d.feederType){
          contentText = "<b>" + (d.position || "") + "</b><br>SPARE";
        } else {
          contentText =
            "<b>" + (d.position || "") + "</b><br>" +
            "<div style='font-size:11px;line-height:1.2;min-height:24px;'>" + displayDrive + "</div>" +
            "<div style='margin-top:4px;font-weight:600;color:#222;font-size:10px;'>" +
            (
              (d.feederType === "INCOMER" ||
               d.feederType === "BUS_COUPLER" ||
               d.breakerType)
              ? (d.breakerType || "")
              : (d.DriveType || d.deviceType || "")
            ) + "</div>";
        }

        cell.innerHTML = contentText;

        if(linkDrive){
          cell.classList.add("clickable");
          cell.style.cursor = "pointer";
          cell.onclick = function(){
            const id = encodeURIComponent(linkDrive);
            location.href = "https://08electricaldata.github.io/drive-viewer/mobile/index.html?id=" + id;
          };
        } else {
          cell.style.cursor = "default";
          cell.onclick = null;
        }

        cellsContainer.appendChild(cell);
      });

      secDiv.appendChild(cellsContainer);
      container.appendChild(secDiv);
    });
  }catch(err){
    console.error('Load error:', err);
    document.getElementById('boardContainer').innerHTML = '<p style="padding:20px;text-align:center;">Error loading board data</p>';
  }
}

load();
</script>
</body>
</html>
