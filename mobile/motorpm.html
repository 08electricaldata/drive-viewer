<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motor PM Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fc;
}

/* Header */
.header{
    background:#003f88;
    color:#fff;
    padding:15px;
    text-align:center;
}

.header h2{
    margin:0;
    font-size:28px;
}

.header p{
    margin:5px 0 0;
}

/* Controls */

.controls{
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.controls input{
    flex:1;
    min-width:250px;
    padding:10px;
    font-size:15px;
}

.controls button{
    padding:10px 18px;
    border:none;
    background:#003f88;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}

.table-wrap{
    padding:15px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#003f88;
    color:#fff;
    position:sticky;
    top:0;
}

.drive-band{
    font-weight:bold;
}

.ok{
    background:#d4edda;
    font-weight:bold;
}

.overdue{
    background:red;
    color:yellow;
    font-weight:bold;
}

tbody tr:hover{
    background:#eef5ff;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<h2>Motor PM Status</h2>
<p>Designed & Maintained by Rakesh Chandra Sethy</p>
</div>

<div class="controls">
<input type="text" id="search" placeholder="Search Main Drive / Sub Drive">
<button onclick="exportCSV()">Export CSV</button>
<button onclick="window.print()">Print</button>
</div>

<div class="table-wrap">

<table id="tbl">

<thead>
<tr>
<th>Main Drive</th>
<th>Sub Drive</th>
<th>Before OCT-25 Motor</th>
<th>OCT25-MAR26 Motor</th>
<th>Motor Due</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const JSON_URL="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/2026_oct_mar.json";

const palette=[
"#e3f2fd",
"#fce4ec",
"#e8f5e9",
"#fff3e0",
"#ede7f6",
"#e0f7fa",
"#f1f8e9",
"#fbe9e7"
];

const driveMap={};
let index=0;

function colour(d){

if(!driveMap[d]){
driveMap[d]=palette[index%palette.length];
index++;
}

return driveMap[d];

}

function parse(v){
if(!v) return null;
const d=new Date(v);
return isNaN(d)?null:d;
}

function fmt(d){
if(!d) return "";
return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear();
}

async function load(){

const r=await fetch(JSON_URL);
const j=await r.json();

const tbody=document.querySelector("tbody");

const today=new Date();
today.setHours(0,0,0,0);

j.rows.forEach(row=>{

if(String(row[4]).toUpperCase()!="S") return;
if(!row[1] || !row[2]) return;

const motor1=parse(row[13]);
const motor2=parse(row[15]);
const due=parse(row[19]);

const over=!due || due<today;

const tr=document.createElement("tr");

tr.onclick=()=>{
const id=row[1]+"-"+row[2];
location.href="https://08electricaldata.github.io/drive-viewer/history.html?id="+encodeURIComponent(id);
};

tr.innerHTML=`
<td class="drive-band" style="background:${colour(row[1])}">${row[1]}</td>
<td>${row[2]}</td>
<td>${fmt(motor1)}</td>
<td>${fmt(motor2)}</td>
<td class="${over?'overdue':'ok'}">${fmt(due)}</td>
`;

tbody.appendChild(tr);

});

}

document.getElementById("search").onkeyup=function(){

const q=this.value.toLowerCase();

document.querySelectorAll("tbody tr").forEach(tr=>{

tr.style.display=
tr.children[0].innerText.toLowerCase().includes(q) ||
tr.children[1].innerText.toLowerCase().includes(q)
? "" : "none";

});

};

function exportCSV(){

let csv=[];

document.querySelectorAll("table tr").forEach(r=>{

csv.push([...r.children].map(x=>'"'+x.innerText+'"').join(","));

});

const a=document.createElement("a");

a.href=URL.createObjectURL(new Blob([csv.join("\n")]));

a.download="motor_pm_status.csv";

a.click();

}

load();

</script>

</body>
</html>
