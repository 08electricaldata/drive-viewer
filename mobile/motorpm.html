<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Motor & Module PM Status — List View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  background: #f2f6ff;
  font-size: 14px;
  color: #111;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== HEADER ===== */
.header {
  background: #003f88;
  color: white;
  padding: 12px 10px;
  position: sticky;
  top: 0;
  z-index: 1000;
}
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-left {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.header-btn {
  background: white;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
}
.header-btn:active { opacity: 0.9; transform: translateY(1px); }
.header-center {
  text-align: center;
  flex: 1;
  padding: 0 8px;
  min-width: 0;
}
.header-center h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
}
.header-center p {
  margin: 2px 0 0;
  font-size: 13px;
  opacity: 0.95;
}

/* ===== CONTAINER ===== */
.container { padding: 12px; }

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  align-items: center;
}
.controls input {
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  flex: 1;
  min-width: 180px;
  background: white;
  box-shadow: 0 1px 0 rgba(0,0,0,0.03);
}
.controls button {
  padding: 9px 12px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
}
.controls button:active { opacity: 0.92; transform: translateY(1px); }

/* ===== TABLE ===== */
.table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  background: white;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  font-size: 14px;
  min-width: 840px;
}
th, td {
  border: 1px solid #e7e7e7;
  padding: 10px 8px;
  text-align: center;
  vertical-align: middle;
}
th {
  background: #003f88;
  color: white;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
}

/* === HALVED WIDTHS (reduced to roughly half) === */
th:nth-child(1), td:nth-child(1) { width: 110px; } /* Main Drive */
th:nth-child(2), td:nth-child(2) { width: 80px; }  /* Sub Drive */
th:nth-child(n+3), td:nth-child(n+3) { width: 60px; } /* date columns */

/* ===== STATUS COLORS ===== */
.ok {
  background: #c8f7c5;
  color: black;
  font-weight: bold;
  padding: 6px 8px;
  border-radius: 4px;
  display: inline-block;
}
.overdue-cell {
  background: #d32f2f;
  color: #fff200;
  font-weight: bold;
  padding: 6px 8px;
  border-radius: 4px;
  display: inline-block;
}

/* ===== DRIVE COLOR BAND ===== */
.drive-band {
  font-weight: bold;
  text-align: left;
  padding-left: 8px;
  border-radius: 4px;
}

/* ===== UX ===== */
tbody tr { cursor: pointer; transition: background .12s ease; }
tbody tr:hover { background: #f5f9ff; }

/* Responsive adjustments */
@media (max-width: 640px) {
  .header { padding: 10px 8px; }
  .header-btn { padding: 7px 10px; font-size: 15px; }
  .header-center h1 { font-size: 18px; }
  .controls input { font-size: 14px; padding: 9px; }
  .controls button { font-size: 13px; padding: 8px 10px; }
  table { font-size: 13px; min-width: 680px; }
  th, td { padding: 8px 6px; }
  th:nth-child(1), td:nth-child(1) { width: 90px; }
  th:nth-child(2), td:nth-child(2) { width: 65px; }
  th:nth-child(n+3), td:nth-child(n+3) { width: 55px; }
}

@media (max-width: 420px) {
  .header-btn { padding: 6px 8px; font-size: 13px; }
  .header-center h1 { font-size: 16px; }
  .controls input { min-width: 100px; font-size: 13px; }
  table { font-size: 12px; min-width: 560px; }
  th, td { padding: 7px 5px; }
}

/* Print */
@media print {
  .controls, .header-left { display: none; }
  .header { background: #003f88; color: white; }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-bar">
    <div class="header-left">
      <button class="header-btn" onclick="goHome()">🏠 Home</button>
      <button class="header-btn" onclick="goBack()">⬅ Back</button>
      <button class="header-btn" onclick="openMotorList()">⚙️ Motor List</button>
      <button class="header-btn" onclick="openMotorOH()">🛠️ Motor O/H Data</button>
    </div>

    <div class="header-center">
      <h1>Motor & Module PM Status — List</h1>
      <p>Designed and maintained by Rakesh Chandra Sethy</p>
    </div>

    <div style="width:60px"></div>
  </div>
</div>

<div class="container">

  <div class="controls">
    <input id="search" placeholder="Search (any column)">
    <button onclick="exportExcel()">📥 Export Excel</button>
    <button onclick="window.print()">🖨 Print</button>
  </div>

  <div class="table-wrapper">
    <table id="pmTable" role="table" aria-label="Motor and module PM status">
      <thead>
        <tr>
          <th>Main Drive</th>
          <th>Sub Drive</th>
          <th>Before OCT-25 Module</th>
          <th>Before OCT-25 Motor</th>
          <th>OCT25-MAR26 Module</th>
          <th>OCT25-MAR26 Motor</th>
          <th>Module Due</th>
          <th>Motor Due</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
const JSON_URL =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/2026_oct_mar.json";

/* NAV */
function goHome(){ location.href="https://08electricaldata.github.io/"; }
function goBack(){ history.back(); }
function openMotorList(){ location.href="https://08electricaldata.github.io/drive-viewer/motorlist.html"; }
function openMotorOH(){ location.href="https://08electricaldata.github.io/drive-viewer/motoroh.html"; }

/* DATE: more robust parsing with fallback */
function parseISO(v){
  if (v == null || v === "") return null;

  // If already a Date object
  if (v instanceof Date) return isNaN(v) ? null : v;

  // If numeric (timestamp)
  if (typeof v === "number" && isFinite(v)) {
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }

  // If string that looks like /Date(....)/ or Date(yyyy,mm,dd)
  if (typeof v === "string") {
    const s = v.trim();

    // Google-style Date(...) strings: try extracting numbers
    if (s.startsWith("Date(") || s.startsWith("/Date(")) {
      const nums = s.match(/-?\d+/g);
      if (nums && nums.length) {
        // If it's milliseconds since epoch
        if (nums[0].length >= 10) {
          const ms = parseInt(nums[0], 10);
          const d = new Date(ms);
          return isNaN(d) ? null : d;
        }
        // else try year/month/day
        if (nums.length >= 3) {
          const y = parseInt(nums[0],10);
          const m = parseInt(nums[1],10);
          const day = parseInt(nums[2],10);
          const d = new Date(y, m, day);
          return isNaN(d) ? null : d;
        }
      }
    }

    // If ISO-like (YYYY-MM-DD or YYYY/MM/DD etc.) or other recognizable string
    const d = new Date(s);
    if (!isNaN(d)) return d;

    // If looks like an Excel serial (number as string), try numeric parse
    const n = Number(s);
    if (!isNaN(n)) {
      // treat as JS timestamp if large (ms), else attempt Excel serial -> date
      if (n > 1e11) {
        const d2 = new Date(n);
        if (!isNaN(d2)) return d2;
      } else if (n > 0) {
        // Excel serial number -> date (Excel epoch 1899-12-30)
        const excelEpoch = new Date(Date.UTC(1899,11,30));
        const ms = n * 24 * 60 * 60 * 1000;
        const d3 = new Date(excelEpoch.getTime() + ms);
        if (!isNaN(d3)) return d3;
      }
    }
  }

  return null;
}

function fmt(d){
  return d
    ? `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`
    : "";
}

/* Drive color band */
const driveColorMap={};
const palette=[
  "#e3f2fd","#fce4ec","#e8f5e9","#fff3e0",
  "#ede7f6","#e0f7fa","#f1f8e9","#fbe9e7"
];
let colorIndex=0;
function getDriveColor(key){
  if(!driveColorMap[key]){
    driveColorMap[key]=palette[colorIndex%palette.length];
    colorIndex++;
  }
  return driveColorMap[key];
}

/* LOAD */
async function loadData(){
  try {
    const r = await fetch(JSON_URL);
    const j = await r.json();

    const tbody=document.querySelector("#pmTable tbody");
    const today=new Date(); today.setHours(0,0,0,0);

    tbody.innerHTML = ""; // clear existing

    j.rows.forEach(row=>{
      // filtering: only rows with "S" in column index 4 and non-empty drive/subdrive
      if(String(row[4]||"").toUpperCase()!=="S") return;
      if(!row[1] || !row[2]) return;

      const mRaw = row[12];
      const nRaw = row[13];
      const oRaw = row[14];
      const pRaw = row[15];
      const sRaw = row[18];
      const tRaw = row[19];

      const m = parseISO(mRaw);
      const n = parseISO(nRaw);
      const o = parseISO(oRaw);
      const p = parseISO(pRaw);
      const s = parseISO(sRaw);
      const t = parseISO(tRaw);

      const sOver = !s || s < today;
      const tOver = !t || t < today;

      const drive = row[1] || "";
      const bandColor = getDriveColor(drive);

      const tr=document.createElement("tr");
      tr.dataset.moduleOver = sOver ? "1" : "0";
      tr.dataset.motorOver  = tOver ? "1" : "0";

      tr.onclick=()=> {
        const id=`${row[1]}-${row[2]}`;
        location.href="https://08electricaldata.github.io/drive-viewer/history.html?id="+encodeURIComponent(id);
      };

      // fallback: if parseISO returned null but raw exists, display raw trimmed
      const moduleDueText = s ? fmt(s) : (sRaw ? String(sRaw).trim() : "");
      const motorDueText  = t ? fmt(t) : (tRaw ? String(tRaw).trim() : "");

      tr.innerHTML=`
        <td class="drive-band" style="background:${bandColor}">${drive}</td>
        <td>${row[2]||""}</td>
        <td>${m ? fmt(m) : (mRaw ? String(mRaw).trim() : "")}</td>
        <td>${n ? fmt(n) : (nRaw ? String(nRaw).trim() : "")}</td>
        <td>${o ? fmt(o) : (oRaw ? String(oRaw).trim() : "")}</td>
        <td>${p ? fmt(p) : (pRaw ? String(pRaw).trim() : "")}</td>
        <td class="${sOver ? 'overdue-cell' : 'ok'}">${moduleDueText}</td>
        <td class="${tOver ? 'overdue-cell' : 'ok'}">${motorDueText}</td>
      `;

      tbody.appendChild(tr);
    });

    // search: any cell in row
    const search = document.getElementById("search");
    search.onkeyup=function(){
      const q=this.value.trim().toLowerCase();
      document.querySelectorAll("#pmTable tbody tr").forEach(tr=>{
        if(!q){
          tr.style.display="";
          return;
        }
        const matches = [...tr.children].some(td=> td.innerText.toLowerCase().includes(q));
        tr.style.display = matches ? "" : "none";
      });
    };
  } catch (err) {
    console.error("Error loading JSON:", err);
    document.querySelector("#pmTable tbody").innerHTML =
      '<tr><td colspan="8" style="text-align:center;color:#d32f2f;">Error loading data</td></tr>';
  }
}

/* EXPORT */
function exportExcel(){
  let csv=[];
  document.querySelectorAll("#pmTable tr").forEach(r=>{
    csv.push([...r.children].map(td=>`"${td.innerText.replace(/"/g,'""')}"`).join(","));
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv.join("\n")], {type: "text/csv"}));
  a.download="motor_module_pm_status_list.csv";
  a.click();
}

loadData();
</script>

</body>
</html>
