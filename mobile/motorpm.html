<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Motor & Module PM — Mobile View</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<style>
/* Mobile-first app-like style */

:root{
  --brand:#003f88;
  --bg:#f2f6ff;
  --card:#ffffff;
  --muted:#6b7280;
  --overdue:#d32f2f;
  --ok-bg:#e6f7e9;
  --drive-text-padding:10px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial, -apple-system, "Segoe UI", Roboto, sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
.header{
  background:var(--brand);
  color:white;
  padding:14px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
}
.header-left{display:flex;gap:8px;align-items:center}
.header-btn{
  background:white;color:var(--brand);border:none;border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.06)
}
.header-center{flex:1;text-align:center}
.header-center h1{margin:0;font-size:18px;font-weight:800}
.header-center p{margin:2px 0 0;font-size:12px;opacity:.95}

/* container */
.container{padding:12px;max-width:960px;margin:0 auto}

/* summary strip */
.summary-strip{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.summary-card{flex:1;background:var(--card);padding:10px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.summary-card h4{margin:0;color:var(--brand);font-size:12px}
.summary-card p{margin:6px 0 0;font-size:18px;font-weight:800}

/* controls */
.controls{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search{
  flex:1;min-width:80px;padding:10px 12px;border-radius:10px;border:1px solid #e6e9ef;background:white;font-size:15px;
  box-shadow:0 1px 0 rgba(0,0,0,.03)
}
.small-btn{background:var(--brand);color:white;border:none;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}

/* cards list */
.cards{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--card);
  border-radius:12px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
}
.card:active{transform:translateY(1px)}
.card-top{display:flex;align-items:center;padding:10px 12px;gap:10px}
.drive-band{
  min-width:48px;border-radius:8px;padding:8px var(--drive-text-padding);font-weight:800;color:#022a59;flex-shrink:0;
  word-break:break-word;
}
.card-main{flex:1;display:flex;flex-direction:column;gap:4px}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.subdrive{font-weight:700;color:#0b3b74;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);}

/* details grid (smaller: removed OCT25-MAR26 fields) */
.card-grid{display:flex;flex-wrap:wrap;padding:10px 12px 14px;gap:8px;border-top:1px solid rgba(0,0,0,0.04)}
.grid-item{flex:1 1 45%;min-width:120px;background:transparent;border-radius:8px;padding:6px 8px}
.grid-item strong{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.grid-item span{font-size:14px;font-weight:800;color:#0b3b74}

/* due badges (full width) */
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{
  padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px;
  display:inline-block;
}
.badge.ok{background:var(--ok-bg);color:#0b3b74}
.badge.overdue{background:var(--overdue);color:white}

/* empty state */
.empty{padding:24px;text-align:center;color:var(--muted)}

/* Floating filter FAB row */
.fab-row{position:fixed;right:12px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:120}
.fab{background:var(--brand);color:white;border:none;padding:12px;border-radius:50%;width:52px;height:52px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}

/* small screens: emphasize card content, bigger touch targets */
@media (max-width:420px){
  .header-btn{padding:8px 10px;font-size:14px}
  .header-center h1{font-size:16px}
  .search{font-size:14px;padding:10px}
  .card-top{padding:12px}
  .drive-band{padding:10px 12px;font-size:14px;min-width:64px}
  .subdrive{font-size:17px}
  .grid-item{flex-basis:100%}
}

/* desktop: allow 2-column grid for cards */
@media (min-width:900px){
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .container{padding:18px}
  .card-grid{gap:10px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="header-btn" onclick="goHome()">🏠</button>
    <button class="header-btn" onclick="goBack()">⬅</button>
  </div>

  <div class="header-center">
    <h1>Motor & Module PM</h1>
    <p style="margin:0;font-size:12px">Mobile app view — Rakesh Chandra Sethy</p>
  </div>
</div>

<div class="container">
  <div class="summary-strip" aria-hidden="true">
    <div class="summary-card">
      <h4>Total Motors</h4>
      <p id="totalCount">0</p>
    </div>
    <div class="summary-card">
      <h4>Overdue</h4>
      <p id="overdueCount" style="color:var(--overdue);">0</p>
    </div>
  </div>

  <div class="controls" role="search">
    <input id="search" class="search" type="search" placeholder="Search Main Drive / Sub Drive / Any text" aria-label="Search motors">
    <button class="small-btn" onclick="exportCSV()">CSV</button>
  </div>

  <div id="cards" class="cards" aria-live="polite"></div>

  <div id="empty" class="empty" style="display:none">No motors found.</div>
</div>

<!-- floating quick filters -->
<div class="fab-row" aria-hidden="true">
  <button class="fab" title="All" onclick="filterShow('all')">ALL</button>
  <button class="fab" title="Module overdue" onclick="filterShow('module')">M</button>
  <button class="fab" title="Motor overdue" onclick="filterShow('motor')">Mo</button>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/2026_oct_mar.json";

/* Navigation helpers */
function goHome(){ location.href="https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }

/* Robust date parser */
function parseISO(v){
  if (v == null || v === "") return null;
  if (v instanceof Date) return isNaN(v)?null:v;
  if (typeof v === "number" && isFinite(v)) {
    const d=new Date(v); return isNaN(d)?null:d;
  }
  if (typeof v === "string"){
    const s=v.trim();
    if (s.startsWith("Date(") || s.startsWith("/Date(")){
      const nums = s.match(/-?\d+/g);
      if (nums && nums.length){
        if (nums[0].length >= 10){
          const ms = parseInt(nums[0],10);
          const d = new Date(ms);
          if (!isNaN(d)) return d;
        }
        if (nums.length >= 3){
          const y = parseInt(nums[0],10);
          const m = parseInt(nums[1],10);
          const day = parseInt(nums[2],10);
          const d = new Date(y,m,day);
          if (!isNaN(d)) return d;
        }
      }
    }
    const d = new Date(s);
    if (!isNaN(d)) return d;
    const n = Number(s);
    if (!isNaN(n)){
      if (n > 1e11){
        const d2 = new Date(n); if (!isNaN(d2)) return d2;
      } else if (n > 0){
        const excelEpoch = new Date(Date.UTC(1899,11,30));
        const ms = n * 24*60*60*1000;
        const d3 = new Date(excelEpoch.getTime()+ms);
        if (!isNaN(d3)) return d3;
      }
    }
  }
  return null;
}
function fmt(d){
  if(!d) return "";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* Drive color assignment */
const driveColorMap={};
const palette=["#e3f2fd","#fce4ec","#e8f5e9","#fff3e0","#ede7f6","#e0f7fa","#f1f8e9","#fbe9e7"];
let colorIndex=0;
function getDriveColor(k){
  if(!k) return "#fff";
  if(!driveColorMap[k]) driveColorMap[k]=palette[(colorIndex++)%palette.length];
  return driveColorMap[k];
}

/* Data load & render */
let allRows = []; // raw rows for filtering/export
async function loadData(){
  try{
    const res = await fetch(JSON_URL);
    const j = await res.json();
    const rows = j.rows || [];
    const cardsEl = document.getElementById("cards");
    cardsEl.innerHTML = "";
    allRows = [];

    const today = new Date(); today.setHours(0,0,0,0);
    let total = 0, overdueCount = 0;

    rows.forEach(row=>{
      // keep only S in col index 4 (as before) and require drive/subdrive
      if(String(row[4]||"").toUpperCase()!=="S") return;
      if(!row[1] || !row[2]) return;

      // preserve raw for export
      allRows.push(row);

      const mRaw = row[12], nRaw = row[13], /* oRaw = row[14], pRaw = row[15], */ sRaw = row[18], tRaw = row[19];
      const m = parseISO(mRaw), n = parseISO(nRaw), /* o = parseISO(oRaw), p = parseISO(pRaw), */ s = parseISO(sRaw), t = parseISO(tRaw);
      const sOver = !s || s < today;
      const tOver = !t || t < today;

      if (sOver) overdueCount++;
      if (tOver) overdueCount++; // counting both for summary (same as previous approach)

      total++;

      // build card
      const drive = row[1]||"";
      const sub = row[2]||"";
      const bandColor = getDriveColor(drive);
      const moduleDueText = s ? fmt(s) : (sRaw ? String(sRaw).trim() : "");
      const motorDueText  = t ? fmt(t) : (tRaw ? String(tRaw).trim() : "");

      const card = document.createElement("article");
      card.className="card";
      card.tabIndex = 0;
      card.dataset.moduleOver = sOver ? "1":"0";
      card.dataset.motorOver = tOver ? "1":"0";
      card.dataset.id = `${drive}-${sub}`;

      card.innerHTML = `
        <div class="card-top">
          <div class="drive-band" style="background:${bandColor}">${drive}</div>
          <div class="card-main">
            <div class="card-title">
              <div class="subdrive">${sub}</div>
              <div class="meta">LT/HT: ${row[5]||""}</div>
            </div>
            <div class="meta">${row[3]||""}</div>
          </div>
        </div>

        <div class="card-grid">
          <div class="grid-item"><strong>Before OCT-25 Module</strong><span>${m ? fmt(m) : (mRaw||"")}</span></div>
          <div class="grid-item"><strong>Before OCT-25 Motor</strong><span>${n ? fmt(n) : (nRaw||"")}</span></div>

          <div class="grid-item" style="flex-basis:60%"><strong>Module Due</strong>
            <div style="margin-top:6px" class="badges">
              <span class="badge ${sOver ? 'overdue':'ok'}">${moduleDueText||'—'}</span>
            </div>
          </div>

          <div class="grid-item" style="flex-basis:40%"><strong>Motor Due</strong>
            <div style="margin-top:6px" class="badges">
              <span class="badge ${tOver ? 'overdue':'ok'}">${motorDueText||'—'}</span>
            </div>
          </div>
        </div>
      `;

      // click / keyboard enter opens history
      card.addEventListener("click", ()=> navigateToHistory(row));
      card.addEventListener("keydown", (e)=>{ if(e.key==='Enter') navigateToHistory(row); });

      cardsEl.appendChild(card);
    });

    document.getElementById("totalCount").innerText = total;
    document.getElementById("overdueCount").innerText = overdueCount;

    document.getElementById("empty").style.display = total ? "none" : "block";

    // attach search handler
    const search = document.getElementById("search");
    search.addEventListener("input", onSearch);

    // initial show all
    filterShow('all');

  }catch(err){
    console.error(err);
    document.getElementById("cards").innerHTML = `<div class="empty">Error loading data</div>`;
  }
}

function navigateToHistory(row){
  if(!row[1]||!row[2]) return;
  const id = `${row[1]}-${row[2]}`;
  location.href = "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" + encodeURIComponent(id);
}

/* search across all visible card text */
function onSearch(e){
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".cards .card").forEach(card=>{
    if(!q){ card.style.display=''; return; }
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(q) ? '' : 'none';
  });
}

/* filter by overdue flags */
function filterShow(type){
  document.querySelectorAll(".cards .card").forEach(card=>{
    if(type === 'all'){ card.style.display = ''; return; }
    if(type === 'module'){
      card.style.display = card.dataset.moduleOver === '1' ? '' : 'none';
      return;
    }
    if(type === 'motor'){
      card.style.display = card.dataset.motorOver === '1' ? '' : 'none';
      return;
    }
  });
}

/* CSV export uses original raw rows (keeps all columns even if hidden from card) */
function exportCSV(){
  const header = ["Main Drive","Sub Drive","LT/HT","EQPT NAME","Before OCT-25 Module","Before OCT-25 Motor","OCT25-MAR26 Module","OCT25-MAR26 Motor","Module Due","Motor Due"];
  const visibleCards = Array.from(document.querySelectorAll(".cards .card")).filter(c=> c.style.display!=='none');
  const csvRows = [ header.join(",") ];

  visibleCards.forEach(card=>{
    const id = card.dataset.id;
    const row = allRows.find(r => `${r[1]}-${r[2]}` === id);
    if(!row) return;
    // map original indices used earlier
    const drive = row[1] || "";
    const sub = row[2] || "";
    const ltht = row[5] || "";
    const eqptName = row[3] || "";
    const mRaw = row[12] || "";
    const nRaw = row[13] || "";
    const oRaw = row[14] || "";
    const pRaw = row[15] || "";
    const sRaw = row[18] || "";
    const tRaw = row[19] || "";

    const values = [drive, sub, ltht, eqptName, mRaw, nRaw, oRaw, pRaw, sRaw, tRaw];
    csvRows.push( values.map(v=> `"${String(v).replace(/"/g,'""')}"` ).join(",") );
  });

  const blob = new Blob([csvRows.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "motor_module_pm_mobile.csv";
  a.click();
}

/* initial load */
loadData();
</script>
</body>
</html>
