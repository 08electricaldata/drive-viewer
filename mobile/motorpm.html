<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Motor & Module PM — Mobile Compact</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<style>
:root{
  --brand:#003f88;
  --bg:#f2f6ff;
  --card:#ffffff;
  --muted:#6b7280;
  --overdue:#d32f2f;
  --ok-bg:#e6f7e9;
  --drive-padding:8px;
}

/* Reset & base */
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial, -apple-system, "Segoe UI", Roboto, sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
.header{
  background:var(--brand);color:white;padding:12px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;
}
.header-left{display:flex;gap:8px;align-items:center}
.header-btn{background:white;color:var(--brand);border:none;border-radius:8px;padding:7px 9px;font-weight:700;font-size:14px;cursor:pointer}
.header-center{flex:1;text-align:center}
.header-center h1{margin:0;font-size:17px;font-weight:800}
.header-center p{margin:2px 0 0;font-size:12px;opacity:.95}

/* container */
.container{padding:10px;max-width:960px;margin:0 auto}

/* summary & controls */
.summary-strip{display:flex;gap:8px;margin-bottom:10px}
.summary-card{flex:1;background:var(--card);padding:8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.summary-card h4{margin:0;color:var(--brand);font-size:12px}
.summary-card p{margin:6px 0 0;font-size:16px;font-weight:800}
.controls{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.search{flex:1;padding:8px 10px;border-radius:10px;border:1px solid #e6e9ef;background:white;font-size:14px}
.small-btn{background:var(--brand);color:white;border:none;padding:8px 10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}

/* cards - compact */
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.06);overflow:hidden;cursor:pointer;transition:transform .08s ease;display:flex;flex-direction:column}
.card:active{transform:translateY(1px)}
.card-top{display:flex;align-items:center;padding:8px 10px;gap:10px}
.drive-band{min-width:56px;border-radius:8px;padding:8px var(--drive-padding);font-weight:800;color:#022a59;flex-shrink:0;font-size:13px;text-align:center}
.card-main{flex:1;display:flex;flex-direction:column;gap:2px}
.subdrive{font-weight:700;color:#0b3b74;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);line-height:1.15}

/* compact grid: two columns, two rows */
.card-grid{display:flex;padding:8px 10px 10px;gap:8px;border-top:1px solid rgba(0,0,0,0.04);align-items:flex-start}
.left-col{flex:1;display:flex;flex-direction:column;gap:6px}
.right-col{width:42%;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* rows inside cols */
.row{display:flex;justify-content:space-between;align-items:center}
.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:capitalize}
.value{font-size:14px;font-weight:800;color:#0b3b74;margin-left:8px;white-space:nowrap}

/* due badges smaller */
.badge{padding:6px 8px;border-radius:8px;font-weight:800;font-size:13px;display:inline-block}
.badge.ok{background:var(--ok-bg);color:#0b3b74}
.badge.overdue{background:var(--overdue);color:white}

/* empty state */
.empty{padding:18px;text-align:center;color:var(--muted)}

/* FABs */
.fab-row{position:fixed;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:120}
.fab{background:var(--brand);color:white;border:none;padding:10px;border-radius:50%;width:48px;height:48px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;font-size:13px}

/* small screens tuning */
@media (max-width:420px){
  .header-btn{padding:7px 8px;font-size:13px}
  .header-center h1{font-size:16px}
  .summary-card p{font-size:15px}
  .card-top{padding:10px}
  .drive-band{min-width:68px;padding:8px 10px;font-size:14px}
  .subdrive{font-size:16px}
  .label{font-size:12px}
  .value{font-size:14px}
  .right-col{width:45%}
}

/* desktop grid for cards if needed */
@media (min-width:900px){
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .container{padding:14px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="header-btn" onclick="goHome()">🏠</button>
    <button class="header-btn" onclick="goBack()">⬅</button>
  </div>

  <div class="header-center">
    <h1>Motor & Module PM</h1>
    <p style="margin:0;font-size:12px">Mobile compact view — Rakesh Chandra Sethy</p>
  </div>
</div>

<div class="container">
  <div class="summary-strip" aria-hidden="true">
    <div class="summary-card">
      <h4>Total Motors</h4>
      <p id="totalCount">0</p>
    </div>
    <div class="summary-card">
      <h4>Overdue</h4>
      <p id="overdueCount" style="color:var(--overdue);">0</p>
    </div>
  </div>

  <div class="controls" role="search">
    <input id="search" class="search" type="search" placeholder="Search Main Drive / Sub Drive / Any text" aria-label="Search motors">
    <button class="small-btn" onclick="exportCSV()">CSV</button>
  </div>

  <div id="cards" class="cards" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">No motors found.</div>
</div>

<!-- floating quick filters -->
<div class="fab-row" aria-hidden="true">
  <button class="fab" title="All" onclick="filterShow('all')">ALL</button>
  <button class="fab" title="Module overdue" onclick="filterShow('module')">M</button>
  <button class="fab" title="Motor overdue" onclick="filterShow('motor')">Mo</button>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/2026_oct_mar.json";

/* navigation */
function goHome(){ location.href="https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }

/* parsing helpers (robust) */
function parseISO(v){
  if (v == null || v === "") return null;
  if (v instanceof Date) return isNaN(v)?null:v;
  if (typeof v === "number" && isFinite(v)) { const d=new Date(v); return isNaN(d)?null:d; }
  if (typeof v === "string"){
    const s=v.trim();
    if (s.startsWith("Date(") || s.startsWith("/Date(")){
      const nums = s.match(/-?\d+/g);
      if (nums && nums.length){
        if (nums[0].length >= 10){
          const ms = parseInt(nums[0],10);
          const d = new Date(ms);
          if (!isNaN(d)) return d;
        }
        if (nums.length >= 3){
          const y = parseInt(nums[0],10);
          const m = parseInt(nums[1],10);
          const day = parseInt(nums[2],10);
          const d = new Date(y,m,day);
          if (!isNaN(d)) return d;
        }
      }
    }
    const d = new Date(s);
    if (!isNaN(d)) return d;
    const n = Number(s);
    if (!isNaN(n)){
      if (n > 1e11){
        const d2 = new Date(n); if (!isNaN(d2)) return d2;
      } else if (n > 0){
        const excelEpoch = new Date(Date.UTC(1899,11,30));
        const ms = n * 24*60*60*1000;
        const d3 = new Date(excelEpoch.getTime()+ms);
        if (!isNaN(d3)) return d3;
      }
    }
  }
  return null;
}
function fmt(d){ if(!d) return ""; return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`; }

/* drive color assignment */
const driveColorMap={};
const palette=["#e3f2fd","#fce4ec","#e8f5e9","#fff3e0","#ede7f6","#e0f7fa","#f1f8e9","#fbe9e7"];
let colorIndex=0;
function getDriveColor(k){ if(!k) return "#fff"; if(!driveColorMap[k]) driveColorMap[k]=palette[(colorIndex++)%palette.length]; return driveColorMap[k]; }

/* data & render */
let allRows = [];
async function loadData(){
  try{
    const res = await fetch(JSON_URL);
    const j = await res.json();
    const rows = j.rows || [];
    const cardsEl = document.getElementById("cards");
    cardsEl.innerHTML = "";
    allRows = [];

    const today = new Date(); today.setHours(0,0,0,0);
    let total = 0, overdueCount = 0;

    rows.forEach(row=>{
      if(String(row[4]||"").toUpperCase()!=="S") return;
      if(!row[1] || !row[2]) return;

      allRows.push(row);

      const mRaw = row[12], nRaw = row[13], sRaw = row[18], tRaw = row[19];
      const m = parseISO(mRaw), n = parseISO(nRaw), s = parseISO(sRaw), t = parseISO(tRaw);
      const sOver = !s || s < today;
      const tOver = !t || t < today;

      if (sOver) overdueCount++;
      if (tOver) overdueCount++;
      total++;

      const drive = row[1]||"";
      const sub = row[2]||"";
      const bandColor = getDriveColor(drive);
      const moduleDone = m ? fmt(m) : (mRaw ? String(mRaw).trim() : "—");
      const motorDone  = n ? fmt(n) : (nRaw ? String(nRaw).trim() : "—");
      const moduleDueText = s ? fmt(s) : (sRaw ? String(sRaw).trim() : "—");
      const motorDueText  = t ? fmt(t) : (tRaw ? String(tRaw).trim() : "—");

      const card = document.createElement("article");
      card.className = "card";
      card.tabIndex = 0;
      card.dataset.moduleOver = sOver ? "1":"0";
      card.dataset.motorOver = tOver ? "1":"0";
      card.dataset.id = `${drive}-${sub}`;

      card.innerHTML = `
        <div class="card-top">
          <div class="drive-band" style="background:${bandColor}">${drive}</div>
          <div class="card-main">
            <div class="subdrive">${sub}</div>
            <div class="meta">${row[3]||""} • LT/HT: ${row[5]||""}</div>
          </div>
        </div>

        <div class="card-grid">
          <div class="left-col">
            <div class="row"><div class="label">module done</div><div class="value">${moduleDone}</div></div>
            <div class="row"><div class="label">motor done</div><div class="value">${motorDone}</div></div>
          </div>

          <div class="right-col">
            <div class="row"><div class="label">Module Due</div><div class="value"><span class="badge ${sOver ? 'overdue' : 'ok'}">${moduleDueText}</span></div></div>
            <div class="row"><div class="label">Motor Due</div><div class="value"><span class="badge ${tOver ? 'overdue' : 'ok'}">${motorDueText}</span></div></div>
          </div>
        </div>
      `;

      card.addEventListener("click", () => navigateToHistory(row));
      card.addEventListener("keydown", (e) => { if (e.key === 'Enter') navigateToHistory(row); });

      cardsEl.appendChild(card);
    });

    document.getElementById("totalCount").innerText = total;
    document.getElementById("overdueCount").innerText = overdueCount;
    document.getElementById("empty").style.display = total ? "none" : "block";

    const search = document.getElementById("search");
    search.addEventListener("input", onSearch);

    filterShow('all');

  }catch(err){
    console.error(err);
    document.getElementById("cards").innerHTML = `<div class="empty">Error loading data</div>`;
  }
}

function navigateToHistory(row){
  if(!row[1]||!row[2]) return;
  const id = `${row[1]}-${row[2]}`;
  location.href = "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" + encodeURIComponent(id);
}

function onSearch(e){
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".cards .card").forEach(card=>{
    if(!q){ card.style.display=''; return; }
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(q) ? '' : 'none';
  });
}

function filterShow(type){
  document.querySelectorAll(".cards .card").forEach(card=>{
    if(type === 'all'){ card.style.display = ''; return; }
    if(type === 'module'){ card.style.display = card.dataset.moduleOver === '1' ? '' : 'none'; return; }
    if(type === 'motor'){ card.style.display = card.dataset.motorOver === '1' ? '' : 'none'; return; }
  });
}

/* CSV export uses original raw rows to keep full data */
function exportCSV(){
  const header = ["Main Drive","Sub Drive","LT/HT","EQPT NAME","Before OCT-25 Module","Before OCT-25 Motor","OCT25-MAR26 Module","OCT25-MAR26 Motor","Module Due","Motor Due"];
  const visibleCards = Array.from(document.querySelectorAll(".cards .card")).filter(c=> c.style.display!=='none');
  const csvRows = [ header.join(",") ];

  visibleCards.forEach(card=>{
    const id = card.dataset.id;
    const row = allRows.find(r => `${r[1]}-${r[2]}` === id);
    if(!row) return;
    const drive = row[1] || "";
    const sub = row[2] || "";
    const ltht = row[5] || "";
    const eqptName = row[3] || "";
    const mRaw = row[12] || "";
    const nRaw = row[13] || "";
    const oRaw = row[14] || "";
    const pRaw = row[15] || "";
    const sRaw = row[18] || "";
    const tRaw = row[19] || "";
    const values = [drive, sub, ltht, eqptName, mRaw, nRaw, oRaw, pRaw, sRaw, tRaw];
    csvRows.push( values.map(v=> `"${String(v).replace(/"/g,'""')}"` ).join(",") );
  });

  const blob = new Blob([csvRows.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "motor_module_pm_mobile_compact.csv";
  a.click();
}

/* start */
loadData();
</script>
</body>
</html>
