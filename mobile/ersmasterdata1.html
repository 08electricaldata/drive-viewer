<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pending Dashboard — Diagnostic & Retry (fixed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --brand: #003f88;
  --bg: #f4f7ff;
  --label-color: #374151;
  --value-color: #0b1220;
  --label-width: 34%;
  --font-size: 14px;
  --line-height: 1.45;
  --card-radius: 10px;
  --card-gap: 12px;
}
*{box-sizing:border-box}
body{font-family:Arial,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);-webkit-font-smoothing:antialiased;color:var(--value-color);}

/* header/controls/summary (kept minimal styling) */
.header{background:var(--brand);color:#fff;padding:14px 12px}
.header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.header-center{text-align:center;flex:1}
.header-center h1{margin:0;font-size:20px}
.header-center p{margin:4px 0 0;font-size:12px;opacity:0.95}
.header-btn{background:#fff;color:var(--brand);border:none;padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;margin:3px;}

.controls{padding:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
select,input,button{padding:8px 10px;font-size:14px;border-radius:6px;border:1px solid #d1d5db}

.summary{display:flex;gap:12px;justify-content:center;padding:8px 10px;flex-wrap:wrap}
.summary .card{background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(7,18,42,0.06);min-width:110px;text-align:center}
.summary h3{margin:0;font-size:18px}

/* status area */
.status-bar{padding:8px 12px;text-align:center;color:#0b1220}
.status-bar .msg{display:inline-block;padding:6px 10px;border-radius:6px;background:#fff;box-shadow:0 2px 6px rgba(7,18,42,.06)}
.status-bar .link{color:var(--brand);text-decoration:underline;cursor:pointer}

/* table */
.table-wrapper{padding:8px 10px;overflow:auto;max-height:60vh}
table{border-collapse:collapse;width:100%;background:#fff;table-layout:auto;min-width:100%}
th,td{padding:10px 12px;font-size:var(--font-size);line-height:var(--line-height);vertical-align:top;border:1px solid #e6e9ef}
th{background:var(--brand);color:#fff;position:sticky;top:0;z-index:2;text-align:left}
th, td { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--value-color); }
th[data-col="Problems"], td[data-col="Problems"]{white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-overflow:clip}

/* mobile app view (keeps consistent with your last version) */
@media (max-width:760px){
  thead{display:none}
  table, tbody, tr, td { display:block; width:100%; }
  tbody tr { display:block;margin-bottom:var(--card-gap);border-radius:var(--card-radius);background:#fff;padding:10px;box-shadow:0 10px 24px rgba(7,18,42,0.06);border:1px solid rgba(0,0,0,0.04); }
  td{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border:none;white-space:nowrap;overflow:visible}
  td::before{content:attr(data-col);font-weight:700;color:var(--label-color);width:var(--label-width);flex:0 0 var(--label-width);max-width:var(--label-width);box-sizing:border-box;padding-right:4px}
  td>.val{flex:1 1 calc(100% - var(--label-width));text-align:left;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td[data-col="Problems"]>.val{white-space:normal;overflow-wrap:anywhere;word-break:break-word;text-overflow:clip}
}

/* small UI helpers */
.debug {font-size:13px;color:#333;margin-top:6px;text-align:left}
.kv {font-weight:700;margin-right:8px}
.center {text-align:center}
.btn-ghost {background:#fff;border:1px solid #cfd8e3;padding:6px 10px;border-radius:6px;cursor:pointer;margin-left:6px}
</style>
</head>
<body>

<div class="header">
  <div class="header-bar">
    <div>
      <button class="header-btn" onclick="history.back()">⬅ Back</button>
      <button class="header-btn" onclick="location.href='https://08electricaldata.github.io/index_mob.html'">🏠 Home</button>
    </div>
    <div class="header-center">
      <h1>Rewinding / Overhauling Dashboard</h1>
      <p>Designed and maintained by Rakesh Chandra Sethi</p>
    </div>
    <div></div>
  </div>
</div>

<div class="controls">
  <select id="typeSelect">
    <option value="rewinding">Rewinding</option>
    <option value="overhauling">Overhauling</option>
  </select>

  <input type="text" id="searchBox" placeholder="Search...">
  <button id="appViewBtn" class="header-btn" onclick="toggleAppView()">📱 App View</button>
  <button onclick="exportCSV()">Export Excel</button>
</div>

<div class="summary">
  <div class="card"><h3 id="totalCount">0</h3><span>Total</span></div>
  <div class="card"><h3 id="highCount">0</h3><span>High Priority</span></div>
  <div class="card"><h3 id="mediumCount">0</h3><span>Medium</span></div>
  <div class="card"><h3 id="lowCount">0</h3><span>Low</span></div>
  <div class="card"><h3 id="noPriorityCount">0</h3><span>No Priority</span></div>
</div>

<div class="status-bar" id="statusBar">
  <div class="msg" id="statusMsg">Ready</div>
</div>

<div class="table-wrapper">
  <table id="priorityTable" aria-label="Priority assigned">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<div class="table-wrapper" style="margin-top:8px">
  <table id="noPriorityTable" aria-label="No priority assigned">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<div style="padding:10px" class="center">
  <button id="retryBtn" class="btn-ghost" onclick="retryFetch()">🔄 Retry Fetch</button>
  <button id="sampleBtn" class="btn-ghost" onclick="loadSampleData()">📥 Load Sample Data</button>
  <div class="debug" id="debugInfo"></div>
</div>

<script>
/* --- configuration --- */
const JSON_FILES = {
  rewinding: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/rewinding.json",
  overhauling: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/overhauling.json"
};
const desiredDisplayCols = [
  "PRIORITY","W.O No","kW","Make","Frame Size","Mounting","RPM","Sl No",
  "Equipment details","Problems","Job Completion Dat"
];
const excludedNames = ["voltage","area","storage","remarks"];

let currentData = [], headers = [], priorityKey = "";

const select = document.getElementById("typeSelect");
const searchBox = document.getElementById("searchBox");
const statusMsg = document.getElementById("statusMsg");
const statusBar = document.getElementById("statusBar");
const debugInfo = document.getElementById("debugInfo");

function setStatus(text, type){
  statusMsg.innerText = text;
}

/* --- improved loadData with diagnostics & retry --- */
async function loadData(type){
  const url = JSON_FILES[type];
  setStatus("Loading from: " + url);
  debugInfo.innerHTML = `<span class="kv">Fetching:</span> ${url}`;
  try{
    const res = await fetch(url, {cache: "no-store"});
    debugInfo.innerHTML += `<br><span class="kv">HTTP:</span> ${res.status} ${res.statusText}`;
    if(!res.ok){
      setStatus("Fetch failed: " + res.status + " " + res.statusText);
      showFetchError(url, `HTTP ${res.status} ${res.statusText}`);
      currentData = [];
      headers = [];
      priorityKey = "";
      render();
      return;
    }
    const json = await res.json();
    let data = [];
    if(Array.isArray(json)) data = json;
    else if(Array.isArray(json.data)) data = json.data;
    else if(json.rows && Array.isArray(json.rows)) data = json.rows;
    else {
      debugInfo.innerHTML += `<br><span class="kv">JSON preview:</span> ${escapeHtml(JSON.stringify(Object.keys(json)).slice(0,200))}`;
      setStatus("Loaded JSON but no array found (check JSON structure).");
      currentData = [];
      headers = [];
      priorityKey = "";
      render();
      showFetchError(url, "JSON did not contain expected array (data/rows or top-level array).");
      return;
    }

    currentData = data;
    headers = currentData[0] ? Object.keys(currentData[0]) : [];
    priorityKey = findKeyMatch("PRIORITY") || headers[0] || "";
    setStatus(`Loaded ${currentData.length} rows`);
    debugInfo.innerHTML += `<br><span class="kv">Rows:</span> ${currentData.length} <span class="kv">Headers:</span> ${headers.length ? headers.join(", ") : "(none)"}`;
    render();
  } catch(err){
    console.error("Fetch error", err);
    setStatus("Fetch error: " + (err.message || err));
    showFetchError(JSON_FILES[type], err.message || String(err));
    currentData = []; headers = []; priorityKey = "";
    render();
  }
}

function showFetchError(url, details){
  statusMsg.innerHTML = `Error loading data — <a class="link" href="${url}" target="_blank" rel="noopener">Open raw JSON</a>`;
  debugInfo.innerHTML += `<br><span class="kv">Error:</span> ${escapeHtml(String(details))}`;
}

function retryFetch(){ loadData(select.value); }

function loadSampleData(){
  currentData = [
    {
      "PRIORITY":"1",
      "W.O No":"095/30.04.26",
      "kW":"75",
      "Make":"ABB",
      "Frame Size":"315S MA41",
      "Mounting":"B3",
      "RPM":"1485",
      "Sl No":"864679",
      "Equipment details":"P-908, (BAT- E)",
      "Motor Location Update On":"R/W BY M/S MAITY. (1st LOT)",
      "Job Completion Dat":"NS"
    },
    {
      "PRIORITY":"2",
      "W.O No":"100/02.05.26",
      "kW":"45",
      "Make":"Siemens",
      "Frame Size":"225S",
      "Mounting":"B3",
      "RPM":"1500",
      "Sl No":"864680",
      "Equipment details":"P-912",
      "Motor Location Update On":"Checked; pending parts",
      "Job Completion Dat":"TBD"
    }
  ];
  headers = Object.keys(currentData[0]);
  priorityKey = findKeyMatch("PRIORITY") || headers[0];
  setStatus("Sample data loaded (" + currentData.length + " rows)");
  debugInfo.innerHTML = `<span class="kv">Sample data</span> loaded for testing`;
  render();
}

function normalize(s){ return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,""); }
function findKeyMatch(displayName){
  const n = normalize(displayName);
  for(const h of headers) if(normalize(h) === n) return h;
  for(const h of headers) if(normalize(h).includes(n) || n.includes(normalize(h))) return h;
  const tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  for(const h of headers){ const hn = normalize(h); if(tokens.every(t=>hn.includes(t))) return h; }
  return null;
}

function buildOrderedKeys(){
  const ordered = [];
  for(const display of desiredDisplayCols){
    if(display.toLowerCase() === "problems"){
      const candidates = ["Motor Location Update On","Motor Location Update","Motor Location","Motor Location Updated On","Problems","problem","motorlocationupdateon"];
      let found = null;
      for(const c of candidates){ found = findKeyMatch(c); if(found) break; }
      ordered.push(found || findKeyMatch(display) || null);
      continue;
    }
    ordered.push(findKeyMatch(display) || null);
  }
  return ordered.map(k => {
    if(!k) return k;
    const kn = normalize(k);
    for(const ex of excludedNames) if(kn.includes(ex)) return null;
    return k;
  });
}

function render(){
  const q = (searchBox.value || "").toLowerCase();
  const filtered = currentData.filter(r => Object.values(r||{}).join(" ").toLowerCase().includes(q));
  const orderedKeys = buildOrderedKeys();
  const withPriority = [], withoutPriority = [];
  filtered.forEach(r => {
    const pVal = priorityKey ? (r[priorityKey] ?? "") : "";
    if(pVal || pVal === 0 || pVal === "0") {
      if(String(pVal).trim() !== "") withPriority.push(r); else withoutPriority.push(r);
    } else withoutPriority.push(r);
  });
  if(priorityKey) withPriority.sort((a,b) => (Number(a[priorityKey])||9999) - (Number(b[priorityKey])||9999));
  buildTable("priorityTable", withPriority, orderedKeys);
  buildTable("noPriorityTable", withoutPriority, orderedKeys);
  updateCards(withPriority, withoutPriority);
}

function buildTable(id, data, orderedKeys){
  const table = document.getElementById(id);
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  if(!data || data.length === 0){
    thead.innerHTML = "";
    tbody.innerHTML = "<tr><td style='padding:12px'>No Data</td></tr>";
    return;
  }
  let head = "<tr>";
  for(let i=0;i<desiredDisplayCols.length;i++){
    const display = desiredDisplayCols[i];
    const key = orderedKeys[i];
    if(key === null) continue;
    head += `<th data-col="${escapeHtml(display)}">${escapeHtml(display)}</th>`;
  }
  head += "</tr>";
  thead.innerHTML = head;

  tbody.innerHTML = "";
  data.forEach(row => {
    let tr = "<tr>";
    for(let i=0;i<desiredDisplayCols.length;i++){
      const display = desiredDisplayCols[i];
      const key = orderedKeys[i];
      if(key === null) continue;
      const raw = row[key] ?? "";
      const val = escapeHtml(raw);
      if(priorityKey && key === priorityKey){
        const num = Number(raw);
        const cls = (!isNaN(num) && num>=1 && num<=4) ? `priority-${num}` : "";
        tr += `<td data-col="${escapeHtml(display)}" class="${cls}"><span class="val">${val}</span></td>`;
      } else if(String(raw).toUpperCase().includes("COMPLETED")){
        tr += `<td data-col="${escapeHtml(display)}"><span class="badge completed">${val}</span></td>`;
      } else {
        tr += `<td data-col="${escapeHtml(display)}"><span class="val">${val}</span></td>`;
      }
    }
    tr += "</tr>";
    tbody.insertAdjacentHTML("beforeend", tr);
  });
}

/* FIXED: use the parameter name withoutP here (was withoutPriority causing ReferenceError) */
function updateCards(withP, withoutP){
  let high=0,med=0,low=0;
  withP.forEach(r=>{
    const p = priorityKey ? Number(r[priorityKey]) : NaN;
    if(p===1) high++; else if(p===2) med++; else if(!isNaN(p)) low++;
  });
  document.getElementById("totalCount").innerText = withP.length + withoutP.length;
  document.getElementById("highCount").innerText = high;
  document.getElementById("mediumCount").innerText = med;
  document.getElementById("lowCount").innerText = low;
  document.getElementById("noPriorityCount").innerText = withoutP.length;
}

function exportCSV(){
  const orderedKeys = buildOrderedKeys();
  const visibleDisplays = [], visibleKeys = [];
  for(let i=0;i<desiredDisplayCols.length;i++){
    if(orderedKeys[i] === null) continue;
    visibleDisplays.push(desiredDisplayCols[i]);
    visibleKeys.push(orderedKeys[i]);
  }
  let csv = visibleDisplays.join(",") + "\n";
  currentData.forEach(r => {
    const row = visibleKeys.map(k => `"${escapeCSV(String(r[k] ?? ""))}"`).join(",");
    csv += row + "\n";
  });
  const blob = new Blob([csv], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pending_data_filtered.csv"; a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function escapeCSV(s){ return String(s).replace(/"/g,'""'); }

/* App view toggle */
function toggleAppView(){
  const enabled = document.body.classList.toggle("app-view");
  if(enabled) document.body.classList.remove("no-auto-app");
  localStorage.setItem("appView", enabled ? "1" : "0");
  document.getElementById("appViewBtn").innerText = enabled ? "🧭 Desktop View" : "📱 App View";
}

/* init app view */
(function initAppView(){
  const v = localStorage.getItem("appView");
  if(v === "1"){ document.body.classList.add("app-view"); document.getElementById("appViewBtn").innerText = "🧭 Desktop View"; }
  else document.getElementById("appViewBtn").innerText = "📱 App View";
})();

select.addEventListener("change", ()=> loadData(select.value));
searchBox.addEventListener("keyup", render);

/* initial load */
loadData(select.value);
</script>

</body>
</html>
