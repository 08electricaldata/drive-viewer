<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Details — App View</title>

<style>
  /* Reset & base */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f7ff;color:#102230;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* Top credit */
  .top-credit{
    background:#0b3b74;color:#fff;text-align:center;padding:10px 8px;font-weight:700;font-size:13px;
  }

  /* Container */
  .wrap{max-width:1100px;margin:10px auto;padding:12px}

  /* Header */
  .header{
    text-align:center;padding:10px 6px 6px;
  }
  .header h1{color:#0b3b74;font-size:18px;margin-bottom:4px;font-weight:800}
  .header h2{color:#444;font-size:13px;font-weight:600;margin-bottom:4px}
  .meta{font-size:12px;color:#556;margin-bottom:6px}

  /* Buttons */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
  .btn{background:#fff;color:#0b3b74;border:1px solid rgba(11,59,116,0.12);padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(11,59,116,0.06);}
  .btn.small{padding:8px 10px;font-size:13px;border-radius:8px}
  .btn.primary{background:linear-gradient(90deg,#0b3b74,#0050aa);color:#fff;border:none}
  .btn.full{width:100%}

  /* Info grid - compact */
  .info-card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 8px 20px rgba(3,63,136,0.04);margin-bottom:10px}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
  .info-item{padding:6px;border-radius:8px;background:linear-gradient(180deg,#fbfdff,#fff);display:flex;flex-direction:column}
  .info-label{font-size:11px;color:#3a5a7a;font-weight:800;margin-bottom:4px}
  .info-value{font-size:14px;color:#0c2333;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* compact small tables inside collapsible sections */
  details{background:transparent;border-radius:8px;margin-bottom:10px}
  summary{cursor:pointer;list-style:none;outline:none;padding:10px;border-radius:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(3,63,136,0.04)}
  summary .title{font-weight:800;color:#0b3b74;font-size:14px}
  summary .count{font-size:12px;color:#556}
  .detail-body{padding:8px;background:#fff;border-radius:0 0 10px 10px;margin-top:0;box-shadow:0 6px 20px rgba(3,63,136,0.04)}
  .small-table{width:100%;border-collapse:collapse;font-size:12px}
  .small-table th, .small-table td{padding:6px;border:1px solid #e9f0ff;text-align:left}
  .small-table th{background:#eef6ff;color:#0b3b74;font-weight:700}
  .nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* message and loader */
  .loader,.no-data{text-align:center;padding:18px;font-weight:700;color:#556}

  /* Responsive adjustments */
  @media(max-width:700px){
    .info-grid{grid-template-columns:1fr 1fr}
    .toolbar{gap:6px}
    .btn{padding:8px 10px;font-size:13px}
    .header h1{font-size:16px}
  }
  @media(max-width:420px){
    .info-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="top-credit">Designed & Maintained by RAKESH CHANDRA SETHY</div>

<div class="wrap" id="app">
  <div class="loader">Loading Motor Details...</div>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

/* helper to get id param */
function getID(){ return new URLSearchParams(location.search).get("id") || ""; }
function goBack(){ history.back(); }
function goHome(){ location.href = "https://08electricaldata.github.io/index_mob.html"; }
/* use index2 for drive info for mobile consistency */
function goDrive(){ const id=getID(); if(!id) return; location.href = "https://08electricaldata.github.io/drive-viewer/index.html?id=" + encodeURIComponent(id); }
function goPLC(){ const id=getID(); if(!id) return; location.href = "plc.html?id=" + encodeURIComponent(id); }

function formatDate(v){
  if(!v) return "N/A";
  const d=new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString('en-GB');
}

async function loadMotor(){
  const app = document.getElementById('app');
  const id = getID().trim();
  if(!id){
    app.innerHTML = `<div class="no-data">No Drive ID supplied.</div>`;
    return;
  }

  try{
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('Failed to fetch JSON');
    const data = await res.json();

    // find row where column D (index 3) matches id (case-insensitive)
    let row = null;
    for(const r of (data.rows || [])){
      if(String(r[3] || "").trim().toUpperCase() === id.toUpperCase()){
        row = r; break;
      }
    }

    // build header + toolbar
    let html = `
      <div class="header">
        <h1>MOTOR DETAILS</h1>
        <h2>${id}</h2>
        <div class="meta">Last Updated : ${data.updated ? new Date(data.updated).toLocaleString('en-GB') : 'Unknown'}</div>
      </div>

      <div class="toolbar" role="toolbar" aria-label="actions">
        <button class="btn small" onclick="goBack()">⬅ Back</button>
        <button class="btn small" onclick="goHome()">🏠 Home</button>
        <button class="btn small" onclick="goDrive()">Drive Info</button>
        <button class="btn small" onclick="goPLC()">PLC</button>
      </div>
    `;

    if(!row){
      html += `<div class="no-data">Motor details not found for <b>${id}</b></div>`;
      app.innerHTML = html;
      return;
    }

    // info grid: use smaller labels and values
    html += `<div class="info-card">
      <div class="info-grid">
        <div class="info-item"><div class="info-label">KW</div><div class="info-value">${row[5]||''}</div></div>
        <div class="info-item"><div class="info-label">MAKE</div><div class="info-value">${row[7]||''}</div></div>
        <div class="info-item"><div class="info-label">FRAME SIZE</div><div class="info-value">${row[8]||''}</div></div>
        <div class="info-item"><div class="info-label">RPM</div><div class="info-value">${row[9]||''}</div></div>
        <div class="info-item"><div class="info-label">FLC</div><div class="info-value">${row[10]||''}</div></div>
        <div class="info-item"><div class="info-label">MTG</div><div class="info-value">${row[11]||''}</div></div>
      </div>
    </div>`;

    // last motor replacement / last PM
    html += `<div style="margin-top:10px;background:#fff;padding:10px;border-radius:10px;box-shadow:0 6px 20px rgba(3,63,136,0.04);">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div style="flex:1;"><div style="font-size:12px;color:#3a5a7a;font-weight:800">Last Motor Replacement</div>
          <div style="font-size:14px;font-weight:700">${formatDate(row[37])}</div></div>
        <div style="flex:1;"><div style="font-size:12px;color:#3a5a7a;font-weight:800">Last Motor PM</div>
          <div style="font-size:14px;font-weight:700">${formatDate(row[38])}</div></div>
      </div>
    </div>`;

    // Spare Motor Details (collapsible)
    const spareData = (row[24]||"").trim();
    let spareHtml = '';
    if(spareData){
      const spareList = spareData.split("@").map(s=>s.trim()).filter(Boolean);
      spareHtml += `<table class="small-table">`;
      spareHtml += `<thead><tr><th style="width:32px">#</th><th>W/O</th><th>KW</th><th>MAKE</th><th>FRAME</th><th>RPM</th><th>MTG</th><th>DRIVE</th><th>LOCATION</th></tr></thead><tbody>`;
      spareList.forEach((it, idx)=>{
        const parts = it.split("!").map(p=>p? p.trim() : "");
        spareHtml += `<tr>
          <td style="text-align:center">${idx+1}</td>
          <td>${parts[0]||''}</td>
          <td>${parts[1]||''}</td>
          <td>${parts[2]||''}</td>
          <td>${parts[3]||''}</td>
          <td>${parts[4]||''}</td>
          <td>${parts[5]||''}</td>
          <td>${parts[6]||''}</td>
          <td>${parts[7]||''}</td>
        </tr>`;
      });
      spareHtml += `</tbody></table>`;
    } else {
      spareHtml = `<div style="padding:10px;color:#666">No Spare Motor Details Available</div>`;
    }

    html += `<details open style="margin-top:10px">
      <summary><span style="font-weight:800;color:#0b3b74">Spare Motor Details</span><span style="font-size:12px;color:#666;margin-left:8px">${spareData ? '' : '(empty)'}</span></summary>
      <div class="detail-body" style="padding:8px 0">${spareHtml}</div>
    </details>`;

    // Pending Motors at ERS (collapsible)
    const pendingData = (row[26]||"").trim();
    let pendingHtml = '';
    if(pendingData){
      const pendingList = pendingData.split("@").map(s=>s.trim()).filter(Boolean);
      pendingHtml += `<table class="small-table">`;
      pendingHtml += `<thead><tr><th style="width:32px">#</th><th>W/O</th><th>KW</th><th>MAKE</th><th>FRAME</th><th>RPM</th><th>MTG</th><th>DRIVE</th><th>LOCATION</th></tr></thead><tbody>`;
      pendingList.forEach((it, idx)=>{
        const parts = it.split("!").map(p=>p? p.trim() : "");
        pendingHtml += `<tr>
          <td style="text-align:center">${idx+1}</td>
          <td>${parts[0]||''}</td>
          <td>${parts[1]||''}</td>
          <td>${parts[2]||''}</td>
          <td>${parts[3]||''}</td>
          <td>${parts[4]||''}</td>
          <td>${parts[5]||''}</td>
          <td>${parts[6]||''}</td>
          <td>${parts[7]||''}</td>
        </tr>`;
      });
      pendingHtml += `</tbody></table>`;
    } else {
      pendingHtml = `<div style="padding:10px;color:#666">No Pending Motors Available</div>`;
    }

    html += `<details style="margin-top:10px">
      <summary><span style="font-weight:800;color:#0b3b74">Pending Motors at ERS</span><span style="font-size:12px;color:#666;margin-left:8px">${pendingData ? '' : '(empty)'}</span></summary>
      <div class="detail-body" style="padding:8px 0">${pendingHtml}</div>
    </details>`;

    app.innerHTML = html;

  } catch(err){
    console.error(err);
    app.innerHTML = `<div class="no-data">Unable to load Motor Details.<br><br>${err.message || ''}</div>`;
  }
}

/* start */
loadMotor();
</script>
</body>
</html>
