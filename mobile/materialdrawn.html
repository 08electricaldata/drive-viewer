<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Material Drawn Viewer</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 18px; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    h1 { margin:0; font-size:18px; } 
    .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .controls label { font-size:13px; }
    .controls input[type="text"], .controls input[type="date"] { padding:6px; font-size:13px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; min-width:640px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; vertical-align:top; }
    th { background:#f5f5f5; position:sticky; top:0; z-index:1; }
    tr:nth-child(even) td { background:#fafafa; }
    .buttons { margin-left:auto; display:flex; gap:8px; }
    button { padding:6px 10px; font-size:13px; cursor:pointer; }
    .small { font-size:12px; color:#555; }
    .summary { margin-top:6px; font-size:13px; color:#333; }
    .nowrap { white-space:nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Material Drawn — Viewer</h1>
    <div class="buttons">
      <button id="backBtn">Back</button>
      <button id="homeBtn">Home</button>
      <button id="infoBtn">Information</button>
    </div>
  </header>

  <div class="controls" aria-label="filters">
    <!-- Material Code contains removed per request -->

    <!-- Column D (Material Description) filter -->
    <div>
      <label class="nowrap">Material Description contains:<br><input id="dContains" type="text" placeholder="contains..." /></label>
    </div>

    <!-- Date filters for column G -->
    <div>
      <label class="nowrap">From (Date):<br><input id="fromDate" type="date" /></label>
    </div>
    <div>
      <label class="nowrap">To (Date):<br><input id="toDate" type="date" /></label>
    </div>

    <div>
      <button id="clearFilters">Clear Filters</button>
    </div>
  </div>

  <div class="summary"><span id="countText">Loading...</span></div>

  <div style="overflow:auto; max-height:70vh;">
    <table id="dataTable" aria-live="polite">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // URL to the raw JSON
    const DATA_URL = 'https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/materialdrawn.json';

    // Source column indexes (0-based):
    // column G -> index 6 (Date)
    // column 3 -> index 2 (Material code)
    // column 4 -> index 3 (Material description)
    // column H -> index 7 (Quantity)
    const IDX_G = 6;         // Date source (column G)
    const IDX_MATERIAL = 2;  // Material code (column 3)
    const IDX_DESC = 3;      // Material description (column 4)
    const IDX_QTY = 7;       // Quantity (column H)

    let headers = [];
    let rows = []; // raw rows array
    let rowsFiltered = [];

    // Buttons behaviour
    document.getElementById('backBtn').addEventListener('click', () => { history.back(); });
    document.getElementById('homeBtn').addEventListener('click', () => { window.open('https://08electricaldata.github.io/index_mob.html', '_self'); });
    document.getElementById('infoBtn').addEventListener('click', () => { window.open('https://08electricaldata.github.io/drive-viewer/info.html', '_blank'); });

    // Inputs
    const dContains = document.getElementById('dContains');
    const fromDate = document.getElementById('fromDate');
    const toDate = document.getElementById('toDate');
    const clearFilters = document.getElementById('clearFilters');

    [dContains, fromDate, toDate].forEach(el => el.addEventListener('input', applyFilters));
    clearFilters.addEventListener('click', () => {
      dContains.value=''; fromDate.value=''; toDate.value='';
      applyFilters();
    });

    fetch(DATA_URL)
      .then(r => {
        if (!r.ok) throw new Error('Failed to fetch JSON: ' + r.status);
        return r.json();
      })
      .then(json => {
        headers = Array.isArray(json.headers) ? json.headers : [];
        rows = Array.isArray(json.rows) ? json.rows : [];
        // Keep only rows where Material (index 2) is non-blank
        rows = rows.filter(r => safeString(r[IDX_MATERIAL]) !== '');
        buildTableHead();
        // Sort by date (column G) newest -> oldest using IDX_G
        rows.sort((a,b) => {
          const da = parseFlexibleDate(a[IDX_G]);
          const db = parseFlexibleDate(b[IDX_G]);
          if (da && db) return db - da;
          if (da && !db) return -1;
          if (!da && db) return 1;
          return 0;
        });
        applyFilters();
      })
      .catch(err => {
        document.getElementById('countText').textContent = 'Error loading data: ' + err;
        console.error(err);
      });

    // Only show these selected columns in this order: Date (G), Material (3), Desc. (4), Quantity (H)
    function getVisibleIndexes() {
      const totalCols = headers.length ? headers.length : (rows.reduce((m,r)=>Math.max(m,r.length),0) || 0);
      const desired = [IDX_G, IDX_MATERIAL, IDX_DESC, IDX_QTY];
      return desired.filter(idx => (typeof idx === 'number' && idx >= 0 && idx < totalCols));
    }

    function buildTableHead() {
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '';
      const tr = document.createElement('tr');
      // Fixed friendly headings
      const headings = ['Date', 'Material code', 'Desc.', 'Quantity'];
      headings.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
      });
      thead.appendChild(tr);
    }

    function applyFilters() {
      const dContainsVal = dContains.value.trim().toLowerCase();
      const from = fromDate.value ? new Date(fromDate.value) : null;
      const to = toDate.value ? new Date(toDate.value) : null;
      if (to) to.setHours(23,59,59,999);

      rowsFiltered = rows.filter(r => {
        const d = safeString(r[IDX_DESC]).toLowerCase();
        if (dContainsVal && !d.includes(dContainsVal)) return false;

        // Date filter on column G (IDX_G)
        const cell = r[IDX_G];
        const dt = parseFlexibleDate(cell);
        if (from || to) {
          if (!dt) return false; // ignore rows with no valid date when date range is applied
          if (from && dt < from) return false;
          if (to && dt > to) return false;
        }
        return true;
      });

      // Sort the filtered results by date descending (recent -> older)
      rowsFiltered.sort((a,b) => {
        const da = parseFlexibleDate(a[IDX_G]);
        const db = parseFlexibleDate(b[IDX_G]);
        if (da && db) return db - da;
        if (da && !db) return -1;
        if (!da && db) return 1;
        return 0;
      });

      renderTableBody();
    }

    function renderTableBody() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const visible = getVisibleIndexes();

      rowsFiltered.forEach(row => {
        const tr = document.createElement('tr');
        visible.forEach(idx => {
          const td = document.createElement('td');
          const v = row[idx];
          if (idx === IDX_G) {
            const dt = parseFlexibleDate(v);
            td.textContent = dt ? formatDateDDMMYYYY(dt) : safeString(v);
          } else {
            td.textContent = (v === null || v === undefined) ? '' : String(v);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById('countText').textContent = `Showing ${rowsFiltered.length} of ${rows.length} rows (Material non-blank enforced)`;
    }

    // Helpers
    function safeString(v) {
      if (v === null || v === undefined) return '';
      return String(v).trim();
    }

    function formatDateDDMMYYYY(d) {
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth() + 1).padStart(2,'0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    // Parse multiple date formats; returns Date or null
    function parseFlexibleDate(val) {
      if (val === null || val === undefined) return null;
      if (val instanceof Date && !isNaN(val)) return val;
      if (typeof val === 'number') {
        const d = new Date(val);
        if (!isNaN(d)) return d;
      }
      const s = String(val).trim();
      if (!s) return null;
      // native parser
      const d1 = new Date(s);
      if (!isNaN(d1)) return d1;
      // dd-mm-yyyy or dd/mm/yyyy with optional time
      const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[T\s](.*))?$/);
      if (m) {
        const day = Number(m[1]), mon = Number(m[2]) - 1, yr = Number(m[3]);
        if (m[4]) {
          const rest = m[4];
          const iso = `${yr.toString().padStart(4,'0')}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}T${rest}`;
          const d2 = new Date(iso);
          if (!isNaN(d2)) return d2;
        }
        const d = new Date(yr, mon, day);
        if (!isNaN(d)) return d;
      }
      // mm/dd/yyyy fallback
      const m2 = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
      if (m2) {
        const mth = Number(m2[1]) - 1, day = Number(m2[2]), yr = Number(m2[3]);
        const d = new Date(yr, mth, day);
        if (!isNaN(d)) return d;
      }
      return null;
    }

  </script>
</body>
</html>
