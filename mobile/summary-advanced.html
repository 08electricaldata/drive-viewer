<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Summary — App View</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --brand:#003f88;
    --bg:#f2f6ff;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#22c55e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:#0b1220;
  }

  /* App header (mobile-first) */
  .app-header{
    position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;padding:12px;
    background:linear-gradient(90deg,var(--brand),#0050aa);color:#fff;
  }
  .app-left{display:flex;gap:8px;align-items:center}
  .app-title{flex:1;text-align:center;font-weight:800;font-size:16px}
  .app-sub{font-size:11px;opacity:.95}

  .btn{
    background:#fff;color:var(--brand);border:0;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.12);
  }
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2)}

  /* Page */
  .page{max-width:1100px;margin:12px auto;padding:12px}

  /* Controls - stacked on mobile */
  .controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .controls-row{display:flex;gap:8px;align-items:center}
  .controls input[type="date"], .controls button{
    padding:10px;border-radius:10px;border:1px solid #dce9ff;background:#fff;font-size:14px;
  }
  .controls .actions{display:flex;gap:8px}

  /* Card list for mobile */
  .card-list{display:flex;flex-direction:column;gap:10px}
  .card{
    background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 20px rgba(3,63,136,0.06);
  }
  .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .card-left{display:flex;gap:8px;align-items:flex-start;min-width:0}
  .badge{background:#eef6ff;color:var(--brand);padding:6px 8px;border-radius:8px;font-weight:800;flex-shrink:0}
  .card-title{font-weight:800;color:var(--brand);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:12px;color:var(--muted)}
  .card-body{margin-top:8px;font-size:13px;color:#0b1220;display:grid;grid-template-columns:1fr;gap:6px}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap}
  .meta{background:#f1f7ff;padding:6px 8px;border-radius:8px;font-weight:700;color:#0b3b74;font-size:12px}

  /* Table for larger screens */
  .table-wrap{display:none;background:var(--card);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(3,63,136,0.04);overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:900px;font-size:13px}
  th,td{padding:10px;border:1px solid #e8edf6;text-align:left;vertical-align:top}
  thead th{background:var(--brand);color:#fff;font-weight:700}
  tr.clickable:hover{background:#eef6ff;cursor:pointer}
  a.file-link{color:var(--brand);font-weight:700;text-decoration:underline}

  /* responsive */
  @media(min-width:900px){
    .controls{flex-direction:row;align-items:center}
    .card-list{display:none}
    .table-wrap{display:block}
  }

  @media(max-width:420px){
    .app-title{font-size:15px}
    .controls input[type="date"]{font-size:13px;padding:8px}
    .badge{padding:5px 6px}
  }

  /* Print */
  @media print{
    .app-header,.controls{display:none}
  }
</style>
</head>
<body>

<header class="app-header" role="banner">
  <div class="app-left">
    <button class="btn" onclick="goBack()">⬅</button>
  </div>
  <div class="app-title">
    Summary
    <div class="app-sub" style="font-weight:600">Drive History Summary — Mobile App View</div>
  </div>
  <div>
    <button class="btn" onclick="goHome()">🏠</button>
  </div>
</header>

<main class="page" role="main">
  <section class="card" aria-labelledby="summaryTitle">
    <h2 id="summaryTitle" style="margin:0 0 12px 0;text-align:center;color:var(--brand)">Summary</h2>

    <div class="controls" role="region" aria-label="filters">
      <div class="controls-row" style="flex:1;gap:8px;">
        <input type="date" id="fromDate" aria-label="From date">
        <input type="date" id="toDate" aria-label="To date">
        <div class="actions">
          <button onclick="loadSummary()">Apply</button>
        </div>
      </div>

      <div class="controls-row" style="justify-content:flex-end">
        <button onclick="exportExcel()">Export CSV</button>
        <button onclick="window.print()">Export PDF</button>
      </div>
    </div>

    <!-- Mobile card list -->
    <div id="cardList" class="card-list" aria-live="polite">No data loaded. Tap Apply to load summary.</div>

    <!-- Desktop table -->
    <div class="table-wrap" id="tableWrap" aria-hidden="true">
      <table id="summaryTable" aria-label="Summary table">
        <thead>
          <tr>
            <th>BAT</th>
            <th>EQP</th>
            <th>TR NO</th>
            <th>MONTH</th>
            <th>DATE</th>
            <th>DETAILS OF JOB</th>
            <th>JOB TYPE</th>
            <th>JOB CATEGORY</th>
            <th>CARRIED OUT BY</th>
            <th>LINK</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/1Ar9-a9u4b622-6i8b889qGqENI8rl8Q2U6PPOPBaLDc/gviz/tq" +
  "?gid=751880096&tqx=out:json";

/* Nav */
function goHome(){ window.location.href = "https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }

/* Parse various date formats */
function parseDate(v){
  if(!v) return null;
  if(typeof v === "string" && v.startsWith("Date(")){
    // Google viz Date(YYYY,MM,DD,...)
    const m = v.match(/\d+/g);
    if(m && m.length >= 3) return new Date(Number(m[0]), Number(m[1]), Number(m[2]));
  }
  if(typeof v === "string" && /^\d{2}-\d{2}-\d{4}$/.test(v)){
    const [d,m,y] = v.split("-");
    return new Date(Number(y), Number(m)-1, Number(d));
  }
  if(typeof v === "string" && /^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const [d,m,y] = v.split("/");
    return new Date(Number(y), Number(m)-1, Number(d));
  }
  // fallback: try Date
  const d = new Date(v);
  if(!isNaN(d)) return d;
  return null;
}
function formatDate(d){
  if(!d) return "";
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}

/* State for last loaded items (filtered) */
let lastItems = []; // each item is object with fields used below

async function loadSummary(){
  // read date filters
  const fromInput = document.getElementById("fromDate").valueAsDate;
  const toInput = document.getElementById("toDate").valueAsDate;
  let from = fromInput ? new Date(fromInput) : null;
  let to = toInput ? new Date(toInput) : null;
  if(from) from.setHours(0,0,0,0);
  if(to) to.setHours(23,59,59,999);

  // fetch sheet via gviz
  const res = await fetch(SHEET_URL);
  const txt = await res.text();
  // gviz returns jsonp-like "/*O_o*/\ngoogle.visualization.Query.setResponse(...);"
  const json = JSON.parse(txt.substring(txt.indexOf('(') + 1, txt.lastIndexOf(')')));
  const rows = json.table.rows || [];

  // build items
  const items = [];
  rows.forEach(r=>{
    const c = r.c || [];
    const dateVal = c[4] && c[4].v;
    const d = parseDate(dateVal);
    if(!d) return;
    if(from && d < from) return;
    if(to && d > to) return;

    const item = {
      bat: c[2] && c[2].v || "",
      eqp: c[3] && c[3].v || "",
      trno: c[0] && c[0].v || "",
      month: c[1] && c[1].v || "",
      date: d,
      details: c[5] && c[5].v || "",
      jobType: c[6] && c[6].v || "",
      jobCategory: c[7] && c[7].v || "",
      carriedBy: c[9] && c[9].v || "",
      link: c[10] && c[10].v || ""
    };
    items.push(item);
  });

  lastItems = items;
  renderMobileCards(items);
  renderTable(items);
}

/* Render mobile cards */
function renderMobileCards(items){
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  if(items.length === 0){
    list.textContent = 'No records found for selected date range.';
    return;
  }

  items.forEach(it=>{
    const card = document.createElement('article');
    card.className = 'card';

    const top = document.createElement('div');
    top.className = 'card-top';
    top.innerHTML = `
      <div class="card-left">
        <div class="badge">${escapeHtml(it.trno)}</div>
        <div style="min-width:0">
          <div class="card-title">${escapeHtml(it.bat)} • ${escapeHtml(it.eqp)}</div>
          <div class="card-sub">${it.month} • ${formatDate(it.date)}</div>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:800">${escapeHtml(it.jobType)}</div>
        <div style="font-size:12px;color:var(--muted)">${escapeHtml(it.jobCategory)}</div>
      </div>
    `;

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div>${escapeHtml(it.details)}</div>
      <div class="meta-row">
        <div class="meta">By: ${escapeHtml(it.carriedBy)}</div>
        <div class="meta">${it.link ? `<a class="file-link" href="${escapeAttr(it.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open</a>` : ''}</div>
      </div>
    `;

    // clicking card navigates to drive viewer for this BAT-EQP (keep same behavior as table)
    const driveId = `${it.bat || ''}-${it.eqp || ''}`;
    if(driveId && driveId !== '-'){
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => {
        // open same as before; user earlier wanted index2 for VIEW - keep index2 here for consistency
        window.location.href = 'https://08electricaldata.github.io/drive-viewer/index2.html?id=' + encodeURIComponent(driveId);
      });
    }

    card.appendChild(top);
    card.appendChild(body);
    list.appendChild(card);
  });
}

/* Render desktop table */
function renderTable(items){
  const tableWrap = document.getElementById('tableWrap');
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = '';

  // show table-wrap only on large screens via CSS; still populate tbody always
  items.forEach(it=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(it.bat)}</td>
      <td>${escapeHtml(it.eqp)}</td>
      <td>${escapeHtml(it.trno)}</td>
      <td>${escapeHtml(it.month)}</td>
      <td>${formatDate(it.date)}</td>
      <td>${escapeHtml(it.details)}</td>
      <td>${escapeHtml(it.jobType)}</td>
      <td>${escapeHtml(it.jobCategory)}</td>
      <td>${escapeHtml(it.carriedBy)}</td>
      <td>${it.link ? `<a href="${escapeAttr(it.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open</a>` : ''}</td>
    `;
    // row click -> open drive viewer (index2)
    const driveId = `${it.bat || ''}-${it.eqp || ''}`;
    if(driveId && driveId !== '-'){
      tr.classList.add('clickable');
      tr.addEventListener('click', () => {
        window.location.href = 'https://08electricaldata.github.io/drive-viewer/index2.html?id=' + encodeURIComponent(driveId);
      });
    }
    tbody.appendChild(tr);
  });
}

/* Export CSV from lastItems (filtered) */
function exportExcel(){
  if(!lastItems || lastItems.length===0){ alert('No data to export'); return; }
  const header = ['BAT','EQP','TR NO','MONTH','DATE','DETAILS','JOB TYPE','JOB CATEGORY','CARRIED OUT BY','LINK'];
  const rows = [header.join(',')];
  lastItems.forEach(it=>{
    const line = [
      it.bat,
      it.eqp,
      it.trno,
      it.month,
      formatDate(it.date),
      (it.details||'').replace(/"/g,'""'),
      it.jobType,
      it.jobCategory,
      it.carriedBy,
      it.link
    ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',');
    rows.push(line);
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `summary-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* Escape helpers */
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s||'').replace(/"/g,'%22'); }

/* Wire Apply on Enter in date inputs */
document.getElementById('fromDate').addEventListener('keypress', (e)=>{ if(e.key==='Enter') loadSummary(); });
document.getElementById('toDate').addEventListener('keypress', (e)=>{ if(e.key==='Enter') loadSummary(); });

/* Optional: auto-load most recent month on open — commented out for explicit user action
window.addEventListener('load', ()=>{
  // loadSummary();
});
*/
</script>
</body>
</html>
