<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drive History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  padding: 0;
  margin: 0;
  background: #f2f6ff;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ===== STICKY HEADER ===== */
.header-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #003f88;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px;
}

.header-left {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
}

.header-bar button {
  background: white;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.header-bar button:active {
  transform: scale(0.95);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.header-title {
  flex: 1;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}

.header-credit {
  display: none;
  font-size: 12px;
  font-weight: 500;
  opacity: 0.9;
  white-space: nowrap;
}

/* ===== PAGE ===== */
.page { 
  padding: 8px; 
  max-width: 100%;
  margin: 0 auto;
}

h2 {
  color: #003f88;
  text-align: center;
  font-weight: 600;
  font-size: 15px;
  margin: 6px 0;
}

/* ===== DRIVE INFO CARD ===== */
.card {
  background: white;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  margin-bottom: 8px;
}

.card h3 {
  color: #003f88;
  text-align: center;
  font-weight: 600;
  font-size: 14px;
  margin: 0 0 8px 0;
}

.drive-info-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.info-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  align-items: flex-start;
}

.info-label {
  font-weight: 600;
  color: #003f88;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

.info-value {
  font-size: 12px;
  word-break: break-word;
  line-height: 1.3;
}

/* CONTROLS */
.controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.controls input {
  padding: 8px;
  font-size: 13px;
  border: 1px solid #ddd;
  border-radius: 6px;
  width: 100%;
}

.btn-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.controls button {
  padding: 8px 10px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.controls button:active {
  transform: scale(0.98);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

/* TABLE */
.table-container {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 8px;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th, td {
  border: 1px solid #ddd;
  padding: 6px 5px;
  text-align: left;
  word-break: break-word;
  overflow-wrap: break-word;
}

th {
  background: #003f88;
  color: white;
  font-weight: 600;
  font-size: 11px;
  white-space: normal;
}

/* Column Widths */
#historyTable th:nth-child(1),
#historyTable td:nth-child(1) {
  width: 50px;
  text-align: center;
}

#historyTable th:nth-child(2),
#historyTable td:nth-child(2) {
  width: 65px;
  text-align: center;
}

#historyTable th:nth-child(3),
#historyTable td:nth-child(3) {
  width: 100px;
  min-width: 100px;
}

#historyTable th:nth-child(4),
#historyTable td:nth-child(4) {
  width: 100px;
  min-width: 100px;
}

#historyTable th:nth-child(5),
#historyTable td:nth-child(5) {
  width: 40px;
  text-align: center;
}

#historyTable a {
  color: #003f88;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  display: inline-block;
}

#historyTable a:active {
  opacity: 0.7;
}

.year-row td {
  background: #e8f0ff;
  color: #003f88;
  font-weight: 700;
  text-align: center;
  padding: 6px;
  font-size: 12px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 480px) {
  .header-bar {
    padding: 6px 6px;
  }

  .header-bar button {
    padding: 5px 6px;
    font-size: 11px;
  }

  .header-title {
    font-size: 13px;
  }

  .page {
    padding: 6px;
  }

  h2 {
    font-size: 14px;
    margin: 4px 0;
  }

  .card {
    padding: 8px;
    margin-bottom: 6px;
  }

  .card h3 {
    font-size: 13px;
    margin-bottom: 6px;
  }

  .drive-info-list {
    gap: 4px;
  }

  .info-row {
    gap: 6px;
  }

  .info-label {
    font-size: 11px;
  }

  .info-value {
    font-size: 11px;
  }

  table {
    font-size: 11px;
  }

  th, td {
    padding: 5px 4px;
  }

  th {
    font-size: 10px;
  }

  #historyTable th:nth-child(1),
  #historyTable td:nth-child(1) {
    width: 45px;
  }

  #historyTable th:nth-child(2),
  #historyTable td:nth-child(2) {
    width: 60px;
  }

  #historyTable th:nth-child(3),
  #historyTable td:nth-child(3) {
    width: 80px;
    min-width: 80px;
  }

  #historyTable th:nth-child(4),
  #historyTable td:nth-child(4) {
    width: 90px;
    min-width: 90px;
  }

  #historyTable th:nth-child(5),
  #historyTable td:nth-child(5) {
    width: 35px;
  }

  .year-row td {
    padding: 4px;
    font-size: 11px;
  }
}

@media (min-width: 768px) {
  .page {
    max-width: 1000px;
    margin: 0 auto;
  }

  table {
    font-size: 13px;
  }

  th, td {
    padding: 7px 6px;
  }

  h2 {
    font-size: 16px;
  }

  #historyTable th:nth-child(1),
  #historyTable td:nth-child(1) {
    width: 60px;
  }

  #historyTable th:nth-child(2),
  #historyTable td:nth-child(2) {
    width: 75px;
  }

  #historyTable th:nth-child(3),
  #historyTable td:nth-child(3) {
    width: 120px;
    min-width: 120px;
  }

  #historyTable th:nth-child(4),
  #historyTable td:nth-child(4) {
    width: 150px;
    min-width: 150px;
  }

  #historyTable th:nth-child(5),
  #historyTable td:nth-child(5) {
    width: 50px;
  }
}

.no-data {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 12px;
}

</style>
</head>

<body>

<div class="header-bar">
  <div class="header-left">
    <button onclick="goHome()">🏠</button>
    <button onclick="goBack()">⬅</button>
    <button onclick="goDriveInfo()">ℹ️</button>
  </div>
  <div class="header-title">History</div>
  <div class="header-credit">By Rakesh Chandra Sethy</div>
</div>

<div class="page">

<h2>Drive Info</h2>

<div id="driveInfo" class="card">
  Loading data…
</div>

<h2>History</h2>

<div class="card">
  <div class="controls">
    <input id="search" placeholder="Search…" type="text">
    <div class="btn-group">
      <button onclick="exportExcel()">📥 CSV</button>
      <button onclick="window.print()">🖨️ Print</button>
    </div>
  </div>

  <div class="table-container">
    <table id="historyTable">
      <thead>
        <tr>
          <th>TR NO</th>
          <th>DATE</th>
          <th>DETAILS</th>
          <th>CATEGORY</th>
          <th>LINK</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="no-data" id="noData" style="display:none;">No history found</div>
</div>

</div>

<script>
/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

/* ===== ID ===== */
const rawId = new URLSearchParams(location.search).get("id");
const id = normalize(rawId);

/* ===== NAV ===== */
function goHome(){ location.href="https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }
function goDriveInfo(){
  if(!id) return;
  location.href =
    "https://08electricaldata.github.io/drive-viewer/mobile/index.html?id=" +
    encodeURIComponent(id);
}

/* ===== DRIVE INFO ===== */
async function loadDriveInfo(){
  if(!id) return;

  const url="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";
  try{
    const r=await fetch(url);
    const j=await r.json();

    let c=null;
    j.rows.forEach(r=>{
      if(normalize(`${r[1]}-${r[2]}`) === id) c=r;
    });

    if(!c){
      driveInfo.innerHTML="<p style='color:#d32f2f;'>Drive not found.</p>";
      return;
    }

    const type=normalize(c[1]);
    let html = `<h3>${c[1]} – ${c[2]}</h3><div class="drive-info-list">`;

    if(type==="TRANSFORMER"){
      html += `
        <div class="info-row"><span class="info-label">TR Sl No:</span><span class="info-value">${c[3]}</span></div>
        <div class="info-row"><span class="info-label">Make:</span><span class="info-value">${c[4]}</span></div>
        <div class="info-row"><span class="info-label">Rating:</span><span class="info-value">${c[5]} KVA</span></div>
        <div class="info-row"><span class="info-label">From S/S:</span><span class="info-value">${c[6]}</span></div>
        <div class="info-row"><span class="info-label">Unit S/S:</span><span class="info-value">${c[7]}</span></div>
        <div class="info-row"><span class="info-label">% Impedance:</span><span class="info-value">${c[8]}</span></div>
        <div class="info-row"><span class="info-label">LT SWBD:</span><span class="info-value">${c[9]}</span></div>
        <div class="info-row"><span class="info-label">Panel Rating:</span><span class="info-value">${c[10]}</span></div>
      `;
    } else if(type==="BREAKER"){
      html += `
        <div class="info-row"><span class="info-label">Compartment No:</span><span class="info-value">${c[3]}</span></div>
        <div class="info-row"><span class="info-label">Breaker Desc:</span><span class="info-value">${c[4]}</span></div>
        <div class="info-row"><span class="info-label">Make:</span><span class="info-value">${c[5]}</span></div>
        <div class="info-row"><span class="info-label">Rating:</span><span class="info-value">${c[6]} A</span></div>
        <div class="info-row"><span class="info-label">Type:</span><span class="info-value">${c[7]}</span></div>
        <div class="info-row"><span class="info-label">LT SWBD:</span><span class="info-value">${c[9]}</span></div>
        <div class="info-row"><span class="info-label">Panel Rating:</span><span class="info-value">${c[10]}</span></div>
      `;
    } else {
      html += `
        <div class="info-row"><span class="info-label">Rating:</span><span class="info-value">${c[5]} KW</span></div>
        <div class="info-row"><span class="info-label">FLC:</span><span class="info-value">${c[10]} A</span></div>
        <div class="info-row"><span class="info-label">SFU:</span><span class="info-value">${c[14]}</span></div>
        <div class="info-row"><span class="info-label">Fuse:</span><span class="info-value">${c[15]}</span></div>
        <div class="info-row"><span class="info-label">Contactor:</span><span class="info-value">${c[16]}</span></div>
        <div class="info-row"><span class="info-label">Relay:</span><span class="info-value">${c[17]}</span></div>
        <div class="info-row"><span class="info-label">CT (M):</span><span class="info-value">${c[18]}</span></div>
        <div class="info-row"><span class="info-label">CT (P):</span><span class="info-value">${c[19]}</span></div>
        <div class="info-row"><span class="info-label">Aux Contactor:</span><span class="info-value">${c[20]}</span></div>
      `;
    }

    html += `</div>`;
    driveInfo.innerHTML = html;
  }catch(e){
    console.error(e);
  }
}

/* ===== DATE NORMALIZER ===== */
function normalizeDateKey(v){
  if(!v) return "";
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
  if(typeof v==="string" && v.startsWith("Date(")){
    const p=v.match(/\d+/g);
    const d=new Date(p[0],p[1],p[2]);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  }
  const d=new Date(v);
  if(!isNaN(d)){
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  }
  return "";
}

function formatDate(v){
  const key=normalizeDateKey(v);
  if(!key) return "";
  const[d,m,y]=key.split("/");
  return `${d}-${m}-${y}`;
}

/* ===== JOB BOOK ===== */
const JOBBOOK_JSON =
  "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/jobbook.json";

let jobBookMap = {};

async function loadJobBook(){
  try{
    const r = await fetch(JOBBOOK_JSON);
    const j = await r.json();
    j.rows.forEach(r=>{
      const key = normalizeDateKey(r[0]);
      if(key && r[1]) jobBookMap[key] = r[1];
    });
  }catch(e){}
}

/* ===== HISTORY ===== */
const HISTORY_YEARS=[2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/";

async function loadHistory(){
  let all=[];

  for(const y of HISTORY_YEARS){
    try{
      const r=await fetch(HISTORY_BASE+y+".json");
      if(!r.ok) continue;
      const j=await r.json();
      j.rows.forEach(row=>{
        if(normalize(`${row[2]}-${row[3]}`) === id){
          all.push(row);
        }
      });
    }catch(e){}
  }

  all.sort((a,b)=>new Date(b[4])-new Date(a[4]));
  renderHistory(all);
}

function renderHistory(rows){
  const tbody=document.querySelector("#historyTable tbody");
  const noData=document.getElementById("noData");
  
  tbody.innerHTML="";
  
  if(!rows.length){
    noData.style.display="block";
    return;
  }
  
  noData.style.display="none";
  let currentYear="";

  rows.forEach(r=>{
    const key=normalizeDateKey(r[4]);
    const y=key.slice(-4);

    if(y!==currentYear){
      currentYear=y;
      const yr=document.createElement("tr");
      yr.className="year-row";
      yr.innerHTML=`<td colspan="5">${y}</td>`;
      tbody.appendChild(yr);
    }

    const link = jobBookMap[key] || r[10];

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r[0]||"-"}</td>
      <td>${formatDate(r[4])||"-"}</td>
      <td>${r[5]||"-"}</td>
      <td>${r[7]||"-"}</td>
      <td>${link?`<a href="${link}" target="_blank" title="Open">📎</a>`:"-"}</td>`;
    tbody.appendChild(tr);
  });
}

/* ===== SEARCH ===== */
document.getElementById("search").addEventListener("input",function(){
  const v=this.value.toLowerCase();
  let visibleCount=0;
  document.querySelectorAll("#historyTable tbody tr").forEach(tr=>{
    const isYearRow=tr.classList.contains("year-row");
    const matches=tr.innerText.toLowerCase().includes(v);
    tr.style.display=matches?"":"none";
    if(matches && !isYearRow) visibleCount++;
  });
  document.getElementById("noData").style.display=visibleCount===0?"block":"none";
});

/* ===== EXPORT ===== */
function exportExcel(){
  let csv=[];
  document.querySelectorAll("#historyTable tr").forEach(r=>{
    if(r.classList.contains("year-row")){
      csv.push([r.innerText]);
    }else{
      csv.push([...r.children].map((c,i)=>{
        if(i===4) return `"Open"`;
        return `"${c.innerText.trim()}"`;
      }).join(","));
    }
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv.join("\n")],{type:"text/csv"}));
  a.download=`drive-history-${id}-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

/* ===== INIT ===== */
(async function(){
  await loadJobBook();
  loadDriveInfo();
  loadHistory();
})();
</script>

</body>
</html>
