<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Industrial LT MCC Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  margin:0;
  background:#f2f6ff;
}

/* HEADER */
.header{
  background:#003f88;
  color:white;
  padding:10px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  position:relative;
}

.header-title{
  font-size:22px;
  font-weight:700;
}

.subtitle{
  font-size:14px;
  margin-top:3px;
  font-weight:500;
}

/* NEW NAV BUTTONS */
.nav-buttons{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:10px;
}

.nav-btn{
  background:white;
  color:#003f88;
  border:none;
  padding:6px 12px;
  border-radius:5px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  transition:all .2s ease;
}

.nav-btn:hover{
  background:#ffd633;
  transform:scale(1.05);
}

/* BOARD AREA */
#boardWrapper{
  overflow:auto;
  padding:12px;
}

#boardContainer{
  display:flex;
  align-items:flex-start;
  position:relative;
  min-height:300px;
  gap:10px;
  /* allow wrapping on small screens */
  flex-wrap:wrap;
}

/* SECTIONS */
.section{
  background:white;
  border-radius:8px;
  box-shadow:0 6px 15px rgba(0,0,0,.18);
  margin-right:10px;
  display:flex;
  flex-direction:column;
  width:160px;
  position:relative; /* for coupler bridge positioning */
  flex: 0 0 160px;
}

.section-title{
  background:#003f88;
  color:white;
  text-align:center;
  font-weight:bold;
  padding:8px;
  font-size:14px;
  letter-spacing:.5px;
}

/* BASE CELL */
.cell{
  border:2px solid #333;
  padding:8px;
  margin:6px;
  font-size:12px;
  border-radius:6px;
  cursor:pointer;
  min-height:75px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;

  box-shadow:
    0 4px 8px rgba(0,0,0,.18),
    inset 0 1px 2px rgba(255,255,255,.6);

  transition:all .18s ease;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}

.cell:hover{
  transform:scale(1.03);
  box-shadow:
    0 8px 16px rgba(0,0,0,.28),
    inset 0 1px 2px rgba(255,255,255,.7);
}

/* On touch devices, do not scale on :hover */
@media (hover: none) {
  .cell:hover { transform: none; box-shadow: 0 4px 8px rgba(0,0,0,.18); }
}

.incomer-box{
  min-height:110px;
  font-size:14px;
  font-weight:bold;
}

.breaker-font{
  font-size:14px;
  font-weight:bold;
}

.status-on{
  border-color:#00aa00;
  box-shadow:
    0 0 12px rgba(0,255,0,.45),
    0 6px 14px rgba(0,0,0,.18);
  animation:glowPulse 2.2s infinite;
}

@keyframes glowPulse{
  0%{box-shadow:0 0 6px rgba(0,255,0,.35);}
  50%{box-shadow:0 0 12px rgba(0,255,0,.75);}
  100%{box-shadow:0 0 6px rgba(0,255,0,.35);}
}

.status-off{
  border-color:#cc0000;
}

.incomer{ background:#ff4d4d; color:#fff; }
.coupler{ background:#ffd633; }
.outgoing-breaker{ background:#ff944d; color:#000; }
.outgoing-dol{ background:#4d94ff; color:#000; }
.outgoing-mccb{ background:#b366ff; color:#fff; }
.outgoing-sfu{ background:#33ccff; color:#000; }
.spare{ background:#e0e0e0; color:#333; }

/* Coupler bridge placed inside section and centered */
.section .coupler-bridge{
  position:absolute;
  width:6px;
  background:linear-gradient(to bottom, red 0%, yellow 50%, red 100%);
  top:48px;
  left:50%;
  transform:translateX(-50%);
  height:70px;
  z-index:1;
  background-size:100% 200%;
  animation:flowAnimation 1.5s linear infinite;
  border-radius:3px;
}

/* small-screen layout tweaks */
@media (max-width: 480px) {
  .header-title{ font-size:18px; }
  .subtitle{ font-size:12px; }
  #boardWrapper{ padding:8px; }
  .section{ width:45%; flex:0 0 45%; margin-bottom:10px; min-width:140px; }
  .section-title{ font-size:13px; padding:6px; }
  .cell{ min-height:64px; font-size:12px; padding:6px; margin:6px 6px; }
  .incomer-box{ min-height:90px; font-size:13px; }
  .nav-buttons{ left:8px; top:8px; }
  .nav-btn{ padding:6px 8px; font-size:12px; }
  #boardContainer{ gap:8px; }
}

/* larger screen */
@media (min-width: 768px){
  #boardWrapper{ padding:20px 30px; }
  .section{ width:180px; flex:0 0 180px; }
  .cell{ min-height:80px; padding:10px; font-size:13px; }
}
</style>
</head>

<body>

<div class="header">

  <!-- NEW BUTTONS -->
  <div class="nav-buttons" aria-hidden="false">
    <button class="nav-btn" onclick="goHome()">Home</button>
    <button class="nav-btn" onclick="goBack()">Back</button>
  </div>

  <div class="header-title" id="title">Industrial LT MCC Layout</div>
  <div class="subtitle">
    Designed and Maintained by Rakesh Chandra Sethy
  </div>
</div>

<div id="boardWrapper" role="region" aria-label="Board area">
  <div id="boardContainer"></div>
</div>

<script>

function goHome(){
  window.location.href="https://08electricaldata.github.io/index_mob.html";
}

function goBack(){
  window.history.back();
}

const JSON_URL =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/sld/lt_sld.json";

function getParam(n){
  return new URL(location.href).searchParams.get(n);
}

async function load(){

  const boardId=getParam("id");
  if(!boardId) return;

  document.getElementById("title").innerText =
  "Industrial LT MCC Layout - " + boardId;

  const res=await fetch(JSON_URL);
  const data=await res.json();

  const board=data.boards?.[boardId];
  if(!board) {
    const container=document.getElementById("boardContainer");
    container.innerHTML = "<div style='padding:16px;color:#d32f2f;font-weight:700'>Board not found in lt_sld.json</div>";
    return;
  }

  const container=document.getElementById("boardContainer");
  container.innerHTML="";

  const sections=Object.keys(board.sections || {})
    .sort((a,b)=>Number(a)-Number(b));

  // Remove fixed width calculation - allow container to size responsively
  // container.style.width=(sections.length*sectionWidth)+"px";

  let maxDevices=0;
  sections.forEach(sec=>{
    const count=board.sections[sec].length;
    if(count>maxDevices) maxDevices=count;
  });

  sections.forEach((sec,index)=>{

    const secDiv=document.createElement("div");
    secDiv.className="section";

    const title=document.createElement("div");
    title.className="section-title";
    title.innerText="SECTION "+sec;
    secDiv.appendChild(title);

    const devices=board.sections[sec]
      .slice()
      .sort((a,b)=> (a.level||"").localeCompare(b.level||"") );

    devices.forEach(d=>{

      const cell=document.createElement("div");
      cell.className="cell";

      if(d.status && String(d.status).toUpperCase()==="ON"){
        cell.classList.add("status-on");
      }else{
        cell.classList.add("status-off");
      }

      if(d.feederType === "INCOMER"){
        cell.classList.add("incomer","incomer-box","breaker-font");
      }
      else if(d.feederType === "BUS_COUPLER"){
        cell.classList.add("coupler","breaker-font");

        // create a coupler-bridge inside this section so it positions correctly on wrap
        const bridge=document.createElement("div");
        bridge.className="coupler-bridge";
        secDiv.appendChild(bridge);
      }
      else if(d.feederType === "OUTGOING"){

        if(d.breakerType){
          cell.classList.add("outgoing-breaker","breaker-font");
        }
        else{
          if(d.DriveType === "DOL"){
            cell.classList.add("outgoing-dol");
          }
          else if(d.DriveType === "MCCB"){
            cell.classList.add("outgoing-mccb");
          }
          else if(d.DriveType === "SFU"){
            cell.classList.add("outgoing-sfu");
          }
          else{
            cell.classList.add("outgoing-dol");
          }
        }
      }
      else{
        cell.classList.add("spare");
      }

      // build text content
      const posText = "<div style='font-weight:700;margin-bottom:6px;'>"+(d.position||"")+"</div>";
      const driveText = "<div style='font-size:13px;line-height:1.1;min-height:28px;'>"+(d.driveid ? escapeHtml(d.driveid) : "")+"</div>";
      const typeText = "<div style='margin-top:6px;font-weight:600;color:#222;'>"+
        (
          (d.feederType==="INCOMER" ||
           d.feederType==="BUS_COUPLER" ||
           d.breakerType)
          ? (d.breakerType || "")
          : (d.DriveType || "")
        ) + "</div>";

      cell.innerHTML = posText + driveText + typeText;

      // navigate when clicking the device (driveid)
      if(d.driveid){
        cell.onclick=function(){
          // use encoded driveid to avoid spaces/newlines causing issues
          const id = encodeURIComponent(d.driveid);
          location.href = "https://08electricaldata.github.io/drive-viewer/index.html?id=" + id;
        };
      }

      secDiv.appendChild(cell);
    });

    // fill empty cells so sections have equal height
    const missing = Math.max(0, maxDevices - devices.length);
    for(let i=0;i<missing;i++){
      const empty=document.createElement("div");
      empty.className="cell spare";
      empty.innerHTML="&nbsp;";
      secDiv.appendChild(empty);
    }

    container.appendChild(secDiv);
  });
}

/* small helper to escape text used as HTML (we only insert driveid) */
function escapeHtml(str){
  if(!str) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/\n/g," ");
}

load();

</script>
</body>
</html>
