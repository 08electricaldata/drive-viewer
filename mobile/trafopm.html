<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transformer Maintenance Status — Mobile / App View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --brand:#003f88;
    --bg:#f2f6ff;
    --muted:#6b7280;
  }
  body { font-family: Arial, sans-serif; margin:0; background:var(--bg); color:#0b1220; }

  /* HEADER */
  .header {
    background:var(--brand); color:#fff; padding:12px 14px;
    display:flex; align-items:center; gap:12px; justify-content:space-between;
  }
  .header-left { display:flex; gap:8px; align-items:center; }
  .header-btn {
    background:#fff; color:var(--brand); border:none;
    padding:6px 10px; border-radius:6px; font-size:14px; cursor:pointer;
  }
  .title {
    text-align:center; flex:1;
  }
  .title h1{ margin:0; font-size:18px; letter-spacing:0.2px; }
  .title p{ margin:4px 0 0; font-size:12px; opacity:0.95; }

  /* SUMMARY (compact row) */
  .summary-row {
    display:flex; gap:12px; padding:10px 14px; align-items:center;
    justify-content:flex-start; flex-wrap:wrap; background:transparent;
  }
  .summary-row .item {
    background:#fff; padding:8px 10px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08);
    min-width:110px; text-align:center;
  }
  .summary-row h4{ margin:0; font-size:12px; color:var(--brand); }
  .summary-row p{ margin:6px 0 0; font-size:18px; font-weight:700; }

  /* CONTROLS */
  .controls {
    display:flex; gap:8px; padding:10px 14px; align-items:center; flex-wrap:wrap;
  }
  .controls input, .controls select {
    padding:8px; font-size:14px; border-radius:6px; border:1px solid #d1d5db;
  }
  .controls button {
    padding:8px 12px; background:var(--brand); color:#fff; border:none; border-radius:6px; cursor:pointer;
    font-size:14px;
  }
  .controls .muted-btn {
    background:#fff; color:var(--brand); border:1px solid #d1d5db;
  }

  /* TABLE - desktop */
  .table-wrap { padding:14px; }
  table {
    width:100%; border-collapse:collapse; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.08);
    border-radius:8px; overflow:hidden;
  }
  thead th {
    background:var(--brand); color:#fff; padding:10px; font-size:13px; position:sticky; top:0;
  }
  th,td { border-bottom:1px solid #eef2f7; padding:10px; text-align:left; font-size:13px; }
  tbody tr { cursor:pointer; transition:background .12s ease; }
  tbody tr:hover { background:#f3f8ff; }

  /* column highlight colors */
  td.col-oil { background:#fff4cc; }
  td.col-oh  { background:#e8f4ff; }
  td.col-pm  { background:#e9ffe8; }

  .ok { background:#b6f2b6; font-weight:bold; display:inline-block; padding:4px 6px; border-radius:4px; }
  .warn { background:orange; color:#000; font-weight:bold; display:inline-block; padding:4px 6px; border-radius:4px; }
  .overdue { background:red; color:yellow; font-weight:bold; display:inline-block; padding:4px 6px; border-radius:4px; }

  /* MOBILE / APP VIEW - stacked rows */
  @media (max-width:760px){
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { margin-bottom:12px; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.04); background:#fff; }
    td {
      padding:10px 12px; border:none; display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid #f1f5f9;
      font-size:14px;
    }
    td::before { content:attr(data-label); font-weight:600; color:var(--muted); margin-right:8px; width:45%; display:inline-block; }
    td:last-child { border-bottom:none; }
  }

  /* App view toggle for desktop to force stacked rows */
  body.app-view thead { display:none; }
  body.app-view table, body.app-view tbody, body.app-view tr, body.app-view td { display:block; width:100%; }
  body.app-view tr { margin-bottom:12px; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.04); background:#fff; }
  body.app-view td {
    padding:10px 12px; border:none; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #f1f5f9; font-size:14px;
  }
  body.app-view td::before { content:attr(data-label); font-weight:600; color:var(--muted); margin-right:8px; width:45%; display:inline-block; }
  body.app-view td:last-child { border-bottom:none; }

  @media print {
    .controls,.header-left{display:none;}
    thead { display:table-header-group; }
    td::before{ content: ""; }
  }
</style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <button class="header-btn" onclick="goHome()">🏠 Home</button>
      <button class="header-btn" onclick="history.back()">⬅ Back</button>
    </div>

    <div class="title">
      <h1>Transformer Maintenance Status</h1>
      <p>Designed & maintained by Rakesh Chandra Sethy</p>
    </div>

    <div style="width:80px"></div>
  </div>

  <div class="summary-row" id="summaryRow">
    <div class="item"><h4>Total Transformers</h4><p id="tot">0</p></div>
    <div class="item"><h4>Overdue 🔴</h4><p id="over">0</p></div>
    <div class="item"><h4>Due in 30 Days 🟠</h4><p id="soon">0</p></div>
  </div>

  <div class="controls">
    <input id="search" placeholder="Search S/S / TRF / Make" style="min-width:160px;">
    <select id="yearFilter"></select>
    <button onclick="toggleAppView()" class="muted-btn" id="appViewBtn">📱 App View</button>
    <button onclick="sendWhatsApp()">🔔 WhatsApp Alert</button>
    <button onclick="exportExcel()">📥 Export Excel</button>
    <button onclick="window.print()">🖨 Print</button>
  </div>

  <div class="table-wrap">
    <table id="tbl" aria-label="Transformer list">
      <thead>
        <tr>
          <th>S/S</th><th>TRF NO</th><th>MAKE</th><th>RATING</th>
          <th>OIL LEAKAGE</th><th>O/H DATE</th><th>PM DATE</th>
          <th>O/H FREQ</th><th>LAST DATE</th><th>NEXT DUE</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const JSON_URL =
  "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/transformer_pm.json";

function goHome(){ location.href="https://08electricaldata.github.io/"; }

/* App-view toggle */
function toggleAppView(){
  const enabled = document.body.classList.toggle("app-view");
  document.getElementById("appViewBtn").innerText = enabled ? "🧭 Desktop View" : "📱 App View";
  localStorage.setItem("appView", enabled ? "1" : "0");
}

/* initialize app view preference */
if(localStorage.getItem("appView")==="1"){
  document.body.classList.add("app-view");
  document.getElementById("appViewBtn").innerText = "🧭 Desktop View";
}

/* DATE HELPERS */
function parseDate(v){
  if(!v) return null;
  if(typeof v==="string" && v.startsWith("Date")){
    const p=v.match(/\d+/g); if(!p) return null; return new Date(+p[0], +p[1], +p[2]);
  }
  if(typeof v==="string" && v.includes("T")){
    const d=new Date(v); return isNaN(d)?null:d;
  }
  if(/^\d{2}-\d{2}-\d{4}$/.test(v)){
    const [d,m,y]=v.split("-"); return new Date(+y, +m-1, +d);
  }
  return null;
}
function fmt(d){
  if(!d||isNaN(d)) return "";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* LOAD */
async function load(){
  const r = await fetch(JSON_URL);
  const j = await r.json();
  const tbody = document.querySelector("#tbl tbody");
  const today = new Date(); today.setHours(0,0,0,0);

  let tot=0, over=0, soon=0;
  const years=new Set();

  j.rows.forEach(row=>{
    const pm = parseDate(row[8]); // PM DATE is index 8
    if(pm) years.add(pm.getFullYear());
  });

  const yf=document.getElementById("yearFilter");
  yf.innerHTML='<option value="">All Years</option>';
  [...years].sort().forEach(y=>{
    yf.innerHTML+=`<option value="${y}">${y}</option>`;
  });

  function render(){
    tbody.innerHTML=""; tot=over=soon=0;
    const ysel = yf.value;
    const q = (search.value||"").toLowerCase();

    j.rows.forEach(r=>{
      const pm = parseDate(r[8]); // PM DATE
      if(ysel && (!pm || pm.getFullYear() != ysel)) return;

      // build text to search (selected fields)
      const rowText = [
        r[0]||"", // S/S
        r[2]||"", // TRF NO
        r[4]||"", // MAKE
        r[5]||"", // RATING
        r[6]||""  // OIL LEAKAGE date string
      ].join(" ").toLowerCase();

      if(q && !rowText.includes(q)) return;

      tot++;
      const next = parseDate(r[11]); // NEXT DUE index 11
      let cls="ok";
      if(next){
        const diff=(next-today)/86400000;
        if(diff<0){ cls="overdue"; over++; }
        else if(diff<=30){ cls="warn"; soon++; }
      }

      const tr=document.createElement("tr");
      tr.onclick = ()=> {
        location.href =
          "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
          encodeURIComponent("TRANSFORMER-"+String(r[2]||"").trim());
      };

      tr.innerHTML = `
        <td data-label="S/S">${escapeHtml(r[0]||"")}</td>
        <td data-label="TRF NO">${escapeHtml(r[2]||"")}</td>
        <td data-label="MAKE">${escapeHtml(r[4]||"")}</td>
        <td data-label="RATING">${escapeHtml(r[5]||"")}</td>
        <td data-label="OIL LEAKAGE" class="col-oil">${fmt(parseDate(r[6]))}</td>
        <td data-label="O/H DATE" class="col-oh">${fmt(parseDate(r[7]))}</td>
        <td data-label="PM DATE" class="col-pm">${fmt(pm)}</td>
        <td data-label="O/H FREQ">${escapeHtml(r[9]||"")}</td>
        <td data-label="LAST DATE">${fmt(parseDate(r[10]))}</td>
        <td data-label="NEXT DUE" class="${cls}">${fmt(next)}</td>
      `;
      tbody.appendChild(tr);
    });

    totElem.innerText = tot;
    overElem.innerText = over;
    soonElem.innerText = soon;
  }

  search.onkeyup = render;
  yf.onchange = render;
  render();
}

/* simple escape for innerText-like behavior when injecting HTML text */
function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* WHATSAPP */
function sendWhatsApp(){
  let msg="🔔 Transformer PM Overdue List:%0A";
  document.querySelectorAll("td.overdue").forEach(td=>{
    const tr=td.parentElement;
    const ss = tr.querySelector('td[data-label="S/S"]').innerText;
    const trf = tr.querySelector('td[data-label="TRF NO"]').innerText;
    msg+=`S/S ${ss} TRF ${trf} → ${td.innerText}%0A`;
  });
  if(msg.endsWith(":%0A")){ alert("No overdue transformers"); return; }
  window.open("https://wa.me/?text="+msg,"_blank");
}

/* EXPORT */
function exportExcel(){
  let csv=[];

  // header row (matching visible columns)
  const headers = ["S/S","TRF NO","MAKE","RATING","OIL LEAKAGE","O/H DATE","PM DATE","O/H FREQ","LAST DATE","NEXT DUE"];
  csv.push(headers.map(h=>`"${h}"`).join(","));

  document.querySelectorAll("#tbl tbody tr").forEach(tr=>{
    const cells = [...tr.children].map(td=>`"${td.innerText.replace(/"/g,'""')}"`);
    csv.push(cells.join(","));
  });

  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv.join("\n")], {type: 'text/csv'}));
  a.download="transformer_pm_status.csv";
  a.click();
}

const totElem=document.getElementById("tot");
const overElem=document.getElementById("over");
const soonElem=document.getElementById("soon");
const search=document.getElementById("search");

load();
</script>

</body>
</html>
