<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monthly Job Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0052cc">

<style>
:root{
  --app-bg: linear-gradient(135deg,#e6f0ff,#f4f9ff);
  --header-start:#002b5c;
  --header-end:#0052cc;
  --accent:#003f88;
  --card-bg:#ffffff;
  --muted:#666;
  --positive:#e8f5e9;
  --negative:#ffebee;
  --equal:#fff8e1;
  --shadow: 0 8px 24px rgba(2,6,23,0.12);
}

/* Reset and base */
html,body{
  height:100%;
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--app-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  color:#0b2540;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* App shell centered */
.app-shell{
  width:100%;
  max-width:420px;
  margin:12px auto;
  min-height:calc(100vh - 24px);
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:0 8px;
  box-sizing:border-box;
}

/* Card container */
.app-card{
  background:var(--card-bg);
  border-radius:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

/* Header */
.header{
  background:linear-gradient(135deg,var(--header-start),var(--header-end));
  color:white;
  padding:10px 12px;
  position:sticky;
  top:12px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:20;
  border-radius:12px 12px 0 0;
}

.header .title-block{flex:1;min-width:0;}
.header h1{margin:0;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.credit{margin-top:3px;font-size:11px;font-weight:600;color:#cce0ff;opacity:0.95;}

/* Nav buttons (touch-friendly) */
.nav-buttons{
  display:flex;
  gap:6px;
  align-items:center;
}
.nav-buttons button{
  padding:8px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.12);
  color:white;
  font-weight:700;
  cursor:pointer;
  min-width:40px;
  height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:none;
}
.nav-buttons button:active{transform:translateY(1px);opacity:0.95;}

/* Content area */
.container{
  padding:8px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* Table styles */
table{
  border-collapse:collapse;
  width:100%;
  background:transparent;
  table-layout:auto;
  font-size:13px;
}
th, td{
  border:1px solid #e6edf6;
  padding:8px 10px;
  text-align:left;
  white-space:nowrap;
  font-size:12px;
}
th{
  background:linear-gradient(135deg,var(--accent),#0052cc);
  color:white;
  font-weight:700;
  font-size:12px;
}

/* Section Heading */
.section-row td{
  background:var(--accent);
  color:white;
  font-weight:700;
  padding:10px;
  border:none;
}

/* Item indent */
.item-name{
  padding-left:14px;
}

/* Highlights */
.positive{
  background:var(--positive);
  color:#1b5e20;
  font-weight:700;
}
.negative{
  background:var(--negative);
  color:#b71c1c;
  font-weight:700;
}
.equal{
  background:var(--equal);
  color:#e65100;
  font-weight:700;
}

/* numeric alignment */
td.num { text-align:right; }
td.num .cell-value { text-align:right; display:block; }

/* footer */
.footer{
  padding:10px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}

/* MOBILE: stacked cards, wrapping, right-aligned numeric column */
@media (max-width:600px){
  .app-shell{padding:6px;}
  .header{top:8px;border-radius:10px;padding:10px;}
  .app-card{border-radius:10px;overflow:visible;}

  thead{display:none;}

  tbody tr{
    display:block;
    margin:8px 0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 16px rgba(2,6,23,0.06);
    border:1px solid rgba(10,20,40,0.03);
    background:linear-gradient(180deg,#fff,#fbfdff);
  }

  tbody tr.section-row{
    display:block;
    margin:0 0 8px 0;
    border-radius:10px;
  }

  tbody td{
    display:flex;
    flex-direction:row;
    justify-content:space-between;
    padding:10px 12px;
    border:none;
    align-items:center;
    gap:8px;
    font-size:13px;
    line-height:1.2;
    white-space:normal;
    word-break:break-word;
  }

  tbody td::before{
    content: attr(data-label);
    display:block;
    font-weight:700;
    color:#243b58;
    margin-right:8px;
    font-size:11px;
    opacity:0.9;
    min-width:42%;
    flex:0 0 42%;
    white-space:normal;
  }

  tbody td > .cell-value{
    flex:1 1 58%;
    word-break:break-word;
    white-space:normal;
    text-align:right; /* default to right for better numeric placement */
  }

  /* numeric badge compact */
  .positive, .negative, .equal{
    border-radius:8px;
    padding:4px 8px;
    font-weight:700;
    display:inline-block;
    font-size:12px;
  }

  @media (max-width:380px){
    tbody td{padding:8px 10px;}
    tbody td::before{font-size:10px;min-width:40%;flex:0 0 40%;}
    .header h1{font-size:15px;}
  }
}

/* Medium screens: allow wrapping to avoid horizontal scroll */
@media (min-width:601px) and (max-width:900px){
  th, td{font-size:12px; padding:7px 8px; white-space:normal; word-break:break-word;}
}
</style>
</head>

        <thead></thead>
        <tbody></tbody>
      </table>

    <div class="footer">© 08 Electrical Data</div>
  </div>

</div>
