<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monthly Job Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0052cc">

<style>
/* App shell */
:root{
  --app-bg: linear-gradient(135deg,#e6f0ff,#f4f9ff);
  --header-start:#002b5c;
  --header-end:#0052cc;
  --accent:#003f88;
  --card-bg:#ffffff;
  --muted:#666;
  --positive:#e8f5e9;
  --negative:#ffebee;
  --equal:#fff8e1;
  --shadow: 0 8px 24px rgba(2,6,23,0.12);
}

html,body{
  height:100%;
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--app-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  color:#0b2540;
}

/* center narrow app-like column */
.app-shell{
  width:100%;
  max-width:420px;
  margin:16px auto;
  background:transparent;
  min-height:calc(100vh - 32px);
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:0 12px;
  box-sizing:border-box;
}

/* Card-like container inside shell */
.app-card{
  background:var(--card-bg);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--header-start),var(--header-end));
  color:white;
  padding:14px 16px;
  position:sticky;
  top:16px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:20;
  border-radius:14px 14px 0 0;
}

.header .title-block{flex:1;min-width:0;}
.header h1{margin:0;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.credit{margin-top:4px;font-size:12px;font-weight:600;color:#cce0ff;opacity:0.95;}

/* Nav buttons (touch-friendly) */
.nav-buttons{
  display:flex;
  gap:8px;
  align-items:center;
}
.nav-buttons button{
  padding:8px 10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:700;
  cursor:pointer;
  min-width:44px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:none;
}
.nav-buttons button:active{transform:translateY(1px);opacity:0.95;}

/* main content scroll area */
.container{
  padding:12px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* Table styles - desktop */
table{
  border-collapse:collapse;
  width:100%;
  background:transparent;
  min-width:900px; /* keep for wide datasets; on small screens we'll convert to cards */
}
th, td{
  border:1px solid #e1e6ef;
  padding:8px 10px;
  text-align:left;
  white-space:nowrap;
  font-size:13px;
}
th{
  background:linear-gradient(135deg,var(--accent),#0052cc);
  color:white;
  font-weight:700;
  font-size:13px;
}

/* Section Heading */
.section-row td{
  background:var(--accent);
  color:white;
  font-weight:700;
  padding:10px;
  border:none;
}

/* Item indent */
.item-name{
  padding-left:18px;
}

/* Highlights */
.positive{
  background:var(--positive);
  color:#1b5e20;
  font-weight:700;
}
.negative{
  background:var(--negative);
  color:#b71c1c;
  font-weight:700;
}
.equal{
  background:var(--equal);
  color:#e65100;
  font-weight:700;
}

/* footer */
.footer{
  padding:12px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

/* MOBILE: convert table into stacked cards */
@media (max-width:600px){
  /* Make the app feel closer to a native card stack */
  .app-shell{padding:8px;}
  .header{top:8px;border-radius:12px;}
  .app-card{border-radius:12px;overflow:visible;}

  table{min-width:unset; width:100%;}
  thead{display:none;} /* hide header row on mobile; we'll show labels via data-label */

  tbody tr{
    display:block;
    margin:8px 0;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(2,6,23,0.08);
    border:1px solid rgba(10,20,40,0.03);
    background:linear-gradient(180deg,#fff,#fbfdff);
  }

  tbody tr.section-row{
    display:block;
    margin:0;
    border-radius:10px;
  }

  tbody td{
    display:flex;
    justify-content:space-between;
    padding:12px 14px;
    border:none;
    align-items:center;
    gap:8px;
    font-size:14px;
    line-height:1.2;
  }

  /* label on left using data-label attribute */
  tbody td::before{
    content: attr(data-label);
    display:block;
    font-weight:700;
    color:#243b58;
    margin-right:8px;
    font-size:12px;
    opacity:0.85;
    min-width:40%;
  }

  /* When numeric-like value, align right and use smaller label */
  tbody td:last-child{
    flex-basis:30%;
    justify-content:flex-end;
  }

  /* make highlight cells look good on cards */
  .positive, .negative, .equal{
    border-radius:8px;
    padding:6px 10px;
    font-weight:700;
    display:inline-block;
  }
}

/* extra small devices - increase hit targets */
@media (max-width:400px){
  .nav-buttons button{padding:10px;height:44px;min-width:44px;}
  .header h1{font-size:16px;}
}
</style>
</head>

<body>

<div class="app-shell">

  <div class="app-card">
    <div class="header">
      <div class="title-block">
        <h1>Monthly Job Plan</h1>
        <div class="credit">Designed and Maintained by Rakesh Chandra Sethy</div>
      </div>

      <div class="nav-buttons">
        <button aria-label="Back" onclick="history.back()">⬅</button>
        <button aria-label="Home" onclick="goHome()">🏠</button>
      </div>
    </div>

    <div class="container">
      <table id="table" role="table" aria-label="Monthly Job Plan">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="footer">© 08 Electrical Data</div>
  </div>

</div>

<script>
const JSON_URL =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/monthlyjob.json";

function goHome(){
  // open the mobile index as requested
  location.href = "https://08electricaldata.github.io/index_mob.html";
}

async function loadData(){
  try {
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('Failed to fetch data: ' + res.status);
    const data = await res.json();

    const headers = data.headers || [];
    const rows = data.rows || [];

    const thead = document.querySelector("#table thead");
    const tbody = document.querySelector("#table tbody");

    /*
       SHOW:
       Column A (0)
       Column B (1)
       Skip Column C (2)
       Show Column D → J (3 to 9)
    */
    const displayColumns = [0,1,3,4,5,6,7,8,9];

    /* ===== HEADER ===== */
    let headerHTML = "<tr>";
    displayColumns.forEach(i=>{
      headerHTML += `<th>${headers[i] ?? ""}</th>`;
    });
    headerHTML += "</tr>";
    thead.innerHTML = headerHTML;

    /* ===== BODY ===== */
    let bodyHTML = "";
    rows.forEach(r=>{
      const colA = String(r[0] ?? "").trim();
      const colB = String(r[1] ?? "").trim();

      // If Column A has number → Section Heading
      if(colA !== "" && !isNaN(Number(colA))){
        bodyHTML += `
          <tr class="section-row">
            <td colspan="${displayColumns.length}">
              ${colA}. ${colB}
            </td>
          </tr>
        `;
      } else {
        bodyHTML += "<tr>";
        displayColumns.forEach(i=>{

          let value = r[i] ?? "";
          let className = "";

          // Column E Highlight (index 4)
          if(i === 4){
            const achieved = Number(r[4]) || 0;
            const target   = Number(r[5]) || 0;

            if(achieved > target) className = "positive";
            else if(achieved < target) className = "negative";
            else className = "equal";
          }

          // add data-label for responsive mobile view
          const label = (headers[i] ?? "").replace(/"/g,'&quot;');

          bodyHTML += `<td class="${className}" data-label="${label}">${value}</td>`;
        });
        bodyHTML += "</tr>";
      }
    });

    tbody.innerHTML = bodyHTML;

  } catch(err){
    console.error(err);
    const container = document.querySelector('.container');
    container.innerHTML = `<div style="padding:16px;color:#922; font-weight:700;">Unable to load data. ${err.message}</div>`;
  }
}

loadData();
</script>

</body>
</html>
