<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Transformer Master List — Mobile Tiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#003f88" />
<style>
:root{
  --primary:#003f88;
  --bg:#f6f8ff;
  --tile-bg:#ffffff;
  --muted:#556;
  --border:#e6edf6;
  --tile-shadow: 0 4px 12px rgba(8,15,42,0.06);
}

/* Base */
html,body{
  margin:0; height:100%; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:#0b2540;
  -webkit-text-size-adjust:100%;
}
.header-bar{ position:sticky; top:0; z-index:1000; background:var(--primary); color:white; display:flex; align-items:center; gap:8px; padding:8px; }
.header-bar button{ background:white; color:var(--primary); border:none; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; min-width:40px; height:36px; display:inline-flex; align-items:center; justify-content:center; }
.header-title{ flex:1; text-align:center; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.2px; }

/* Container & controls */
.container{ padding:8px; }
.controls{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.controls button{ padding:8px 10px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
.controls .filter{ flex:1; min-width:120px; }
.controls .filter input{ width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:13px; }

/* status */
.status{ font-size:12px; color:#223; padding:6px; border-radius:8px; background:#f6f9ff; margin-bottom:8px; border:1px solid #e6eefc; }

/* Tiles: single column stacked for mobile */
.tile-grid{ display:grid; grid-template-columns: 1fr; gap:8px; align-items:start; }

/* Enhanced tile with label-value layout */
.tile{
  background: linear-gradient(180deg,var(--tile-bg),#fbfdff);
  border-radius:8px;
  padding:8px;
  box-shadow: var(--tile-shadow);
  border:1px solid rgba(8,15,42,0.04);
  transition: transform 120ms ease, box-shadow 120ms ease;
  display:flex; flex-direction:column; gap:5px; cursor:pointer;
}
.tile:active, .tile:hover{ transform: translateY(-3px); box-shadow: 0 10px 18px rgba(8,15,42,0.08); }

/* Tile header section */
.tile-header{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border-bottom: 1px solid #e6edf6;
  padding-bottom: 6px;
  margin-bottom: 4px;
}

.tile-header-item{
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tile-label{
  font-size: 10px;
  font-weight: 700;
  color: #556;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.tile-value{
  font-size: 12px;
  font-weight: 600;
  color: #0b2540;
  word-break: break-word;
  line-height: 1.2;
}

/* Tile content rows */
.tile-content{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.tile-field{
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.tile-field-label{
  font-size: 10px;
  font-weight: 700;
  color: #556;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.tile-field-value{
  font-size: 11px;
  font-weight: 500;
  color: #163047;
  word-break: break-word;
  line-height: 1.2;
}

/* fallback table for large screens */
.table-wrapper{ display:none; margin-top:6px; }
@media (min-width:980px){ .table-wrapper{ display:block; } .tile-grid{ display:none; } }

/* empty note */
.empty-note{ padding:8px; color:#445; font-size:13px; border-radius:8px; background:#fff; border:1px solid #eef3ff; margin-top:8px; }

/* very small screens */
@media (max-width:360px){
  .tile{ padding:6px; }
  .tile-value{ font-size:11px; }
  .tile-field-value{ font-size:10px; }
  .header-title{ font-size:14px; }
  .controls button{ padding:6px 8px; font-size:12px; }
}

@media (max-width:480px){
  .tile-grid{ gap:6px; }
  .tile{ padding:6px; gap:4px; }
  .tile-header{ gap:8px; }
  .tile-content{ gap:8px; }
  .tile-label{ font-size:9px; }
  .tile-value{ font-size:11px; }
  .tile-field-label{ font-size:9px; }
  .tile-field-value{ font-size:10px; }
}
</style>
</head>
<body>

<div class="header-bar">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="openPM()">⚡ PM Status</button>
  <button onclick="openOil()">🛢️ Oil Status</button>
  <div class="header-title">TRANSFORMER MASTER LIST</div>
</div>

<div class="container">
  <div id="status" class="status">Loading…</div>

  <div class="controls">
    <button onclick="exportCSV()">📄 Export CSV</button>
    <button onclick="window.print()">🖨 Print</button>
    <div class="filter"><input id="universalFilter" placeholder="🔍 Search" /></div>
  </div>

  <div id="tileGrid" class="tile-grid" aria-live="polite"></div>

  <div id="emptyNote" class="empty-note" style="display:none">No transformers found</div>

  <div class="table-wrapper" id="tableWrapper" aria-hidden="true">
    <table id="xfmrTable"><thead><tr id="headerRow"></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
/* Transformer Master List - Fixed for actual JSON structure
 - Row 0: Area/section header (skip)
 - Row 1: Column headers
 - Rows 2+: Actual transformer data
*/

// JSON endpoint
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/transformers.json";

const tileGrid = document.getElementById('tileGrid');
const statusEl = document.getElementById('status');
const universalFilter = document.getElementById('universalFilter');
const emptyNote = document.getElementById('emptyNote');

// navigation functions
function goHome(){ location.href = "https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }
function openPM(){ location.href = "https://08electricaldata.github.io/drive-viewer/mobile/trafopm.html"; }
function openOil(){ location.href = "https://08electricaldata.github.io/drive-viewer/mobile/transformer-oil-summary.html"; }

// helpers
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadAndRender(){
  statusEl.style.display = '';
  statusEl.textContent = 'Loading…';
  let data = null;

  try {
    const c = localStorage.getItem('xfmrJSON');
    if(c) data = JSON.parse(c);
  } catch(e){ }

  try {
    const res = await fetch(JSON_URL, { cache: 'no-store' });
    if(res && res.ok){
      const js = await res.json();
      data = js;
      try { localStorage.setItem('xfmrJSON', JSON.stringify(js)); } catch(e){}
      statusEl.textContent = 'Loaded';
    } else {
      statusEl.textContent = 'Using cache/fallback';
    }
  } catch(err){
    console.warn('fetch failed', err);
    statusEl.textContent = 'Offline / using cache';
  }

  if(!data || !data.rows){
    statusEl.textContent = 'No data available';
    emptyNote.style.display = 'block';
    return;
  }

  // Process rows
  const rows = Array.isArray(data.rows) ? data.rows.slice() : [];
  
  if(rows.length < 2){
    statusEl.textContent = 'Insufficient data';
    emptyNote.style.display = 'block';
    return;
  }

  // Skip row 0 (area/section header)
  // Row 1 contains headers: 0, "S/S", "TRF-No", "TR SL NO", "MAKE", "KVA", "MAIN S/S", "UNIT S/S", "%IMP", "LT SWBD", "RATING"
  // Data rows start from row 2
  
  const headerRow = rows[1]; // This contains the column names
  
  // Map headers to column indices
  const idxSS = 1;           // S/S
  const idxTRFNo = 2;        // TRF-No
  const idxTRSlNo = 3;       // TR SL NO
  const idxMake = 4;         // MAKE
  const idxKVA = 5;          // KVA
  const idxMainSS = 6;       // MAIN S/S
  const idxUnitSS = 7;       // UNIT S/S
  const idxImp = 8;          // %IMP
  const idxLTSWBD = 9;       // LT SWBD
  const idxRating = 10;      // RATING

  // Render tiles (start from row 2)
  tileGrid.innerHTML = '';
  let shown = false;

  for(let i = 2; i < rows.length; i++){
    const row = Array.isArray(rows[i]) ? rows[i] : [];
    
    // Skip if this looks like a header row (contains text in first column that starts with common keywords)
    const firstCol = String(row[0] || '').trim().toUpperCase();
    if(firstCol.includes('AREA') || firstCol.includes('SECTION') || firstCol.includes('SUBSTATION NO')){
      continue;
    }

    // Get values, clean up newlines and trim
    const ss = (row[idxSS] || '').toString().trim().replace(/\n/g, ' ');
    const trfNo = (row[idxTRFNo] || '').toString().trim();
    const trSlNo = (row[idxTRSlNo] || '').toString().trim();
    const make = (row[idxMake] || '').toString().trim().replace(/\n/g, ' ');
    const kva = (row[idxKVA] || '').toString().trim();
    const mainSS = (row[idxMainSS] || '').toString().trim();
    const unitSS = (row[idxUnitSS] || '').toString().trim();
    const imp = (row[idxImp] || '').toString().trim();
    const ltswbd = (row[idxLTSWBD] || '').toString().trim();
    const rating = (row[idxRating] || '').toString().trim();

    // Skip if no S/S and TRF-No
    if(!ss && !trfNo) continue;

    // create tile
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.title = row.map(x => x ?? '').join(' | ');

    // Header section (S/S and TRF-No)
    const header = document.createElement('div');
    header.className = 'tile-header';

    const h1 = document.createElement('div');
    h1.className = 'tile-header-item';
    h1.innerHTML = `<div class="tile-label">S/S</div><div class="tile-value">${escapeHtml(ss)}</div>`;

    const h2 = document.createElement('div');
    h2.className = 'tile-header-item';
    h2.innerHTML = `<div class="tile-label">TRF-No</div><div class="tile-value">${escapeHtml(trfNo)}</div>`;

    header.appendChild(h1);
    header.appendChild(h2);
    tile.appendChild(header);

    // Content section
    const content = document.createElement('div');
    content.className = 'tile-content';

    const fields = [
      { label: 'TR SL NO', value: trSlNo },
      { label: 'MAKE', value: make },
      { label: 'KVA', value: kva },
      { label: 'MAIN S/S', value: mainSS },
      { label: 'UNIT S/S', value: unitSS },
      { label: '%IMP', value: imp },
      { label: 'LT SWBD', value: ltswbd },
      { label: 'RATING', value: rating }
    ];

    for(const field of fields){
      if(field.value !== ''){
        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'tile-field';
        fieldDiv.innerHTML = `<div class="tile-field-label">${escapeHtml(field.label)}</div><div class="tile-field-value">${escapeHtml(field.value)}</div>`;
        content.appendChild(fieldDiv);
      }
    }

    tile.appendChild(content);

    // click -> detail page
    tile.addEventListener('click', () => {
      const transformerNo = trfNo || trSlNo || '';
      if(!transformerNo) return;
      location.href = 'https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=' + encodeURIComponent('Transformer-' + transformerNo);
    });

    tileGrid.appendChild(tile);
    shown = true;
  }

  emptyNote.style.display = shown ? 'none' : 'block';
  statusEl.style.display = 'none';

  // search filter
  universalFilter.addEventListener('input', () => {
    const q = universalFilter.value.trim().toLowerCase();
    document.querySelectorAll('.tile').forEach(tile => {
      tile.style.display = tile.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

// CSV export of visible tiles
function exportCSV(){
  const tiles = Array.from(document.querySelectorAll('.tile')).filter(t => getComputedStyle(t).display !== 'none');
  if(tiles.length === 0){ alert('No data to export'); return; }
  const rows = tiles.map(tile => {
    const parts = [];
    Array.from(tile.querySelectorAll('.tile-header-item')).forEach(item => {
      parts.push(item.querySelector('.tile-value').innerText.replace(/"/g,'""'));
    });
    Array.from(tile.querySelectorAll('.tile-field')).forEach(field => {
      parts.push(field.querySelector('.tile-field-value').innerText.replace(/"/g,'""'));
    });
    return '"' + parts.join('","') + '"';
  });
  const blob = new Blob([rows.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transformer_list.csv';
  a.click();
}

// Initialize
loadAndRender();
</script>
</body>
</html>
