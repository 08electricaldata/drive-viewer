<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Material Codes — Mobile View</title>
  <style>
    :root{
      --bg:#eef7ff;
      --card:#ffffff;
      --accent:#0d47a1;
      --muted:#5b6b7a;
      --radius:12px;
      --gap:12px;
      --pad:12px;
    }

    /* Mobile-first app styles */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:linear-gradient(180deg,var(--bg),#f6fbff);
      color:#062238;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:14px;
    }

    /* App header */
    .container { max-width:980px; margin:0 auto; }
    header{
      display:flex;align-items:center;gap:8px;justify-content:space-between;
      background:linear-gradient(90deg,#0d47a1,#0052cc); color:#fff;
      padding:10px;border-radius:12px;box-shadow:0 8px 26px rgba(3,63,136,.12);
    }
    .header-left{display:flex;align-items:center;gap:8px}
    .icon-btn{
      background:rgba(255,255,255,0.95);color:var(--accent);border:none;border-radius:10px;
      width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
      font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(3,63,136,.08);
    }
    .title-wrap{flex:1;text-align:center;line-height:1}
    header h1{font-size:16px;margin:0;font-weight:800}
    header .subtitle{font-size:12px;opacity:.95;margin-top:2px}

    /* Controls card */
    .card{
      background:var(--card);
      border-radius:12px;
      padding:12px;
      margin-top:12px;
      box-shadow:0 8px 24px rgba(3,63,136,.04);
    }

    .controls{display:flex;flex-direction:column;gap:10px}
    label{font-size:13px;color:var(--muted);font-weight:700}
    select, input[type="search"]{
      width:100%;padding:12px;border-radius:10px;border:1px solid #e5f0ff;background:#fff;font-size:14px;
      color:#062238;
    }

    /* Table (mobile-friendly) */
    .table-wrap{overflow:auto;margin-top:12px; -webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;min-width:420px;background:var(--card);box-shadow:0 0 0 1px #edf5ff;border-radius:8px}
    thead th{position:sticky;top:0;background:#f4f9ff;padding:10px 12px;text-align:left;font-weight:700;color:var(--accent);border-bottom:1px solid #e9f2ff}
    tbody td{padding:12px;border-top:1px solid #f7fbff;font-size:14px;color:#082635;vertical-align:top}
    tbody tr:nth-child(even) td{background:#fcfeff}
    .empty{padding:18px;color:var(--muted);text-align:center}
    .code{color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;display:inline-block;padding:6px 4px;border-radius:6px}
    .code:active{opacity:0.9}

    .note{font-size:12px;color:var(--muted);margin-top:6px}

    /* Modal responsive: made narrower for mobile */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:12px}
    .modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:12px;padding:12px;box-shadow:0 20px 60px rgba(2,40,80,0.3)}
    .modal header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .modal h2{margin:0;font-size:16px;color:#073169}
    .modal .meta{margin-left:auto;color:#556;font-size:13px}
    .modal .close{background:#f1f5f9;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}

    .tx-table{width:100%;border-collapse:collapse;margin-top:8px}
    .tx-table th,.tx-table td{padding:8px 10px;border:1px solid #eef4fb;font-size:13px;text-align:left}

    /* Larger touch targets on small screens */
    @media (max-width:480px){
      body{padding:12px}
      header{padding:10px}
      .icon-btn{width:40px;height:40px}
      select,input[type="search"]{padding:12px;font-size:15px}
      thead th{font-size:13px;padding:10px}
      tbody td{padding:12px;font-size:15px}
      .modal{padding:10px;max-width:100%}
    }

    /* Desktop tweaks (keeps mobile styling but improves spacing) */
    @media (min-width:720px){
      body{padding:20px}
      header{border-radius:14px}
      .container{max-width:1100px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header role="banner" aria-label="Top navigation">
      <div class="header-left">
        <button id="backBtn" class="icon-btn" aria-label="Back">⬅</button>
      </div>

      <div class="title-wrap">
        <h1>Material Codes</h1>
        <div class="subtitle">Dropdown lists Type of material</div>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <button id="homeBtn" class="icon-btn" aria-label="Home">🏠</button>
        <button id="infoBtn" class="icon-btn" aria-label="Info">ℹ️</button>
      </div>
    </header>

    <section class="card" aria-labelledby="controls-title" style="margin-top:12px">
      <div id="controls-title" style="font-weight:800;color:var(--accent);margin-bottom:8px">Filter & Search</div>

      <div class="controls" role="region" aria-label="Filters">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="typeSelect">Material Type (column D)</label>
          <select id="typeSelect" aria-label="Select material type">
            <option>Loading…</option>
          </select>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="searchBox">Search</label>
          <input id="searchBox" type="search" placeholder="Filter Material desc. or code" aria-label="Search" />
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="table-title" style="margin-top:12px">
      <div id="table-title" style="font-weight:800;color:var(--accent);margin-bottom:8px">Results</div>

      <div class="table-wrap" role="region" aria-label="Results table">
        <table id="resultsTable" aria-live="polite">
          <thead>
            <tr>
              <th style="min-width:60%">Material desc.</th>
              <th style="width:40%">Material code</th>
            </tr>
          </thead>
          <tbody>
            <tr><td class="empty" colspan="2">Loading data…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="note">Tap a material code to view transactions (popup).</div>
    </section>
  </div>

  <script>
    // URLs to the JSON files
    const MATERIAL_CODE_URL = 'https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/materialcode.json';
    const MATERIAL_DRAWN_URL = 'https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/materialdrawn.json';
    const HOME_URL = 'https://08electricaldata.github.io/';

    // DOM refs
    const typeSelect = document.getElementById('typeSelect');
    const searchBox = document.getElementById('searchBox');
    const resultsTbody = document.querySelector('#resultsTable tbody');
    const backBtn = document.getElementById('backBtn');
    const homeBtn = document.getElementById('homeBtn');
    const infoBtn = document.getElementById('infoBtn');

    // State
    let allRows = [];                 // materialcode.json rows (skipping first two)
    let displayedRows = [];           // filtered rows for table
    let drawnRows = [];               // materialdrawn.json rows (raw)
    let drawnHeaders = [];            // materialdrawn.json headers
    const drawnIndexByCode = new Map(); // map materialCode -> [rows...]

    // Utility: safe string
    const toStr = v => (v === null || v === undefined) ? '' : String(v);

    // parse date flexibly (supports ISO and dd-mm-yyyy)
    function parseFlexibleDate(val) {
      if (val === null || val === undefined) return null;
      if (typeof val === 'number') {
        const d = new Date(val);
        if (!isNaN(d)) return d;
      }
      const s = String(val).trim();
      if (!s) return null;
      const d1 = new Date(s);
      if (!isNaN(d1)) return d1;
      const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[T\s](.*))?$/);
      if (m) {
        const day = Number(m[1]), mon = Number(m[2]) - 1, yr = Number(m[3]);
        if (m[4]) {
          const rest = m[4];
          const iso = `${yr.toString().padStart(4,'0')}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}T${rest}`;
          const d2 = new Date(iso);
          if (!isNaN(d2)) return d2;
        }
        const d = new Date(yr, mon, day);
        if (!isNaN(d)) return d;
      }
      return null;
    }

    // Format date for display in popup as dd-mm-yyyy (no time). Fallback to raw if unparseable.
    function formatDateCell(raw) {
      const dt = parseFlexibleDate(raw);
      if (!dt) return toStr(raw);
      const dd = String(dt.getDate()).padStart(2,'0');
      const mm = String(dt.getMonth() + 1).padStart(2,'0');
      const yyyy = dt.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    // Fetch both JSONs (prefetch materialdrawn for quick lookups)
    Promise.all([
      fetch(MATERIAL_CODE_URL).then(r => { if (!r.ok) throw new Error('Failed to fetch materialcode.json'); return r.json(); }),
      fetch(MATERIAL_DRAWN_URL).then(r => { if (!r.ok) throw new Error('Failed to fetch materialdrawn.json'); return r.json(); })
    ]).then(([codeJson, drawnJson]) => {
      // materialcode.json processing
      if (!codeJson || !Array.isArray(codeJson.rows)) throw new Error('materialcode.json invalid');
      allRows = codeJson.rows.slice(2).filter(r => Array.isArray(r) && r.length >= 3);
      if (allRows.length === 0) {
        renderEmpty('No data found after skipping the first two rows.');
        typeSelect.innerHTML = '<option value="">No types</option>';
      } else {
        // Build unique types from column D (index 3) if present
        const typesSet = new Set();
        allRows.forEach(r => {
          const val = toStr(r[3]).trim();
          if (val) typesSet.add(val);
        });
        const types = Array.from(typesSet).sort((a,b)=> a.localeCompare(b, undefined, {sensitivity:'base'}));
        // Populate dropdown
        typeSelect.innerHTML = '';
        const allOption = document.createElement('option');
        allOption.value = '__ALL__';
        allOption.textContent = 'All types';
        typeSelect.appendChild(allOption);
        types.forEach(t => {
          const opt = document.createElement('option'); opt.value = t; opt.textContent = t; typeSelect.appendChild(opt);
        });
        typeSelect.value = '__ALL__';
        applyTypeFilter();
      }

      // materialdrawn.json processing
      if (!drawnJson || !Array.isArray(drawnJson.rows)) {
        drawnRows = [];
        drawnHeaders = Array.isArray(drawnJson.headers) ? drawnJson.headers : [];
      } else {
        drawnRows = drawnJson.rows.slice();
        drawnHeaders = Array.isArray(drawnJson.headers) ? drawnJson.headers : [];
        // Build index by material code at column C (index 2)
        drawnRows.forEach(r => {
          const code = toStr(r[2]).trim();
          if (!code) return;
          if (!drawnIndexByCode.has(code)) drawnIndexByCode.set(code, []);
          drawnIndexByCode.get(code).push(r);
        });
        // Sort each list by date column G (index 6) descending (present -> past)
        const IDX_G = 6;
        drawnIndexByCode.forEach((arr, code) => {
          arr.sort((a,b) => {
            const da = parseFlexibleDate(a[IDX_G]);
            const db = parseFlexibleDate(b[IDX_G]);
            if (da && db) return db - da;
            if (da && !db) return -1;
            if (!da && db) return 1;
            return 0;
          });
        });
      }

    }).catch(err => {
      renderEmpty('Error loading data: ' + (err.message || err));
      console.error(err);
    });

    // Apply filter by type selection
    function applyTypeFilter() {
      const selected = typeSelect.value;
      if (!selected || selected === '__ALL__') {
        displayedRows = allRows.slice();
      } else {
        displayedRows = allRows.filter(r => toStr(r[3]).trim() === selected);
      }
      applySearchFilter(); // then search
    }

    // Apply search filter to displayedRows and render
    function applySearchFilter() {
      const q = toStr(searchBox.value).trim().toLowerCase();
      const filtered = q ? displayedRows.filter(r => {
        // columns B (index1) and C (index2) and D (index3 if exists)
        return [1,2,3].some(i => toStr(r[i]).toLowerCase().includes(q));
      }) : displayedRows;
      renderTable(filtered);
    }

    // Render table rows (now only 2 columns: desc and code)
    function renderTable(rows) {
      resultsTbody.innerHTML = '';
      if (!rows || rows.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="empty" colspan="2">No matching rows.</td>';
        resultsTbody.appendChild(tr);
        return;
      }

      const frag = document.createDocumentFragment();
      rows.forEach(r => {
        const tr = document.createElement('tr');
        const desc = toStr(r[1]);
        const code = toStr(r[2]);

        const td1 = document.createElement('td'); td1.textContent = desc;
        const td2 = document.createElement('td');
        td2.textContent = code;
        td2.className = 'code';
        td2.setAttribute('role','button');
        td2.setAttribute('tabindex','0');
        td2.setAttribute('title','Click to view transactions for ' + code);
        // click handler to open modal with drawn transactions
        td2.addEventListener('click', () => openTransactionsModal(code));
        td2.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTransactionsModal(code); } });

        tr.appendChild(td1); tr.appendChild(td2);
        frag.appendChild(tr);
      });
      resultsTbody.appendChild(frag);
    }

    // Render a single-row empty message
    function renderEmpty(msg) {
      resultsTbody.innerHTML = '<tr><td class="empty" colspan="2">' + msg + '</td></tr>';
    }

    // Open modal showing transactions for a specific material code
    // Modified: popup shows ONLY two columns — Date (col G index 6) and Qty. (col H index 7)
    function openTransactionsModal(materialCode) {
      const rows = drawnIndexByCode.get(materialCode) || [];
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.tabIndex = -1;

      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.setAttribute('role','dialog');
      modal.setAttribute('aria-modal','true');
      modal.setAttribute('aria-label','Transactions for ' + materialCode);

      const header = document.createElement('header');

      // Use first matched row to show MaterialCode and Material Description in header if available
      const firstRow = (rows && rows.length) ? rows[0] : null;
      const materialDesc = firstRow ? toStr(firstRow[3]) : '';
      const h2 = document.createElement('h2');
      h2.textContent = `MaterialCode: ${materialCode}` + (materialDesc ? ` \u00A0 — \u00A0 Desc.: ${materialDesc}` : '');
      const meta = document.createElement('div'); meta.className = 'meta small';
      meta.textContent = 'Sorted: present → past (column G)';
      const closeBtn = document.createElement('button'); closeBtn.className = 'close'; closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', closeModal);
      header.appendChild(h2); header.appendChild(meta); header.appendChild(closeBtn);

      modal.appendChild(header);

      const bodyDiv = document.createElement('div');
      if (!rows || rows.length === 0) {
        const p = document.createElement('div'); p.className = 'tx-empty'; p.textContent = 'No transactions found for this material code in materialdrawn.json';
        bodyDiv.appendChild(p);
      } else {
        const firstDate = formatDateCell(rows[0][6]);
        const lastDate = formatDateCell(rows[rows.length-1][6]);
        const summary = document.createElement('div');
        summary.className = 'small';
        summary.style.marginBottom = '8px';
        summary.textContent = `Showing ${rows.length} transactions — latest: ${firstDate} → earliest: ${lastDate}`;
        bodyDiv.appendChild(summary);

        // Build a compact two-column table: Date (G) and Qty. (H)
        const txTable = document.createElement('table');
        txTable.className = 'tx-table';
        const thead = document.createElement('thead');
        const trHead = document.createElement('tr');
        const thDate = document.createElement('th'); thDate.textContent = 'Date';
        const thQty = document.createElement('th'); thQty.textContent = 'Qty.';
        trHead.appendChild(thDate); trHead.appendChild(thQty);
        thead.appendChild(trHead);
        txTable.appendChild(thead);

        const tbody = document.createElement('tbody');
        rows.forEach(r => {
          const tr = document.createElement('tr');
          const tdDate = document.createElement('td');
          tdDate.textContent = formatDateCell(r[6]); // column G
          const tdQty = document.createElement('td');
          tdQty.textContent = toStr(r[7]); // column H
          tr.appendChild(tdDate);
          tr.appendChild(tdQty);
          tbody.appendChild(tr);
        });
        txTable.appendChild(tbody);
        bodyDiv.appendChild(txTable);
      }

      modal.appendChild(bodyDiv);
      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);

      closeBtn.focus();

      function closeModal() {
        if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) {
        if (e.key === 'Escape') closeModal();
      }
      backdrop.addEventListener('click', (ev) => {
        if (ev.target === backdrop) closeModal();
      });
      document.addEventListener('keydown', onKey);
    }

    // Events
    typeSelect.addEventListener('change', () => applyTypeFilter());
    searchBox.addEventListener('input', () => applySearchFilter());

    // Navigation button behavior
    backBtn.addEventListener('click', () => {
      if (window.history && window.history.length > 1) window.history.back();
      else window.location.href = HOME_URL;
    });
    homeBtn.addEventListener('click', () => { window.location.href = HOME_URL; });

  </script>
</body>
</html>
