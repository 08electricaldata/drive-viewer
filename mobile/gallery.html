<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Electrical Photo Gallery — App View</title>
<style>
  /* Reset & base */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:#f0f6ff;color:#102230;
    -webkit-font-smoothing:antialiased;
  }

  /* App header */
  header.app-header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(90deg,#0d47a1,#0052cc);
    color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
  .hdr-left{display:flex;align-items:center;gap:12px}
  .btn{background:#fff;color:#0d47a1;border:0;padding:8px 10px;border-radius:10px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.12);min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}
  .title{flex:1;text-align:center;font-weight:800;font-size:16px}
  .subtitle{display:block;font-size:11px;opacity:.95;font-weight:600}

  /* Page */
  main{padding:12px;max-width:1100px;margin:0 auto 36px}

  /* Gallery card */
  .gallery{
    background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 10px 30px rgba(3,63,136,0.04);
  }
  .gallery-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .gallery-title{font-weight:800;color:#0d47a1;font-size:15px}
  .badge{background:#0d47a1;color:#fff;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}

  /* Track + cards */
  .wrap{position:relative;overflow:hidden}
  .track{
    display:flex;gap:12px;overflow-x:auto;padding:10px 6px;
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
  }
  .track::-webkit-scrollbar{height:8px}
  .track::-webkit-scrollbar-thumb{background:rgba(13,71,161,.12);border-radius:8px}
  .card{
    scroll-snap-align:center;flex:0 0 72vw;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);
    display:flex;flex-direction:column;cursor:pointer;min-height:180px;
  }
  .card img{width:100%;height:54vw;max-height:58vh;object-fit:cover;background:#ddd;display:block}
  .card .label{padding:10px;font-weight:800;text-align:center;color:#0b3b74;font-size:13px}

  /* Navigation buttons */
  .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 10px 24px rgba(3,63,136,0.12);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;
  }
  .nav-btn.prev{left:8px}
  .nav-btn.next{right:8px}

  /* Lightbox */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:16px}
  #lightbox img{max-width:98%;max-height:80vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  #caption{color:#fff;margin-top:12px;font-size:16px;max-width:95%;text-align:center}
  .lb-close{position:absolute;top:18px;right:18px;background:transparent;border:0;color:#fff;font-size:34px;cursor:pointer}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.06);border:0;color:#fff;font-size:36px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .lb-prev{left:12px}.lb-next{right:12px}

  /* Desktop adjustments */
  @media(min-width:700px){
    .card{flex:0 0 260px;min-height:220px}
    .card img{height:160px}
    .gallery{padding:18px}
    .title{font-size:18px}
  }

  /* Print hide UI */
  @media print{ header, .nav-btn, .btn {display:none} }
</style>
</head>
<body>

<header class="app-header" role="banner" aria-label="Gallery header">
  <div class="hdr-left" aria-hidden="false">
    <button class="btn" onclick="goBack()" aria-label="Back">⬅</button>
  </div>

  <div class="title" role="heading" aria-level="1">
    Electrical Photo Gallery
    <span class="subtitle">08 AREA • SAFETY • 5S</span>
  </div>

  <div style="margin-left:auto">
    <button class="btn" onclick="goHome()" aria-label="Home">🏠</button>
  </div>
</header>

<main role="main">
  <section class="gallery" aria-labelledby="g1-title">
    <div class="gallery-head">
      <div id="g1-title" class="gallery-title">08 AREA PHOTOS</div>
      <div class="badge" id="c1">0</div>
    </div>
    <div class="wrap" aria-hidden="false">
      <button class="nav-btn prev" onclick="scrollTrack('t1', -getScrollAmount('t1'))" aria-label="Scroll previous">❮</button>
      <div class="track" id="t1" role="list" aria-label="08 area photos"></div>
      <button class="nav-btn next" onclick="scrollTrack('t1', getScrollAmount('t1'))" aria-label="Scroll next">❯</button>
    </div>
  </section>

  <section class="gallery" aria-labelledby="g2-title">
    <div class="gallery-head">
      <div id="g2-title" class="gallery-title">SAFETY PHOTOS</div>
      <div class="badge" id="c2">0</div>
    </div>
    <div class="wrap">
      <button class="nav-btn prev" onclick="scrollTrack('t2', -getScrollAmount('t2'))" aria-label="Scroll previous">❮</button>
      <div class="track" id="t2" role="list" aria-label="Safety photos"></div>
      <button class="nav-btn next" onclick="scrollTrack('t2', getScrollAmount('t2'))" aria-label="Scroll next">❯</button>
    </div>
  </section>

  <section class="gallery" aria-labelledby="g3-title">
    <div class="gallery-head">
      <div id="g3-title" class="gallery-title">5S PHOTOS</div>
      <div class="badge" id="c3">0</div>
    </div>
    <div class="wrap">
      <button class="nav-btn prev" onclick="scrollTrack('t3', -getScrollAmount('t3'))" aria-label="Scroll previous">❮</button>
      <div class="track" id="t3" role="list" aria-label="5S photos"></div>
      <button class="nav-btn next" onclick="scrollTrack('t3', getScrollAmount('t3'))" aria-label="Scroll next">❯</button>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="lb-close" onclick="hideLightbox()" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" onclick="lightboxPrev()" aria-label="Previous">‹</button>
  <img id="lbimg" alt="">
  <div id="caption"></div>
  <button class="lb-nav lb-next" onclick="lightboxNext()" aria-label="Next">›</button>
</div>

<script>
  function goHome(){ location.href = "https://08electricaldata.github.io/index_mob.html"; }
  function goBack(){ history.back(); }

  const galleries = [
    { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/08area.json", track: "t1", count: "c1" },
    { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/safety.json", track: "t2", count: "c2" },
    { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/5s.json", track: "t3", count: "c3" }
  ];

  // lightbox state
  const lbState = { list: [], index: 0, open: false };

  async function loadGallery(g){
    try{
      const res = await fetch(g.url + "?t=" + Date.now());
      const j = await res.json();
      const total = j.total || (j.photos && j.photos.length) || 0;
      document.getElementById(g.count).textContent = total;
      const track = document.getElementById(g.track);
      track.innerHTML = "";
      track._items = j.photos || [];

      (j.photos || []).forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("role","listitem");
        const imgSrc = p.thumb || p.image || "";
        const title = p.title || "";
        card.innerHTML = `<img loading="lazy" src="${imgSrc}" alt="${escapeHtml(title)}"><div class="label">${escapeHtml(title)}</div>`;
        card.addEventListener("click", () => openLightboxFrom(track.id, idx));
        track.appendChild(card);
      });

      // start autoscroll for this track
      startAutoScroll(track);
    } catch(err){
      console.error("Failed to load gallery:", g.url, err);
      const track = document.getElementById(g.track);
      track.innerHTML = `<div style="padding:12px;color:#b91c1c">Failed to load gallery</div>`;
    }
  }

  function getScrollAmount(trackId){
    const el = document.getElementById(trackId);
    if(!el) return 280;
    return Math.round(Math.min(el.clientWidth * 0.8, 320));
  }

  function scrollTrack(id, delta){
    const el = document.getElementById(id);
    if(!el) return;
    el.scrollBy({ left: delta, behavior: "smooth" });
  }

  // auto-scroll with pause on pointer interactions
  function startAutoScroll(trackEl){
    if(!trackEl) return;
    if(trackEl._autoStarted) return;
    trackEl._autoStarted = true;
    let paused = false;
    trackEl.addEventListener("pointerenter", ()=> paused = true);
    trackEl.addEventListener("pointerleave", ()=> paused = false);
    trackEl.addEventListener("touchstart", ()=> paused = true, {passive:true});
    trackEl.addEventListener("touchend", ()=> paused = false, {passive:true});
    trackEl._timer = setInterval(()=>{
      if(paused) return;
      if(trackEl.children.length === 0) return;
      trackEl.scrollBy({ left: 280, behavior: "smooth" });
      if(trackEl.scrollLeft + trackEl.clientWidth >= trackEl.scrollWidth - 8){
        setTimeout(()=> trackEl.scrollTo({ left: 0, behavior: "smooth" }), 700);
      }
    }, 3500);
  }

  // lightbox helpers
  function buildFlatList(){
    const flat = [];
    galleries.forEach(g => {
      const t = document.getElementById(g.track);
      if(!t || !t._items) return;
      t._items.forEach(item => flat.push({ image: item.image || item.thumb || "", title: item.title || "" }));
    });
    return flat;
  }

  function openLightboxFrom(trackId, idxInTrack){
    // compute absolute index
    const flat = buildFlatList();
    let abs = 0;
    for(const g of galleries){
      if(g.track === trackId){
        abs += idxInTrack;
        break;
      }
      const t = document.getElementById(g.track);
      abs += (t && t._items) ? t._items.length : 0;
    }
    openLightbox(flat, abs);
  }

  function openLightbox(list, index){
    if(!list || list.length === 0) return;
    lbState.list = list;
    lbState.index = index || 0;
    showLightbox();
  }

  function showLightbox(){
    const lb = document.getElementById("lightbox");
    const img = document.getElementById("lbimg");
    const cap = document.getElementById("caption");
    const item = lbState.list[lbState.index] || {};
    img.src = item.image || "";
    img.alt = item.title || "";
    cap.textContent = item.title || "";
    lb.style.display = "flex";
    lb.setAttribute("aria-hidden","false");
    lbState.open = true;
  }

  function hideLightbox(){
    const lb = document.getElementById("lightbox");
    lb.style.display = "none";
    lb.setAttribute("aria-hidden","true");
    lbState.open = false;
    document.getElementById("lbimg").src = "";
  }

  function lightboxPrev(){
    if(!lbState.open) return;
    lbState.index = (lbState.index - 1 + lbState.list.length) % lbState.list.length;
    showLightbox();
  }
  function lightboxNext(){
    if(!lbState.open) return;
    lbState.index = (lbState.index + 1) % lbState.list.length;
    showLightbox();
  }

  // keyboard & background close
  document.addEventListener("keydown", (e)=>{
    if(!lbState.open) return;
    if(e.key === "Escape") hideLightbox();
    if(e.key === "ArrowLeft") lightboxPrev();
    if(e.key === "ArrowRight") lightboxNext();
  });
  document.getElementById("lightbox").addEventListener("click", (e)=>{
    if(e.target.id === "lightbox") hideLightbox();
  });

  // small touch swipe for lightbox image
  (function addLightboxSwipe(){
    const img = document.getElementById("lbimg");
    let startX = null;
    img.addEventListener("touchstart", (e)=> { if(e.touches && e.touches.length) startX = e.touches[0].clientX; }, {passive:true});
    img.addEventListener("touchend", (e)=> {
      if(!startX || !e.changedTouches || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40){
        if(dx > 0) lightboxPrev(); else lightboxNext();
      }
      startX = null;
    }, {passive:true});
  })();

  function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // load all galleries
  galleries.forEach(loadGallery);
</script>
</body>
</html>
