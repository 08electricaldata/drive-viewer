<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width,initial-scale=1" /> <title>Electrical Photo Gallery — App View</title> <style> /* Reset / base */ *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%} body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:#f0f6ff;color:#102230; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
/* App header (sticky) */ header.app-header{ position:sticky;top:0;z-index:40; background:linear-gradient(90deg,#0d47a1,#0052cc); color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px; box-shadow:0 6px 18px rgba(0,0,0,.12); } .hdr-left{display:flex;align-items:center;gap:8px} .btn{ background:#fff;color:#0d47a1;border:0;padding:8px 10px;border-radius:10px;font-weight:800;cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.12);min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center; } .title{flex:1;text-align:center;font-weight:800;font-size:16px} .subtitle{display:block;font-size:11px;opacity:.95;font-weight:600}

/* Page */ main{padding:12px;max-width:1100px;margin:0 auto 36px}

/* Gallery card (mobile-first) */ .gallery{ background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 10px 30px rgba(3,63,136,0.04); } .gallery-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px} .gallery-title{font-weight:800;color:#0d47a1;font-size:15px} .badge{background:#0d47a1;color:#fff;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}

/* Horizontal track: snap + large, tappable cards / .wrap{position:relative;overflow:hidden} .track{ display:flex;gap:12px;overflow-x:auto;padding:10px 6px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; } .track::-webkit-scrollbar{height:8px} .track::-webkit-scrollbar-thumb{background:rgba(13,71,161,.2);border-radius:8px} .card{ scroll-snap-align:center;flex:0 0 72vw; / large card on mobile */ border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);min-height:180px; display:flex;flex-direction:column;cursor:pointer; } .card img{width:100%;height:54vw;max-height:58vh;object-fit:cover;background:#ddd;display:block} .card .label{padding:10px;font-weight:800;text-align:center;color:#0b3b74;font-size:13px}

/* Prev / Next large tappable buttons */ .nav-btn{ position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 10px 24px rgba(3,63,136,0.12);font-size:20px;cursor:pointer; display:flex;align-items:center;justify-content:center;z-index:10; } .nav-btn.prev{left:8px} .nav-btn.next{right:8px}

/* Lightbox (full-screen) */ #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:16px} #lightbox img{max-width:98%;max-height:80vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.6)} #caption{color:#fff;margin-top:12px;font-size:16px;max-width:95%;text-align:center} .lb-close{position:absolute;top:18px;right:18px;background:transparent;border:0;color:#fff;font-size:34px;cursor:pointer} .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.06);border:0;color:#fff;font-size:36px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer} .lb-prev{left:12px}.lb-next{right:12px}

/* Desktop adjustments */ @media(min-width:700px){ .track{gap:14px;padding:14px} .card{flex:0 0 260px;min-height:220px} .card img{height:160px} .gallery{padding:18px} .title{font-size:18px} }

/* Print hide UI */ @media print{ header, .nav-btn, .btn {display:none} } </style>

</head> <body> <header class="app-header" role="banner"> <div class="hdr-left" aria-hidden="true"> <div style="display:flex;align-items:center;gap:10px"> <button class="btn" onclick="goBack()" aria-label="Back">⬅</button> <div style="display:flex;flex-direction:column"> <div class="title">Electrical Photo Gallery</div> <span class="subtitle">08 AREA • SAFETY • 5S</span> </div> </div> </div> <div style="margin-left:auto"> <button class="btn" onclick="goHome()" aria-label="Home">🏠</button> </div> </header> <main role="main"> <section class="gallery" aria-labelledby="g1-title"> <div class="gallery-head"> <div id="g1-title" class="gallery-title">08 AREA PHOTOS</div> <div class="badge" id="c1">0</div> </div> <div class="wrap" aria-hidden="false"> <button class="nav-btn prev" onclick="scrollTrack('t1', -getScrollAmount('t1'))" aria-label="Scroll previous">❮</button> <div class="track" id="t1" role="list" aria-label="08 area photos"></div> <button class="nav-btn next" onclick="scrollTrack('t1', getScrollAmount('t1'))" aria-label="Scroll next">❯</button> </div> </section> <section class="gallery" aria-labelledby="g2-title"> <div class="gallery-head"> <div id="g2-title" class="gallery-title">SAFETY PHOTOS</div> <div class="badge" id="c2">0</div> </div> <div class="wrap"> <button class="nav-btn prev" onclick="scrollTrack('t2', -getScrollAmount('t2'))" aria-label="Scroll previous">❮</button> <div class="track" id="t2" role="list" aria-label="Safety photos"></div> <button class="nav-btn next" onclick="scrollTrack('t2', getScrollAmount('t2'))" aria-label="Scroll next">❯</button> </div> </section> <section class="gallery" aria-labelledby="g3-title"> <div class="gallery-head"> <div id="g3-title" class="gallery-title">5S PHOTOS</div> <div class="badge" id="c3">0</div> </div> <div class="wrap"> <button class="nav-btn prev" onclick="scrollTrack('t3', -getScrollAmount('t3'))" aria-label="Scroll previous">❮</button> <div class="track" id="t3" role="list" aria-label="5S photos"></div> <button class="nav-btn next" onclick="scrollTrack('t3', getScrollAmount('t3'))" aria-label="Scroll next">❯</button> </div> </section> </main> <!-- Lightbox --> <div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true"> <button class="lb-close" onclick="hideLightbox()" aria-label="Close">×</button> <button class="lb-nav lb-prev" onclick="lightboxPrev()" aria-label="Previous">‹</button> <img id="lbimg" alt=""> <div id="caption"></div> <button class="lb-nav lb-next" onclick="lightboxNext()" aria-label="Next">›</button> </div> <script> // Navigation handlers function goHome(){ location.href = "https://08electricaldata.github.io/"; } function goBack(){ history.back(); } // Data sources for galleries const galleries = [ { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/08area.json", track: "t1", count: "c1" }, { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/safety.json", track: "t2", count: "c2" }, { url: "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/Gallery/5s.json", track: "t3", count: "c3" } ]; // State for lightbox const lightboxState = { list: [], index: 0, open: false }; async function loadGallery(g) { try { const res = await fetch(g.url + "?t=" + Date.now()); const j = await res.json(); document.getElementById(g.count).textContent = j.total || (j.photos && j.photos.length) || 0; const trackEl = document.getElementById(g.track); trackEl.innerHTML = ""; (j.photos || []).forEach((p, idx) => { const card = document.createElement("div"); card.className = "card"; card.setAttribute("role", "listitem"); // Keep image accessible by including alt text const imgSrc = p.thumb || p.image || ""; const title = p.title || ""; card.innerHTML = `<img loading="lazy" src="${imgSrc}" alt="${escapeHtml(title)}"><div class="label">${escapeHtml(title)}</div>`; card.addEventListener("click", () => openLightboxFromElement(g.track, idx)); trackEl.appendChild(card); }); // store items for lightbox navigation // use attribute on track to store base index offset of all images across galleries trackEl._items = (j.photos || []).map(p => ({ image: p.image || p.thumb || "", title: p.title || "" })); // Auto-scroll: start small timeout to allow layout setTimeout(() => initAutoScroll(trackEl), 600); } catch (err) { console.error("Gallery load failed:", g.url, err); } } // Press prev/next scroll by visible card width function getScrollAmount(trackId){ const el = document.getElementById(trackId); if(!el) return 280; // use ~70% of viewport or card width const amount = Math.min(el.clientWidth * 0.8, 320); return Math.round(amount); } function scrollTrack(id, x){ const el = document.getElementById(id); if(el) el.scrollBy({ left: x, behavior: "smooth" }); } // auto-scroll with pause on hover/touch function initAutoScroll(trackEl){ if(!trackEl) return; if(trackEl._autoscroll) return; // already running let paused = false; trackEl.addEventListener("mouseenter", ()=> paused = true); trackEl.addEventListener("mouseleave", ()=> paused = false); trackEl.addEventListener("touchstart", ()=> paused = true, {passive:true}); trackEl.addEventListener("touchend", ()=> paused = false, {passive:true}); const step = () => { if(paused) return; if(trackEl.children.length === 0) return; trackEl.scrollBy({ left: 280, behavior: "smooth" }); if(trackEl.scrollLeft + trackEl.clientWidth >= trackEl.scrollWidth - 4){ setTimeout(()=> trackEl.scrollTo({ left: 0, behavior: "smooth" }), 700); } }; trackEl._autoscroll = setInterval(step, 3500); } // Lightbox: combine all tracks into a single flat list for navigation function buildFlatList(){ const flat = []; galleries.forEach(g => { const t = document.getElementById(g.track); if(!t || !t._items) return; t._items.forEach(item => flat.push(item)); }); return flat; } function openLightboxFromElement(trackId, idxInTrack){ // compute absolute index by summing previous tracks lengths const flat = buildFlatList(); // Need to compute absolute index: let absIndex = 0; for(const g of galleries){ if(g.track === trackId){ absIndex += idxInTrack; break; } const t = document.getElementById(g.track); if(t && t._items) absIndex += t._items.length; } openLightbox(flat, absIndex); } function openLightbox(list, index){ if(!list || list.length === 0) return; lightboxState.list = list; lightboxState.index = index || 0; showLightbox(); } function showLightbox(){ const lb = document.getElementById("lightbox"); const img = document.getElementById("lbimg"); const cap = document.getElementById("caption"); const item = lightboxState.list[lightboxState.index] || {}; img.src = item.image || ""; img.alt = item.title || ""; cap.textContent = item.title || ""; lb.style.display = "flex"; lb.setAttribute("aria-hidden", "false"); lightboxState.open = true; // focus for keyboard navigation lb.focus(); } function hideLightbox(){ const lb = document.getElementById("lightbox"); lb.style.display = "none"; lb.setAttribute("aria-hidden", "true"); lightboxState.open = false; document.getElementById("lbimg").src = ""; } function lightboxPrev(){ if(!lightboxState.open) return; lightboxState.index = (lightboxState.index - 1 + lightboxState.list.length) % lightboxState.list.length; showLightbox(); } function lightboxNext(){ if(!lightboxState.open) return; lightboxState.index = (lightboxState.index + 1) % lightboxState.list.length; showLightbox(); } // open by gallery loads items into tracks then listeners allow lightbox open galleries.forEach(loadGallery); // Helpers function escapeHtml(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); } // Keyboard support for lightbox document.addEventListener("keydown", (e)=>{ if(!lightboxState.open) return; if(e.key === "Escape") hideLightbox(); if(e.key === "ArrowLeft") lightboxPrev(); if(e.key === "ArrowRight") lightboxNext(); }); // Close lightbox on background click document.getElementById("lightbox").addEventListener("click", (e)=>{ if(e.target.id === "lightbox") hideLightbox(); }); </script> </body> </html>
