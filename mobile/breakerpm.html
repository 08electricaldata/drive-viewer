<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Breaker PM — Mobile Compact</title>

<style>
:root{
  --brand:#003f88;
  --bg:#f2f6ff;
  --card:#fff;
  --muted:#6b7280;
  --overdue:#d32f2f;
  --warn:#ff9900;
}

/* Reset & base */
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial, -apple-system, "Segoe UI", Roboto, sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
.container{max-width:960px;margin:0 auto;padding:8px}

/* App header */
.header{
  background:var(--brand);color:white;display:flex;align-items:center;gap:8px;padding:10px;position:sticky;top:0;z-index:120;
}
.icon-btn{background:white;color:var(--brand);border:none;border-radius:8px;padding:7px 9px;font-weight:800;font-size:13px;cursor:pointer}
.title{flex:1;text-align:center}
.title h1{margin:0;font-size:16px;font-weight:800}
.title p{margin:2px 0 0;font-size:11px;opacity:.95}

/* summary row (compact) */
.summary{display:flex;gap:8px;margin:8px 0;align-items:center}
.sum-card{flex:1;background:var(--card);padding:6px;border-radius:8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sum-card h4{margin:0;color:var(--brand);font-size:11px}
.sum-card p{margin:6px 0 0;font-size:14px;font-weight:800}

/* controls */
.controls{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.search{flex:1;padding:8px;border-radius:10px;border:1px solid #e6e9ef;font-size:13px;background:#fff}
.select{padding:8px;border-radius:10px;border:1px solid #e6e9ef;background:#fff;font-size:13px}
.small-btn{background:var(--brand);color:#fff;border:none;padding:8px 10px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}

/* cards list - very compact */
.cards{display:flex;flex-direction:column;gap:6px;margin-bottom:80px}
.card{background:var(--card);border-radius:8px;padding:8px 8px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .12s ease, border-left .12s ease;}
.card-left{min-width:64px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rcs{background:#eef6ff;color:var(--brand);padding:6px 8px;border-radius:8px;font-weight:800;font-size:12px}
.board{font-size:11px;color:var(--muted)}
.card-mid{flex:1;display:flex;flex-direction:column;gap:4px}
.name{font-size:13px;font-weight:800;color:var(--brand);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted)}

/* compact two-line PM/NEXT display */
.pair-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.pair-left{font-size:11px;color:var(--muted);font-weight:700}
.pair-right{font-size:13px;font-weight:800;color:#0b3b74;padding:2px 6px;border-radius:6px}

/* overdue visuals */
.overdue-card{
  background: #fff2f2;
  border-left: 4px solid var(--overdue);
}
.pair-right.overdue-date{
  background: var(--overdue);
  color: white;
}

/* small footer text inside card */
.card-foot{font-size:11px;color:var(--muted);margin-top:4px}

/* floating actions */
.fab-row{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:140}
.fab{background:var(--brand);color:#fff;border:none;padding:12px;border-radius:50%;width:48px;height:48px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18)}

/* empty */
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}

/* print */
@media print{ .controls,.fab-row,.header{display:none} }

/* slightly larger on tablet */
@media(min-width:700px){
  .container{padding:10px}
  .card{padding:10px}
  .name{font-size:14px}
}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;gap:6px">
    <button class="icon-btn" onclick="history.back()">⬅</button>
    <button class="icon-btn" onclick="goHome()">🏠</button>
  </div>
  <div class="title">
    <h1>Breaker PM</h1>
    <p>By Rakesh Chandra Sethy</p>
  </div>
  <div style="width:56px"></div>
</div>

<div class="container">

  <div class="summary" aria-hidden="true">
    <div class="sum-card"><h4>Total</h4><p id="tot">0</p></div>
    <div class="sum-card"><h4>Overdue</h4><p id="over">0</p></div>
    <div class="sum-card"><h4>Due ≤30d</h4><p id="soon">0</p></div>
  </div>

  <div class="controls" role="search">
    <input id="search" class="search" placeholder="Search S/S / Breaker / Make" aria-label="Search">
    <select id="yearFilter" class="select" aria-label="Filter year"></select>
    <button class="small-btn" onclick="exportCSV()">CSV</button>
  </div>

  <div id="cards" class="cards" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">No breakers found.</div>
</div>

<div class="fab-row" aria-hidden="true">
  <button class="fab" title="All" onclick="filterShow('all')">ALL</button>
  <button class="fab" title="Overdue" onclick="filterShow('overdue')">🔴</button>
  <button class="fab" title="Due30" onclick="filterShow('soon')">🟠</button>
  <button class="fab" title="WhatsApp" onclick="sendWhatsApp()">💬</button>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/breaker_pm.json";

/* navigation */
function goHome(){ location.href = "https://08electricaldata.github.io/"; }

/* robust date parser */
function parseDate(v){
  if(!v && v !== 0) return null;
  if(v instanceof Date) return isNaN(v)?null:v;
  if(typeof v === "number") return new Date(v);
  if(typeof v === "string"){
    const s = v.trim();
    if(s.startsWith("Date(") || s.startsWith("/Date(")){
      const nums = s.match(/-?\d+/g);
      if(nums && nums.length){
        if(nums[0].length >= 10){ const ms = parseInt(nums[0],10); const d=new Date(ms); if(!isNaN(d)) return d; }
        if(nums.length>=3){ const y=parseInt(nums[0],10), m=parseInt(nums[1],10), day=parseInt(nums[2],10); const d=new Date(y,m,day); if(!isNaN(d)) return d; }
      }
    }
    if(/^\d{2}-\d{2}-\d{4}$/.test(s)){
      const [d,m,y] = s.split("-"); return new Date(y, +m-1, +d);
    }
    const d = new Date(s); if(!isNaN(d)) return d;
    const n = Number(s); if(!isNaN(n)){
      if(n > 1e11){ const d2 = new Date(n); if(!isNaN(d2)) return d2; }
      else if(n>0){ const excelEpoch=new Date(Date.UTC(1899,11,30)); return new Date(excelEpoch.getTime() + n*24*60*60*1000); }
    }
  }
  return null;
}
function fmt(d){ if(!d) return "—"; const dd = new Date(d); if(isNaN(dd)) return String(d).slice(0,16); return `${String(dd.getDate()).padStart(2,"0")}-${String(dd.getMonth()+1).padStart(2,"0")}-${dd.getFullYear()}`; }

let allRows = [];
async function init(){
  try{
    const res = await fetch(JSON_URL);
    const j = await res.json();
    allRows = j.rows || [];
    populateYearFilter();
    renderCards();
    attachSearch();
  }catch(err){
    console.error(err);
    document.getElementById('cards').innerHTML = '<div class="empty">Error loading data</div>';
  }
}

function populateYearFilter(){
  const years = new Set();
  allRows.forEach(r => {
    if(!r || !r[0]) return;
    const pm = parseDate(r[12]);
    if(pm) years.add(pm.getFullYear());
  });
  const sel = document.getElementById('yearFilter');
  sel.innerHTML = '<option value="">All</option>';
  Array.from(years).sort().forEach(y=>{
    const o = document.createElement('option'); o.value=y; o.textContent=y; sel.appendChild(o);
  });
  sel.onchange = () => renderCards();
}

/* render compact cards with PM DATE and NEXT DUE shown, and red highlight if NEXT DUE < today */
function renderCards(){
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const year = document.getElementById('yearFilter').value;
  const today = new Date(); today.setHours(0,0,0,0);

  let visible = 0;
  allRows.forEach(r => {
    if(!r || !r[0]) return;

    // mapping
    const ss = r[1] || '';
    const board = r[2] || '';
    const bkrNo = r[3] || '';
    const uid = r[4] || '';
    const compt = r[5] || '';
    const make = r[7] || '';
    const pmRaw = r[12];
    const nextRaw = r[13];

    const pmDate = parseDate(pmRaw);
    const nextDue = parseDate(nextRaw);

    if(year){
      if(!pmDate || String(pmDate.getFullYear()) !== String(year)) return;
    }

    const combined = [ss, board, bkrNo, uid, compt, make, pmRaw, nextRaw].join(' ').toLowerCase();
    if(q && !combined.includes(q)) return;

    visible++;

    const isOverdue = nextDue ? nextDue < today : false;

    const card = document.createElement('article');
    card.className = 'card' + (isOverdue ? ' overdue-card' : '');
    card.dataset.overdue = isOverdue ? '1' : '0';
    card.dataset.soon = (nextDue && ((nextDue - today)/86400000) <= 30 && ((nextDue - today)/86400000) >= 0) ? '1' : '0';

    const nextClass = 'pair-right' + (isOverdue ? ' overdue-date' : '');

    card.innerHTML = `
      <div class="card-left">
        <div class="rcs">${ss}</div>
        <div class="board">${board}</div>
      </div>

      <div class="card-mid">
        <div class="name">${bkrNo || uid}</div>
        <div class="meta">${make} • Comp: ${compt}</div>

        <div class="pair-row">
          <div style="display:flex;flex-direction:column;gap:4px">
            <div class="pair-left">PM DATE</div>
            <div class="pair-right">--${fmt(pmDate)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
            <div class="pair-left">NEXT DUE</div>
            <div class="${nextClass}">--${fmt(nextDue)}</div>
          </div>
        </div>
      </div>
    `;

    card.addEventListener('click', ()=> {
      const id = "BREAKER-" + String(uid).trim();
      location.href = "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" + encodeURIComponent(id);
    });

    cardsEl.appendChild(card);
  });

  document.getElementById('empty').style.display = visible ? 'none' : 'block';
  updateCounts();
}

/* counts update */
function updateCounts(){
  const today = new Date(); today.setHours(0,0,0,0);
  let tot=0, over=0, soon=0;
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const year = document.getElementById('yearFilter').value;

  allRows.forEach(r => {
    if(!r || !r[0]) return;
    const pmDate = parseDate(r[12]);
    const nextDue = parseDate(r[13]);

    if(year){
      if(!pmDate || String(pmDate.getFullYear()) !== String(year)) return;
    }

    const combined = [r[1], r[2], r[3], r[4], r[5], r[7]].join(' ').toLowerCase();
    if(q && !combined.includes(q)) return;

    tot++;
    if(nextDue){
      const diff = Math.round((nextDue - today)/86400000);
      if(diff < 0) over++;
      else if(diff <= 30) soon++;
    }
  });

  document.getElementById('tot').textContent = tot;
  document.getElementById('over').textContent = over;
  document.getElementById('soon').textContent = soon;
}

/* search */
function attachSearch(){
  const s = document.getElementById('search');
  s.addEventListener('input', ()=> { renderCards(); });
}

/* filter FAB */
function filterShow(type){
  document.querySelectorAll('.cards .card').forEach(card => {
    if(type === 'all') card.style.display = '';
    else if(type === 'overdue') card.style.display = card.dataset.overdue === '1' ? '' : 'none';
    else if(type === 'soon') card.style.display = card.dataset.soon === '1' ? '' : 'none';
  });
}

/* WhatsApp */
function sendWhatsApp(){
  const lines = [];
  document.querySelectorAll('.cards .card').forEach(card => {
    if(card.style.display === 'none') return;
    if(card.dataset.overdue === '1'){
      const uidText = card.querySelector('.name')?.innerText || '';
      const nextText = card.querySelector('.pair-row .pair-right.overdue-date')?.innerText || '';
      lines.push(`${uidText} → ${nextText}`);
    }
  });
  if(lines.length === 0){ alert('No overdue breakers.'); return; }
  const msg = '🔔 Breaker PM Overdue:%0A' + lines.join('%0A');
  window.open('https://wa.me/?text=' + msg, '_blank');
}

/* CSV */
function exportCSV(){
  const visibleCards = Array.from(document.querySelectorAll('.cards .card')).filter(c => c.style.display !== 'none');
  const header = ['S/S','BOARD NO','BREAKER NO','BREAKER UID','COMPT NO','MAKE','PM DATE','NEXT DUE'];
  const rows = [ header.join(',') ];

  visibleCards.forEach(card => {
    const ss = card.querySelector('.rcs')?.innerText || '';
    const board = card.querySelector('.board')?.innerText || '';
    const name = card.querySelector('.name')?.innerText || '';
    const row = allRows.find(r => (r[3] === name) || (r[4] === name) || ((r[3]||'') + '' === name));
    if(!row) {
      const pmText = card.querySelector('.pair-row .pair-right')?.innerText.replace(/^--/,'') || '';
      const nextText = card.querySelector('.pair-row .pair-right.overdue-date')?.innerText.replace(/^--/,'') || card.querySelector('.pair-row .pair-right:last-child')?.innerText.replace(/^--/,'') || '';
      rows.push([ss, board, name, '', '', '', pmText, nextText].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
      return;
    }
    const vals = [ row[1]||'', row[2]||'', row[3]||'', row[4]||'', row[5]||'', row[7]||'', row[12]||'', row[13]||'' ];
    rows.push(vals.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  });

  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'breaker_pm_mobile_compact.csv';
  a.click();
}

/* init */
async function init(){
  try{
    const res = await fetch(JSON_URL);
    const j = await res.json();
    allRows = j.rows || [];
    populateYearFilter();
    renderCards();
    attachSearch();
  }catch(err){
    console.error(err);
    document.getElementById('cards').innerHTML = '<div class="empty">Error loading data</div>';
  }
}

init();
</script>
</body>
</html>
