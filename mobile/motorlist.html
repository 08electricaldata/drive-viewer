<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Motor Master List — Stacked Compact Tiles (Main Drive)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#003f88" />
<style>
:root{
  --primary:#003f88;
  --bg:#f6f8ff;
  --tile-bg:#ffffff;
  --muted:#556;
  --border:#e6edf6;
  --tile-shadow: 0 4px 12px rgba(8,15,42,0.06);
}

/* Basic */
html,body{
  margin:0;
  height:100%;
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background:var(--bg);
  color:#0b2540;
  -webkit-text-size-adjust:100%;
}
.header-bar{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
}
.header-bar button{
  background:white;
  color:var(--primary);
  border:none;
  border-radius:8px;
  padding:8px 10px;
  font-size:14px;
  cursor:pointer;
  min-width:40px;
  height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.header-title{
  flex:1;
  text-align:center;
  font-size:15px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.2px;
}

/* Container and controls */
.container{ padding:8px; }
.controls{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.controls button{ padding:8px 10px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
.controls .filter{ flex:1; min-width:120px; }
.controls .filter input{ width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:13px; }

/* status */
.status{ font-size:12px; color:#223; padding:6px; border-radius:8px; background:#f6f9ff; margin-bottom:8px; border:1px solid #e6eefc; }

/* Tile grid: STACKED single column (one card per row) */
.tile-grid{
  display:grid;
  grid-template-columns: 1fr; /* always single column */
  gap:6px;
  align-items:start;
}

/* Compact smaller tile */
.tile{
  background: linear-gradient(180deg,var(--tile-bg),#fbfdff);
  border-radius:8px;
  padding:4px;                 /* reduced padding */
  box-shadow: var(--tile-shadow);
  border:1px solid rgba(8,15,42,0.04);
  transition: transform 120ms ease, box-shadow 120ms ease;
  min-height:40px;            /* reduced height */
  display:flex;
  flex-direction:column;
  gap:3px;                    /* smaller gaps */
  cursor:pointer;
}
.tile:active, .tile:hover{
  transform: translateY(-3px);
  box-shadow: 0 10px 18px rgba(8,15,42,0.08);
}

/* each tile has 4 compact rows; each row contains two short tokens */
.tile-row{
  display:flex;
  justify-content:space-between;
  gap:6px;
  align-items:center;
  padding:0;
  line-height:1;
  min-height:14px;
}
.token-left, .token-right{
  font-size:11px;            /* smaller font */
  font-weight:700;
  color:#163047;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:48%;
}
.token-right{ text-align:right; }

/* small badge style */
.badge{ display:inline-block; padding:3px 6px; border-radius:8px; font-weight:700; font-size:11px; white-space:nowrap; }
.pos{ background:#e8f5e9; color:#1b5e20; }
.neg{ background:#fff0f0; color:#a01f1f; }
.eq{ background:#fff8e1; color:#e65100; }

/* fallback table for very wide screens (kept hidden on phones) */
.table-wrapper{ display:none; margin-top:6px; }
@media (min-width:980px){
  .table-wrapper{ display:block; }
  .tile-grid{ display:none; }
}

/* empty note */
.empty-note{ padding:8px; color:#445; font-size:13px; border-radius:8px; background:#fff; border:1px solid #eef3ff; margin-top:8px; }

/* further compact on very small screens */
@media (max-width:360px){
  .tile{ padding:4px; min-height:38px; }
  .token-left, .token-right{ font-size:10px; }
  .header-title{ font-size:14px; }
  .controls button{ padding:6px 8px; font-size:13px; }
}
</style>
</head>
<body>

<div class="header-bar">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="openMotorOH()">🛠️ Motor O/H</button>
  <button onclick="openMotorPM()">🧾 Motor PM</button>
  <div class="header-title">MOTOR MASTER LIST</div>
</div>

<div class="container">
  <div id="status" class="status">Loading…</div>

  <div class="controls">
    <button onclick="exportCSV()">📄 Export CSV</button>
    <button onclick="window.print()">🖨 Print</button>
    <div class="filter"><input id="universalFilter" placeholder="🔍 Search tiles" /></div>
  </div>

  <div id="tileGrid" class="tile-grid" aria-live="polite"></div>

  <div id="emptyNote" class="empty-note" style="display:none">No data available</div>

  <div class="table-wrapper" id="tableWrapper" aria-hidden="true">
    <table id="motorTable"><thead><tr id="headerRow"></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
/* Stacked compact tiles showing MAIN DRIVE (EQUIP NAME) in title-left spot.
   - Tiles are generated only for rows where column 0 is numeric (skip headings)
   - The script searches for a MainDrive/Equip header and uses it as the left title.
   - If not present, falls back to Tag/Name (index 1) or the second column.
   - Tile layout: top row shows EquipName (left) and model/id (right).
     Next 3 rows show paired tokens like KW-90KW / MAKE-KEC etc.
*/

// JSON source
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/motors.json";

const tileGrid = document.getElementById('tileGrid');
const statusEl = document.getElementById('status');
const universalFilter = document.getElementById('universalFilter');
const emptyNote = document.getElementById('emptyNote');

// nav
function goHome(){ location.href = "https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }
function openMotorOH(){ location.href = "https://08electricaldata.github.io/drive-viewer/mobile/motoroh.html"; }
function openMotorPM(){ location.href = "https://08electricaldata.github.io/drive-viewer/mobile/motorpm.html"; }

// utils
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isNumericString(x){ if(x === null || x === undefined) return false; const t = String(x).trim(); if(t === '') return false; return !isNaN(Number(t)); }

function findHeaderIndex(headers, keywords){
  if(!Array.isArray(headers)) return -1;
  const low = headers.map(h => (h ?? '').toString().toLowerCase());
  for(const kw of keywords){
    for(let i=0;i<low.length;i++){
      if(low[i].includes(kw)) return i;
    }
  }
  return -1;
}

// fallback sample data (for testing)
const fallback = {
  headers: ["S.No","TAG","MODEL","C","KW","MAKE","FRAME","RPM","FLC","MTG"],
  rows: [
    [1,"BAT_A","P-202","","90","KEC","280M4","1478","154","B3"],
    [2,"BAT_B","P-203","","75","KEC","280M4","1460","120","B3"],
    ["","Summary Section","","","","","","","",""], // should be skipped
    [3,"BAT_C","P-204","","45","ABC","200M4","1500","78","V5"],
    [4,"BAT_D","P-205","","37","XYZ","180M4","1440","63","B3"]
  ]
};

async function loadAndRender(){
  statusEl.style.display = '';
  statusEl.textContent = 'Loading…';
  let data = null;

  // try cached data
  try {
    const c = localStorage.getItem('motorJSON');
    if(c) data = JSON.parse(c);
  } catch(e){ /* ignore */ }

  // fetch
  try {
    const res = await fetch(JSON_URL, { cache: 'no-store' });
    if(res && res.ok){
      const j = await res.json();
      data = j;
      try { localStorage.setItem('motorJSON', JSON.stringify(j)); } catch(e){}
      statusEl.textContent = 'Loaded';
    } else {
      statusEl.textContent = 'Using cache/fallback';
    }
  } catch(err){
    console.warn('fetch failed', err);
    statusEl.textContent = 'Offline / using cache';
  }

  if(!data) data = fallback;

  let headers = Array.isArray(data.headers) ? data.headers.slice() : (data.headers ? Object.values(data.headers) : []);
  const rows = Array.isArray(data.rows) ? data.rows.slice() : [];

  if(headers.length === 0 && rows.length > 0){
    const max = rows.reduce((m,r) => Math.max(m, Array.isArray(r) ? r.length : 0), 0);
    headers = Array.from({length:max}, (_,i) => 'Col' + (i+1));
  }

  // Find MainDrive/Equip header first (user requested equip name = main drive)
  // Try several keyword matches
  const idxMainDrive = findHeaderIndex(headers, ['main drive','main_drive','main-drive','equip name','equipname','equipment','equip','main drive name','main']);
  // Fallbacks
  const idxTag = findHeaderIndex(headers, ['tag','name','asset','id','drive']) !== -1 ? findHeaderIndex(headers, ['tag','name','asset','id','drive']) : 1;
  const idxModel = findHeaderIndex(headers, ['model','modelno','p-','pno','code']) !== -1 ? findHeaderIndex(headers, ['model','modelno','p-','pno','code']) : 2;
  const idxKW = findHeaderIndex(headers, ['kw','k.w','power','kw-']) !== -1 ? findHeaderIndex(headers, ['kw','k.w','power','kw-']) : -1;
  const idxMake = findHeaderIndex(headers, ['make','manufacturer','mfr','brand']) !== -1 ? findHeaderIndex(headers, ['make','manufacturer','mfr','brand']) : -1;
  const idxFrame = findHeaderIndex(headers, ['frame']) !== -1 ? findHeaderIndex(headers, ['frame']) : -1;
  const idxRPM = findHeaderIndex(headers, ['rpm']) !== -1 ? findHeaderIndex(headers, ['rpm']) : -1;
  const idxFLC = findHeaderIndex(headers, ['flc','full load','amp','amps']) !== -1 ? findHeaderIndex(headers, ['flc','full load','amp','amps']) : -1;
  const idxMTG = findHeaderIndex(headers, ['mtg','mount','mounting']) !== -1 ? findHeaderIndex(headers, ['mtg','mount','mounting']) : -1;

  // Build picks list in desired order (unique)
  const picks = [];
  [idxKW, idxMake, idxFrame, idxRPM, idxFLC, idxMTG].forEach(i => { if(i !== -1 && !picks.includes(i)) picks.push(i); });
  // Fill with other headers if needed
  for(let i=0;i<headers.length && picks.length < 6; i++){
    if(!picks.includes(i)) picks.push(i);
  }

  // Render tiles: only rows where column 0 is numeric
  tileGrid.innerHTML = '';
  let any = false;
  for(const r of rows){
    const row = Array.isArray(r) ? r : [];
    if(!isNumericString(row[0] ?? '')) continue; // skip headings

    // Title for left: prefer main drive column if found, else idxTag fallback
    const titleLeft = (idxMainDrive !== -1 && row[idxMainDrive] !== undefined && String(row[idxMainDrive]).trim() !== '') ? row[idxMainDrive] : (row[idxTag] ?? row[1] ?? '');

    // Title right: show model/id (idxModel) or second column fallback
    const titleRight = row[idxModel] ?? row[2] ?? '';

    // Prepare tokens for next 3 rows (we'll show up to 6 tokens -> 3 rows)
    const tokens = picks.slice(0,6).map(i => {
      if(i === -1) return '';
      const hdr = headers[i] ?? ('Col' + (i+1));
      const val = row[i] ?? '';
      if(val === null || val === undefined || String(val).trim() === '') return '';
      const short = String(hdr).split(/\s|[-_]/)[0].toUpperCase();
      // show as "KW-90" only if header is KW; else show raw value for clarity
      if(short === 'KW' || short === 'KW:') return `${short}-${val}`;
      return `${short}-${val}`;
    });
    while(tokens.length < 6) tokens.push('');

    // Build compact tile
    const tile = document.createElement('div'); tile.className = 'tile';
    tile.title = row.map(x => x ?? '').join(' | ');

    // Row 1: main drive / equip name (left) and model (right)
    const r1 = document.createElement('div'); r1.className = 'tile-row';
    const left1 = document.createElement('div'); left1.className = 'token-left'; left1.textContent = String(titleLeft);
    const right1 = document.createElement('div'); right1.className = 'token-right'; right1.textContent = String(titleRight);
    r1.appendChild(left1); r1.appendChild(right1);
    tile.appendChild(r1);

    // Rows 2..4: tokens in pairs (tokens[0]/[1], [2]/[3], [4]/[5])
    for(let t=0; t<3; t++){
      const rdiv = document.createElement('div'); rdiv.className = 'tile-row';
      const l = document.createElement('div'); l.className = 'token-left'; l.textContent = tokens[2*t] || '';
      const rr = document.createElement('div'); rr.className = 'token-right'; rr.textContent = tokens[2*t+1] || '';
      rdiv.appendChild(l); rdiv.appendChild(rr);
      tile.appendChild(rdiv);
    }

    // click to open details (r[1]-r[2])
    tile.addEventListener('click', () => {
      const id = (row[1] ?? '') + '-' + (row[2] ?? '');
      if((row[1] ?? '') === '') return;
      location.href = 'https://08electricaldata.github.io/drive-viewer/index.html?id=' + encodeURIComponent(id);
    });

    tileGrid.appendChild(tile);
    any = true;
  }

  emptyNote.style.display = any ? 'none' : 'block';
  statusEl.style.display = 'none';

  // search filter
  universalFilter.addEventListener('input', () => {
    const q = universalFilter.value.trim().toLowerCase();
    document.querySelectorAll('.tile').forEach(tile => {
      tile.style.display = tile.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

// CSV export of visible tiles
function exportCSV(){
  const tiles = Array.from(document.querySelectorAll('.tile')).filter(t => getComputedStyle(t).display !== 'none');
  if(tiles.length === 0){ alert('No data to export'); return; }
  const rows = tiles.map(tile => {
    const parts = Array.from(tile.querySelectorAll('.tile-row')).map(r => r.innerText.replace(/"/g,'""'));
    return '"' + parts.join('","') + '"';
  });
  const blob = new Blob([rows.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'motor_tiles.csv'; a.click();
}

// initialize
loadAndRender();
</script>
</body>
</html>
