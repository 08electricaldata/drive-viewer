<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Motor Master List - Compact Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#003f88" />
<style>
:root{
  --primary:#003f88;
  --bg:#f6f8ff;
  --card:#ffffff;
  --muted:#556;
  --accent:#eaf1ff;
  --soft:#f3f6ff;
  --border:#e6edf6;
  --shadow-1: 0 1px 2px rgba(8,15,42,0.06);
  --shadow-2: 0 6px 18px rgba(8,15,42,0.08);
}

/* Base */
html,body{ margin:0; height:100%; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#0b2540; -webkit-text-size-adjust:100%; }
.header-bar{ position:sticky; top:0; z-index:1000; background:var(--primary); color:white; display:flex; align-items:center; gap:8px; padding:8px; }
.header-bar button{ background:white; color:var(--primary); border:none; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; min-width:40px; height:36px; display:inline-flex; align-items:center; justify-content:center; }
.header-title{ flex:1; text-align:center; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.2px; }

/* Layout */
.container{ padding:8px; }
.card-shell{ background:transparent; border-radius:10px; padding:6px; }

/* Controls */
.controls{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
.controls button{ padding:8px 10px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
.controls .filter{ flex:1; min-width:120px; }
.controls .filter input{ width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:13px; }

/* Table (for wide screens) */
.table-wrapper{ display:none; }
table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
th, td{ border:1px solid var(--border); padding:6px 8px; white-space:normal; overflow-wrap:break-word; word-break:break-word; font-size:12px; }
thead tr:nth-child(1) th{ position:sticky; top:56px; background:var(--primary); color:white; z-index:20; padding:8px; font-size:12px; }
thead tr:nth-child(2) th{ position:sticky; top:92px; background:var(--accent); z-index:15; padding:6px; font-size:12px; }
tbody tr:hover{ background:#f0f6ff; cursor:pointer; }
.section-row{ background:#dbe9ff !important; font-weight:600; }

/* Cards grid - compact */
.cards-grid{
  display:grid;
  grid-template-columns: repeat(1, 1fr);
  gap:8px;
  align-items:start;
}

/* Use two columns where there's enough width (auto layout) */
@media (min-width:380px){
  .cards-grid{ grid-template-columns: repeat(2, 1fr); }
}

/* Card styling (compact + 3D subtle) */
.card-item{
  background: linear-gradient(180deg, #ffffff, #fbfdff);
  border-radius:10px;
  padding:8px;                 /* compact */
  box-shadow: var(--shadow-1), 0 3px 10px rgba(8,15,42,0.04);
  border: 1px solid rgba(12,24,60,0.04);
  transform: translateZ(0);
  transition: transform 180ms ease, box-shadow 180ms ease;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:52px;            /* keep compact */
}

/* Slight lift on hover/touch */
.card-item:hover, .card-item:active{
  transform: translateY(-4px);
  box-shadow: var(--shadow-2);
}

/* Reduce spacing within label/value rows */
.card-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  padding:2px 0;
}

/* Labels smaller and narrower to fit more rows per card */
.card-label{
  flex:0 0 44%;
  font-size:12px;
  color:#234;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Values compact */
.card-value{
  flex:1 1 56%;
  text-align:right;
  font-size:13px;
  color:#103049;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Achieved numeric badges */
.badge-num{ display:inline-block; padding:4px 8px; border-radius:10px; font-weight:700; font-size:12px; }
.positive{ background:#e8f5e9; color:#1b5e20; }
.negative{ background:#fff0f0; color:#a01f1f; }
.equal{ background:#fff8e1; color:#e65100; }

/* status area */
.status{ font-size:12px; color:#223; padding:6px; border-radius:8px; background:#f6f9ff; margin-bottom:8px; border:1px solid #e6eefc; }

/* Hide-by-attribute fallback */
[data-hide="true"]{ display:none !important; }

/* smaller fonts for small screens */
@media (max-width:360px){
  .card-item{ padding:6px; min-height:48px; }
  .card-label{ font-size:11px; flex:0 0 42%; }
  .card-value{ font-size:12px; }
  .header-title{ font-size:14px; }
  .controls button{ font-size:13px; padding:6px 8px; }
}
</style>
</head>
<body>

<div class="header-bar" role="banner">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="openMotorOH()">🛠️ Motor O/H</button>
  <button onclick="openMotorPM()">🧾 Motor PM</button>
  <div class="header-title">MOTOR MASTER LIST</div>
</div>

<div class="container">
  <div class="card-shell">

    <div id="status" class="status">Loading…</div>

    <div class="controls">
      <button onclick="exportExcel()">📄 Export CSV</button>
      <button onclick="window.print()">🖨 Print</button>
      <div class="filter" style="flex:1;">
        <input id="universalFilter" placeholder="🔍 Search" style="width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:13px;">
      </div>
    </div>

    <!-- table for wider screens -->
    <div class="table-wrapper" aria-hidden="true">
      <table id="motorTable">
        <thead>
          <tr id="headerRow"></tr>
          <tr class="filter-row" id="filterRow"></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- compact cards grid for mobile -->
    <div class="cards-grid" id="cardsGrid" aria-live="polite"></div>

  </div>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/motors.json";
const statusEl = document.getElementById('status');
const headerRowEl = document.getElementById('headerRow');
const filterRowEl = document.getElementById('filterRow');
const tbodyEl = document.querySelector('#motorTable tbody');
const cardsGridEl = document.getElementById('cardsGrid');
const universalFilter = document.getElementById('universalFilter');

function goHome(){ window.location.href = "https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }
function openMotorOH(){ window.location.href = "https://08electricaldata.github.io/drive-viewer/mobile/motoroh.html"; }
function openMotorPM(){ window.location.href = "https://08electricaldata.github.io/drive-viewer/mobile/motorpm.html"; }

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isNumericVal(v){ if(v === null || v === undefined) return false; const s = String(v).trim().replace(/,/g,''); return /^-?\d+(\.\d+)?$/.test(s); }

function computeVisibleIndices(headers, rows){
  const hdrCount = headers.length;
  const skip = new Set();
  if(hdrCount > 3) skip.add(3);        // hide 4th column (index 3)
  if(hdrCount > 0) skip.add(hdrCount-1); // hide last column
  const indices = headers.map((_,i)=>i).filter(i => !skip.has(i));
  if(indices.length === 0 && rows.length > 0){
    const maxCols = rows.reduce((m,r) => Math.max(m, Array.isArray(r)?r.length:0), 0);
    return Array.from({length:maxCols}, (_,i)=>i).filter(i => ![3, maxCols-1].includes(i));
  }
  return indices;
}

function renderTable(headers, rows, visibleIndices){
  headerRowEl.innerHTML = '';
  filterRowEl.innerHTML = '';
  visibleIndices.forEach(i => {
    const th = document.createElement('th'); th.textContent = headers[i] ?? ''; headerRowEl.appendChild(th);
    const fh = document.createElement('th'); fh.innerHTML = '<input placeholder="🔍">'; filterRowEl.appendChild(fh);
  });
  tbodyEl.innerHTML = '';
  rows.forEach(r => {
    const row = Array.isArray(r)? r : [];
    if(!row[1]) return;
    const tr = document.createElement('tr');
    if(!row[0]) tr.classList.add('section-row');
    visibleIndices.forEach(i => {
      const td = document.createElement('td'); const raw = row[i] ?? '';
      td.title = raw;
      const span = document.createElement('span'); span.className = 'cell-value'; span.innerHTML = escapeHtml(raw);
      td.appendChild(span);
      if(isNumericVal(raw)) td.classList.add('num');
      tr.appendChild(td);
    });
    tr.addEventListener('click', () => {
      const id = (row[1] ?? '') + '-' + (row[2] ?? '');
      if((row[1] ?? '') === '') return;
      window.location.href = 'https://08electricaldata.github.io/drive-viewer/index.html?id=' + encodeURIComponent(id);
    });
    tbodyEl.appendChild(tr);
  });
}

function renderCards(headers, rows, visibleIndices){
  cardsGridEl.innerHTML = '';
  rows.forEach(r => {
    const row = Array.isArray(r)? r : [];
    if(!row[1]) return;
    const card = document.createElement('div'); card.className = 'card-item';
    visibleIndices.forEach(i => {
      const label = headers[i] ?? ('Col ' + (i+1));
      const raw = row[i] ?? '';
      const rowDiv = document.createElement('div'); rowDiv.className = 'card-row';
      const lab = document.createElement('div'); lab.className = 'card-label'; lab.textContent = label;
      const valWrap = document.createElement('div'); valWrap.className = 'card-value';
      if(i === 4 && isNumericVal(raw)){
        const badge = document.createElement('span'); badge.className = 'badge-num';
        const achieved = Number(String(row[4] ?? '').replace(/,/g,'')) || 0;
        const target = Number(String(row[5] ?? '').replace(/,/g,'')) || 0;
        if(achieved > target) badge.classList.add('positive');
        else if(achieved < target) badge.classList.add('negative');
        else badge.classList.add('equal');
        badge.textContent = String(raw);
        valWrap.appendChild(badge);
      } else {
        valWrap.innerHTML = escapeHtml(String(raw));
      }
      rowDiv.appendChild(lab); rowDiv.appendChild(valWrap);
      card.appendChild(rowDiv);
    });
    card.addEventListener('click', () => {
      const id = (row[1] ?? '') + '-' + (row[2] ?? '');
      if((row[1] ?? '') === '') return;
      window.location.href = 'https://08electricaldata.github.io/drive-viewer/index.html?id=' + encodeURIComponent(id);
    });
    cardsGridEl.appendChild(card);
  });
}

async function loadData(){
  statusEl.textContent = 'Loading…';
  let data = null;
  try { const cache = localStorage.getItem('motorJSON'); if(cache) data = JSON.parse(cache); } catch(e){ console.warn('cache parse failed', e); }
  try {
    const res = await fetch(JSON_URL, {cache:'no-store'});
    if(res && res.ok){ const json = await res.json(); data = json; try { localStorage.setItem('motorJSON', JSON.stringify(json)); } catch(e){} statusEl.textContent = 'Loaded remote'; }
    else statusEl.textContent = 'Using cache';
  } catch(err){ console.warn('fetch failed', err); statusEl.textContent = 'Offline / using cache'; }
  if(!data) data = { headers: [], rows: [] };
  let headers = Array.isArray(data.headers) ? data.headers.slice() : (data.headers ? Object.values(data.headers) : []);
  const rows = Array.isArray(data.rows) ? data.rows.slice() : [];
  if(headers.length === 0 && rows.length > 0){
    const max = rows.reduce((m,r) => Math.max(m, Array.isArray(r)?r.length:0), 0);
    headers = Array.from({length:max}, (_,i) => 'Col ' + (i+1));
  }
  const visible = computeVisibleIndices(headers, rows);
  renderTable(headers, rows, visible);
  renderCards(headers, rows, visible);

  // universal filter
  universalFilter.addEventListener('input', () => {
    const q = universalFilter.value.trim().toLowerCase();
    // filter table rows
    document.querySelectorAll('#motorTable tbody tr').forEach(tr => {
      if(!tr.children || tr.children.length === 0){ tr.style.display = ''; return; }
      const text = Array.from(tr.children).map(td => td.innerText).join(' ').toLowerCase();
      tr.style.display = text.includes(q) ? '' : 'none';
    });
    // filter cards
    document.querySelectorAll('.card-item').forEach(card => {
      const text = card.innerText.toLowerCase();
      card.style.display = text.includes(q) ? '' : 'none';
    });
  });

  statusEl.textContent = '';
}

/* CSV export (visible rows only) */
function exportExcel(){
  const headerCells = Array.from(document.querySelectorAll('#headerRow th')).map(th => th.innerText);
  const lines = [];
  if(headerCells.length) lines.push(headerCells.map(h => `"${h.replace(/"/g,'""')}"`).join(','));
  const tableVisible = getComputedStyle(document.querySelector('.table-wrapper')).display !== 'none';
  if(tableVisible){
    document.querySelectorAll('#motorTable tbody tr').forEach(tr => {
      if(getComputedStyle(tr).display === 'none') return;
      const vals = Array.from(tr.children).map(td => `"${td.innerText.replace(/"/g,'""')}"`);
      lines.push(vals.join(','));
    });
  } else {
    document.querySelectorAll('.card-item').forEach(card => {
      if(getComputedStyle(card).display === 'none') return;
      const vals = Array.from(card.querySelectorAll('.card-row .card-value')).map(v => `"${v.innerText.replace(/"/g,'""')}"`);
      lines.push(vals.join(','));
    });
  }
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'motor_master_list.csv'; a.click();
}

/* init */
loadData();
</script>
</body>
</html>
