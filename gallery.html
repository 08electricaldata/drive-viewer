<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Electrical Photo Gallery</title>

<!-- Modern, professional styling — behavior & JavaScript left unchanged -->
<style>
  :root{
    --bg: #f3f7ff;
    --card-bg: #ffffff;
    --muted: #6b7280;
    --accent: #0d47a1;
    --accent-2: #1976d2;
    --glass: rgba(255,255,255,0.7);
    --shadow-1: 0 6px 22px rgba(13,71,161,0.08);
    --shadow-2: 0 10px 30px rgba(2,6,23,0.08);
    --radius: 14px;
    --gap: 16px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg, #eef6ff 0%, var(--bg) 100%);
    color:#102235;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.45;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
    padding:18px 24px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:white;
    border-bottom-left-radius:12px;
    border-bottom-right-radius:12px;
    box-shadow: var(--shadow-1);
    position:relative;
    flex-wrap:wrap;
  }

  /* left-side top buttons */
  .left-controls{
    display:flex;
    gap:10px;
    align-items:center;
    z-index:5;
  }

  .action-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding:10px 12px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(2,6,23,0.06);
    transition: transform .12s ease, background .12s;
  }
  .action-btn:hover{ transform:translateY(-3px); background: rgba(255,255,255,0.18); }
  .action-btn:active{ transform:none; }

  /* center title fixed in center of header */
  .header-center{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:4;
    pointer-events:none;
  }
  .branding{
    font-weight:800;
    font-size:20px;
    letter-spacing:0.2px;
    pointer-events:auto;
  }
  .branding small{
    display:block;
    font-weight:600;
    font-size:12px;
    margin-top:6px;
    color: rgba(255,255,255,0.95);
    pointer-events:auto;
  }

  .version-info{
    background: rgba(255,255,255,0.15);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    margin-left: auto;
    z-index: 5;
  }

  .status-indicator{
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf50;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}

  main{
    max-width:1400px;
    margin:26px auto;
    padding:0 20px 60px;
  }

  /* Gallery card container */
  .gallery{
    background: var(--card-bg);
    border-radius: var(--radius);
    padding:18px;
    box-shadow: var(--shadow-2);
    margin-bottom:18px;
    overflow:visible;
    border:1px solid rgba(2,6,23,0.04);
  }

  .gallery-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }

  .gallery h2{
    font-size:18px;
    color:var(--accent);
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .count{
    background: linear-gradient(90deg,var(--accent),var(--accent-2));
    color:white;
    padding:6px 10px;
    border-radius:999px;
    font-weight:800;
    font-size:13px;
    box-shadow: 0 6px 18px rgba(13,71,161,0.12);
  }

  /* Carousel track */
  .wrap{
    position:relative;
  }

  .track{
    display:flex;
    gap:var(--gap);
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:8px;
    -webkit-overflow-scrolling:touch;
  }
  .track::-webkit-scrollbar{ height:10px; display:none; }

  /* Card styles */
  .card{
    flex:0 0 280px;
    min-width:220px;
    border-radius:12px;
    background: linear-gradient(180deg,#fff,#fbfdff);
    box-shadow: 0 6px 18px rgba(2,6,23,0.06);
    overflow:hidden;
    cursor:zoom-in;
    transition: transform .18s ease, box-shadow .18s ease;
    display:flex;
    flex-direction:column;
  }
  .card:hover{ transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,6,23,0.08); }

  .card-media{
    position:relative;
    width:100%;
    height:170px;
    background:#e6eefb;
  }
  .card-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition: transform .32s ease;
  }
  .card:hover .card-media img{ transform: scale(1.05); }

  .card-caption{
    padding:12px;
    text-align:center;
    font-weight:700;
    color:#0d2a44;
    font-size:14px;
    background:linear-gradient(180deg,#fff,#fbfdff);
  }

  /* Prev / Next buttons */
  .btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    border:0;
    background: rgba(255,255,255,0.92);
    color:var(--accent);
    font-size:20px;
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow: 0 8px 26px rgba(2,6,23,0.12);
    transition: transform .12s ease, background .12s;
    backdrop-filter: blur(6px);
  }
  .btn:hover{ transform:translateY(-50%) scale(1.04); background:#fff; }
  .prev{ left:8px; }
  .next{ right:8px; }

  /* Lightbox */
  #lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background: linear-gradient(180deg, rgba(2,6,23,0.85), rgba(2,6,23,0.95));
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:20px;
    gap:14px;
  }
  #lightbox.show{ display:flex; animation:fadeIn .18s ease; }

  @keyframes fadeIn{ from{opacity:0;transform:scale(.99);} to{opacity:1;transform:none;} }

  #lbimg{
    max-width:96%;
    max-height:82vh;
    border-radius:10px;
    box-shadow: 0 18px 50px rgba(2,6,23,0.6);
    background:#111;
  }
  #caption{
    color:#fff;
    font-size:18px;
    font-weight:700;
    text-align:center;
    max-width:88%;
  }

  .close{
    position:absolute;
    top:18px;
    right:20px;
    color:#fff;
    font-size:34px;
    cursor:pointer;
    opacity:0.95;
    transition: transform .12s ease;
  }
  .close:hover{ transform:rotate(10deg) }

  /* Loading indicator */
  .loading{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#1976d2;
    animation:pulse 1.5s infinite;
  }

  /* Responsive */
  @media (max-width:1000px){
    .track{ gap:12px; padding:6px }
    .card{ flex:0 0 240px }
    .card-media{ height:150px }
    .btn{ width:40px; height:40px }
  }
  @media (max-width:700px){
    header{ padding:12px 14px; align-items:flex-start; }
    .left-controls{ gap:8px; }
    .header-center{ position:static; transform:none; text-align:center; margin:8px auto 0; }
    .version-info{ margin-left:0; margin-top:8px; order:3; flex-basis:100%; }
    main{ padding:16px }
    .track{ gap:10px }
    .card{ flex:0 0 200px; min-width:170px }
    .card-media{ height:130px }
    .gallery{ padding:14px }
    .gallery h2{ font-size:16px }
  }

  /* Accessibility focus */
  .action-btn:focus, .btn:focus, .card:focus, .card div:focus { outline: 3px solid rgba(21,101,216,0.12); outline-offset: 3px; border-radius:10px; }

</style>
</head>

<body>
<header>
  <!-- Left top buttons -->
  <div class="left-controls">
    <button class="action-btn" onclick="goBack()" title="Back" aria-label="Back">⬅ Back</button>
    <button class="action-btn" onclick="goHome()" title="Home" aria-label="Home">🏠 Home</button>
  </div>

  <!-- Centered branding -->
  <div class="header-center" aria-hidden="false">
    <div class="branding">Electrical Photo Gallery Of 08 AREA</div>
    <small>08 AREA • SAFETY • 5S</small>
  </div>

  <!-- Version info (top right) -->
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</header>

<main>
  <section class="gallery" aria-labelledby="g1-title">
    <div class="gallery-header">
      <h2 id="g1-title">08 AREA PHOTOS <span id="c1" class="count"><span class="loading"></span></span></h2>
    </div>
    <div class="wrap" aria-hidden="false">
      <button class="btn prev" onclick="scrollTrack('t1',-280)" aria-label="Scroll left">❮</button>
      <div class="track" id="t1" role="list" aria-label="08 area photos"></div>
      <button class="btn next" onclick="scrollTrack('t1',280)" aria-label="Scroll right">❯</button>
    </div>
  </section>

  <section class="gallery" aria-labelledby="g2-title">
    <div class="gallery-header">
      <h2 id="g2-title">SAFETY PHOTOS <span id="c2" class="count"><span class="loading"></span></span></h2>
    </div>
    <div class="wrap" aria-hidden="false">
      <button class="btn prev" onclick="scrollTrack('t2',-280)" aria-label="Scroll left">❮</button>
      <div class="track" id="t2" role="list" aria-label="Safety photos"></div>
      <button class="btn next" onclick="scrollTrack('t2',280)" aria-label="Scroll right">❯</button>
    </div>
  </section>

  <section class="gallery" aria-labelledby="g3-title">
    <div class="gallery-header">
      <h2 id="g3-title">5S PHOTOS <span id="c3" class="count"><span class="loading"></span></span></h2>
    </div>
    <div class="wrap" aria-hidden="false">
      <button class="btn prev" onclick="scrollTrack('t3',-280)" aria-label="Scroll left">❮</button>
      <div class="track" id="t3" role="list" aria-label="5S photos"></div>
      <button class="btn next" onclick="scrollTrack('t3',280)" aria-label="Scroll right">❯</button>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="close" onclick="hideLightbox()" role="button" aria-label="Close">×</div>
  <img id="lbimg" alt="" />
  <div id="caption" aria-live="polite"></div>
</div>

<script>
  /* Existing functions preserved */
  function goHome(){ location.href = "https://08electricaldata.github.io/"; }
  function goBack(){ history.back(); }

  /* ===== VERSION-BASED CACHE BUSTING ===== */
  const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
  const AUTO_RELOAD_INTERVAL = 5 * 60 * 1000; // 5 minutes
  
  let currentVersion = "1.0.0";
  const versionDisplayEl = document.getElementById("versionDisplay");

  const galleryConfig = [
    { name: "08area", track: "t1", count: "c1" },
    { name: "safety", track: "t2", count: "c2" },
    { name: "5s", track: "t3", count: "c3" }
  ];

  /* Fetch version file to bust cache */
  async function getVersion() {
    try {
      const res = await fetch(VERSION_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      const data = await res.json();
      currentVersion = data.version || "1.0.0";
      versionDisplayEl.textContent = currentVersion;
      console.log("Gallery version loaded:", currentVersion);
    } catch (err) {
      console.warn("Failed to load version file:", err);
      currentVersion = "1.0.0";
      versionDisplayEl.textContent = currentVersion;
    }
  }

  /* Build gallery URL with version param for faster cache busting */
  function buildGalleryUrl(galleryName) {
    return `https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/Gallery/${galleryName}.json?v=${currentVersion}`;
  }

  /* Preload gallery image for better performance */
  function preloadImage(src) {
    const img = new Image();
    img.src = src;
  }

  async function loadGallery(config) {
    try {
      const url = buildGalleryUrl(config.name);
      console.log("Loading gallery:", config.name, "from", url);
      const startTime = performance.now();
      
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
      const j = await r.json();
      
      const loadTime = performance.now() - startTime;
      console.log(`${config.name} loaded in ${loadTime.toFixed(2)}ms`);
      
      document.getElementById(config.count).textContent = j.total || (j.photos && j.photos.length) || 0;
      const t = document.getElementById(config.track);
      t.innerHTML = "";
      
      /* Use DocumentFragment for better performance */
      const fragment = document.createDocumentFragment();
      
      j.photos.forEach((p, idx) => {
        const c = document.createElement("div");
        c.className = "card";
        c.setAttribute("role", "listitem");
        
        /* Use thumb for initial display, full image for lightbox */
        const thumbSrc = p.thumb || p.image;
        const fullSrc = p.image;
        
        c.innerHTML = `
          <div class="card-media">
            <img loading="lazy" src="${thumbSrc}" alt="${(p.title || '')}" data-full="${fullSrc}" />
          </div>
          <div class="card-caption">${p.title || ''}</div>
        `;
        
        c.onclick = () => showLightbox(fullSrc, p.title);
        c.onkeydown = (e) => { if (e.key === 'Enter') showLightbox(fullSrc, p.title); };
        c.tabIndex = 0;
        
        /* Preload images in viewport (first 5 images) */
        if (idx < 5) {
          preloadImage(fullSrc);
        }
        
        fragment.appendChild(c);
      });
      
      t.appendChild(fragment);

      /* Auto-scroll loop with better performance */
      let scrollInterval = setInterval(() => {
        if (!t || t.children.length === 0) {
          clearInterval(scrollInterval);
          return;
        }
        t.scrollBy({left: 280, behavior: "smooth"});
        if (t.scrollLeft + t.clientWidth >= t.scrollWidth - 10) {
          setTimeout(() => t.scrollTo({left: 0, behavior: "smooth"}), 700);
        }
      }, 3500);
      
    } catch (err) {
      console.error(`Failed to load gallery [${config.name}]:`, err);
      document.getElementById(config.count).textContent = "Error";
      document.getElementById(config.track).innerHTML = `<div style="padding:20px;color:red;text-align:center;">Failed to load. Please refresh.</div>`;
    }
  }

  function scrollTrack(id, x) { 
    const el = document.getElementById(id); 
    if (el) el.scrollBy({left: x, behavior: "smooth"}); 
  }
  
  function showLightbox(src, title) { 
    document.getElementById("lbimg").src = src; 
    document.getElementById("caption").textContent = title || ''; 
    document.getElementById("lightbox").classList.add('show');
    /* Preload next images from current gallery */
    document.querySelectorAll('.card img').forEach(img => {
      if (img.dataset.full) {
        preloadImage(img.dataset.full);
      }
    });
  }
  
  function hideLightbox() { 
    document.getElementById("lightbox").classList.remove('show'); 
    document.getElementById("lbimg").src = ''; 
  }

  /* Initialize: load version first, then all galleries in parallel */
  (async () => {
    await getVersion();
    console.log("Loading galleries in parallel for better performance...");
    await Promise.all(galleryConfig.map(loadGallery));
    console.log("All galleries loaded!");
  })();

  /* Reload galleries every 5 minutes to check for updates */
  setInterval(async () => {
    console.log("Auto-refreshing galleries...");
    await getVersion();
    await Promise.all(galleryConfig.map(loadGallery));
  }, AUTO_RELOAD_INTERVAL);

</script>
</body>
</html>
