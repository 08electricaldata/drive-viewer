<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f2f6ff; }

.header-bar {
  position: sticky; top: 0; z-index: 1000;
  background: #f2f6ff; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);

.header-title h2 { margin: 0; color: #003f88; }
.header-title small { display: block; font-size: 15px; font-weight: 600; }

.icon-btn {
  background: #ffffff;
  color: #003f88;
  border: 1px solid #003f88;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;

.container { padding: 20px; }

.card {
  background: #fff; padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

.card h3 {
  margin: 0 0 20px 0;
  display: flex;
  gap: 20px;
  align-items: baseline;
  flex-wrap: wrap;
  word-break: break-word;
}

.drive-id {
  flex: 0 0 auto;
  font-size: 20px;
  font-weight: bold;
  color: #1976d2;
}

.drive-location {
  flex: 0 0 auto;
  font-size: 18px;
  font-weight: normal;
}

.drive-location .location-label {
  font-size: 18px;
  font-weight: bold;
  color: #003f88;
}

.drive-location .location-value {
  font-size: 18px;
  font-weight: bold;
  color: #d32f2f;
  margin-left: 8px;
}

.label { font-weight: bold; color: #003f88; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}

.action-btn {
  margin-top: 20px;
  padding: 10px 18px;
  background: #003f88;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.action-btn:disabled {
  background:#ccc;
  cursor:not-allowed;
}

.badge {
  color:red;
  font-weight:bold;
  margin-top:10px;
}

@media(max-width:768px){
  .grid { grid-template-columns: 1fr; }
  
  .card h3 {
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  .action-row .action-btn {
    margin-top: 0;
    width: 100%;
  }
}
</style>
</head>

<div class="header-bar">
  <button class="icon-btn" onclick="goHome()">🏠 Home</button>
  <button class="icon-btn" onclick="goBack()">⬅ Back</button>
  <button class="icon-btn" onclick="addJob()">➕ ADD JOB</button>

    <h2>Equipment Information</h2>

  </div>
</div>

<div class="container">
  <div id="content">Loading data…</div>
</div>

<script>
// ===== JSDELIVR CDN URLS =====
const DRIVE_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drive.json";

const DRAWING_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drawings/drawings.json";

const PLC_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/plc/plc.json";

const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/history/";

const BOARDS_SLD_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/sld/boards_sld.json";

const LT_SLD_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/sld/lt_sld.json";

let drawingAvailableMap = {};
let plcAvailableMap = {};

// SLD maps
let sldBoardMap = {}; // normalized breakerId -> boardId (for boards_sld.json)
let sldLTMap = {};    // normalized drive token -> boardId (for lt_sld.json)

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

function goHome(){ location.href="https://08electricaldata.github.io/"; }
function goBack(){ history.back(); }

/* ===== ADD JOB ===== */
function addJob(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;
  location.href =
  "https://08electricaldata.github.io/qrsubmit.html?id=" +
  encodeURIComponent(id);
}

/* ===== DRAWING OPEN ===== */
async function openDrawings(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // If we already know availability:
  if(drawingAvailableMap.hasOwnProperty(id)){
    if(drawingAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
    return;
  }

  // Otherwise check on demand
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    let hasDrawing = false;
    j.rows.forEach(item=>{
      const iid = normalize(item.id);
      if(iid !== id) return;

      const found = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      if(found) hasDrawing = true;
    });

    drawingAvailableMap[id] = hasDrawing;

    if(hasDrawing){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
  }catch(e){
    alert("Error checking drawings");
  }
}

/* ===== PLC OPEN ===== */
async function openPLC(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  if(plcAvailableMap.hasOwnProperty(id)){
    if(plcAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
    return;
  }

  try{
    const j = await (await fetch(PLC_JSON)).json();
    const exists = Object.keys(j.drives || {}).some(k => normalize(k) === id);
    plcAvailableMap[id] = exists;

    if(exists){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
  }catch(e){
    alert("Error checking PLC availability");
  }
}

/* ===== MOTOR DATA OPEN ===== */
async function openMotorData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Check drive data presence on demand
  try{
    const j = await (await fetch(DRIVE_JSON)).json();
    const c = j.rows.find(
      r => normalize(`${r[1]}-${r[2]}`) === id
    );

    if(c){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/motordata.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Motor Data Available");
    }
  }catch(e){
    alert("Error checking Motor Data");
  }
}

/* ===== SLD OPEN ===== */
async function openSLD(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Priority 1: boards_sld.json (breakerId mapping)
  if(sldBoardMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/sld.html?id=" +
      encodeURIComponent(sldBoardMap[id]);
    return;
  }

  // Priority 2: lt_sld.json (drive mapping)
  if(sldLTMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/sld3.html?id=" +
      encodeURIComponent(sldLTMap[id]);
    return;
  }

  // If we already know maps exist but not this id, show not found
  const mapsHaveEntries = Object.keys(sldBoardMap).length > 0 || Object.keys(sldLTMap).length > 0;
  if(mapsHaveEntries && !sldBoardMap[id] && !sldLTMap[id]){
    alert("No SLD found for this ID.");
    return;
  }

  // Otherwise load SLD maps on demand
  try{
    await preloadSLD();
    if(sldBoardMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/sld.html?id=" +
        encodeURIComponent(sldBoardMap[id]);
      return;
    }
    if(sldLTMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/sld3.html?id=" +
        encodeURIComponent(sldLTMap[id]);
      return;
    }
    alert("No SLD found for this ID.");
  }catch(e){
    alert("Error checking SLD availability");
  }
}

/* ===== PRELOAD DRAWINGS ===== */
async function preloadDrawings(){
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    j.rows.forEach(item=>{
      const id = normalize(item.id);
      if(!id) return;

      const hasDrawing = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      drawingAvailableMap[id] = hasDrawing;
    });
  }catch(e){}
}

/* ===== PRELOAD PLC ===== */
async function preloadPLC(){
  try{
    const j = await (await fetch(PLC_JSON)).json();
    Object.keys(j.drives || {}).forEach(id=>{
      plcAvailableMap[normalize(id)] = true;
    });
  }catch(e){}
}

/* ===== PRELOAD SLDs (robust) ===== */
async function preloadSLD(){
  // Helper to split and normalize tokens from a possibly multiline/compound string
  function extractTokens(value){
    if(!value) return [];
    return String(value)
      .split(/[\n,\/;]+/) // split by newline, comma, slash, semicolon
      .map(t=>t.trim())
      .filter(Boolean)
      .map(t=>normalize(t));
  }

  // 1) Parse boards_sld.json -> map breakerId (from outgoings/incomers/busCouplers/linePT/busPT etc) to boardId
  try{
    const jb = await (await fetch(BOARDS_SLD_JSON)).json();
    const boardsObj = jb.boards || jb.rows || jb;
    // boardsObj might be an object keyed by boardId
    if(boardsObj && typeof boardsObj === "object"){
      Object.keys(boardsObj).forEach(boardKey=>{
        const board = boardsObj[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        // fields that commonly contain breakerId lists
        const arraysToScan = [
          "outgoings", "incomers", "dgIncomers", "emergencyIncomers",
          "busCouplers", "busPT", "linePT", "incomers", "linePT", "busPT",
          "devices", "feeders"
        ];

        arraysToScan.forEach(field=>{
          const arr = board[field];
          if(Array.isArray(arr)){
            arr.forEach(entry=>{
              if(!entry) return;
              // breakerId might be breakerId, breaker, id, or similar
              const possible = entry.breakerId || entry.breaker || entry.id || entry.BREAKERID || "";
              const tokens = extractTokens(possible);
              tokens.forEach(tok => sldBoardMap[tok] = boardId);
            });
          }
        });

        // Some breakerIds may appear in other nested properties or strings; attempt a broad scan:
        // stringify board and look for tokens like SOME-ID patterns (conservative: split words with - and underscores)
        try{
          const txt = JSON.stringify(board);
          // match tokens that look like UPPER-ALNUM sequences with dashes or underscores, e.g., TANKAGE-P-194, US-08EX-...
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              // avoid mapping plain numbers
              if(t.length > 2) sldBoardMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // fail silently
  }

  // 2) Parse lt_sld.json -> boards -> sections -> items -> driveid tokens map to boardId
  try{
    const jl = await (await fetch(LT_SLD_JSON)).json();
    const boards = jl.boards || jl.rows || jl;
    if(boards && typeof boards === "object"){
      // boards may be keyed by boardId
      Object.keys(boards).forEach(boardKey=>{
        const board = boards[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        // sections: object with arrays of items
        const sections = board.sections || board.section || {};
        Object.values(sections).forEach(sectionArr=>{
          if(!Array.isArray(sectionArr)) return;
          sectionArr.forEach(item=>{
            if(!item) return;
            const drv = item.driveid || item.driveId || item.drive || item.DRIVEID || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        });

        // also check devices or feeders arrays
        const devices = board.devices || board.feeders || [];
        if(Array.isArray(devices)){
          devices.forEach(d=>{
            if(!d) return;
            const drv = d.driveid || d.driveId || d.drive || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        }

        // lastly, scan entire board JSON string for probable drive tokens
        try{
          const txt = JSON.stringify(board);
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              if(t.length > 2) sldLTMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // fail silently
  }
}

function parseDate(v){
  if(!v) return null;
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const[d,m,y]=v.split("/");
    return new Date(y,m-1,d);
  }
  return new Date(v);
}

function fmt(d){
  if(!d || isNaN(d)) return "NO RECORDS";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* ===== LAST DATES ===== */
async function lastDates(id,map){
  const res={};
  Object.keys(map).forEach(k=>res[k]=null);

  for(const y of HISTORY_YEARS){
    try{
      const j = await (await fetch(HISTORY_BASE + y + ".json")).json();
      j.rows.forEach(r=>{
        if(normalize(`${r[2]}-${r[3]}`) !== id) return;

        const job = normalize(r[7]);
        const d = parseDate(r[4]);

        Object.entries(map).forEach(([k,v])=>{
          if(job === normalize(v) && (!res[k] || d > res[k])) {
            res[k] = d;
          }
        });
      });
    }catch(e){}
  }

  Object.keys(res).forEach(
    k => res[k] = res[k] ? fmt(res[k]) : "NO RECORDS"
  );
  return res;
}

/* ===== LOAD DATA ===== */
async function loadData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  try {
    const j = await (await fetch(DRIVE_JSON)).json();
    const c = j.rows.find(
      r => normalize(`${r[1]}-${r[2]}`) === id
    );

    if(!c){
      content.innerHTML =
        "<div class='card'>Drive data not found… opening history…</div>";

      setTimeout(()=>{
        location.href =
          "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
          encodeURIComponent(id);
      }, 800);

      return;
    }

    const TYPE = normalize(c[1]);

    if(TYPE === "TRANSFORMER") showTransformer(c,id);
    else if(TYPE === "BREAKER") showBreaker(c,id);
    else showMotor(c,id);
  } catch(e) {
    content.innerHTML =
      "<div class='card'>Error loading data. Please refresh the page.</div>";
  }
}

/* ===== APPLY BUTTON STATE ===== */
function applyButtonState(id){
  const drawBtn = document.getElementById("drawBtn");
  const plcBtn = document.getElementById("plcBtn");
  const sldBtn = document.getElementById("sldBtn");

  // Only disable if we explicitly know availability=false (don't disable while unknown)
  if(drawBtn && drawingAvailableMap.hasOwnProperty(id) && !drawingAvailableMap[id]){
    drawBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="🎨 No Drawing Available";
    drawBtn.parentNode.appendChild(badge);
  }

  if(plcBtn && plcAvailableMap.hasOwnProperty(id) && !plcAvailableMap[id]){
    plcBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="⚡ No PLC Address Available";
    plcBtn.parentNode.appendChild(badge);
  }

  if(sldBtn){
    const boardKnown = sldBoardMap.hasOwnProperty(id);
    const ltKnown = sldLTMap.hasOwnProperty(id);
    if(boardKnown || ltKnown){
      const hasBoard = !!sldBoardMap[id];
      const hasLT = !!sldLTMap[id];
      if(!hasBoard && !hasLT){
        sldBtn.disabled = true;
        const badge = document.createElement("div");
        badge.className="badge";
        badge.innerText="🗺️ No LOCATION Available";
        sldBtn.parentNode.appendChild(badge);
      }
    }
  }
}



 function formatDDMMYYYY(v){
  if(!v) return "NO RECORDS";

  const d = new Date(v);
  if(isNaN(d)) return v; // if already formatted text

  const day = String(d.getDate()).padStart(2,"0");
  const month = String(d.getMonth()+1).padStart(2,"0");
  const year = d.getFullYear();

  return `${day}-${month}-${year}`;
}

/* ===== TRANSFORMER ===== */
async function showTransformer(c,id){
  const t = await lastDates(id,{
    pm:"TRANSFORMER PM",
    oh:"TRANSFORMER O/H",
    leak:"TRANSFORMER L/A",
    top:"OIL TUPOP",
    chk:"T/F OIL CHECK"
  });

  content.innerHTML = `
  <div class="card">
    <h3>
      <span class="drive-id">Transformer – ${c[2]}</span>
      <span class="drive-location"><span class="location-label">Drive Location:</span> <span class="location-value">${c[42] || 'N/A'}</span></span>

    <div class="grid">
      <p><span class="label">TR Sl No:</span> ${c[3]}</p>

    </div>
  </div>`;

  applyButtonState(id);
}

function openHistory(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
  encodeURIComponent(id);
}
