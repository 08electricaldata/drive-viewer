<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Theme variables */
:root{
  --bg: #f4f7fb;
  --panel: #ffffff;
  --muted: #6b7280;
  --text: #0b2540;
  --accent: #1565d8;         /* primary accent */
  --accent-2: #00b894;       /* secondary accent */
  --card-border: rgba(21,101,216,0.12);
  --glass: rgba(255,255,255,0.7);
  --danger: #d32f2f;
  --success: #16a34a;
  --shadow: 0 8px 20px rgba(11,37,64,0.06);
}

/* Base */
*{box-sizing:border-box}
html,body{height:100%}
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  margin: 0; background: linear-gradient(180deg, #f6f9ff 0%, var(--bg) 100%);
  color: var(--text); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}

/* Sticky header */
.header-bar {
  position: sticky; top: 0; z-index: 1000;
  background: linear-gradient(90deg, rgba(21,101,216,0.06), rgba(0,184,148,0.03));
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(11,37,64,0.04);
  backdrop-filter: blur(6px);
}

/* Header title */
.header-title { flex: 1; text-align: center; }
.header-title h2 { margin: 0; color: var(--accent); font-size: 1.05rem; letter-spacing:0.2px; }
.header-title small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top:2px; }

/* Icon buttons in header */
.icon-btn {
  background: linear-gradient(180deg, #ffffff, #f7fbff);
  color: var(--accent);
  border: 1px solid rgba(21,101,216,0.14);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 700;
  display: inline-flex; gap:8px; align-items:center; justify-content:center;
  box-shadow: 0 4px 12px rgba(16,24,40,0.04);
  transition: transform .14s ease, box-shadow .14s ease;
}
.icon-btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px rgba(16,24,40,0.06); }
.icon-btn:active{ transform: translateY(0); }

/* Page container */
.container { padding: 22px; max-width: 1100px; margin: 0 auto; }

/* Card */
.card {
  background: var(--panel);
  padding: 20px;
  border-radius: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
  overflow: hidden;
  position: relative;
}

/* Card header */
.card h3 {
  margin: 0 0 18px 0;
  display: flex;
  gap: 14px;
  align-items: baseline;
  flex-wrap: wrap;
  word-break: break-word;
}

/* Accent stripe on left of card */
.card::before{
  content: "";
  display:block;
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6px;
  border-top-left-radius:14px;
  border-bottom-left-radius:14px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  transform-origin:left;
}

/* drive id and location */
.drive-id {
  flex: 0 0 auto;
  font-size: 20px;
  font-weight: 700;
  color: #05203a;
  background: linear-gradient(90deg, rgba(21,101,216,0.06), rgba(0,184,148,0.03));
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(21,101,216,0.06);
  box-shadow: 0 2px 8px rgba(21,101,216,0.04) inset;
}

/* location badge */
.drive-location { flex: 1 1 auto; display:flex; gap:8px; align-items:center; justify-content:flex-end; }
.location-label { font-size: 15px; font-weight:700; color:var(--muted); }
.location-value { font-size: 15px; font-weight:800; color:var(--danger); background: rgba(211,47,47,0.06); padding:6px 10px; border-radius:8px; border:1px solid rgba(211,47,47,0.06); }

/* labels and grid */
.label { font-weight: 700; color: var(--accent); display:inline-block; margin-bottom:6px; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 8px;
}

/* info pill style */
.grid p {
  margin: 0;
  padding: 12px;
  background: linear-gradient(180deg,#fff,#fbfdff);
  border: 1px solid rgba(11,37,64,0.04);
  border-radius: 10px;
  color: #102233;
  box-shadow: 0 2px 8px rgba(11,37,64,0.03);
  font-size: 14px;
}

/* action buttons row */
.action-row {
  display:flex;
  flex-wrap:wrap;
  gap: 12px;
  margin-top: 18px;
}

/* Primary action button style (used by LOCATION and now for all actions) */
.action-btn {
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding: 10px 16px;
  background: linear-gradient(90deg, var(--accent), #0b79d0);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(21,101,216,0.12);
  transition: transform .14s ease, box-shadow .14s ease, opacity .12s ease;
  min-width: 120px;
  justify-content: center;
}
.action-btn svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.08)); }
.action-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 32px rgba(21,101,216,0.14); }
.action-btn:active { transform: translateY(-1px); }

/* Keep the secondary class for structure but it now shares primary look */
.action-btn.secondary {
  background: linear-gradient(90deg, var(--accent), #0b79d0);
  color: white;
  border: none;
  box-shadow: 0 8px 20px rgba(21,101,216,0.10);
}

/* Ghost also uses primary color now (keeps lighter border for contrast) */
.action-btn.ghost {
  background: linear-gradient(90deg, var(--accent), #0b79d0);
  color: white;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 6px 14px rgba(11,37,64,0.04);
}

/* Specific background tweak for Drawings button to keep it highlighted but cohesive:
   slightly different gradient stops and inner glow so it "feels" special.
*/
.action-btn#drawBtn {
  background: linear-gradient(90deg, #1e88e5 0%, #1565d8 60%);
  box-shadow: 0 12px 30px rgba(21,101,216,0.14);
  border: 1px solid rgba(255,255,255,0.06);
}

/* Disabled */
.action-btn:disabled {
  opacity: 0.75;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* badge */
.badge {
  color: var(--danger);
  font-weight: 800;
  margin-left: 8px;
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  background: rgba(211,47,47,0.06);
  border: 1px solid rgba(211,47,47,0.06);
  font-size:13px;
}

/* responsive */
@media(max-width:980px){
  .grid { grid-template-columns: 1fr 1fr; }
  .drive-location{ justify-content:flex-start; gap:10px; }
}
@media(max-width:640px){
  .grid { grid-template-columns: 1fr; }
  .card::before{ width:5px; }
  .drive-id{ font-size:18px; }
  .header-bar{ padding:10px; }
  .header-title small{ font-size:12px; }
  .action-row{ justify-content:stretch; }
  .action-btn{ width:100%; min-width: unset; justify-content:center; }
}
</style>
</head>

<div class="header-bar">
  <button class="icon-btn" onclick="goHome()">🏠 Home</button>
  <button class="icon-btn" onclick="goBack()">⬅ Back</button>
  <button class="icon-btn" onclick="addJob()">➕ ADD JOB</button>
  <div class="header-title">
    <h2>Equipment Information</h2>
    <small>Designed and maintained by Rakesh Chandra Sethy</small>
  </div>
</div>

<div class="container">
  <div id="content">Loading data…</div>
</div>

<script>
// ===== JSDELIVR CDN URLS =====
const DRIVE_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drive.json";

const DRAWING_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drawings/drawings.json";

const PLC_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/plc/plc.json";

const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/history/";

const BOARDS_SLD_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/sld/boards_sld.json";

const LT_SLD_JSON =
"https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/sld/lt_sld.json";

let drawingAvailableMap = {};
let plcAvailableMap = {};

// SLD maps
let sldBoardMap = {}; // normalized breakerId -> boardId (for boards_sld.json)
let sldLTMap = {};    // normalized drive token -> boardId (for lt_sld.json)

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

function goHome(){ location.href="https://08electricaldata.github.io/"; }
function goBack(){ history.back(); }

/* ===== ADD JOB ===== */
function addJob(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;
  location.href =
  "https://08electricaldata.github.io/qrsubmit.html?id=" +
  encodeURIComponent(id);
}

/* ===== DRAWING OPEN ===== */
async function openDrawings(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // If we already know availability:
  if(drawingAvailableMap.hasOwnProperty(id)){
    if(drawingAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
    return;
  }

  // Otherwise check on demand
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    let hasDrawing = false;
    j.rows.forEach(item=>{
      const iid = normalize(item.id);
      if(iid !== id) return;

      const found = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      if(found) hasDrawing = true;
    });

    drawingAvailableMap[id] = hasDrawing;

    if(hasDrawing){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No Drawing Available");
    }
  }catch(e){
    alert("Error checking drawings");
  }
}

/* ===== PLC OPEN ===== */
async function openPLC(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  if(plcAvailableMap.hasOwnProperty(id)){
    if(plcAvailableMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
    return;
  }

  try{
    const j = await (await fetch(PLC_JSON)).json();
    const exists = Object.keys(j.drives || {}).some(k => normalize(k) === id);
    plcAvailableMap[id] = exists;

    if(exists){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/plc.html?id=" +
        encodeURIComponent(id);
    } else {
      alert("No PLC Address Available");
    }
  }catch(e){
    alert("Error checking PLC availability");
  }
}

  if(plcAvailableMap.hasOwnProperty(id)){

    } else {

    return;
  }

  try{
    const j = await (await fetch(PLC_JSON)).json();

    plcAvailableMap[id] = exists;

      location.href =

/* ===== MOTOR DATA OPEN ===== */
async function openDrivePhotoData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Check drive data presence on demand
  try{
    const j = await (await fetch(DRIVE_JSON)).json();

/* ===== MOTOR DATA OPEN ===== */
async function openMotorData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Check drive data presence on demand
  try{
    const j = await (await fetch(DRIVE_JSON)).json();

      r => normalize(`${r[1]}-${r[2]}`) === id

    if(c){
      location.href =

/* ===== SLD OPEN ===== */
async function openSLD(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  // Priority 1: boards_sld.json (breakerId mapping)
  if(sldBoardMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/sld.html?id=" +
      encodeURIComponent(sldBoardMap[id]);
    return;
  }

  // Priority 2: lt_sld.json (drive mapping)
  if(sldLTMap[id]){
    location.href =
      "https://08electricaldata.github.io/drive-viewer/sld3.html?id=" +
      encodeURIComponent(sldLTMap[id]);
    return;
  }

  // If we already know maps exist but not this id, show not found
  const mapsHaveEntries = Object.keys(sldBoardMap).length > 0 || Object.keys(sldLTMap).length > 0;
  if(mapsHaveEntries && !sldBoardMap[id] && !sldLTMap[id]){
    alert("No SLD found for this ID.");
    return;
  }

  // Otherwise load SLD maps on demand
  try{
    await preloadSLD();
    if(sldBoardMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/sld.html?id=" +
        encodeURIComponent(sldBoardMap[id]);
      return;
    }
    if(sldLTMap[id]){
      location.href =
        "https://08electricaldata.github.io/drive-viewer/sld3.html?id=" +
        encodeURIComponent(sldLTMap[id]);
      return;
    }
    alert("No SLD found for this ID.");
  }catch(e){
    alert("Error checking SLD availability");
  }
}

/* ===== PRELOAD DRAWINGS ===== */
async function preloadDrawings(){
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    j.rows.forEach(item=>{
      const id = normalize(item.id);
      if(!id) return;

      const hasDrawing = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      drawingAvailableMap[id] = hasDrawing;
    });
  }catch(e){}
}

/* ===== PRELOAD PLC ===== */
async function preloadPLC(){
  try{
    const j = await (await fetch(PLC_JSON)).json();
    Object.keys(j.drives || {}).forEach(id=>{
      plcAvailableMap[normalize(id)] = true;
    });
  }catch(e){}
}

/* ===== PRELOAD SLDs (robust) ===== */
async function preloadSLD(){
  // Helper to split and normalize tokens from a possibly multiline/compound string
  function extractTokens(value){
    if(!value) return [];
    return String(value)
      .split(/[\n,\/;]+/) // split by newline, comma, slash, semicolon
      .map(t=>t.trim())
      .filter(Boolean)
      .map(t=>normalize(t));
  }

  // 1) Parse boards_sld.json -> map breakerId (from outgoings/incomers/busCouplers/linePT/busPT etc) to boardId
  try{
    const jb = await (await fetch(BOARDS_SLD_JSON)).json();
    const boardsObj = jb.boards || jb.rows || jb;
    // boardsObj might be an object keyed by boardId
    if(boardsObj && typeof boardsObj === "object"){
      Object.keys(boardsObj).forEach(boardKey=>{
        const board = boardsObj[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        // fields that commonly contain breakerId lists
        const arraysToScan = [
          "outgoings", "incomers", "dgIncomers", "emergencyIncomers",
          "busCouplers", "busPT", "linePT", "incomers", "linePT", "busPT",
          "devices", "feeders"
        ];

        arraysToScan.forEach(field=>{
          const arr = board[field];
          if(Array.isArray(arr)){
            arr.forEach(entry=>{
              if(!entry) return;
              // breakerId might be breakerId, breaker, id, or similar
              const possible = entry.breakerId || entry.breaker || entry.id || entry.BREAKERID || "";
              const tokens = extractTokens(possible);
              tokens.forEach(tok => sldBoardMap[tok] = boardId);
            });
          }
        });

        // Some breakerIds may appear in other nested properties or strings; attempt a broad scan:
        // stringify board and look for tokens like SOME-ID patterns (conservative: split words with - and underscores)
        try{
          const txt = JSON.stringify(board);
          // match tokens that look like UPPER-ALNUM sequences with dashes or underscores, e.g., TANKAGE-P-194, US-08EX-...
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              // avoid mapping plain numbers
              if(t.length > 2) sldBoardMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // fail silently
  }

  // 2) Parse lt_sld.json -> boards -> sections -> items -> driveid tokens map to boardId
  try{
    const jl = await (await fetch(LT_SLD_JSON)).json();
    const boards = jl.boards || jl.rows || jl;
    if(boards && typeof boards === "object"){
      // boards may be keyed by boardId
      Object.keys(boards).forEach(boardKey=>{
        const board = boards[boardKey];
        const boardId = board.boardId || board.id || boardKey;
        if(!board) return;

        // sections: object with arrays of items
        const sections = board.sections || board.section || {};
        Object.values(sections).forEach(sectionArr=>{
          if(!Array.isArray(sectionArr)) return;
          sectionArr.forEach(item=>{
            if(!item) return;
            const drv = item.driveid || item.driveId || item.drive || item.DRIVEID || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        });

        // also check devices or feeders arrays
        const devices = board.devices || board.feeders || [];
        if(Array.isArray(devices)){
          devices.forEach(d=>{
            if(!d) return;
            const drv = d.driveid || d.driveId || d.drive || "";
            const tokens = extractTokens(drv);
            tokens.forEach(tok => sldLTMap[tok] = boardId);
          });
        }

        // lastly, scan entire board JSON string for probable drive tokens
        try{
          const txt = JSON.stringify(board);
          const matches = txt.match(/\b[A-Z0-9]+(?:[-_][A-Z0-9]+)+\b/g);
          if(matches && matches.length){
            matches.forEach(m=>{
              const t = normalize(m);
              if(t.length > 2) sldLTMap[t] = boardId;
            });
          }
        }catch(e){}
      });
    }
  }catch(e){
    // fail silently
  }
}

function parseDate(v){
  if(!v) return null;
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const[d,m,y]=v.split("/");
    return new Date(y,m-1,d);
  }
  return new Date(v);
}

function fmt(d){
  if(!d || isNaN(d)) return "NO RECORDS";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* ===== LAST DATES ===== */
async function lastDates(id,map){
  const res={};
  Object.keys(map).forEach(k=>res[k]=null);

  for(const y of HISTORY_YEARS){
    try{
      const j = await (await fetch(HISTORY_BASE + y + ".json")).json();
      j.rows.forEach(r=>{
        if(normalize(`${r[2]}-${r[3]}`) !== id) return;

        const job = normalize(r[7]);
        const d = parseDate(r[4]);

        Object.entries(map).forEach(([k,v])=>{
          if(job === normalize(v) && (!res[k] || d > res[k])) {
            res[k] = d;
          }
        });
      });
    }catch(e){}
  }

  Object.keys(res).forEach(
    k => res[k] = res[k] ? fmt(res[k]) : "NO RECORDS"
  );
  return res;
}

/* ===== LOAD DATA ===== */
async function loadData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  try {
    const j = await (await fetch(DRIVE_JSON)).json();
    const c = j.rows.find(
      r => normalize(`${r[1]}-${r[2]}`) === id
    );

    if(!c){
      content.innerHTML =
        "<div class='card'>Drive data not found… opening history…</div>";

      setTimeout(()=>{
        location.href =
          "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
          encodeURIComponent(id);
      }, 800);

      return;
    }

    const TYPE = normalize(c[1]);

    if(TYPE === "TRANSFORMER") showTransformer(c,id);
    else if(TYPE === "BREAKER") showBreaker(c,id);
    else showMotor(c,id);
  } catch(e) {
    content.innerHTML =
      "<div class='card'>Error loading data. Please refresh the page.</div>";
  }
}

/* ===== APPLY BUTTON STATE ===== */
function applyButtonState(id){
  const drawBtn = document.getElementById("drawBtn");
  const plcBtn = document.getElementById("plcBtn");
  const sldBtn = document.getElementById("sldBtn");

  // Only disable if we explicitly know availability=false (don't disable while unknown)
  if(drawBtn && drawingAvailableMap.hasOwnProperty(id) && !drawingAvailableMap[id]){
    drawBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="🎨 No Drawing Available";
    drawBtn.parentNode.appendChild(badge);
  }

  if(plcBtn && plcAvailableMap.hasOwnProperty(id) && !plcAvailableMap[id]){
    plcBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="⚡ No PLC Address Available";
    plcBtn.parentNode.appendChild(badge);
  }

  if(sldBtn){
    const boardKnown = sldBoardMap.hasOwnProperty(id);
    const ltKnown = sldLTMap.hasOwnProperty(id);
    if(boardKnown || ltKnown){
      const hasBoard = !!sldBoardMap[id];
      const hasLT = !!sldLTMap[id];
      if(!hasBoard && !hasLT){
        sldBtn.disabled = true;
        const badge = document.createElement("div");
        badge.className="badge";
        badge.innerText="🗺️ No LOCATION Available";
        sldBtn.parentNode.appendChild(badge);
      }
    }
  }
}



 function formatDDMMYYYY(v){
  if(!v) return "NO RECORDS";

  const d = new Date(v);
  if(isNaN(d)) return v; // if already formatted text

  const day = String(d.getDate()).padStart(2,"0");
  const month = String(d.getMonth()+1).padStart(2,"0");
  const year = d.getFullYear();

  return `${day}-${month}-${year}`;
}
