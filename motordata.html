<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Details</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7ff;color:#222;}
.top-credit{background:#0d47a1;color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:bold;}
.header{text-align:center;padding:20px;}
.header h2{color:#0d47a1;margin-bottom:5px;}
.header h3{color:#444;font-weight:normal;}
.updated{margin-top:10px;font-size:13px;color:#777;}
.button-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0;}
.button-bar button{background:#0d47a1;color:#fff;border:none;padding:10px 18px;cursor:pointer;border-radius:5px;font-size:15px;}
.button-bar button:hover{background:#1565c0;}
.container{width:95%;max-width:1100px;margin:auto;padding-bottom:30px;}
table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.08);}
th{background:#0d47a1;color:white;padding:12px;}
td{padding:12px;text-align:center;border:1px solid #ddd;}
tr:nth-child(even){background:#f8f9ff;}
.loader{padding:40px;text-align:center;font-size:18px;}
.no-data{padding:30px;text-align:center;color:red;font-size:18px;font-weight:bold;}
@media(max-width:700px){
  table{font-size:13px;}
  .button-bar button{width:100%;}
}
</style>
</head>

<body>
<div class="top-credit">Designed & Maintained by RAKESH CHANDRA SETHY</div>
<div class="container">
<div id="app">
<div class="loader">Loading Motor Details...</div>
</div>
</div>

<script>
const JSON_URL="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

function getID(){ return new URLSearchParams(window.location.search).get("id"); }
function goBack(){ history.back(); }
function goHome(){ window.location.href="https://08electricaldata.github.io/"; }
function goPLC(){ window.location.href="plc.html?id="+encodeURIComponent(getID()); }
function goDrive(){ window.location.href="index.html?id="+encodeURIComponent(getID()); }

async function loadMotor(){
  const app=document.getElementById("app");
  const id=getID();

  if(!id){
    app.innerHTML="<div class='no-data'>No Drive ID supplied.</div>";
    return;
  }

  try{
    const response=await fetch(JSON_URL);
    if(!response.ok) throw new Error("Unable to fetch JSON");

    const data=await response.json();
    let row=null;

    // Search using Equipment Number (Column D = index 3)
    for(const r of data.rows){
      if(String(r[3]||"").trim().toUpperCase()===id.trim().toUpperCase()){
        row=r; break;
      }
    }

    let html=`
    <div class="header">
      <h2>MOTOR DETAILS</h2>
      <h3>${id}</h3>
      <div class="updated">Last Updated : ${new Date(data.updated).toLocaleString("en-GB")}</div>
    </div>
    <div class="button-bar">
      <button onclick="goBack()">⬅ Back</button>
      <button onclick="goHome()">🏠 Home</button>
      <button onclick="goDrive()">Drive Info</button>
      <button onclick="goPLC()">PLC</button>
    </div>
    `;

    if(!row){
      html+=`<div class="no-data">Motor details not found for <b>${id}</b></div>`;
      app.innerHTML=html; return;
    }

    // Main Motor Details
    html+=`
    <table>
      <tr>
        <th>KW</th><th>MAKE</th><th>FRAME SIZE</th>
        <th>RPM</th><th>FLC</th><th>MTG</th>
      </tr>
      <tr>
        <td>${row[5]||""}</td>
        <td>${row[7]||""}</td>
        <td>${row[8]||""}</td>
        <td>${row[9]||""}</td>
        <td>${row[10]||""}</td>
        <td>${row[11]||""}</td>
      </tr>
    </table>
    <br><br>
    <table>
      <tr><th>Last Motor Replacement</th><th>Last Motor PM</th></tr>
      <tr><td>${formatDate(row[37])}</td><td>${formatDate(row[38])}</td></tr>
    </table>
    <br><br>
    <h2 style="text-align:center;color:#0d47a1;">Spare Motor Details</h2>
    <table>
      <tr>
        <th>Sl No.</th>
        <th>W/O number</th>
        <th>KW</th>
        <th>MAKE</th>
        <th>FRAME</th>
        <th>RPM</th>
        <th>MTG</th>
        <th>DRIVE</th>
        <th>LOCATION</th>
      </tr>
    `;

    const spareData=(row[24]||"").trim();
    if(spareData){
      const spareList=spareData.split(",");
      spareList.forEach((item,index)=>{
        const parts=item.trim().split("!");
        html+=`<tr><td>${index+1}</td>`;
        for(let i=0;i<8;i++){
          html+=`<td>${parts[i]?parts[i].trim():""}</td>`;
        }
        html+="</tr>";
      });
    } else {
      html+=`<tr><td colspan="9">No Spare Motor Details Available</td></tr>`;
    }

    html+="</table>";
    // ================= Pending Motors at ERS =================

html += `
<br><br>

<h2 style="text-align:center;color:#0d47a1;">
Pending Motors at ERS
</h2>

<table>
<tr>
<th>Sl No.</th>
<th>W/O Number</th>
<th>KW</th>
<th>MAKE</th>
<th>FRAME</th>
<th>RPM</th>
<th>MTG</th>
<th>DRIVE</th>
<th>LOCATION</th>
</tr>
`;

const pendingData = (row[26] || "").trim();

if (pendingData) {

    const pendingList = pendingData.split(",");

    pendingList.forEach((item, index) => {

        const parts = item.trim().split("!");

        html += `<tr>
<td>${index + 1}</td>
<td>${parts[0] ? parts[0].trim() : ""}</td>
<td>${parts[1] ? parts[1].trim() : ""}</td>
<td>${parts[2] ? parts[2].trim() : ""}</td>
<td>${parts[3] ? parts[3].trim() : ""}</td>
<td>${parts[4] ? parts[4].trim() : ""}</td>
<td>${parts[5] ? parts[5].trim() : ""}</td>
<td>${parts[6] ? parts[6].trim() : ""}</td>
<td>${parts[7] ? parts[7].trim() : ""}</td>
</tr>`;

    });

} else {

    html += `
<tr>
<td colspan="9">No Pending Motors Available</td>
</tr>
`;

}

html += "</table>";
    app.innerHTML=html;

  } catch(err){
    console.error(err);
    app.innerHTML=`<div class="no-data">Unable to load Motor Details.<br><br>${err.message}</div>`;
  }
}

function formatDate(v){
  if(!v) return "N/A";
  const d=new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString("en-GB");
}

loadMotor();
</script>
</body>
</html>
