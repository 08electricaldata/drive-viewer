<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motor Master List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f2f6ff;
}

/* ===== HEADER ===== */
.header-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #003f88;
  color: white;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  flex-wrap: wrap;
}

.header-bar button {
  background: white;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
}

.header-title {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

.version-info {
  background: rgba(255,255,255,0.2);
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.status-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
  margin-right: 4px;
}

/* ===== CONTENT ===== */
.container {
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  padding: 15px;
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.controls button {
  padding: 8px 14px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px 8px;
}

/* STICKY HEADERS */
thead tr:nth-child(1) th {
  position: sticky;
  top: 56px;
  background: #003f88;
  color: white;
  z-index: 20;
}
thead tr:nth-child(2) th {
  position: sticky;
  top: 92px;
  background: #eaf1ff;
  z-index: 15;
}

tr:hover {
  background: #eef5ff;
  cursor: pointer;
}

.filter-row input {
  width: 100%;
  padding: 4px;
  font-size: 12px;
}

.section-row {
  background: #dbe9ff !important;
  font-weight: 600;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media print {
  .header-bar, .controls, .filter-row { display: none; }
}
</style>
</head>

<body>

<div class="header-bar">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">⬅ Back</button>
  <button onclick="openMotorOH()">🛠️ Motor O/H Data</button>
  <button onclick="openMotorPM()">🧾 Motor PM Status</button>
  <div class="header-title">MOTOR MASTER LIST</div>
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</div>

<div class="container">
  <div class="card">

    <div class="controls">
      <button onclick="exportExcel()">📄 Export Excel</button>
      <button onclick="window.print()">🖨 Export PDF</button>
    </div>

    <table id="motorTable">
      <thead>
        <tr id="headerRow"></tr>
        <tr class="filter-row" id="filterRow"></tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>
</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING SETUP ===== */
const VERSION_URL = 'https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json';
const BASE_JSON_URL = 'https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/motors.json';
const AUTO_RELOAD_INTERVAL = 5 * 60 * 1000; // 5 minutes

let currentVersion = '1.0.0';

// Build URL with version parameter for cache busting
function buildDataUrl() {
  return `${BASE_JSON_URL}?v=${currentVersion}`;
}

const versionDisplayEl = document.getElementById("versionDisplay");

/* Get latest version from version.json */
async function getVersion(){
  try {
    const res = await fetch(VERSION_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('Version fetch failed');
    const data = await res.json();
    currentVersion = data.version || '1.0.0';
    versionDisplayEl.textContent = currentVersion;
    console.log('Loaded version:', currentVersion);
  } catch(err) {
    console.warn('Failed to fetch version, using default:', err);
    currentVersion = '1.0.0';
    versionDisplayEl.textContent = currentVersion;
  }
}

async function loadMotors() {
  try {
    const url = buildDataUrl();
    console.log('Fetching from:', url);
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();

    const headers = data.headers;
    const rows = data.rows;

    const headerRow = document.getElementById("headerRow");
    const filterRow = document.getElementById("filterRow");
    const tbody = document.querySelector("#motorTable tbody");

    headerRow.innerHTML = "";
    filterRow.innerHTML = "";
    tbody.innerHTML = "";

    /* ===== HEADERS ===== */
    headers.forEach(h => {
      const th = document.createElement("th");
      th.textContent = h;
      headerRow.appendChild(th);

      const fh = document.createElement("th");
      fh.innerHTML = "<input placeholder='🔍'>";
      filterRow.appendChild(fh);
    });

    /* ===== DATA ===== */
    rows.forEach(r => {
      if (!r[1]) return;

      const tr = document.createElement("tr");
      if (!r[0]) tr.classList.add("section-row");

      r.forEach(v => {
        const td = document.createElement("td");
        td.textContent = v ?? "";
        tr.appendChild(td);
      });

      tr.onclick = () => {
        const id = r[1] + "-" + r[2];
        window.location.href =
          "https://08electricaldata.github.io/drive-viewer/index2.html?id=" +
          encodeURIComponent(id);
      };

      tbody.appendChild(tr);
    });

    setupFilters();
  } catch(err) {
    console.error("Error loading motor data:", err);
    document.querySelector("#motorTable tbody").innerHTML =
      "<tr><td colspan='10' style='text-align:center;color:red;'>Error loading motor data. Please refresh the page.</td></tr>";
  }
}

function setupFilters() {
  document.querySelectorAll(".filter-row input")
    .forEach((input, idx) => {
      input.addEventListener("keyup", () => {
        const q = input.value.toLowerCase();
        document.querySelectorAll("#motorTable tbody tr")
          .forEach(tr => {
            const cell = tr.children[idx];
            tr.style.display =
              cell.innerText.toLowerCase().includes(q) ? "" : "none";
          });
      });
    });
}

function exportExcel() {
  let csv = [];
  document.querySelectorAll("#motorTable tr").forEach(row => {
    csv.push([...row.children].map(td =>
      `"${td.innerText.replace(/"/g,'""')}"`
    ).join(","));
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv.join("\n")]));
  a.download = "motor_master_list.csv";
  a.click();
}

function goHome() {
  window.location.href = "https://08electricaldata.github.io/";
}
function goBack() {
  history.back();
}

/* ✅ NEW BUTTON FUNCTIONS */
function openMotorOH(){
  window.location.href="https://08electricaldata.github.io/drive-viewer/motoroh.html";
}
function openMotorPM(){
  window.location.href="https://08electricaldata.github.io/drive-viewer/motorpm.html";
}

/* Initialize: fetch version first, then load data */
async function init(){
  await getVersion();
  await loadMotors();
  
  // Auto-reload every 5 minutes
  setInterval(async () => {
    console.log('Auto-refreshing motor data...');
    await getVersion();
    await loadMotors();
  }, AUTO_RELOAD_INTERVAL);
}

// Start initialization
init();
</script>

</body>
</html>
