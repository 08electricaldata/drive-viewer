<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>08 Area — Motors Compact</title>
<style>
  :root{--brand:#0d47a1;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eef7ff,#f7fbff);color:#082033}
  header{position:sticky;top:0;background:linear-gradient(90deg,var(--brand),#0052cc);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;z-index:20}
  .btn{background:#fff;color:var(--brand);border:0;padding:8px 10px;border-radius:10px;font-weight:800;cursor:pointer;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}
  .title{flex:1;text-align:center;font-weight:800}
  main{padding:12px;max-width:980px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 10px 30px rgba(3,63,136,0.06);overflow:hidden}
  .row{display:flex;flex-direction:column;gap:8px}
  .row-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .row-left{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
  .label{font-weight:800;color:var(--brand);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--muted)}
  .compact{font-size:13px;color:#123;line-height:1.3}
  .expand{font-size:13px;color:#0b3b74;margin-top:6px;background:#fbfdff;padding:8px;border-radius:8px;border:1px solid #e6f4ff}
  .toggle{background:transparent;border:0;color:var(--brand);font-weight:800;cursor:pointer}
  .no-data{padding:18px;text-align:center;color:#b91c1c;font-weight:800}
  .spinner{padding:18px;text-align:center;color:var(--muted);font-weight:700}
  details summary{cursor:pointer;outline:none}
  @media(min-width:720px){
    .row{flex-direction:row;align-items:center}
    .compact{font-size:14px}
  }
</style>
</head>
<body>

<header role="banner">
  <button class="btn" onclick="history.back()" aria-label="Back">⬅</button>
  <div class="title">08 Area — Motors Compact</div>
  <button class="btn" onclick="location.href='https://08electricaldata.github.io/index_mob.html'" aria-label="Home">🏠</button>
</header>

<main id="app" role="main">
  <div class="spinner">Loading data…</div>
</main>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";
// D..N indices (0-based): D=3 .. N=13
const START = 3;
const END = 13;

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="spinner">Loading data…</div>';
  try{
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('Fetch failed: ' + res.status);
    const data = await res.json();

    const headers = data.headers || [];
    const rows = data.rows || [];

    // Check if any header equals "No motors found" (case-insensitive)
    const hasNoMotorsHeader = headers.some(h => String(h||'').trim().toLowerCase() === 'no motors found');

    if(!hasNoMotorsHeader){
      // still allow rendering list but indicate nothing matched
      app.innerHTML = '<div class="no-data">No "No motors found" header detected — nothing to compactly show.</div>';
      return;
    }

    // Build UI list
    const list = document.createElement('div');

    // iterate rows and create compact display for those with data in D..N or row[3] present
    let anyShown = false;
    rows.forEach((r, idx) => {
      // skip empty rows (no equipment)
      const equip = r[3] || r[2] || '';
      if(!equip || String(equip).trim() === '') return;

      // Build compact items from indices 3..13
      const parts = [];
      for(let i=START;i<=END;i++){
        const label = headers[i] ? String(headers[i]).trim() : ('col'+i);
        const val = r[i];
        if(val !== undefined && val !== null && String(val).trim() !== ''){
          parts.push(`${label.replace(/\s+/g,' ')} - ${String(val).trim()}`);
        }
      }

      // If nothing in D..N, skip
      if(parts.length === 0) return;

      anyShown = true;
      const card = document.createElement('section');
      card.className = 'card';
      // head: equip title left, toggle right
      const head = document.createElement('div');
      head.className = 'row-head';

      const left = document.createElement('div');
      left.className = 'row-left';
      left.innerHTML = `<div class="label">${escapeHtml(String(equip))}</div>
                        <div class="sub">${escapeHtml(String(r[4]||'')).slice(0,80)}</div>`;

      const rightBtn = document.createElement('div');
      rightBtn.innerHTML = `<button class="toggle" aria-expanded="false">SHOW</button>`;

      head.appendChild(left);
      head.appendChild(rightBtn);
      card.appendChild(head);

      const compact = document.createElement('div');
      compact.className = 'compact';
      compact.textContent = parts.join(' , ');

      card.appendChild(compact);

      // expand area with full row details (spare/pending etc)
      const expand = document.createElement('div');
      expand.className = 'expand';
      expand.style.display = 'none';
      // Construct table of label:value for indices 0..headers.length-1
      let detailsHtml = '<dl style="display:grid;grid-template-columns:1fr 2fr;gap:6px">';
      for(let i=0;i<headers.length;i++){
        const h = headers[i] || ('col'+i);
        const v = r[i] === undefined || r[i] === null ? '' : String(r[i]);
        if(String(v).trim() === '') continue;
        detailsHtml += `<dt style="font-weight:800;color:#0d47a1;padding:6px">${escapeHtml(h)}</dt><dd style="padding:6px">${escapeHtml(v)}</dd>`;
      }
      detailsHtml += '</dl>';
      expand.innerHTML = detailsHtml;
      card.appendChild(expand);

      // wire toggle
      const btn = rightBtn.querySelector('button');
      btn.addEventListener('click', ()=>{
        const open = expand.style.display === 'block';
        expand.style.display = open ? 'none' : 'block';
        btn.textContent = open ? 'SHOW' : 'HIDE';
        btn.setAttribute('aria-expanded', String(!open));
      });

      // clicking entire card toggles as well (but avoid toggling when pressing links)
      card.addEventListener('click', (ev)=>{
        // ignore clicks on the toggle button itself
        if(ev.target.tagName.toLowerCase() === 'button') return;
        // toggle
        const open = expand.style.display === 'block';
        expand.style.display = open ? 'none' : 'block';
        btn.textContent = open ? 'SHOW' : 'HIDE';
        btn.setAttribute('aria-expanded', String(!open));
      });

      list.appendChild(card);
    });

    if(!anyShown){
      app.innerHTML = '<div class="no-data">No equipment rows with D→N data found.</div>';
      return;
    }

    app.innerHTML = '';
    app.appendChild(list);

  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="no-data">Failed to load data: ${escapeHtml(err.message||String(err))}</div>`;
  }
}

init();
</script>
</body>
</html>
