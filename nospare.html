<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>08 Area — "No motors found" Column</title>
<style>
  :root{--brand:#0d47a1;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eef7ff,#f7fbff);color:#082033}
  header{position:sticky;top:0;background:linear-gradient(90deg,var(--brand),#0052cc);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;z-index:20}
  .btn{background:#fff;color:var(--brand);border:0;padding:8px 10px;border-radius:10px;font-weight:800;cursor:pointer;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}
  .title{flex:1;text-align:center;font-weight:800}
  main{padding:12px;max-width:980px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 10px 30px rgba(3,63,136,0.06)}
  .row-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .label{font-weight:800;color:var(--brand);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .value{margin-top:8px;font-size:13px;color:#123;line-height:1.35}
  .list{margin-top:8px;padding-left:16px}
  .no-data{padding:18px;text-align:center;color:#b91c1c;font-weight:800}
  .spinner{padding:18px;text-align:center;color:var(--muted);font-weight:700}
  .toggle{background:transparent;border:0;color:var(--brand);font-weight:800;cursor:pointer}
  details summary{cursor:pointer;outline:none}
  @media(min-width:720px){ .card{padding:12px} }
</style>
</head>
<body>

<header role="banner">
  <button class="btn" onclick="history.back()" aria-label="Back">⬅</button>
  <div class="title">08 Area — "No motors found" Column</div>
  <button class="btn" onclick="location.href='https://08electricaldata.github.io/index_mob.html'" aria-label="Home">🏠</button>
</header>

<main id="app" role="main">
  <div class="spinner">Loading data…</div>
</main>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

/* helpers */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="spinner">Loading data…</div>';
  try{
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const data = await res.json();
    const headers = data.headers || [];
    const rows = data.rows || [];

    // find all header indices whose text is "No motors found" (case-insensitive, trimmed)
    const noMotorIndices = [];
    headers.forEach((h,i)=>{
      if(String(h||'').trim().toLowerCase() === 'no motors found'){
        noMotorIndices.push(i);
      }
    });

    if(noMotorIndices.length === 0){
      app.innerHTML = '<div class="no-data">No header titled "No motors found" was found in the JSON.</div>';
      return;
    }

    // Build UI showing only those column values for each equipment row
    const container = document.createElement('div');
    let anyShown = false;

    rows.forEach(r=>{
      // pick equipment identifier (prefer column 3 (D) or 2)
      const equip = r[3] || r[2] || '';
      if(!String(equip).trim()) return;

      // collect values from the noMotorIndices
      const vals = [];
      noMotorIndices.forEach(idx=>{
        const v = r[idx];
        if(v !== undefined && v !== null && String(v).trim() !== ''){
          vals.push({ idx, val: String(v).trim() });
        }
      });

      if(vals.length === 0) return; // nothing to show for this row

      anyShown = true;
      const card = document.createElement('section');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'row-head';
      head.innerHTML = `<div style="min-width:0"><div class="label">${esc(String(equip))}</div><div class="sub">${esc(String(r[4]||'')).slice(0,90)}</div></div>
                        <div><button class="toggle" aria-expanded="false">SHOW</button></div>`;
      card.appendChild(head);

      // For each no-motors column show its raw value; if it contains '@' split into items
      const content = document.createElement('div');
      content.className = 'value';
      vals.forEach(item=>{
        const headerLabel = headers[item.idx] ? headers[item.idx] : ('col'+item.idx);
        const raw = item.val;
        // if looks like list separated by '@', show as list items
        if(raw.includes('@') && raw.split('@').length > 1){
          const parts = raw.split('@').map(s=>s.trim()).filter(Boolean);
          const section = document.createElement('div');
          section.innerHTML = `<strong>${esc(headerLabel)} (col ${item.idx}):</strong>`;
          const ul = document.createElement('ul');
          ul.className = 'list';
          parts.forEach(p=>{
            const li = document.createElement('li');
            li.innerHTML = esc(p);
            ul.appendChild(li);
          });
          section.appendChild(ul);
          content.appendChild(section);
        } else {
          const p = document.createElement('div');
          p.innerHTML = `<strong>${esc(headerLabel)} (col ${item.idx}):</strong> ${esc(raw)}`;
          content.appendChild(p);
        }
      });

      // full details toggle (optional) - show full row when expanded
      const details = document.createElement('details');
      details.style.marginTop = '8px';
      const summary = document.createElement('summary');
      summary.textContent = 'Show full row details';
      details.appendChild(summary);

      const full = document.createElement('div');
      full.style.marginTop = '6px';
      full.innerHTML = buildFullDetailsHTML(headers, r);
      details.appendChild(full);

      content.appendChild(details);
      content.style.display = 'none';
      card.appendChild(content);

      // wire toggle button
      const toggle = head.querySelector('button.toggle');
      toggle.addEventListener('click', ()=>{
        const open = content.style.display === 'block';
        content.style.display = open ? 'none' : 'block';
        toggle.textContent = open ? 'SHOW' : 'HIDE';
        toggle.setAttribute('aria-expanded', String(!open));
      });

      container.appendChild(card);
    });

    if(!anyShown){
      app.innerHTML = '<div class="no-data">No rows had values in the "No motors found" column(s).</div>';
      return;
    }

    app.innerHTML = '';
    app.appendChild(container);

  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="no-data">Failed to load data: ${esc(err.message || String(err))}</div>`;
  }
}

function buildFullDetailsHTML(headers, row){
  let html = '<dl style="display:grid;grid-template-columns:1fr 2fr;gap:6px">';
  for(let i=0;i<headers.length;i++){
    const h = headers[i] || ('col'+i);
    const v = row[i] === undefined || row[i] === null ? '' : String(row[i]);
    if(String(v).trim() === '') continue;
    html += `<dt style="font-weight:800;color:var(--brand);padding:6px">${esc(h)}</dt><dd style="padding:6px">${esc(v)}</dd>`;
  }
  html += '</dl>';
  return html;
}

init();
</script>
</body>
</html>
