<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pending Dashboard — Problems column & nowrap other columns</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#f4f7ff;}

/* HEADER */
.header{
  background:#003f88;
  color:#fff;
  padding:15px 10px;
}

.header-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.header-center{
  text-align:center;
  flex:1;
}

.header-center h1{
  margin:0;
  font-size:22px;
}

.header-center p{
  margin:3px 0 0;
  font-size:13px;
  font-weight:normal;
}

.header-btn{
  background:#fff;
  color:#003f88;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
  margin:3px;
}

.controls{
  padding:15px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

select,input,button{
  padding:7px 10px;
  font-size:14px;
}

.summary{
  display:flex;
  gap:15px;
  justify-content:center;
  padding:10px;
  flex-wrap:wrap;
}

.card{
  background:#fff;
  padding:12px 18px;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
  text-align:center;
  min-width:130px;
}

.card h3{margin:0;font-size:18px;}

.table-wrapper{
  padding:10px;
  overflow:auto;
  max-height:60vh;
}

/* table */
table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
  table-layout: auto; /* let columns size to content */
  min-width:100%;
}

th,td{
  border:1px solid #ccc;
  padding:8px 10px;
  /* default: do NOT wrap - keep all columns single-line */
  white-space:nowrap;
  text-align:left;
  font-size:13px;
  vertical-align:top;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Allow Problems column to wrap */
th[data-col="Problems"],
td[data-col="Problems"]{
  white-space:normal;           /* allow wrapping only here */
  word-break:break-word;
  overflow-wrap:anywhere;
  text-overflow:clip;
  max-width:360px;              /* optional maximum width so wrapping happens; adjust as needed */
}

/* header style */
th{
  background:#003f88;
  color:#fff;
  position:sticky;
  top:0;
  z-index:2;
  text-align:left;
}

/* Priority styles (keep from original) */
.priority-1{background:#ff4d4d;color:#fff;}
.priority-2{background:#ff9933;color:#fff;}
.priority-3{background:#ffcc00;color:#000;}
.priority-4{background:#66cc66;color:#000;}

.badge{
  padding:4px 8px;
  border-radius:4px;
  color:#fff;
  font-weight:bold;
}

.completed{background:#28a745;}

/* Responsive tweaks */
@media (max-width:720px){
  th, td { padding:6px 8px; font-size:13px; }
  .controls{padding:8px;}
  .summary{padding:8px;}
  /* keep Problems wrapping the only column that can expand vertically */
  th[data-col="Problems"], td[data-col="Problems"] { max-width:260px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-bar">

    <div>
      <button class="header-btn" onclick="history.back()">⬅ Back</button>
      <button class="header-btn" onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
      <button class="header-btn" onclick="location.href='https://08electricaldata.github.io/drive-viewer/ersmasterdata.html'">🗂️ ERS Master</button>
    </div>

    <div class="header-center">
      <h1>Rewinding / Overhauling Dashboard</h1>
      <p>Designed and maintained by Rakesh Chandra Sethi</p>
    </div>

    <div></div>

  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <select id="typeSelect">
    <option value="rewinding">Rewinding</option>
    <option value="overhauling">Overhauling</option>
    <option value="scrap">SCRAP</option>
  </select>
  <input type="text" id="searchBox" placeholder="Search...">
  <button onclick="exportCSV()">Export Excel</button>
</div>

<!-- SUMMARY -->
<div class="summary">
  <div class="card"><h3 id="totalCount">0</h3><span>Total</span></div>
  <div class="card"><h3 id="highCount">0</h3><span>High Priority</span></div>
  <div class="card"><h3 id="mediumCount">0</h3><span>Medium</span></div>
  <div class="card"><h3 id="lowCount">0</h3><span>Low</span></div>
  <div class="card"><h3 id="noPriorityCount">0</h3><span>No Priority</span></div>
</div>

<div class="section-title">Priority Assigned</div>
<div class="table-wrapper">
  <table id="priorityTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<div class="section-title">No Priority Assigned</div>
<div class="table-wrapper">
  <table id="noPriorityTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const JSON_FILES={
  rewinding:"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/rewinding.json",
  overhauling:"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/overhauling.json",
  scrap:"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/scrap.json"
};

let currentData=[];
let headers=[];
let priorityKey=""; // actual JSON key used for priority
let currentType = 'rewinding'; // track selected type

const select=document.getElementById("typeSelect");
const searchBox=document.getElementById("searchBox");

/* Desired visible columns (display order)
   "Problems" will display but the script will try to match data using "Motor Location Update On" */
const desiredDisplayCols = [
  "PRIORITY",
  "W.O No",
  "kW",
  "Make",
  "Frame Size",
  "Mounting",
  "RPM",
  "Sl No",
  "Equipment details",
  "Problems",                 /* visible caption - maps to JSON key for Motor Location Update On */
  "Job Completion Dat"        /* keep as in previous code to match your JSON */
];

/* Columns to explicitly exclude if present */
const excludedNames = ["voltage","area","storage","remarks"];

/* helper to normalize header strings for matching */
function normalize(s){
  return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
}

async function loadData(type){
  currentType = type; // set current selection type
  try{
    const res=await fetch(JSON_FILES[type]);
    const json=await res.json();
    currentData = json.data || [];
    if(currentData.length === 0){
      headers = [];
      priorityKey = "";
      render();
      return;
    }
    headers = Object.keys(currentData[0]||{});
    // find priority key by matching desired 'PRIORITY'
    priorityKey = findKeyMatch("PRIORITY") || headers[0] || "";
  }catch(err){
    console.error(err);
    currentData = [];
    headers = [];
    priorityKey = "";
  }
  render();
}

/* find the actual header key from headers by matching a display label */
function findKeyMatch(displayName){
  const n = normalize(displayName);
  // exact normalized match
  for(const h of headers){
    if(normalize(h) === n) return h;
  }
  // contains match (normalized)
  for(const h of headers){
    if(normalize(h).includes(n) || n.includes(normalize(h))) return h;
  }
  // fuzzy: match word-by-word
  const tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  for(const h of headers){
    const hn = normalize(h);
    if(tokens.every(t=>hn.includes(t))) return h;
  }
  return null;
}

/* Build the ordered list of actual JSON keys to render (matching desiredDisplayCols)
   For the "Problems" display label we attempt to match JSON keys related to Motor Location Update On.
   For SCRAP only: override "Job Completion Dat" to use column L (headers[11]) if available.
*/
function buildOrderedKeys(){
  const orderedKeys = [];
  for(const display of desiredDisplayCols){
    // special-case: Job Completion Dat -> use column L for SCRAP only
    if(display.toLowerCase() === "job completion dat" && currentType === 'scrap'){
      // column L is index 11 (0-based). If headers array long enough, use it.
      if(headers && headers.length > 11 && headers[11]) {
        orderedKeys.push(headers[11]);
        continue;
      } else {
        // fallback to normal matching
        orderedKeys.push(findKeyMatch(display) || null);
        continue;
      }
    }

    if(display.toLowerCase() === "problems"){
      const candidateNames = [
        "Motor Location Update On",
        "Motor Location Update",
        "Motor Location",
        "Motor Location Updated On",
        "motorlocationupdateon",
        "problem",
        "problems",
        "issue",
        "description"
      ];
      let found = null;
      for(const c of candidateNames){
        found = findKeyMatch(c);
        if(found) break;
      }
      orderedKeys.push(found || findKeyMatch(display) || null);
      continue;
    }
    orderedKeys.push(findKeyMatch(display) || null);
  }
  // remove any keys that match excludedNames
  return orderedKeys.map(k => {
    if(!k) return k;
    const kn = normalize(k);
    for(const ex of excludedNames){
      if(kn.includes(ex)) return null;
    }
    return k;
  });
}

function render(){
  const q = (searchBox.value || "").toLowerCase();
  const filtered = currentData.filter(r => {
    return Object.values(r).join(" ").toLowerCase().includes(q);
  });

  // build ordered keys from desired mapping
  const mappedOrderedKeys = buildOrderedKeys();

  // If none of desiredDisplayCols matched (all null), fallback to using actual headers (after applying excludedNames)
  const allNull = mappedOrderedKeys.every(k => k === null);

  let keysForTable = [];
  let labelsForTable = [];

  if(allNull){
    // use actual headers, excluding excludedNames
    keysForTable = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    labelsForTable = keysForTable.slice(); // show actual header names as labels
  } else {
    // build lists based on desiredDisplayCols order, skipping nulls
    for(let i=0;i<desiredDisplayCols.length;i++){
      const key = mappedOrderedKeys[i];
      if(key === null) continue;
      keysForTable.push(key);
      labelsForTable.push(desiredDisplayCols[i]);
    }
  }

  const withPriority = [];
  const withoutPriority = [];

  filtered.forEach(r=>{
    const pVal = priorityKey ? (r[priorityKey] ?? "") : "";
    if(pVal || pVal === 0 || pVal === "0" || pVal === "0.0") {
      if(String(pVal).trim() !== "") withPriority.push(r);
      else withoutPriority.push(r);
    } else {
      withoutPriority.push(r);
    }
  });

  // if priorityKey exists, try numeric sort
  if(priorityKey){
    withPriority.sort((a,b)=>{
      const aa = Number(a[priorityKey]) || 9999;
      const bb = Number(b[priorityKey]) || 9999;
      return aa - bb;
    });
  }

  // Render using keysForTable + labelsForTable
  buildTable("priorityTable", withPriority, keysForTable, labelsForTable);
  buildTable("noPriorityTable", withoutPriority, keysForTable, labelsForTable);
  updateCards(withPriority, withoutPriority);
}

/*
  buildTable(id, data, keys, labels)
  - keys: array of JSON keys to show (actual keys from JSON)
  - labels: array of display labels for each column (same length as keys)
*/
function buildTable(id, data, keys, labels){
  const table = document.getElementById(id);
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");

  if(!data || data.length===0){
    thead.innerHTML = "";
    tbody.innerHTML = "<tr><td style='padding:12px'>No Data</td></tr>";
    return;
  }

  // Build header row using provided labels
  let head = "<tr>";
  for(let i=0;i<keys.length;i++){
    const display = labels[i] || keys[i];
    head += `<th data-col="${escapeHtml(display)}">${escapeHtml(display)}</th>`;
  }
  head += "</tr>";
  thead.innerHTML = head;

  // build rows
  tbody.innerHTML = "";
  data.forEach(row=>{
    let tr = "<tr>";
    for(let i=0;i<keys.length;i++){
      const key = keys[i];
      let val = row[key] ?? "";
      if(priorityKey && key === priorityKey){
        let cls = "";
        const num = Number(val);
        if(!isNaN(num) && num >= 1 && num <= 4) cls = `priority-${num}`;
        tr += `<td data-col="${escapeHtml(key)}" class="${cls}">${escapeHtml(val)}</td>`;
      } else if(String(val).toUpperCase().includes("COMPLETED")){
        tr += `<td data-col="${escapeHtml(key)}"><span class="badge completed">${escapeHtml(val)}</span></td>`;
      } else {
        // if the header looks like problems/issue/description, mark for wrapping
        const normalizedHeader = normalize(labels[i] || key);
        if(/problem|issue|description|motorlocation|remarks|comment/.test(normalizedHeader)){
          tr += `<td data-col="Problems">${escapeHtml(val)}</td>`;
        } else {
          tr += `<td data-col="${escapeHtml(key)}">${escapeHtml(val)}</td>`;
        }
      }
    }
    tr += "</tr>";
    tbody.insertAdjacentHTML("beforeend", tr);
  });
}

function updateCards(withP, withoutP){
  let high=0, med=0, low=0;
  withP.forEach(r=>{
    const p = priorityKey ? Number(r[priorityKey]) : NaN;
    if(p === 1) high++;
    else if(p === 2) med++;
    else if(!isNaN(p)) low++;
  });

  document.getElementById("totalCount").innerText = withP.length + withoutP.length;
  document.getElementById("highCount").innerText = high;
  document.getElementById("mediumCount").innerText = med;
  document.getElementById("lowCount").innerText = low;
  document.getElementById("noPriorityCount").innerText = withoutP.length;
}

function exportCSV(){
  // Build export using same fallback logic as render()
  const mappedOrderedKeys = buildOrderedKeys();
  const allNull = mappedOrderedKeys.every(k => k === null);

  let exportKeys = [];
  let exportLabels = [];

  if(allNull){
    exportKeys = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    exportLabels = exportKeys.slice();
  } else {
    for(let i=0;i<desiredDisplayCols.length;i++){
      const key = mappedOrderedKeys[i];
      if(key === null) continue;
      exportKeys.push(key);
      exportLabels.push(desiredDisplayCols[i]);
    }
  }

  const visibleDisplays = exportLabels;
  const visibleKeys = exportKeys;

  let csv = visibleDisplays.join(",") + "\n";
  currentData.forEach(r=>{
    const row = visibleKeys.map(k => `"${escapeCSV(String(r[k] ?? ""))}"`).join(",");
    csv += row + "\n";
  });

  const blob = new Blob([csv], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pending_data_filtered.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeCSV(s){
  return s.replace(/"/g,'""');
}

select.addEventListener("change",()=>loadData(select.value));
searchBox.addEventListener("keyup",render);

// initial load
loadData(select.value);
</script>

</body>
</html>
