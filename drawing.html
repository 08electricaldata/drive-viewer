<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Drawings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#f2f6ff}

/* HEADER */
.header{
  background:#003f88;
  color:white;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.header-title{
  flex:1;
  text-align:center;
  min-width:300px;
}

.header-title h2{
  margin:0;
}

.header-title small{
  display:block;
  font-size:14px;
  font-weight:500;
  opacity:.9;
}

/* HEADER BUTTONS */
.header-btn{
  background:white;
  color:#003f88;
  border:1px solid #003f88;
  border-radius:6px;
  padding:6px 10px;
  cursor:pointer;
  font-weight:bold;
  transition:transform .14s ease, box-shadow .14s ease;
}
.header-btn:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,63,136,0.2)}

.version-info {
  background:rgba(255,255,255,0.2); color:white;
  padding:6px 10px; border-radius:6px;
  font-size:12px; font-weight:bold;
}

.status-indicator {
  display:inline-block; width:8px; height:8px;
  border-radius:50%; background:#4caf50;
  margin-right:4px; animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}

.container{padding:20px}

.card{
  background:white;padding:20px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.15)
}

/* GROUP TITLE */
.group-title{
  margin-top:25px;
  font-weight:bold;
  color:#003f88;
  font-size:18px;
  border-bottom:2px solid #003f88;
  padding-bottom:5px
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
  margin-top:15px
}

/* TILE */
.tile{
  background:#f8fbff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
  cursor:pointer;
  text-align:center;
  transition:.2s;
  animation:fade-in 0.3s ease-out;
}
@keyframes fade-in { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
.tile:hover{transform:scale(1.03)}

.tile img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:8px;
  background:#e0e7ff;
}

.tile h4{
  margin:5px 0;
  font-size:14px;
  color:#003f88
}

.tile small{
  font-size:12px;color:#666
}

/* VIEWER */
.viewer{
  margin-top:30px;
  height:650px;
  border:1px solid #ccc;
  border-radius:10px;
  overflow:hidden;
  display:none;
  position:relative;
  animation:slide-up 0.3s ease-out;
}
@keyframes slide-up { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
.viewer iframe{
  width:100%;
  height:100%;
  border:none;
  background:#fff;
}

/* CONTROLS */
.viewer-controls{
  margin-top:10px;
  text-align:right
}
.viewer-controls button{
  padding:8px 14px;
  border:none;
  background:#003f88;
  color:white;
  border-radius:6px;
  cursor:pointer;
  margin-left:8px;
  transition:transform .14s ease, box-shadow .14s ease;
}
.viewer-controls button:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,63,136,0.2)}

/* FULLSCREEN */
.viewer.fullscreen{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  z-index:9999;
  background:white;
  border-radius:0
}

.no-data{
  color:red;
  text-align:center;
  font-weight:bold
}

.loading-spinner {
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#003f88;
  animation:pulse 1.5s infinite;
}

@media(max-width:768px){
  .viewer{height:450px}
}
</style>
</head>

<body>

<!-- UPDATED HEADER -->
<div class="header">
  <button class="header-btn" onclick="goHome()">🏠 Home</button>
  <button class="header-btn" onclick="goBack()">⬅ Back</button>
  <button class="header-btn" onclick="goDriveInfo()">ℹ️ Drive Info</button>
  <button class="header-btn" onclick="goHistory()">📜 History</button>
  <button class="header-btn" onclick="goPLC()">⚡ PLC-ADD</button>

  <div class="header-title">
    <h2>Equipment Drawings</h2>
    <small>Designed and maintained by Rakesh Chandra Sethy</small>
  </div>
  
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</div>

<div class="container">
  <div id="content">Loading drawings…</div>
</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING ===== */
const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
const JSON_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drawings/drawings.json";

let currentVersion = "1.0.0";
const versionDisplayEl = document.getElementById("versionDisplay");

/* FETCH VERSION FOR CACHE BUSTING */
async function getVersion() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    currentVersion = data.version || "1.0.0";
    versionDisplayEl.textContent = currentVersion;
    console.log("✓ Version loaded:", currentVersion);
  } catch (err) {
    console.warn("Failed to load version file:", err);
    currentVersion = "1.0.0";
    versionDisplayEl.textContent = currentVersion;
  }
}

/* BUILD URLS WITH VERSION PARAM AND TIMESTAMP */
function buildUrl(baseUrl) {
  return `${baseUrl}?v=${currentVersion}&t=${Date.now()}`;
}

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v||"").toUpperCase().trim();
}

/* ===== NAVIGATION ===== */
function goHome(){
  location.href="https://08electricaldata.github.io/";
}
function goBack(){
  history.back();
}

function getCurrentID(){
  return new URLSearchParams(location.search).get("id");
}

function goDriveInfo(){
  const id = getCurrentID();
  location.href =
  "https://08electricaldata.github.io/drive-viewer/index2.html?id=" +
  encodeURIComponent(id);
}

function goHistory(){
  const id = getCurrentID();
  location.href =
  "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
  encodeURIComponent(id);
}

function goPLC(){
  const id = getCurrentID();
  location.href =
  "https://08electricaldata.github.io/drive-viewer/plc.html?id=" +
  encodeURIComponent(id);
}

/* ===== Extract Drive File ID ===== */
function getFileId(link){
  if(!link) return null;
  const match = link.match(/[-\w]{25,}/);
  return match ? match[0] : null;
}

/* ===== Proper Google Drive Embed ===== */
function convertToEmbed(link){
  const fileId = getFileId(link);
  if(!fileId) return link;
  return "https://drive.google.com/file/d/"+fileId+"/preview";
}

/* ===== Thumbnail ===== */
function convertToThumbnail(link){
  const fileId = getFileId(link);
  if(!fileId) return "";
  return "https://drive.google.com/thumbnail?id="+fileId;
}

/* ===== LOCAL STORAGE FOR DOWNLOADS ===== */
function incrementDownload(id, index){
  const key = "draw_"+id+"_"+index;
  let count = localStorage.getItem(key);
  count = count ? Number(count)+1 : 1;
  localStorage.setItem(key, count);
  return count;
}

function getDownload(id, index){
  return localStorage.getItem("draw_"+id+"_"+index) || "0";
}

/* ===== LOAD PAGE (OPTIMIZED) ===== */
async function load(){
  const id = normalize(getCurrentID());
  if(!id) {
    content.innerHTML = "<div class='card no-data'>Invalid Equipment ID</div>";
    return;
  }

  try {
    console.log(`📐 Loading drawings for ${id}...`);
    const startTime = performance.now();
    
    const j = await (await fetch(buildUrl(JSON_URL))).json();
    const item = j.rows.find(r => normalize(r.id) === id);

    if(!item){
      content.innerHTML =
        "<div class='card no-data'>No Drawings Available</div>";
      console.warn("No drawings found for:", id);
      return;
    }

    const loadTime = performance.now() - startTime;
    console.log(`✓ Drawings loaded in ${loadTime.toFixed(2)}ms`);

    renderDrawings(id, item);
  } catch(e) {
    console.error("Error loading drawings:", e);
    content.innerHTML =
      "<div class='card no-data'>Error loading drawings. Please refresh the page.</div>";
  }
}

/* ===== RENDER DRAWINGS (OPTIMIZED WITH DOCUMENTFRAGMENT) ===== */
function renderDrawings(id, item){
  const fragment = document.createDocumentFragment();
  
  const card = document.createElement("div");
  card.className = "card";
  
  const title = document.createElement("h3");
  title.textContent = id;
  card.appendChild(title);

  Object.keys(item).forEach(group => {
    if(group === "id") return;
    if(!Array.isArray(item[group])) return;

    const groupTitle = document.createElement("div");
    groupTitle.className = "group-title";
    groupTitle.textContent = group.toUpperCase();
    card.appendChild(groupTitle);

    const grid = document.createElement("div");
    grid.className = "grid";

    /* Use DocumentFragment for tiles */
    const tilesFragment = document.createDocumentFragment();

    item[group].forEach((link, i) => {
      if(!link) return;

      const thumb = convertToThumbnail(link);
      const count = getDownload(id, i);

      const tile = document.createElement("div");
      tile.className = "tile";
      tile.setAttribute("data-id", id);
      tile.setAttribute("data-index", i);
      tile.setAttribute("data-link", link);
      
      const img = document.createElement("img");
      img.src = thumb;
      img.onerror = () => img.src = "https://via.placeholder.com/300x200?text=PDF";
      
      const h4 = document.createElement("h4");
      h4.textContent = "Drawing " + (i+1);
      
      const small = document.createElement("small");
      small.id = "count_" + i;
      small.textContent = "Downloads: " + count;
      
      tile.appendChild(img);
      tile.appendChild(h4);
      tile.appendChild(small);
      
      /* Event delegation */
      tile.onclick = () => openDrawing(id, i, link);
      
      tilesFragment.appendChild(tile);
    });

    grid.appendChild(tilesFragment);
    card.appendChild(grid);
  });

  /* Add viewer and controls */
  const viewer = document.createElement("div");
  viewer.className = "viewer";
  viewer.id = "viewerBox";
  const iframe = document.createElement("iframe");
  iframe.id = "pdfFrame";
  viewer.appendChild(iframe);
  card.appendChild(viewer);

  const controls = document.createElement("div");
  controls.className = "viewer-controls";
  
  const fsBtn = document.createElement("button");
  fsBtn.textContent = "📱 Full Screen";
  fsBtn.onclick = toggleFullScreen;
  
  const printBtn = document.createElement("button");
  printBtn.textContent = "🖨 Print";
  printBtn.onclick = printDrawing;
  
  controls.appendChild(fsBtn);
  controls.appendChild(printBtn);
  card.appendChild(controls);

  fragment.appendChild(card);
  content.innerHTML = "";
  content.appendChild(fragment);
}

function openDrawing(id, index, link){
  console.log(`🎨 Opening drawing ${index+1}...`);
  
  const embed = convertToEmbed(link);
  const frame = document.getElementById("pdfFrame");
  const viewer = document.getElementById("viewerBox");

  frame.src = embed;
  viewer.style.display = "block";

  const newCount = incrementDownload(id, index);
  const countEl = document.getElementById("count_" + index);
  if(countEl) countEl.textContent = "Downloads: " + newCount;
  
  console.log(`✓ Drawing displayed (Total opens: ${newCount})`);
}

function printDrawing(){
  const frame = document.getElementById("pdfFrame");
  if(frame && frame.contentWindow){
    frame.contentWindow.print();
  }
}

function toggleFullScreen(){
  const viewer = document.getElementById("viewerBox");
  viewer.classList.toggle("fullscreen");
}

/* ===== INIT ===== */
(async function(){
  console.log("📥 Initializing drawings page...");
  await getVersion();
  load();
})();

</script>

</body>
</html>
