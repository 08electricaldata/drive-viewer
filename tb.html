<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Electrical Tutorials — Modules & Components</title>
  <style>
    :root{--accent:#1a73e8;--bg:#f6f8fb;--card:#ffffff}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0; background:var(--bg); color:#0b1220}
    header{background:linear-gradient(90deg, #0f1724, var(--accent)); color:#fff; padding:18px}
    header h1{margin:0;font-size:1.2rem}
    .container{max-width:980px;margin:20px auto;padding:16px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    input[type="url"], button{padding:8px 10px;border-radius:6px;border:1px solid #d1d7e0}
    button{background:var(--accent);color:#fff;border:none;cursor:pointer}
    .card{background:var(--card);border-radius:8px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(16,24,40,.06)}
    .module-title{display:flex;justify-content:space-between;align-items:center}
    .module-title h2{margin:0;font-size:1rem}
    .component{padding:10px;border-top:1px dashed #eef2f7;display:flex;gap:12px;align-items:flex-start}
    .comp-name{font-weight:600;width:220px}
    .comp-desc{flex:1}
    .motto{font-style:italic;color:#375a7f}
    .search{margin-left:auto}
    .small{font-size:.9rem;color:#374151}
    .empty{padding:16px;color:#6b7280}
    .error{color:#b91c1c}
    details summary{cursor:pointer; font-weight:600}
    @media (max-width:640px){ .comp-name{width:140px} }
  </style>
</head>
<body>
  <header>
    <div style="max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px">
      <h1>Electrical Tutorials — Modules & Components</h1>
      <div style="margin-left:auto;font-size:.9rem;opacity:.95">Load your Google Sheet (CSV) to populate</div>
    </div>
  </header>

  <main class="container">
    <div class="card controls" role="region" aria-label="Load sheet">
      <label style="display:flex;gap:8px;align-items:center;flex:1">
        <span class="small">Google Sheet CSV URL</span>
        <input id="csvUrl" type="url" placeholder="Paste CSV export URL (or leave blank to try demo)" />
      </label>
      <button id="loadBtn">Load sheet</button>
      <button id="demoBtn" title="Load demo data">Load demo</button>
      <input id="q" class="search" placeholder="Search components or modules" />
    </div>

    <div id="out"></div>
  </main>

  <script>
    // Helper: parse CSV (simple)
    function parseCSV(text) {
      // Basic CSV parser supporting quoted fields (not blazing-fast but OK for simple sheets)
      const rows = [];
      let i = 0, cur = '', row = [], inQuotes = false;
      while (i < text.length) {
        const ch = text[i];
        if (ch === '"' ) {
          if (inQuotes && text[i+1] === '"') { cur += '"'; i += 2; continue; } // escaped quote
          inQuotes = !inQuotes;
          i++; continue;
        }
        if (!inQuotes && (ch === '\n' || ch === '\r')) {
          // handle CRLF
          if (ch === '\r' && text[i+1] === '\n') i++;
          row.push(cur); cur = '';
          rows.push(row); row = []; i++; continue;
        }
        if (!inQuotes && ch === ',') { row.push(cur); cur = ''; i++; continue; }
        cur += ch; i++;
      }
      // final
      if (cur !== '' || inQuotes) row.push(cur);
      if (row.length) rows.push(row);
      // Trim possible empty last row
      if (rows.length && rows[rows.length-1].length === 1 && rows[rows.length-1][0] === '') rows.pop();
      return rows;
    }

    function groupByModule(data) {
      // data: [{Module, Component, Description, AimMotto}, ...]
      const groups = {};
      data.forEach(r => {
        const mod = (r.Module || 'General').trim();
        groups[mod] = groups[mod] || [];
        groups[mod].push(r);
      });
      return groups;
    }

    function render(groups, filter='') {
      const out = document.getElementById('out');
      out.innerHTML = '';
      const modules = Object.keys(groups).sort();
      if (!modules.length) { out.innerHTML = '<div class="card empty">No modules found.</div>'; return; }
      const f = filter.trim().toLowerCase();
      modules.forEach(mod => {
        const comps = groups[mod].filter(c => {
          if (!f) return true;
          return (c.Module||'').toLowerCase().includes(f) ||
                 (c.Component||'').toLowerCase().includes(f) ||
                 (c.Description||'').toLowerCase().includes(f) ||
                 (c.AimMotto||'').toLowerCase().includes(f);
        });
        if (!comps.length) return;
        const card = document.createElement('section');
        card.className = 'card';
        card.innerHTML = `
          <div class="module-title">
            <h2>${escapeHtml(mod)} <span style="font-weight:400;color:#6b7280;font-size:.9rem">(${comps.length} component${comps.length>1?'s':''})</span></h2>
            <details><summary>View details</summary><div class="small" style="margin-top:8px">Click component names to expand description & motto</div></details>
          </div>
        `;
        comps.forEach((c, idx) => {
          const compDiv = document.createElement('div');
          compDiv.className = 'component';
          compDiv.innerHTML = `
            <div class="comp-name">${escapeHtml(c.Component||'—')}</div>
            <div class="comp-desc">
              <details>
                <summary>${escapeHtml((c.Description || '').slice(0,60) || 'Description')}</summary>
                <div style="margin-top:6px"><strong>Description:</strong> ${escapeHtml(c.Description || '—')}</div>
                <div style="margin-top:6px"><strong>Aim / Motto:</strong> <span class="motto">${escapeHtml(c.AimMotto || '—')}</span></div>
              </details>
            </div>
          `;
          card.appendChild(compDiv);
        });
        out.appendChild(card);
      });
      if (!out.children.length) out.innerHTML = '<div class="card empty">No results for that search.</div>';
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    function rowsToObjects(rows) {
      if (!rows || !rows.length) return [];
      const headers = rows[0].map(h => (h||'').trim());
      const needed = ['Module','Component','Description','AimMotto'];
      // try to normalize header names: allow spaces or different case: "Aim / Motto" etc.
      const map = headers.map(h => {
        const n = h.toLowerCase().replace(/[^a-z]/g,'');
        if (n.includes('module')) return 'Module';
        if (n.includes('component')) return 'Component';
        if (n.includes('description') || n.includes('desc')) return 'Description';
        if (n.includes('aim') || n.includes('motto') || n.includes('purpose')) return 'AimMotto';
        return h; // fallback
      });
      const out = [];
      for (let i=1;i<rows.length;i++){
        const row = rows[i];
        const obj = {Module:'',Component:'',Description:'',AimMotto:''};
        for (let j=0;j<row.length;j++){
          const key = map[j] || headers[j];
          if (key === 'Module') obj.Module = row[j] || '';
          else if (key === 'Component') obj.Component = row[j] || '';
          else if (key === 'Description') obj.Description = row[j] || '';
          else if (key === 'AimMotto') obj.AimMotto = row[j] || '';
          else {
            // ignore unknown columns
          }
        }
        // only push rows with at least a component name
        if ((obj.Component||'').trim()) out.push(obj);
      }
      return out;
    }

    async function loadFromCsvUrl(url) {
      try {
        const res = await fetch(url, {cache:'no-store'});
        if (!res.ok) throw new Error('Network response not ok: ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        const objs = rowsToObjects(rows);
        return objs;
      } catch (err) {
        throw err;
      }
    }

    // UI wiring
    const loadBtn = document.getElementById('loadBtn');
    const demoBtn = document.getElementById('demoBtn');
    const q = document.getElementById('q');
    const csvUrlInput = document.getElementById('csvUrl');

    loadBtn.addEventListener('click', async () => {
      const url = (csvUrlInput.value || '').trim();
      const out = document.getElementById('out');
      out.innerHTML = '<div class="card small">Loading…</div>';
      try {
        let data = [];
        if (!url) {
          out.innerHTML = '<div class="card error">Please paste the CSV export URL from Google Sheets (see instructions above).</div>';
          return;
        } else {
          // allow user to paste sheet id or full url; normalize export URL if a sheet id was pasted
          let finalUrl = url;
          const sheetIdMatch = url.match(/[a-zA-Z0-9-_]{40,}/);
          if (url.startsWith('https://docs.google.com/spreadsheets/d/') && url.indexOf('/export') === -1) {
            // if they pasted standard sheet url like https://docs.google.com/spreadsheets/d/<ID>/edit#gid=0
            const id = (url.split('/d/')[1]||'').split('/')[0];
            const gidMatch = url.match(/gid=(\d+)/);
            const gid = gidMatch ? gidMatch[1] : '0';
            finalUrl = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
          } else if (sheetIdMatch && !url.includes('docs.google.com')) {
            // if they pasted just the id
            finalUrl = `https://docs.google.com/spreadsheets/d/${sheetIdMatch[0]}/export?format=csv&gid=0`;
          }
          data = await loadFromCsvUrl(finalUrl);
        }
        const groups = groupByModule(data);
        render(groups, q.value);
      } catch (err) {
        document.getElementById('out').innerHTML = '<div class="card error">Failed to load sheet: ' + escapeHtml(err.message || String(err)) + '</div>';
      }
    });

    demoBtn.addEventListener('click', () => {
      const demoRows = [
        ['Module','Component','Description','Aim / Motto'],
        ['Power Supply','Transformer','Steps down AC voltage to safer levels','Stabilize voltage for circuits'],
        ['Power Supply','Rectifier','Converts AC to DC for electronic circuits','Provide DC power'],
        ['Power Supply','Voltage Regulator','Keeps output voltage constant under varying load','Keep voltage steady'],
        ['Signal Processing','Filter (RC)','Removes unwanted frequencies from signals','Clean the signal'],
        ['Control','Relay','Electrically operated switch used to control circuits','Isolate and switch safely'],
        ['Sensors','Thermistor','Temperature-dependent resistor used for sensing temperature','Sense temperature changes']
      ];
      const objs = rowsToObjects(demoRows);
      const groups = groupByModule(objs);
      render(groups, q.value);
    });

    q.addEventListener('input', () => {
      // re-render with existing DOM data: simplest approach — reconstruct groups from current page content is complex.
      // For simplicity, keep last loaded data in a variable.
      if (window._lastGroups) render(window._lastGroups, q.value);
    });

    // Small enhancement: when loading data, store groups globally for search
    (function patchLoadStore(){
      const origLoad = loadFromCsvUrl;
      loadFromCsvUrl = async function(url){
        const objs = await origLoad(url);
        const groups = groupByModule(objs);
        window._lastGroups = groups;
        return objs;
      };
    })();

    // On first open, show demo
    document.getElementById('demoBtn').click();
  </script>
</body>
</html>
