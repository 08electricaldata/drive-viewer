<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drive History — JOB TYPE BD </title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  *{box-sizing:border-box}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin:0;background:#f2f6ff;color:#0b1220;
  }
  .header-bar{
    position:sticky;top:0;background:#003f88;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:1000;flex-wrap:wrap;
  }
  .header-left{display:flex;gap:8px;align-items:center}
  .hb-btn{background:#fff;color:#003f88;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600}
  .title{flex:1;text-align:center;font-size:16px;font-weight:700}
  .version-info{
    background:rgba(255,255,255,0.2);
    color:white;
    padding:6px 10px;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
  }
  .status-indicator{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#4caf50;
    margin-right:4px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}
  .page{max-width:1200px;margin:14px auto;padding:0 14px}
  h2{color:#003f88;margin:6px 0 12px 0;text-align:left}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .controls .group{display:flex;gap:8px;align-items:center}
  select,input{padding:8px 10px;border-radius:6px;border:1px solid #d6dbe6;font-size:14px}
  .btn{background:#003f88;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:700}
  .btn.ghost{background:#fff;color:#003f88;border:1px solid #cfd8e3}
  .table-wrap{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(3,63,136,0.06);overflow:auto;padding:8px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
  th,td{padding:8px 10px;border:1px solid #e8edf6;text-align:left;vertical-align:top}
  th{background:#003f88;color:#fff;font-weight:700;font-size:12px}
  td a{color:#003f88;text-decoration:none;font-weight:600}
  .year-row td{background:#e9f2ff;color:#003f88;font-weight:700;text-align:center}
  .no-data{padding:16px;text-align:center;color:#666}
  tr.clickable:hover{background:#eef6ff;cursor:pointer}
  .drive-link{color:#003f88;font-weight:700;text-decoration:underline}
  
  /* LOADING INDICATOR */
  .loading{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#003f88;
    animation:pulse-load 1.5s infinite;
  }
  @keyframes pulse-load { 0%,100%{opacity:0.3} 50%{opacity:1} }
  
  @media (max-width:900px){
    .page{padding:0 10px}
    table{min-width:700px;font-size:12px}
    .version-info{order:3;flex-basis:100%;margin-top:8px}
  }
</style>
</head>
<body>

<div class="header-bar">
  <div class="header-left">
    <button class="hb-btn" onclick="goHome()">🏠 Home</button>
    <button class="hb-btn" onclick="goBack()">⬅ Back</button>
  </div>
  <div class="title">Break down History </div>
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</div>

<div class="page">
  <h2>JOB TYPE "Break Down" only , select month then year if monthwise search Required</h2>

  <div class="controls" role="region" aria-label="filters">
    <div class="group">
      <label for="driveSelect">Drive</label>
      <select id="driveSelect"><option value="">All drives</option></select>
    </div>

    <div class="group">
      <label for="yearSelect">Year</label>
      <select id="yearSelect"><option value="">All years</option></select>
    </div>

    <div class="group">
      <label for="monthSelect">Month</label>
      <select id="monthSelect">
        <option value="">All months</option>
        <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
        <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
        <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
        <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
      </select>
    </div>

    <div class="group" style="flex:1;min-width:220px;">
      <input id="search" placeholder="Search details / category / link..." />
    </div>

    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn" id="exportBtn">📥 Export CSV</button>
      <button class="btn ghost" onclick="window.print()">🖨 Print</button>
    </div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table id="historyTable" aria-label="history table">
      <thead>
        <tr>
          <th style="width:60px;text-align:center">TR NO</th>
          <th style="width:110px;text-align:center">DATE</th>
          <th style="width:220px">DRIVE DETAILS</th>
          <th>DETAILS</th>
          <th style="width:160px">CATEGORY</th>
          <th style="width:70px;text-align:center">LINK</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="noData" class="no-data" style="display:none">No entries found.</div>
  </div>
</div>

<script>
/* ===== VERSION AND CDN URLS WITH OPTIMIZED LOADING ===== */
const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/history/";
const JOBBOOK_JSON = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/jobbook.json";
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let currentVersion = "1.0.0";
const versionDisplayEl = document.getElementById("versionDisplay");

/* FETCH VERSION FOR CACHE BUSTING */
async function getVersion() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    currentVersion = data.version || "1.0.0";
    versionDisplayEl.textContent = currentVersion;
    console.log("✓ Version loaded:", currentVersion);
  } catch (err) {
    console.warn("Failed to load version file:", err);
    currentVersion = "1.0.0";
    versionDisplayEl.textContent = currentVersion;
  }
}

/* BUILD URL WITH VERSION PARAM */
function buildHistoryUrl(year) {
  return `${HISTORY_BASE}${year}.json?v=${currentVersion}`;
}

function buildJobbookUrl() {
  return `${JOBBOOK_JSON}?v=${currentVersion}`;
}

/* Utilities */
function normalize(v){ return String(v||"").trim().toUpperCase(); }

/* Parse different date representations into Date or null */
function parseDateKeyToDate(v){
  if(!v) return null;
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)){ 
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }
  if(typeof v === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const [d,m,y] = v.split('/').map(Number); return new Date(y,m-1,d);
  }
  if(typeof v === 'string' && /^\d{2}-\d{2}-\d{4}$/.test(v)){
    const [d,m,y] = v.split('-').map(Number); return new Date(y,m-1,d);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

/* Normalize date key to DD/MM/YYYY for lookup in jobBookMap */
function normalizeDateKey(v){
  const d = parseDateKeyToDate(v);
  if(!d) return "";
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

/* format for display: DD-MM-YYYY */
function formatDateDisplay(v){
  const d = parseDateKeyToDate(v);
  if(!d) return "";
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}-${mm}-${yyyy}`;
}

/* Ensure link is absolute */
function normalizeLink(u){
  if(!u) return "";
  let s = String(u).trim();
  if(!s) return "";
  if(/^(https?:\/\/|mailto:|javascript:)/i.test(s)) return s;
  return 'https://' + s.replace(/^\/+/, '');
}

/* Map from dateKey (DD/MM/YYYY) -> link */
let jobBookMap = {};

/* Load jobbook.json with cache busting */
async function loadJobBook(){
  try{
    const url = buildJobbookUrl();
    console.log("📖 Loading jobbook...");
    const startTime = performance.now();
    const res = await fetch(url);
    if(!res.ok) return;
    const j = await res.json();
    (j.rows || []).forEach(r=>{
      const key = normalizeDateKey(r[0]);
      const link = (r[1]||"").toString().trim();
      if(key && link) jobBookMap[key] = link;
    });
    const loadTime = performance.now() - startTime;
    console.log(`✓ Jobbook loaded in ${loadTime.toFixed(2)}ms (${Object.keys(jobBookMap).length} entries)`);
  }catch(e){
    console.warn('⚠ Jobbook load failed', e);
  }
}

/* Helper: get drive key from row */
function getDriveKeyFromRow(row){
  const a = row[2] || "";
  const b = row[3] || "";
  return `${a}-${b}`.trim();
}

/* State */
let allRows = [], filteredRows = [], driveSet = new Set(), yearSet = new Set();

/* Load all history files in PARALLEL with optimizations */
async function loadAllHistory(){
  allRows = []; driveSet.clear(); yearSet.clear();
  
  console.log("📂 Loading history files in parallel...");
  const startTime = performance.now();
  
  /* Parallel fetch all history files */
  const promises = HISTORY_YEARS.map(y => {
    const url = buildHistoryUrl(y);
    return fetch(url)
      .then(res => res.ok ? res.json() : null)
      .catch(e => { console.warn(`Failed to load year ${y}:`, e); return null; });
  });

  const results = await Promise.all(promises);

  /* Process all results in one pass */
  results.forEach((j, idx) => {
    if(!j) return;
    const year = HISTORY_YEARS[idx];
    (j.rows || []).forEach(r => {
      if(!(r || []).some(cell => normalize(cell) === "BD")) return;
      
      const dateVal = r[4];
      const dateObj = parseDateKeyToDate(dateVal);
      const driveKey = getDriveKeyFromRow(r);
      
      if(driveKey) driveSet.add(driveKey);
      if(dateObj) yearSet.add(dateObj.getFullYear());
      
      allRows.push({ row: r, dateObj, driveKey });
    });
  });

  /* Sort once in descending order */
  allRows.sort((a,b) => (b.dateObj||0) - (a.dateObj||0));
  
  const loadTime = performance.now() - startTime;
  console.log(`✓ History loaded in ${loadTime.toFixed(2)}ms (${allRows.length} BD entries)`);
  
  populateFilters();
  applyFilters();
}

/* Populate filter selects */
function populateFilters(){
  const driveSel = document.getElementById("driveSelect");
  driveSel.innerHTML = '<option value="">All drives</option>';
  Array.from(driveSet).sort().forEach(k=>{
    const o = document.createElement("option"); o.value = k; o.textContent = k; driveSel.appendChild(o);
  });

  const yearSel = document.getElementById("yearSelect");
  yearSel.innerHTML = '<option value="">All years</option>';
  Array.from(yearSet).sort((a,b)=>b-a).forEach(y=>{
    const o = document.createElement("option"); o.value = y; o.textContent = y; yearSel.appendChild(o);
  });
}

/* Apply current UI filters */
function applyFilters(){
  const drive = document.getElementById("driveSelect").value;
  const year = document.getElementById("yearSelect").value;
  const month = document.getElementById("monthSelect") ? document.getElementById("monthSelect").value : "";
  const q = document.getElementById("search").value.trim().toLowerCase();

  filteredRows = allRows.filter(item => {
    if(drive && item.driveKey !== drive) return false;
    if(year && (!item.dateObj || String(item.dateObj.getFullYear()) !== String(year))) return false;
    if(month && item.dateObj){
      if(String(item.dateObj.getMonth()+1) !== String(month)) return false;
    }
    if(q){
      const hay = (item.row || []).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  renderTable();
}

/* Render table rows with DocumentFragment for better performance */
function renderTable(){
  const tbody = document.querySelector("#historyTable tbody");
  const noData = document.getElementById("noData");
  
  if(filteredRows.length === 0){
    tbody.innerHTML = "";
    noData.style.display = "block";
    return;
  }
  noData.style.display = "none";

  /* Use DocumentFragment for better DOM performance */
  const fragment = document.createDocumentFragment();
  let currentYear = null;

  filteredRows.forEach(item=>{
    const r = item.row;
    const dObj = item.dateObj;
    const year = dObj ? dObj.getFullYear() : "";
    
    if(String(year) !== String(currentYear)){
      currentYear = year;
      const yr = document.createElement("tr");
      yr.className = "year-row";
      const td = document.createElement("td");
      td.colSpan = 6;
      td.textContent = year ? `YEAR ${year}` : "Unknown year";
      yr.appendChild(td);
      fragment.appendChild(yr);
    }

    const tr = document.createElement("tr");

    const trno = r[0] || "";
    const dateDisplay = formatDateDisplay(r[4]);
    const driveKey = getDriveKeyFromRow(r) || "";
    const details = r[5] || r[6] || "";
    const category = r[7] || r[8] || "";

    const dateKey = normalizeDateKey(r[4]);
    const jobbookLinkRaw = jobBookMap[dateKey] || "";
    const rowLinkRaw = (r[10] || "").toString().trim();
    const chosenLinkRaw = jobbookLinkRaw || rowLinkRaw;
    const chosenLink = normalizeLink(chosenLinkRaw);

    const td0 = document.createElement('td'); td0.style.textAlign = 'center'; td0.textContent = trno; tr.appendChild(td0);
    const td1 = document.createElement('td'); td1.style.textAlign = 'center'; td1.textContent = dateDisplay; tr.appendChild(td1);

    const td2 = document.createElement('td');
    if(driveKey){
      const a = document.createElement('a');
      a.href = `https://08electricaldata.github.io/drive-viewer/history.html?id=${encodeURIComponent(driveKey)}`;
      a.className = 'drive-link';
      a.textContent = driveKey;
      a.addEventListener('click', (e) => e.stopPropagation());
      td2.appendChild(a);
    } else {
      td2.textContent = driveKey;
    }
    tr.appendChild(td2);

    const td3 = document.createElement('td'); td3.style.whiteSpace='normal'; td3.style.wordBreak='break-word'; td3.textContent = details; tr.appendChild(td3);
    const td4 = document.createElement('td'); td4.textContent = category; tr.appendChild(td4);

    const td5 = document.createElement('td'); td5.style.textAlign = 'center';
    if(chosenLink){
      const a2 = document.createElement('a');
      a2.href = chosenLink;
      a2.target = '_blank';
      a2.rel = 'noopener noreferrer';
      a2.textContent = 'Open';
      a2.addEventListener('click', function(e){ e.stopPropagation(); });
      td5.appendChild(a2);
    }
    tr.appendChild(td5);

    if(driveKey){
      tr.classList.add('clickable');
      tr.addEventListener('click', () => {
        window.location.href = `https://08electricaldata.github.io/drive-viewer/history.html?id=${encodeURIComponent(driveKey)}`;
      });
    }

    fragment.appendChild(tr);
  });

  tbody.innerHTML = "";
  tbody.appendChild(fragment);
}

/* Export CSV */
function exportCSV(){
  if(filteredRows.length === 0){ alert("No rows to export"); return; }
  const header = ["TR NO","DATE","DRIVE DETAILS","DETAILS","CATEGORY","LINK"];
  const rows = [ header.join(",") ];
  filteredRows.forEach(item=>{
    const r = item.row;
    const d = item.dateObj ? formatDateDisplay(r[4]) : "";
    const driveKey = getDriveKeyFromRow(r) || "";
    const details = (r[5] || r[6] || "").toString().replace(/"/g,'""');
    const category = (r[7] || r[8] || "").toString().replace(/"/g,'""');
    const dateKey = normalizeDateKey(r[4]);
    const jobbookLinkRaw = jobBookMap[dateKey] || "";
    const rowLinkRaw = (r[10] || "").toString().trim();
    const chosenLinkRaw = jobbookLinkRaw || rowLinkRaw;
    rows.push([`"${(r[0]||"").toString().replace(/"/g,'""')}"`,`"${d}"`,`"${driveKey.replace(/"/g,'""')}"`,`"${details}"`,`"${category}"`,`"${chosenLinkRaw.replace(/"/g,'""')}"`].join(","));
  });
  const blob = new Blob([rows.join("\n")], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `breakdown-history-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

/* Init: load version, then jobbook and history in parallel */
async function init(){
  try{
    await getVersion();
    console.log("⏳ Loading data...");
    /* Load jobbook and history in parallel */
    await Promise.all([loadJobBook(), loadAllHistory()]);
    console.log("✓ All data loaded!");
  }catch(e){
    console.error("Initialization error:", e);
    document.querySelector("#historyTable tbody").innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;padding:20px;">Error loading data. Please refresh the page.</td></tr>`;
  }
}

/* Wire UI events */
document.getElementById("driveSelect").addEventListener("change", applyFilters);
document.getElementById("yearSelect").addEventListener("change", applyFilters);
document.getElementById("monthSelect").addEventListener("change", applyFilters);
document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("exportBtn").addEventListener("click", exportCSV);

/* Navigation helpers */
function goHome(){ location.href = "https://08electricaldata.github.io/"; }
function goBack(){ history.back(); }

/* Boot sequence */
(async function boot(){
  const monthSelect = document.getElementById("monthSelect");
  if(!monthSelect){
    const sel = document.createElement("select"); sel.id = "monthSelect";
    const wrap = document.querySelector(".controls");
    const group = document.createElement("div"); group.className = "group";
    const label = document.createElement("label"); label.htmlFor = "monthSelect"; label.textContent = "Month";
    group.appendChild(label); group.appendChild(sel);
    wrap.insertBefore(group, document.getElementById("search").parentElement);
    sel.innerHTML = '<option value="">All months</option>';
    for(let i=1;i<=12;i++){ const o=document.createElement("option"); o.value=i; o.textContent=monthNames[i-1]; sel.appendChild(o); }
    sel.addEventListener("change", applyFilters);
  }
  await init();
})();

/* Auto-reload every 5 minutes */
setInterval(async () => {
  console.log("🔄 Auto-refreshing data...");
  await getVersion();
  await loadJobBook();
  await loadAllHistory();
}, 5 * 60 * 1000);

</script>
</body>
</html>
