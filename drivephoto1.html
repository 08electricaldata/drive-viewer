<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Photos</title>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://drive.google.com">
<style>
/* =========================
   BODY
========================= */
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f2f6ff;
  color:#222;
}
/* =========================
   HEADER
========================= */
.header{
  background:#003f88;
  color:white;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.header-title{
  flex:1;
  text-align:center;
}
.header-title h2{
  margin:0;
  font-size:21px;
}
.header-title small{
  display:block;
  font-size:13px;
  font-weight:500;
  opacity:.9;
}
/* =========================
   HEADER BUTTONS
========================= */
.header-btn{
  background:white;
  color:#003f88;
  border:1px solid #003f88;
  border-radius:6px;
  padding:7px 11px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
  font-size:14px;
}
.header-btn:hover{
  background:#eaf2ff;
}
.header-btn:active{
  transform:scale(.98);
}
/* =========================
   CONTAINER
========================= */
.container{
  padding:20px;
  max-width:1400px;
  margin:auto;
}
/* =========================
   CARD
========================= */
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
/* =========================
   TITLE
========================= */
.page-title{
  margin:0 0 5px 0;
  color:#003f88;
  text-align:center;
  font-size:22px;
}
.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
  font-size:14px;
}
/* =========================
   PHOTO GRID
========================= */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
  margin-top:20px;
}
/* =========================
   PHOTO TILE
========================= */
.photo-tile{
  background:#f8fbff;
  padding:10px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;
  transition:.2s ease;
  text-align:center;
  overflow:hidden;
}
.photo-tile:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 12px rgba(0,0,0,.2);
}
.photo-tile:active{
  transform:translateY(-1px);
}
/* =========================
   PHOTO
========================= */
.photo-tile img{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:9px;
  display:block;
  background:#eee;
  contain:layout style paint;
}
/* =========================
   DATE CAPTION
========================= */
.photo-date{
  margin-top:9px;
  font-size:15px;
  font-weight:bold;
  color:#003f88;
}
.photo-name{
  margin-top:4px;
  font-size:11px;
  color:#777;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
/* =========================
   VIEWER
========================= */
.viewer{
  display:none;
  margin-top:25px;
  background:#111;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  text-align:center;
}
.viewer img{
  max-width:100%;
  max-height:650px;
  width:auto;
  height:auto;
  display:block;
  margin:auto;
  contain:layout style paint;
}
/* =========================
   VIEWER CAPTION
========================= */
.viewer-caption{
  background:#111;
  color:white;
  padding:10px;
  font-size:15px;
  font-weight:bold;
  word-break:break-word;
}
/* =========================
   VIEWER CONTROLS
========================= */
.viewer-controls{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px;
  background:#111;
  flex-wrap:wrap;
}
.viewer-controls button{
  padding:8px 15px;
  border:none;
  background:#003f88;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
  transition:.2s ease;
}
.viewer-controls button:hover{
  background:#0058bd;
}
.viewer-controls button:active{
  transform:scale(.95);
}
/* =========================
   FULLSCREEN
========================= */
.viewer.fullscreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:9999;
  margin:0;
  border-radius:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.viewer.fullscreen img{
  max-height:calc(100vh - 120px);
}
/* =========================
   NO DATA
========================= */
.no-data{
  color:#d32f2f;
  text-align:center;
  font-weight:bold;
  padding:30px;
}
/* =========================
   LOADING
========================= */
.loading{
  text-align:center;
  color:#003f88;
  font-weight:bold;
  padding:30px;
}
.loading::after{
  content:" .";
  animation:dots 1.5s steps(4,end) infinite;
}
@keyframes dots{
  0%,20%{content:" ."}
  40%{content:" .."}
  60%{content:" ..."}
  80%,100%{content:"."}
}
/* =========================
   MOBILE
========================= */
@media(max-width:768px){
  .header{
    flex-wrap:wrap;
  }
  .header-title{
    order:-1;
    width:100%;
    flex:none;
    margin-bottom:8px;
  }
  .header-title h2{
    font-size:18px;
  }
  .header-btn{
    font-size:12px;
    padding:6px 8px;
  }
  .container{
    padding:10px;
  }
  .card{
    padding:12px;
  }
  .photo-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .photo-tile{
    padding:7px;
  }
  .photo-tile img{
    height:140px;
  }
  .photo-date{
    font-size:13px;
  }
}
@media(max-width:400px){
  .photo-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<!-- =================================================
     HEADER
================================================= -->
<div class="header" role="banner">
  <button
    class="header-btn"
    onclick="goHome()"
    aria-label="Go to home page">
    🏠 Home
  </button>
  <button
    class="header-btn"
    onclick="goBack()"
    aria-label="Go back to previous page">
    ⬅ Back
  </button>
  <div class="header-title">
    <h1 style="margin:0;font-size:21px;font-weight:normal;">Equipment Photos</h1>
    <small>
      Designed and maintained by Rakesh Chandra Sethy
    </small>
  </div>
</div>
<!-- =================================================
     CONTENT
================================================= -->
<div class="container">
  <div class="card">
    <div id="content">
      <div class="loading">
        Loading photos
      </div>
    </div>
  </div>
</div>
<script>
/* =================================================
   CONFIGURATION
================================================= */
const CONFIG = {
  JSON_URL: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drawings/drivephotos.json",
  CACHE_VERSION: "v1",
  TIMEOUT: 10000,
  PLACEHOLDER: "https://via.placeholder.com/400x250?text=Image+Unavailable"
};

/* =================================================
   CACHE MANAGEMENT
================================================= */
const CacheManager = {
  set(key, value, ttl = 3600000) {
    const now = Date.now();
    sessionStorage.setItem(key, JSON.stringify({
      data: value,
      timestamp: now,
      ttl: ttl
    }));
  },

  get(key) {
    const item = sessionStorage.getItem(key);
    if (!item) return null;
    const parsed = JSON.parse(item);
    const elapsed = Date.now() - parsed.timestamp;
    if (elapsed > parsed.ttl) {
      sessionStorage.removeItem(key);
      return null;
    }
    return parsed.data;
  },

  clear() {
    sessionStorage.clear();
  }
};

/* =================================================
   NAVIGATION
================================================= */
function goHome() {
  location.href = "https://08electricaldata.github.io/";
}

function goBack() {
  history.back();
}

/* =================================================
   GET ID FROM URL
================================================= */
function getCurrentID() {
  return new URLSearchParams(location.search).get("id");
}

/* =================================================
   NORMALIZE
================================================= */
function normalize(value) {
  return String(value || "").trim().toUpperCase();
}

/* =================================================
   EXTRACT GOOGLE DRIVE FILE ID
================================================= */
function getFileId(url) {
  if (!url) return null;
  const match = url.match(/[-\w]{25,}/);
  return match ? match[0] : null;
}

/* =================================================
   DRIVE IMAGE URL WITH OPTIMIZATION
================================================= */
function convertToImage(url, size = "w1200") {
  const fileId = getFileId(url);
  if (!fileId) return url;
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=${size}`;
}

/* =================================================
   SPLIT URL + DATE
================================================= */
function parsePhotoValue(value) {
  if (!value) return null;
  value = String(value).trim();
  if (!value) return null;
  
  const comma = value.lastIndexOf(",");
  if (comma === -1) {
    return { url: value, date: "" };
  }
  
  const url = value.substring(0, comma).trim();
  const date = value.substring(comma + 1).trim();
  if (!url) return null;
  
  return { url: url, date: date };
}

/* =================================================
   ESCAPE HTML
================================================= */
function escapeHTML(value) {
  const map = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  };
  return String(value || "").replace(/[&<>"']/g, char => map[char]);
}

/* =================================================
   GLOBAL PHOTO ARRAY
================================================= */
let photos = [];
let currentPhoto = 0;

/* =================================================
   FETCH WITH TIMEOUT
================================================= */
async function fetchWithTimeout(url, timeout = CONFIG.TIMEOUT) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeout);
  
  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Cache-Control": "max-age=3600"
      }
    });
    clearTimeout(timeoutId);
    return response;
  } catch (error) {
    clearTimeout(timeoutId);
    throw error;
  }
}

/* =================================================
   LOAD JSON WITH CACHING & CACHE BUSTING
================================================= */
async function load() {
  const id = normalize(getCurrentID());
  const content = document.getElementById("content");
  
  if (!id) {
    content.innerHTML = `<div class='no-data'>No equipment ID specified</div>`;
    return;
  }
  
  try {
    // Generate cache key with version
    const cacheKey = `photos_${CONFIG.CACHE_VERSION}_${id}`;
    
    // Check cache first
    let data = CacheManager.get(cacheKey);
    
    if (!data) {
      // Cache miss - fetch from remote
      const cacheBusterUrl = `${CONFIG.JSON_URL}?v=${CONFIG.CACHE_VERSION}_${Date.now()}`;
      const response = await fetchWithTimeout(cacheBusterUrl);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: Failed to load photos`);
      }
      
      data = await response.json();
      
      // Cache the data
      CacheManager.set(cacheKey, data, 3600000); // 1 hour cache
    }
    
    // Find matching equipment ID
    const row = data.find(r => normalize(r[0]) === id);
    
    if (!row) {
      content.innerHTML = `<div class='no-data'>No photos available for ${escapeHTML(id)}</div>`;
      return;
    }
    
    // Extract photos
    photos = [];
    for (let i = 1; i < row.length; i++) {
      const photo = parsePhotoValue(row[i]);
      if (!photo) continue;
      photos.push({
        url: photo.url,
        date: photo.date,
        column: i + 1
      });
    }
    
    if (photos.length === 0) {
      content.innerHTML = `<div class='no-data'>No photos available for ${escapeHTML(id)}</div>`;
      return;
    }
    
    // Build optimized HTML
    buildPhotoGrid(id, content);
    
  } catch (error) {
    console.error("Error loading photos:", error);
    content.innerHTML = `<div class='no-data'>Unable to load photos.<br><br>${escapeHTML(error.message)}</div>`;
  }
}

/* =================================================
   BUILD PHOTO GRID
================================================= */
function buildPhotoGrid(id, container) {
  let html = `
    <h2 class='page-title'>${escapeHTML(id)}</h2>
    <div class='subtitle'>${photos.length} photo${photos.length !== 1 ? "s" : ""} available</div>
    <div class='photo-grid'>
  `;
  
  photos.forEach((photo, index) => {
    const thumbnailUrl = convertToImage(photo.url, "w300");
    const fullUrl = convertToImage(photo.url, "w1200");
    
    html += `
      <div class='photo-tile' onclick='openPhoto(${index})' role='button' tabindex='0' onkeypress='if(event.key==="Enter")openPhoto(${index})'>
        <img src='${escapeHTML(thumbnailUrl)}' 
             alt='Equipment photo dated ${escapeHTML(photo.date)}' 
             loading='lazy' 
             decoding='async'
             data-full='${escapeHTML(fullUrl)}'
             onerror="this.src='${CONFIG.PLACEHOLDER}'">
        <div class='photo-date'>${escapeHTML(photo.date || "Date not available")}</div>
      </div>
    `;
  });
  
  html += `
    </div>
    <div class='viewer' id='viewerBox' role='dialog' aria-hidden='true'>
      <img id='viewerImage' alt='Full size equipment photo'>
      <div class='viewer-caption' id='viewerCaption'></div>
      <div class='viewer-controls'>
        <button onclick='previousPhoto()' aria-label='Previous photo'>⬅ Previous</button>
        <button onclick='toggleFullScreen()' aria-label='Toggle fullscreen'>⛶ Full Screen</button>
        <button onclick='nextPhoto()' aria-label='Next photo'>Next ➡</button>
        <button onclick='closeViewer()' aria-label='Close viewer'>✖ Close</button>
      </div>
    </div>
  `;
  
  container.innerHTML = html;
}

/* =================================================
   OPEN PHOTO
================================================= */
function openPhoto(index) {
  if (index < 0 || index >= photos.length) return;
  
  currentPhoto = index;
  const photo = photos[currentPhoto];
  const viewer = document.getElementById("viewerBox");
  const image = document.getElementById("viewerImage");
  const caption = document.getElementById("viewerCaption");
  
  const fullUrl = convertToImage(photo.url, "w1200");
  image.src = fullUrl;
  image.alt = `Photo dated ${photo.date}`;
  caption.textContent = photo.date || "Date not available";
  
  viewer.style.display = "block";
  viewer.setAttribute("aria-hidden", "false");
  
  viewer.scrollIntoView({ behavior: "smooth", block: "center" });
  image.focus();
}

/* =================================================
   PREVIOUS
================================================= */
function previousPhoto() {
  if (photos.length === 0) return;
  currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
  openPhoto(currentPhoto);
}

/* =================================================
   NEXT
================================================= */
function nextPhoto() {
  if (photos.length === 0) return;
  currentPhoto = (currentPhoto + 1) % photos.length;
  openPhoto(currentPhoto);
}

/* =================================================
   CLOSE VIEWER
================================================= */
function closeViewer() {
  const viewer = document.getElementById("viewerBox");
  viewer.style.display = "none";
  viewer.setAttribute("aria-hidden", "true");
}

/* =================================================
   TOGGLE FULLSCREEN
================================================= */
function toggleFullScreen() {
  const viewer = document.getElementById("viewerBox");
  viewer.classList.toggle("fullscreen");
  
  if (viewer.classList.contains("fullscreen")) {
    viewer.setAttribute("aria-expanded", "true");
  } else {
    viewer.setAttribute("aria-expanded", "false");
  }
}

/* =================================================
   KEYBOARD CONTROLS
================================================= */
document.addEventListener("keydown", function(event) {
  const viewer = document.getElementById("viewerBox");
  if (!viewer || viewer.style.display === "none") return;
  
  switch(event.key) {
    case "ArrowLeft":
      previousPhoto();
      break;
    case "ArrowRight":
      nextPhoto();
      break;
    case "Escape":
      closeViewer();
      break;
  }
});

/* =================================================
   SERVICE WORKER REGISTRATION (Optional)
================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // Service worker not available, continue without it
    });
  });
}

/* =================================================
   START
================================================= */
document.readyState === "loading" 
  ? document.addEventListener("DOMContentLoaded", load)
  : load();
</script>
</body>
</html>
