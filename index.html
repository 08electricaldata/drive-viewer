<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Equipment Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
  margin: 0; 
  background: #f2f6ff; 
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.header-bar {
  position: sticky; 
  top: 0; 
  z-index: 1000;
  background: #003f88;
  padding: 8px 8px;
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}

.header-left {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
}

.header-title { 
  flex: 1; 
  text-align: center; 
  padding: 0 10px;
}

.header-title h2 { 
  margin: 0; 
  color: #ffffff; 
  font-size: 16px;
  font-weight: 600;
}

.header-title small { 
  display: none; 
  font-size: 11px; 
  font-weight: 600;
  color: #e0e0e0;
}

.icon-btn {
  background: #ffffff;
  color: #003f88;
  border: none;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.icon-btn:active {
  transform: scale(0.95);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.container { 
  padding: 10px 8px; 
  max-width: 100%;
  margin: 0 auto;
}

.card {
  background: #fff; 
  padding: 14px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  margin-bottom: 10px;
}

.card h3 {
  margin: 0 0 12px 0;
  color: #003f88;
  font-size: 16px;
  font-weight: 600;
  word-break: break-word;
}

.label { 
  font-weight: 600; 
  color: #003f88; 
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}

.grid p {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
  word-break: break-word;
}

.grid p span {
  display: block;
  margin-bottom: 2px;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.action-btn {
  padding: 10px 8px;
  background: #003f88;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  white-space: normal;
  text-align: center;
  word-break: break-word;
  line-height: 1.2;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.action-btn:active {
  transform: scale(0.98);
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.action-btn:disabled {
  background: #cccccc;
  cursor: not-allowed;
  opacity: 0.6;
}

.badge {
  color: #d32f2f;
  font-weight: 600;
  margin-top: 6px;
  font-size: 12px;
  padding: 4px 6px;
  background: #ffebee;
  border-radius: 4px;
  border-left: 3px solid #d32f2f;
}

.loading {
  text-align: center;
  padding: 40px 20px;
  font-size: 14px;
  color: #003f88;
}

.not-found {
  text-align: center;
  padding: 40px 20px;
  font-size: 14px;
  color: #d32f2f;
}

@media(max-width:480px){
  .header-bar {
    padding: 6px 6px;
  }

  .icon-btn {
    padding: 6px 8px;
    font-size: 12px;
  }

  .container {
    padding: 8px 6px;
  }

  .card {
    padding: 12px;
    border-radius: 8px;
  }

  .card h3 {
    font-size: 15px;
    margin-bottom: 10px;
  }

  .grid {
    gap: 10px;
  }

  .grid p {
    font-size: 12px;
  }

  .label {
    font-size: 12px;
  }

  .action-row {
    gap: 6px;
  }

  .action-btn {
    padding: 9px 6px;
    font-size: 11px;
  }
}

@media(min-width: 768px){
  .container {
    max-width: 600px;
  }

  .grid {
    grid-template-columns: 1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="header-bar">
  <div class="header-left">
    <button class="icon-btn" onclick="goHome()">🏠</button>
    <button class="icon-btn" onclick="goBack()">⬅</button>
    <button class="icon-btn" onclick="addJob()">➕</button>
  </div>
  <div class="header-title">
    <h2>Equipment Info</h2>
    <small>By Rakesh Chandra Sethy</small>
  </div>
</div>

<div class="container">
  <div id="content" class="loading">Loading data…</div>
</div>

<script>
const DRIVE_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

const DRAWING_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drawings/drawings.json";

const PLC_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/plc/plc.json";

const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/history/";

let drawingAvailableMap = {};
let plcAvailableMap = {};

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

function goHome(){ location.href="https://08electricaldata.github.io/index_mob.html"; }
function goBack(){ history.back(); }

/* ===== ADD JOB ===== */
function addJob(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;
  location.href =
  "https://08electricaldata.github.io/qrsubmit.html?id=" +
  encodeURIComponent(id);
}

/* ===== DRAWING OPEN ===== */
function openDrawings(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
  encodeURIComponent(id);
}

/* ===== PLC OPEN ===== */
function openPLC(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/mobile/plc.html?id=" +
  encodeURIComponent(id);
}

/* ===== MOTOR DATA OPEN ===== */
function openMotorData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/motordata.html?id=" +
  encodeURIComponent(id);
}

/* ===== PLC LADDER OPEN ===== */
function openPLCLadder(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/plcladder.html?id=" +
  encodeURIComponent(id);
}

/* ===== PRELOAD DRAWINGS ===== */
async function preloadDrawings(){
  try{
    const j = await (await fetch(DRAWING_JSON)).json();
    j.rows.forEach(item=>{
      const id = normalize(item.id);
      if(!id) return;

      const hasDrawing = Object.keys(item).some(k=>{
        if(k==="id") return false;
        if(!Array.isArray(item[k])) return false;
        return item[k].some(link=>link && link.trim()!=="");
      });

      drawingAvailableMap[id] = hasDrawing;
    });
  }catch(e){}
}

/* ===== PRELOAD PLC ===== */
async function preloadPLC(){
  try{
    const j = await (await fetch(PLC_JSON)).json();
    Object.keys(j.drives || {}).forEach(id=>{
      plcAvailableMap[normalize(id)] = true;
    });
  }catch(e){}
}

function parseDate(v){
  if(!v) return null;
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){
    const[d,m,y]=v.split("/");
    return new Date(y,m-1,d);
  }
  return new Date(v);
}

function fmt(d){
  if(!d || isNaN(d)) return "NO RECORDS";
  return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

/* ===== LAST DATES ===== */
async function lastDates(id,map){
  const res={};
  Object.keys(map).forEach(k=>res[k]=null);

  for(const y of HISTORY_YEARS){
    try{
      const j = await (await fetch(HISTORY_BASE + y + ".json")).json();
      j.rows.forEach(r=>{
        if(normalize(`${r[2]}-${r[3]}`) !== id) return;

        const job = normalize(r[7]);
        const d = parseDate(r[4]);

        Object.entries(map).forEach(([k,v])=>{
          if(job === normalize(v) && (!res[k] || d > res[k])) {
            res[k] = d;
          }
        });
      });
    }catch(e){}
  }

  Object.keys(res).forEach(
    k => res[k] = res[k] ? fmt(res[k]) : "NO RECORDS"
  );
  return res;
}

function formatDDMMYYYY(v){
  if(!v) return "NO RECORDS";
  const d = new Date(v);
  if(isNaN(d)) return v;
  const day = String(d.getDate()).padStart(2,"0");
  const month = String(d.getMonth()+1).padStart(2,"0");
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
}

/* ===== LOAD DATA ===== */
async function loadData(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  if(!id) return;

  const j = await (await fetch(DRIVE_JSON)).json();
  const c = j.rows.find(
    r => normalize(`${r[1]}-${r[2]}`) === id
  );

  if(!c){
    content.innerHTML =
      "<div class='not-found'>Equipment data not found… opening history…</div>";
    setTimeout(()=>{
      location.href =
        "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" +
        encodeURIComponent(id);
    }, 800);
    return;
  }

  const TYPE = normalize(c[1]);

  if(TYPE === "TRANSFORMER") showTransformer(c,id);
  else if(TYPE === "BREAKER") showBreaker(c,id);
  else showMotor(c,id);
}

/* ===== APPLY BUTTON STATE ===== */
function applyButtonState(id){
  const drawBtn = document.getElementById("drawBtn");
  const plcBtn = document.getElementById("plcBtn");

  if(drawBtn && !drawingAvailableMap[id]){
    drawBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="No Drawing";
    drawBtn.parentNode.insertBefore(badge, drawBtn.nextSibling);
  }

  if(plcBtn && !plcAvailableMap[id]){
    plcBtn.disabled = true;
    const badge = document.createElement("div");
    badge.className="badge";
    badge.innerText="No PLC Data";
    plcBtn.parentNode.insertBefore(badge, plcBtn.nextSibling);
  }
}

function openHistory(){
  const id = normalize(new URLSearchParams(location.search).get("id"));
  location.href =
  "https://08electricaldata.github.io/drive-viewer/mobile/history.html?id=" +
  encodeURIComponent(id);
}

/* ===== MOTOR ===== */
async function showMotor(c,id){
  content.innerHTML = `
  <div class="card">
    <h3>${c[1]} – ${c[2]}</h3>
    <div class="grid">
      <p><span class="label">Rating:</span> ${c[5]} KW</p>
      <p><span class="label">FLC:</span> ${c[10]} A</p>
      <p><span class="label">SFU:</span> ${c[14]}</p>
      <p><span class="label">Fuse:</span> ${c[15]}</p>
      <p><span class="label">Contactor:</span> ${c[16]}</p>
      <p><span class="label">Relay/VFD:</span> ${c[17]}</p>
      <p><span class="label">CT (M):</span> ${c[18]}</p>
      <p><span class="label">CT (P):</span> ${c[19]}</p>
      <p><span class="label">Aux Contactor:</span> ${c[20]}</p>
      <p><span class="label">Ammeter:</span> ${c[21]}</p>
      <p><span class="label">Ind Lamp:</span> ${c[22]}</p>
      <p><span class="label">Spare Motors:</span> ${c[23]}</p>
      <p><span class="label">Motor Repl:</span> ${formatDDMMYYYY(c[37])}</p>
      <p><span class="label">Motor PM:</span> ${formatDDMMYYYY(c[38])}</p>
      <p><span class="label">Module PM:</span> ${formatDDMMYYYY(c[39])}</p>
      <p><span class="label">VFD PM:</span> ${formatDDMMYYYY(c[40])}</p>
      <p><span class="label">Low Current:</span> ${c[41]} A</p>
      <p><span class="label">Location:</span> ${c[42]}</p>
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="openHistory()">📜 History</button>
      <button class="action-btn" id="drawBtn" onclick="openDrawings()">📐 Draw</button>
      <button class="action-btn" id="plcBtn" onclick="openPLC()">⚡ PLC</button>
      <button class="action-btn" onclick="openPLCLadder()">⚙ Ladder</button>
      <button class="action-btn" onclick="openMotorData()">🛠 Motor</button>
      <button class="action-btn" onclick="addJob()">➕ Job</button>
    </div>
  </div>`;

  applyButtonState(id);
}

/* ===== TRANSFORMER ===== */
async function showTransformer(c,id){
  const t = await lastDates(id,{
    pm:"TRANSFORMER PM",
    oh:"TRANSFORMER O/H",
    leak:"TRANSFORMER L/A",
    top:"OIL TUPOP",
    chk:"T/F OIL CHECK"
  });

  content.innerHTML = `
  <div class="card">
    <h3>Transformer – ${c[2]}</h3>
    <div class="grid">
      <p><span class="label">TR Sl No:</span> ${c[3]}</p>
      <p><span class="label">Make:</span> ${c[4]}</p>
      <p><span class="label">Rating:</span> ${c[5]} KVA</p>
      <p><span class="label">From S/S:</span> ${c[6]}</p>
      <p><span class="label">Unit S/S:</span> ${c[7]}</p>
      <p><span class="label">% Impedance:</span> ${c[8]}</p>
      <p><span class="label">LT SWBD:</span> ${c[9]}</p>
      <p><span class="label">Panel Rating:</span> ${c[10]}</p>
      <p><span class="label">Last TR PM:</span> ${t.pm}</p>
      <p><span class="label">Last TR O/H:</span> ${t.oh}</p>
      <p><span class="label">Last Oil L/A:</span> ${t.leak}</p>
      <p><span class="label">Last Oil T-Up:</span> ${t.top}</p>
      <p><span class="label">Last Oil Chk:</span> ${t.chk}</p>
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="openHistory()">📜 History</button>
      <button class="action-btn" id="drawBtn" onclick="openDrawings()">📐 Draw</button>
      <button class="action-btn" id="plcBtn" onclick="openPLC()">⚡ PLC</button>
      <button class="action-btn" onclick="addJob()">➕ Job</button>
      <button class="action-btn" style="visibility: hidden;"></button>
      <button class="action-btn" style="visibility: hidden;"></button>
    </div>
  </div>`;

  applyButtonState(id);
}

/* ===== BREAKER ===== */
async function showBreaker(c,id){
  const b = await lastDates(id,{ pm:"BREAKER PM" });

  content.innerHTML = `
  <div class="card">
    <h3>Breaker – ${c[2]}</h3>
    <div class="grid">
      <p><span class="label">Compartment:</span> ${c[3]}</p>
      <p><span class="label">Description:</span> ${c[4]}</p>
      <p><span class="label">Make:</span> ${c[5]}</p>
      <p><span class="label">Rating:</span> ${c[6]} A</p>
      <p><span class="label">Type:</span> ${c[7]}</p>
      <p><span class="label">LT SWBD:</span> ${c[9]}</p>
      <p><span class="label">Panel Rating:</span> ${c[10]}</p>
      <p><span class="label">Last BR PM:</span> ${b.pm}</p>
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="openHistory()">📜 History</button>
      <button class="action-btn" id="drawBtn" onclick="openDrawings()">📐 Draw</button>
      <button class="action-btn" id="plcBtn" onclick="openPLC()">⚡ PLC</button>
      <button class="action-btn" onclick="addJob()">➕ Job</button>
      <button class="action-btn" style="visibility: hidden;"></button>
      <button class="action-btn" style="visibility: hidden;"></button>
    </div>
  </div>`;

  applyButtonState(id);
}

/* ===== INIT ===== */
(async function(){
  await preloadDrawings();
  await preloadPLC();
  loadData();
})();
</script>

</body>
</html>
