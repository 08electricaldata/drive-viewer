<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drive History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Theme variables */
:root{
  --bg: #f6f9ff;
  --panel: #ffffff;
  --text: #0b2540;
  --muted: #6b7280;
  --accent: #1565d8;        /* primary blue */
  --accent-2: #0b79d0;      /* secondary blue */
  --pill-border: rgba(21,101,216,0.20);
  --pill-bg: linear-gradient(180deg,#f8fbff,#eef6ff);
  --card-border: rgba(21,101,216,0.10);
  --shadow: 0 10px 30px rgba(11,37,64,0.06);
  --danger: #d32f2f;
}

/* Reset / base */
*{box-sizing:border-box}
html,body{height:100%}
body {
  margin:0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background: linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
  color:var(--text);
  line-height:1.45;
}

/* Sticky header */
.header-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 18px;
  background: linear-gradient(90deg, rgba(21,101,216,0.06), rgba(11,37,64,0.02));
  border-bottom: 1px solid rgba(11,37,64,0.04);
  backdrop-filter: blur(6px);
  flex-wrap: wrap;
}

/* Header buttons (styled like action buttons) */
.header-bar .icon-btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:10px;
  background: linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  border: none;
  font-weight:700;
  box-shadow: 0 8px 20px rgba(21,101,216,0.12);
  cursor:pointer;
  transition: transform .14s ease, box-shadow .14s ease;
}
.header-bar .icon-btn:hover{ transform: translateY(-3px); box-shadow: 0 16px 40px rgba(21,101,216,0.12); }
.header-bar .icon-btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px dashed rgba(21,101,216,0.14);
  box-shadow: none;
  font-weight:600;
}

/* Header title / credit */
.header-title {
  flex:1;
  text-align:center;
  font-size:18px;
  font-weight:800;
  color:var(--accent);
}
.header-credit {
  font-size:13px;
  color:var(--muted);
  font-weight:600;
  white-space:nowrap;
}

.version-info {
  background:rgba(255,255,255,0.2); color:white;
  padding:6px 10px; border-radius:6px;
  font-size:12px; font-weight:bold;
}

.status-indicator {
  display:inline-block; width:8px; height:8px;
  border-radius:50%; background:#4caf50;
  margin-right:4px; animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}

/* Page container */
.page { max-width:1100px; margin:22px auto; padding:0 18px; }

/* Page headings */
h2, h3 {
  color: var(--accent);
  margin: 6px 0 12px 0;
  font-weight:800;
  text-align:center;
}
h2 { font-size:28px; }
h3 { font-size:18px; }

/* Card */
.card {
  position:relative;
  background:var(--panel);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  border: 1px solid var(--card-border);
  overflow:visible;
}

/* Accent stripe on left */
.card::before{
  content: "";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:6px;
  border-top-left-radius:14px;
  border-bottom-left-radius:14px;
  background: linear-gradient(180deg,var(--accent),var(--accent-2));
}

/* Grid for drive info */
.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:14px;
  margin-top:8px;
}

/* Data boxes (visible border + background) */
.grid p {
  margin:0;
  padding:14px;
  border-radius:12px;
  background: var(--pill-bg);
  border: 1.6px solid var(--pill-border);
  box-shadow: 0 8px 18px rgba(11,37,64,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:64px;
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  position:relative;
}

/* small left accent in each pill */
.grid p::before{
  content:"";
  display:inline-block;
  width:6px;
  height:38px;
  border-radius:4px;
  background: linear-gradient(180deg,var(--accent),var(--accent-2));
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
}

/* label and value inside pills */
.label { color:var(--accent); font-weight:800; display:block; margin-left:26px; }
.grid p .value { margin-left:26px; margin-top:6px; font-weight:700; color:#0f2333; }

/* hover for pills */
.grid p:hover{
  transform:translateY(-6px);
  box-shadow: 0 18px 36px rgba(11,37,64,0.10);
  border-color: rgba(21,101,216,0.34);
}

/* Controls */
.controls {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px;
}
.controls input{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid rgba(11,37,64,0.08);
  min-width:200px;
}
.controls .action-btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  background: linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  box-shadow: 0 10px 26px rgba(21,101,216,0.12);
  transition: transform .12s ease, box-shadow .12s ease;
}
.controls .action-btn:hover{ transform:translateY(-3px); box-shadow: 0 18px 36px rgba(21,101,216,0.12); }

/* Table styles (modern, readable) */
.table-wrap { overflow:auto; border-radius:10px; border:1px solid rgba(11,37,64,0.04); margin-top:6px; }
table {
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:14px;
  min-width:900px;
}
thead th {
  position:sticky;
  top:0;
  background: linear-gradient(180deg,var(--accent),var(--accent-2));
  color:#fff;
  padding:10px 12px;
  text-align:left;
  font-weight:800;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index:10;
}
tbody td {
  padding:10px 12px;
  border-bottom:1px solid rgba(11,37,64,0.04);
  background: #fff;
  vertical-align:middle;
}
tbody tr:nth-child(even) td{ background: #fbfeff; }
#historyTable th:nth-child(3),
#historyTable td:nth-child(3) {
  width:110px;
  white-space:nowrap;
  text-align:center;
}

/* YEAR ROW */
.year-row td {
  background: linear-gradient(180deg,#eef6ff,#e8f4ff);
  color: var(--accent);
  font-weight:900;
  text-align:center;
  padding:10px;
  border-bottom: 1px solid rgba(11,37,64,0.04);
}

/* Link button inside table */
.table-link {
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  background:rgba(21,101,216,0.08);
  color:var(--accent);
  font-weight:700;
  text-decoration:none;
  border:1px solid rgba(21,101,216,0.08);
}

/* Small helpers */
.empty-msg { text-align:center; padding:18px; color:var(--muted); }

/* Responsive */
@media (max-width:980px){
  .grid { grid-template-columns: 1fr 1fr; }
  table { min-width:700px; }
}
@media (max-width:640px){
  .grid { grid-template-columns: 1fr; }
  .header-credit { display:none; }
  .controls input{ min-width:120px; }
  .header-title { font-size:16px; }
  table { min-width:600px; font-size:13px; }
  .version-info{order:3; flex-basis:100%; margin-top:8px;}
}
</style>
</head>

<body>

<div class="header-bar">
  <button class="icon-btn" onclick="goHome()">🏠 Home</button>
  <button class="icon-btn" onclick="goBack()">⬅ Back</button>
  <button class="icon-btn" onclick="goDriveInfo()">ℹ️ Drive Info</button>

  <div class="header-title">Drive History</div>

  <div class="header-credit">
    Designed and Maintained by Rakesh Chandra Sethy
  </div>
  
  <div class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></div>
</div>

<div class="page">

  <h2>Drive Information</h2>

  <div id="driveInfo" class="card">
    Loading drive information…
  </div>

  <h2>History</h2>

  <div class="card">
    <div class="controls">
      <input id="search" placeholder="Search…" />
      <button class="action-btn" onclick="exportExcel()">Export CSV</button>
      <button class="action-btn" onclick="window.print()">Export PDF</button>
    </div>

    <div class="table-wrap card" style="padding:0;">
      <table id="historyTable" aria-describedby="history-caption">
        <thead>
          <tr>
            <th>TR NO</th>
            <th>MONTH</th>
            <th>DATE</th>
            <th>DETAILS OF JOB</th>
            <th>JOB TYPE</th>
            <th>JOB CATEGORY</th>
            <th>CARRIED OUT BY</th>
            <th>LINK</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING ===== */
const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
const DRIVE_JSON = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drive.json";
const JOBBOOK_JSON = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/jobbook.json";
const HISTORY_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];
const HISTORY_BASE = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/history/";

let currentVersion = "1.0.0";
const versionDisplayEl = document.getElementById("versionDisplay");

/* FETCH VERSION FOR CACHE BUSTING */
async function getVersion() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    currentVersion = data.version || "1.0.0";
    versionDisplayEl.textContent = currentVersion;
    console.log("✓ Version loaded:", currentVersion);
  } catch (err) {
    console.warn("Failed to load version file:", err);
    currentVersion = "1.0.0";
    versionDisplayEl.textContent = currentVersion;
  }
}

/* BUILD URLS WITH VERSION PARAM AND TIMESTAMP */
function buildUrl(baseUrl) {
  return `${baseUrl}?v=${currentVersion}&t=${Date.now()}`;
}

/* ===== NORMALIZE ===== */
function normalize(v){
  return String(v || "")
    .replace(/[–—?]/g, "-")
    .toUpperCase()
    .trim();
}

/* ===== ID ===== */
const rawId = new URLSearchParams(location.search).get("id");
const id = normalize(rawId);

/* ===== NAV ===== */
function goHome(){ location.href="https://08electricaldata.github.io/"; }
function goBack(){ history.back(); }
function goDriveInfo(){
  if(!id) return;
  location.href =
    "https://08electricaldata.github.io/drive-viewer/index2.html?id=" +
    encodeURIComponent(id);
}

/* ===== DRIVE INFO ===== */
async function loadDriveInfo(){
  if(!id) return;

  try {
    console.log(`📋 Loading drive info for ${id}...`);
    const startTime = performance.now();
    
    const r = await fetch(buildUrl(DRIVE_JSON));
    if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
    const j = await r.json();

    let c = null;
    j.rows.forEach(r => {
      if(normalize(`${r[1]}-${r[2]}`) === id) c = r;
    });

    if(!c){
      driveInfo.innerHTML="<div class='empty-msg'>Drive not found.</div>";
      return;
    }

    const loadTime = performance.now() - startTime;
    console.log(`✓ Drive info loaded in ${loadTime.toFixed(2)}ms`);

    const type = normalize(c[1]);

    if(type === "TRANSFORMER"){
      driveInfo.innerHTML=`
        <h3>Transformer No: ${c[2]}</h3>
        <div class="grid">
          <p><span class="label">TR Sl No:</span><span class="value">${c[3]||'—'}</span></p>
          <p><span class="label">Make:</span><span class="value">${c[4]||'—'}</span></p>
          <p><span class="label">Rating:</span><span class="value">${c[5] ? c[5] + ' KVA' : '—'}</span></p>
          <p><span class="label">From S/S:</span><span class="value">${c[6]||'—'}</span></p>
          <p><span class="label">Unit S/S:</span><span class="value">${c[7]||'—'}</span></p>
          <p><span class="label">% Impedance:</span><span class="value">${c[8]||'—'}</span></p>
          <p><span class="label">LT SWBD:</span><span class="value">${c[9]||'—'}</span></p>
          <p><span class="label">Panel Rating:</span><span class="value">${c[10]||'—'}</span></p>
        </div>`;
      return;
    }

    if(type === "BREAKER"){
      driveInfo.innerHTML=`
        <h3>Breaker – ${c[2]}</h3>
        <div class="grid">
          <p><span class="label">Compartment No:</span><span class="value">${c[3]||'—'}</span></p>
          <p><span class="label">Breaker Desc:</span><span class="value">${c[4]||'—'}</span></p>
          <p><span class="label">Make:</span><span class="value">${c[5]||'—'}</span></p>
          <p><span class="label">Rating:</span><span class="value">${c[6] ? c[6] + ' A' : '—'}</span></p>
          <p><span class="label">Type:</span><span class="value">${c[7]||'—'}</span></p>
          <p><span class="label">LT SWBD:</span><span class="value">${c[9]||'—'}</span></p>
          <p><span class="label">Panel Rating:</span><span class="value">${c[10]||'—'}</span></p>
        </div>`;
      return;
    }

    driveInfo.innerHTML=`
      <h3>${c[1]} – ${c[2]}</h3>
      <p><span class="label">Pump Type:</span> ${c[4]||'—'}</p>
      <div class="grid" style="margin-top:10px;">
        <p><span class="label">Rating:</span><span class="value">${c[5] ? c[5] + ' KW' : '—'}</span></p>
        <p><span class="label">FLC:</span><span class="value">${c[10]||'—'} A</span></p>
        <p><span class="label">SFU:</span><span class="value">${c[14]||'—'}</span></p>
        <p><span class="label">Fuse:</span><span class="value">${c[15]||'—'}</span></p>
        <p><span class="label">Contactor:</span><span class="value">${c[16]||'—'}</span></p>
        <p><span class="label">Relay:</span><span class="value">${c[17]||'—'}</span></p>
        <p><span class="label">CT (M):</span><span class="value">${c[18]||'—'}</span></p>
        <p><span class="label">CT (P):</span><span class="value">${c[19]||'—'}</span></p>
        <p><span class="label">Aux Contactor:</span><span class="value">${c[20]||'—'}</span></p>
      </div>`;
  } catch(e) {
    console.error("Error loading drive info:", e);
    driveInfo.innerHTML="<div class='empty-msg'>Error loading drive information.</div>";
  }
}

/* ===== DATE HELPERS ===== */
function normalizeDateKey(v){
  if(!v) return "";
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
  if(typeof v==="string" && v.startsWith("Date(")){
    const p=v.match(/\d+/g);
    const d=new Date(p[0],p[1],p[2]);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  }
  const d=new Date(v);
  if(!isNaN(d)){
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  }
  return "";
}

function formatDate(v){
  const key=normalizeDateKey(v);
  if(!key) return "";
  const[d,m,y]=key.split("/");
  return `${d}-${m}-${y}`;
}

/* ===== JOBBOOK (OPTIMIZED) ===== */
let jobBookMap = {};

async function loadJobBook(){
  try {
    console.log("📚 Loading jobbook...");
    const startTime = performance.now();
    
    const r = await fetch(buildUrl(JOBBOOK_JSON));
    if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
    const j = await r.json();
    
    j.rows.forEach(r => {
      const key = normalizeDateKey(r[0]);
      if(key && r[1]) jobBookMap[key] = r[1];
    });

    const loadTime = performance.now() - startTime;
    console.log(`✓ Jobbook loaded in ${loadTime.toFixed(2)}ms (${Object.keys(jobBookMap).length} entries)`);
  } catch(e) {
    console.error("Error loading job book:", e);
  }
}

/* ===== HISTORY (PARALLEL FETCHING) ===== */
async function loadHistory(){
  try {
    console.log("📜 Loading history...");
    const startTime = performance.now();
    
    /* Parallel fetch all history years */
    const promises = HISTORY_YEARS.map(y =>
      fetch(buildUrl(HISTORY_BASE + y + ".json"))
        .then(r => r.ok ? r.json() : null)
        .catch(e => {
          console.warn(`Failed to fetch ${y}:`, e);
          return null;
        })
    );

    const results = await Promise.all(promises);

    let all = [];

    results.forEach(j => {
      if(!j) return;
      (j.rows || []).forEach(row => {
        if(normalize(`${row[2]}-${row[3]}`) === id){
          all.push(row);
        }
      });
    });

    all.sort((a,b) => new Date(b[4]) - new Date(a[4]));

    const loadTime = performance.now() - startTime;
    console.log(`✓ History loaded in ${loadTime.toFixed(2)}ms (${all.length} records)`);

    renderHistory(all);
  } catch(e) {
    console.error("Error loading history:", e);
    const tbody = document.querySelector("#historyTable tbody");
    tbody.innerHTML = `<tr><td colspan="8" class="empty-msg">Error loading history</td></tr>`;
  }
}

function renderHistory(rows){
  const tbody = document.querySelector("#historyTable tbody");
  tbody.innerHTML = "";
  
  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="8" class="empty-msg">No history found</td></tr>`;
    return;
  }

  /* Use DocumentFragment for better DOM performance */
  const fragment = document.createDocumentFragment();
  let currentYear = "";

  rows.forEach(r => {
    const key = normalizeDateKey(r[4]);
    const y = key.slice(-4) || "UNKNOWN";

    if(y !== currentYear){
      currentYear = y;
      const yr = document.createElement("tr");
      yr.className = "year-row";
      yr.innerHTML = `<td colspan="8">YEAR ${y}</td>`;
      fragment.appendChild(yr);
    }

    const link = jobBookMap[key] || r[10];

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r[0]||""}</td>
      <td>${r[1]||""}</td>
      <td>${formatDate(r[4])}</td>
      <td>${r[5]||""}</td>
      <td>${r[6]||""}</td>
      <td>${r[7]||""}</td>
      <td>${r[9]||""}</td>
      <td>${link?`<a class="table-link" href="${link}" target="_blank" rel="noopener">Open</a>`:""}</td>`;
    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ===== SEARCH (OPTIMIZED) ===== */
document.getElementById("search").addEventListener("input", function(){
  const v = this.value.toLowerCase().trim();
  if(!v) {
    document.querySelectorAll("#historyTable tbody tr").forEach(tr => tr.style.display = "");
    return;
  }
  document.querySelectorAll("#historyTable tbody tr").forEach(tr => {
    // keep year rows always visible
    if(tr.classList.contains("year-row")) { 
      tr.style.display = "none"; 
      return; 
    }
    tr.style.display = tr.innerText.toLowerCase().includes(v) ? "" : "none";
  });
});

/* ===== EXPORT ===== */
function exportExcel(){
  const rows = [];
  document.querySelectorAll("#historyTable thead tr, #historyTable tbody tr").forEach(r => {
    if(r.classList.contains("year-row")) return; // skip year rows
    const cols = [...r.children].map(c => `"${c.innerText.replace(/"/g,'""')}"`);
    rows.push(cols.join(","));
  });
  
  if(rows.length <= 1) {
    alert("No data to export");
    return;
  }
  
  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `drive-history-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ===== INIT (PARALLEL LOADING) ===== */
(async function(){
  console.log("📥 Initializing drive history...");
  
  await getVersion();
  
  /* Load drive info and jobbook in parallel */
  await Promise.all([
    loadDriveInfo(),
    loadJobBook()
  ]);
  
  /* Then load history (depends on jobbook being loaded) */
  loadHistory();
})();

</script>

</body>
</html>
