<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pending Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#f4f7ff;}

/* HEADER */
.header{
  background:#003f88;
  color:#fff;
  padding:15px 10px;
}

.header-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.header-center{
  text-align:center;
  flex:1;
}

.header-center h1{
  margin:0;
  font-size:22px;
}

.header-center p{
  margin:3px 0 0;
  font-size:13px;
  font-weight:normal;
}

.header-btn{
  background:#fff;
  color:#003f88;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
  margin:3px;
}

.controls{
  padding:15px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  align-items:center;
}

select,input,button{
  padding:7px 10px;
  font-size:14px;
}

.summary{
  display:flex;
  gap:15px;
  justify-content:flex-end;
  padding:10px 15px 0 15px;
  flex-wrap:wrap;
}

.card{
  background:#fff;
  padding:12px 18px;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
  text-align:center;
  min-width:130px;
}

.card h3{margin:0;font-size:18px;}

.version-info{
  background:#fff;
  padding:6px 12px;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
  font-size:12px;
  color:#003f88;
  font-weight:bold;
}

.status-indicator{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#28a745;
  margin-right:6px;
}

.filter-panel{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:0 15px 15px;
}

.filter-group{
  display:flex;
  align-items:center;
  gap:6px;
  background:#fff;
  border:1px solid #d9dfe8;
  border-radius:6px;
  padding:6px 8px;
}

.filter-group label{
  font-size:12px;
  color:#003f88;
  font-weight:bold;
}

.table-wrapper{
  padding:10px;
  overflow:auto;
  max-height:60vh;
}

/* table */
table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
  table-layout:auto;
  min-width:100%;
}

th,td{
  border:1px solid #ccc;
  padding:8px 10px;
  white-space:nowrap;
  text-align:left;
  font-size:13px;
  vertical-align:top;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Allow Problems column to wrap */
th[data-col="Problems"],
td[data-col="Problems"]{
  white-space:normal;
  word-break:break-word;
  overflow-wrap:anywhere;
  text-overflow:clip;
  max-width:360px;
}

/* header style */
th{
  background:#003f88;
  color:#fff;
  position:sticky;
  top:0;
  z-index:2;
  text-align:left;
}

.badge{
  padding:4px 8px;
  border-radius:4px;
  color:#fff;
  font-weight:bold;
}

.completed{background:#28a745;}

/* Responsive tweaks */
@media (max-width:720px){
  th, td { padding:6px 8px; font-size:13px; }
  .controls{padding:8px;}
  .filter-panel{padding:0 8px 8px;}
  th[data-col="Problems"], td[data-col="Problems"] { max-width:260px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-bar">
    <div>
      <button class="header-btn" onclick="history.back()">⬅ Back</button>
      <button class="header-btn" onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
      <button class="header-btn" onclick="location.href='https://08electricaldata.github.io/drive-viewer/ersmasterdata.html'">🗂️ ERS Transactions</button>
    </div>

    <div class="header-center">
      <h1>Rewinding / Overhauling Dashboard</h1>
      <p>Designed and maintained by Rakesh Chandra Sethi</p>
    </div>

    <div></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <select id="typeSelect">
    <option value="rewinding">Rewinding</option>
    <option value="overhauling">Overhauling</option>
    <option value="scrap">SCRAP</option>
  </select>

  <div class="version-info"><span class="status-indicator"></span>Version: <span id="versionDisplay">—</span></div>

  <button onclick="exportCSV()">Export Excel</button>
</div>

<div class="summary">
  <div class="card"><h3 id="totalCount">0</h3><span>Total</span></div>
</div>

<div class="filter-panel">
  <div class="filter-group">
    <label>Filter 1</label>
    <select id="fieldSelect1">
      <option value="">Select field</option>
    </select>
    <input type="text" id="filterInput1" placeholder="Value">
  </div>

  <div class="filter-group">
    <label>Filter 2</label>
    <select id="fieldSelect2">
      <option value="">Select field</option>
    </select>
    <input type="text" id="filterInput2" placeholder="Value">
  </div>

  <div class="filter-group">
    <label>Filter 3</label>
    <select id="fieldSelect3">
      <option value="">Select field</option>
    </select>
    <input type="text" id="filterInput3" placeholder="Value">
  </div>
</div>

<div class="table-wrapper">
  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING SETUP ===== */
const VERSION_URL = 'https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json';
const AUTO_RELOAD_INTERVAL = 5 * 60 * 1000;

let currentVersion = '1.0.0';

/* ===== JSDELIVR CDN BASE URLS ===== */
const JSON_FILES_BASE = {
  rewinding: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/rewinding.json",
  overhauling: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/overhauling.json",
  scrap: "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/scrap.json"
};

function buildDataUrl(type) {
  return `${JSON_FILES_BASE[type]}?v=${currentVersion}`;
}

let currentData = [];
let headers = [];
let currentType = 'rewinding';

const select = document.getElementById("typeSelect");
const versionDisplayEl = document.getElementById("versionDisplay");

const fieldSelects = [
  document.getElementById("fieldSelect1"),
  document.getElementById("fieldSelect2"),
  document.getElementById("fieldSelect3")
];

const filterInputs = [
  document.getElementById("filterInput1"),
  document.getElementById("filterInput2"),
  document.getElementById("filterInput3")
];

const desiredDisplayCols = [
  "W.O No",
  "kW",
  "Make",
  "Frame Size",
  "Mounting",
  "RPM",
  "Sl No",
  "Equipment details",
  "Problems",
  "Job Completion Dat"
];

const excludedNames = ["voltage","area","storage","remarks","priority","columno","priorityassigned"];

function normalize(s){
  return String(s || "").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
}

/* Get latest version from version.json */
async function getVersion(){
  try {
    const res = await fetch(VERSION_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('Version fetch failed');
    const data = await res.json();
    currentVersion = data.version || '1.0.0';
    versionDisplayEl.textContent = currentVersion;
  } catch(err) {
    console.warn('Failed to fetch version, using default:', err);
    currentVersion = '1.0.0';
    versionDisplayEl.textContent = currentVersion;
  }
}

async function loadData(type){
  currentType = type;
  try{
    const url = buildDataUrl(type);
    console.log('Fetching from:', url);
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const json = await res.json();
    currentData = json.data || [];

    if(currentData.length === 0){
      headers = [];
      render();
      return;
    }

    headers = Object.keys(currentData[0] || {});
    populateFieldSelects();
  }catch(err){
    console.error("Error loading data:", err);
    currentData = [];
    headers = [];
    alert("Error loading data. Please refresh the page.");
  }
  render();
}

function populateFieldSelects(){
  const allFields = [];
  const mapped = buildOrderedKeys();

  if(mapped.every(k => k === null)){
    const fallback = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    fallback.forEach(h => allFields.push(h));
  } else {
    for(let i=0;i<desiredDisplayCols.length;i++){
      const key = mapped[i];
      if(key === null) continue;
      allFields.push(desiredDisplayCols[i]);
    }
  }

  const unique = [...new Set(allFields)];
  fieldSelects.forEach(sel => {
    const currentValue = sel.value;
    sel.innerHTML = '<option value="">Select field</option>';
    unique.forEach(field => {
      const opt = document.createElement("option");
      opt.value = field;
      opt.textContent = field;
      sel.appendChild(opt);
    });
    if (currentValue && unique.includes(currentValue)) sel.value = currentValue;
  });
}

function findKeyMatch(displayName){
  const n = normalize(displayName);

  for(const h of headers){
    if(normalize(h) === n) return h;
  }

  for(const h of headers){
    if(normalize(h).includes(n) || n.includes(normalize(h))) return h;
  }

  const tokens = n.split(/[^a-z0-9]+/).filter(Boolean);
  for(const h of headers){
    const hn = normalize(h);
    if(tokens.every(t => hn.includes(t))) return h;
  }

  return null;
}

function buildOrderedKeys(){
  const orderedKeys = [];

  for(const display of desiredDisplayCols){
    if(display.toLowerCase() === "job completion dat" && currentType === 'scrap'){
      if(headers && headers.length > 11 && headers[11]) {
        orderedKeys.push(headers[11]);
        continue;
      }
    }

    if(display.toLowerCase() === "problems"){
      const candidateNames = [
        "Motor Location Update On",
        "Motor Location Update",
        "Motor Location",
        "Motor Location Updated On",
        "motorlocationupdateon",
        "problem",
        "problems",
        "issue",
        "description"
      ];

      let found = null;
      for(const c of candidateNames){
        found = findKeyMatch(c);
        if(found) break;
      }
      orderedKeys.push(found || findKeyMatch(display) || null);
      continue;
    }

    orderedKeys.push(findKeyMatch(display) || null);
  }

  return orderedKeys.map(k => {
    if(!k) return k;
    const kn = normalize(k);
    for(const ex of excludedNames){
      if(kn.includes(ex)) return null;
    }
    return k;
  });
}

function getActiveFilters(){
  const filters = [];

  fieldSelects.forEach((sel, index) => {
    const field = sel.value;
    const text = (filterInputs[index].value || "").trim().toLowerCase();
    if(field && text){
      filters.push({ field, text });
    }
  });

  return filters;
}

function matchesFilters(row){
  const filters = getActiveFilters();

  if(filters.length === 0) return true;

  return filters.every(filter => {
    const value = String(row[filter.field] ?? "");
    return value.toLowerCase().includes(filter.text);
  });
}

function render(){
  const filtered = currentData.filter(row => matchesFilters(row)).slice().reverse();

  // build visible keys
  const mappedOrderedKeys = buildOrderedKeys();
  const allNull = mappedOrderedKeys.every(k => k === null);

  let keysForTable = [];
  let labelsForTable = [];

  if(allNull){
    keysForTable = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    labelsForTable = keysForTable.slice();
  } else {
    for(let i=0;i<desiredDisplayCols.length;i++){
      const key = mappedOrderedKeys[i];
      if(key === null) continue;
      keysForTable.push(key);
      labelsForTable.push(desiredDisplayCols[i]);
    }
  }

  buildTable("dataTable", filtered, keysForTable, labelsForTable);
  updateTotal(filtered.length);
}

function buildTable(id, data, keys, labels){
  const table = document.getElementById(id);
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");

  if(!data || data.length===0){
    thead.innerHTML = "";
    tbody.innerHTML = "<tr><td style='padding:12px'>No Data</td></tr>";
    return;
  }

  let head = "<tr>";
  for(let i=0;i<keys.length;i++){
    const display = labels[i] || keys[i];
    head += `<th data-col="${escapeHtml(display)}">${escapeHtml(display)}</th>`;
  }
  head += "</tr>";
  thead.innerHTML = head;

  tbody.innerHTML = "";
  data.forEach(row => {
    let tr = "<tr>";
    for(let i=0;i<keys.length;i++){
      const key = keys[i];
      let val = row[key] ?? "";

      if(String(val).toUpperCase().includes("COMPLETED")){
        tr += `<td data-col="${escapeHtml(key)}"><span class="badge completed">${escapeHtml(val)}</span></td>`;
      } else {
        const normalizedHeader = normalize(labels[i] || key);
        if(/problem|issue|description|motorlocation|remarks|comment/.test(normalizedHeader)){
          tr += `<td data-col="Problems">${escapeHtml(val)}</td>`;
        } else {
          tr += `<td data-col="${escapeHtml(key)}">${escapeHtml(val)}</td>`;
        }
      }
    }
    tr += "</tr>";
    tbody.insertAdjacentHTML("beforeend", tr);
  });
}

function updateTotal(count){
  document.getElementById("totalCount").innerText = count;
}

function exportCSV(){
  const mappedOrderedKeys = buildOrderedKeys();
  const allNull = mappedOrderedKeys.every(k => k === null);

  let exportKeys = [];
  let exportLabels = [];

  if(allNull){
    exportKeys = headers.filter(h => {
      const kn = normalize(h);
      return !excludedNames.some(ex => kn.includes(ex));
    });
    exportLabels = exportKeys.slice();
  } else {
    for(let i=0;i<desiredDisplayCols.length;i++){
      const key = mappedOrderedKeys[i];
      if(key === null) continue;
      exportKeys.push(key);
      exportLabels.push(desiredDisplayCols[i]);
    }
  }

  let csv = exportLabels.join(",") + "\n";
  currentData.filter(row => matchesFilters(row)).slice().reverse().forEach(r => {
    const row = exportKeys.map(k => `"${escapeCSV(String(r[k] ?? ""))}"`).join(",");
    csv += row + "\n";
  });

  const blob = new Blob([csv], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pending_data_filtered.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function escapeCSV(s){
  return s.replace(/"/g,'""');
}

select.addEventListener("change", () => loadData(select.value));
fieldSelects.forEach((sel, index) => {
  sel.addEventListener("change", render);
  filterInputs[index].addEventListener("keyup", render);
});

async function init(){
  await getVersion();
  await loadData(select.value);

  setInterval(async () => {
    console.log('Auto-refreshing data...');
    await getVersion();
    await loadData(select.value);
  }, AUTO_RELOAD_INTERVAL);
}

init();
</script>

</body>
</html>
