<div class="controls">
  <select id="typeSelect">
    <option value="rewinding">Rewinding</option>
    <option value="overhauling">Overhauling</option>
    <option value="scrap">SCRAP</option>
  </select>

  <div class="version-info"><span class="status-indicator"></span>Version: <span id="versionDisplay">—</span></div>

  <button onclick="exportCSV()">Export Excel</button>
</div>

<div class="summary">
  <div class="card"><h3 id="totalCount">0</h3><span>Total</span></div>
</div>

<div class="filter-row">
  <div class="filter-box">
    <label>Field</label>
    <select id="fieldSelect">
      <option value="all">All Fields</option>
    </select>
  </div>

  <div class="filter-box">
    <label>Search</label>
    <input type="text" id="searchBox" placeholder="Type to filter">
  </div>

  <button id="clearFiltersBtn">Clear</button>
</div>

<div class="table-wrapper">
  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>
