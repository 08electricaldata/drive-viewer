<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Industrial LT MCC Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f2f6ff;
}

/* HEADER */
.header{
  background:#003f88;
  color:white;
  padding:10px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  position:relative;
}

.header-title{
  font-size:22px;
  font-weight:700;
}

.subtitle{
  font-size:14px;
  margin-top:3px;
  font-weight:500;
}

/* NEW NAV BUTTONS */
.nav-buttons{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:10px;
}

.nav-btn{
  background:white;
  color:#003f88;
  border:none;
  padding:6px 12px;
  border-radius:5px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  transition:all .2s ease;
}

.nav-btn:hover{
  background:#ffd633;
  transform:scale(1.05);
}

/* BOARD AREA */
#boardWrapper{
  overflow:auto;
  padding:20px;
}

#boardContainer{
  display:flex;
  align-items:flex-start;
  position:relative;
  min-height:500px;
}

/* SECTIONS */
.section{
  background:white;
  border-radius:8px;
  box-shadow:0 6px 15px rgba(0,0,0,.25);
  margin-right:10px;
  display:flex;
  flex-direction:column;
  width:160px;
  height:600px;
}

.section-title{
  background:#003f88;
  color:white;
  text-align:center;
  font-weight:bold;
  padding:8px;
  font-size:14px;
  letter-spacing:.5px;
  flex-shrink:0;
}

/* BASE CELL */
.cell{
  border:2px solid #333;
  padding:8px;
  margin:6px;
  font-size:12px;
  border-radius:6px;
  cursor:pointer;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;

  box-shadow:
    0 4px 8px rgba(0,0,0,.25),
    inset 0 1px 2px rgba(255,255,255,.6);

  transition:all .25s ease;
}

.cell:hover{
  transform:scale(1.05);
  box-shadow:
    0 8px 16px rgba(0,0,0,.35),
    inset 0 1px 2px rgba(255,255,255,.7);
}

.incomer-box{
  font-size:14px;
  font-weight:bold;
}

.breaker-font{
  font-size:14px;
  font-weight:bold;
}

/* STATUS - SWAPPED: OFF is GREEN, ON is RED */
.status-on{
  border:4px solid #cc0000 !important;
  background: linear-gradient(180deg, rgba(255,220,220,0.12), rgba(255,255,255,0.02));
  box-shadow:
    0 8px 18px rgba(170,0,0,0.25),          
    0 2px 6px rgba(0,0,0,0.25),             
    inset 0 6px 12px rgba(200,0,0,0.08),    
    inset 0 -6px 10px rgba(255,255,255,0.04);
  position:relative;
  z-index:2;
  animation:glowPulseRed 2s infinite;
}

@keyframes glowPulseRed{
  0%{box-shadow:0 8px 18px rgba(170,0,0,0.18), inset 0 6px 12px rgba(200,0,0,0.06);}
  50%{box-shadow:0 12px 28px rgba(200,0,0,0.30), inset 0 8px 16px rgba(220,0,0,0.10);}
  100%{box-shadow:0 8px 18px rgba(170,0,0,0.18), inset 0 6px 12px rgba(200,0,0,0.06);}
}

/* OFF state — thick GREEN border + 3D effect */
.status-off{
  border:4px solid #00aa00 !important;
  background: linear-gradient(180deg, rgba(200,255,200,0.12), rgba(255,255,255,0.02));
  box-shadow:
    0 8px 18px rgba(0,150,0,0.25),
    0 2px 6px rgba(0,0,0,0.28),
    inset 0 6px 10px rgba(0,120,0,0.12),
    inset 0 -6px 10px rgba(255,255,255,0.03);
  position:relative;
  z-index:1;
  animation:glowPulseGreen 2s infinite;
}

@keyframes glowPulseGreen{
  0%{box-shadow:0 8px 18px rgba(0,150,0,0.18), inset 0 6px 12px rgba(0,120,0,0.06);}
  50%{box-shadow:0 12px 28px rgba(0,180,0,0.30), inset 0 8px 16px rgba(0,140,0,0.10);}
  100%{box-shadow:0 8px 18px rgba(0,150,0,0.18), inset 0 6px 12px rgba(0,120,0,0.06);}
}

/* Colors for feeder types */
.incomer{ background:#ff4d4d; color:#fff; }
.coupler{ background:#ffd633; color:#000; }
.outgoing-breaker{ background:#ff944d; color:#000; }

/* DOL color — bright blue */
.outgoing-dol{
  background:#1e90ff;
  color:#ffffff;
}

/* MCCB color */
.outgoing-mccb{ background:#b366ff; color:#fff; }

/* SFU color — teal */
.outgoing-sfu{
  background:#0d9488;
  color:#ffffff;
}

/* Outgoing ACB — deep burgundy */
.outgoing-acb{
  background:#7b0f1a;
  color:#ffffff;
  box-shadow: 0 6px 14px rgba(123,15,26,0.18), inset 0 2px 8px rgba(255,255,255,0.02);
}

/* Control Transformer — olive/green distinct color */
.control-transformer{
  background:#557a2b;
  color:#ffffff;
  box-shadow: 0 6px 12px rgba(85,122,43,0.12), inset 0 2px 6px rgba(255,255,255,0.03);
}

/* Spare variants */
.spare{ background:#e0e0e0; color:#333; }

/* Spare for DOL (pale warm) */
.spare-dol{
  background: linear-gradient(180deg,#fff3e0,#ffd6b3);
  color:#6b3f00;
  border:2px dashed #ffb86b;
  box-shadow: 0 6px 12px rgba(255,160,80,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
}

/* Spare for SFU (pale cool) */
.spare-sfu{
  background: linear-gradient(180deg,#e9f8ff,#cfefff);
  color:#004862;
  border:2px dashed #5fbfe6;
  box-shadow: 0 6px 12px rgba(80,180,220,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
}

/* coupler bridge style (unchanged) */
.coupler-bridge{
  position:absolute;
  width:6px;
  background:red;
  top:50px;
  height:70px;
  z-index:1;
  background:linear-gradient(to bottom, red 0%, yellow 50%, red 100%);
  background-size:100% 200%;
  animation:flowAnimation 1.5s linear infinite;
}

@keyframes flowAnimation{
  0%{background-position:0% 0%;}
  100%{background-position:0% 200%;}
}

/* print helper: hide nav buttons and shrink box shadows for print if needed */
@media print {
  .nav-buttons { display:none !important; }
  .header { box-shadow:none !important; }
  .section { box-shadow:none !important; }
}
</style>
</head>

<body>

<div class="header">

  <!-- NEW BUTTONS -->
  <div class="nav-buttons">
    <button class="nav-btn" onclick="goHome()">Home</button>
    <button class="nav-btn" onclick="goBack()">Back</button>
    <!-- Added buttons: Download Excel and Print A4 -->
    <button class="nav-btn" onclick="downloadExcel()">Download Excel</button>
    <button class="nav-btn" onclick="printA4()">Print A4</button>
  </div>

  <div class="header-title" id="title">Industrial LT MCC Layout</div>
  <div class="subtitle">
    Designed and Maintained by Rakesh Chandra Sethy
  </div>
</div>

<div id="boardWrapper">
  <div id="boardContainer"></div>
</div>

<!-- SheetJS (xlsx) library for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.7/dist/xlsx.full.min.js"></script>

<script>

function goHome(){
  window.location.href="https://08electricaldata.github.io/";
}

function goBack(){
  window.history.back();
}

const JSON_URL =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/sld/lt_sld.json";

function getParam(n){
  return new URL(location.href).searchParams.get(n);
}

/* helper to normalize type strings for robust matching */
function norm(s){
  if(!s && s!==0) return "";
  return String(s).toUpperCase().replace(/[\s\-]+/g,'').replace(/_/g,'');
}

/* escape HTML for safe insertion */
function escapeHtml(str){
  if(!str) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* parse driveid: returns { displayText, linkId }
   - if raw contains <SOME-ID> the linkId is SOME-ID and displayText is raw with the <...> removed
   - otherwise displayText is the raw trimmed string and linkId is null (so no navigation)
*/
function parseDriveId(raw){
  if(raw === null || raw === undefined) return { displayText: "", linkId: null };
  const s = String(raw).trim();
  const m = s.match(/<\s*([^>]+)\s*>/); // find first <...>
  if(m){
    const linkId = m[1].trim();
    const display = s.replace(/<\s*[^>]+\s*>/g, "") // remove all <> parts
                     .replace(/\s+/g," ").trim();   // collapse whitespace
    return { displayText: display || linkId, linkId: linkId };
  } else {
    return { displayText: s, linkId: null };
  }
}

/* Helper: convert hex color like "#ff4d4d" to XLSX ARGB "FFFF4D4D" */
function hexToARGB(hex){
  if(!hex) return "FFFFFFFF";
  hex = hex.trim();
  if(hex[0]==='#') hex = hex.slice(1);
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  hex = hex.toUpperCase();
  return "FF" + hex;
}

/* Map visual class to representative solid hex color (gradients mapped to a single color) */
function visualColorForDevice(cellElement){
  // check classes in order
  if(cellElement.classList.contains('incomer')) return '#ff4d4d';
  if(cellElement.classList.contains('coupler')) return '#ffd633';
  if(cellElement.classList.contains('outgoing-breaker')) return '#ff944d';
  if(cellElement.classList.contains('outgoing-dol')) return '#1e90ff';
  if(cellElement.classList.contains('outgoing-mccb')) return '#b366ff';
  if(cellElement.classList.contains('outgoing-sfu')) return '#0d9488';
  if(cellElement.classList.contains('outgoing-acb')) return '#7b0f1a';
  if(cellElement.classList.contains('control-transformer')) return '#557a2b';
  if(cellElement.classList.contains('spare-dol')) return '#ffd6b3';
  if(cellElement.classList.contains('spare-sfu')) return '#e9f8ff';
  if(cellElement.classList.contains('spare')) return '#e0e0e0';
  // fallback
  return '#ffffff';
}

/* Download the current board as an Excel workbook.
   Layout: each SECTION is a column; row 1 = SECTION title; subsequent rows are stacked devices.
   Colors and border are applied per device status and type for an approximate visual match.
*/
async function downloadExcel(){
  const boardId = getParam('id');
  if(!boardId) { alert('Board id missing in URL'); return; }

  try {
    const res = await fetch(JSON_URL);
    const data = await res.json();
    const board = data.boards[boardId];
    if(!board) { alert('Board not found'); return; }

    const sections = Object.keys(board.sections).sort((a,b)=>Number(a)-Number(b));
    // determine max devices in any section (to set rows)
    let maxDevices = 0;
    sections.forEach(sec=>{
      const list = (board.sections[sec]||[]);
      if(list.length > maxDevices) maxDevices = list.length;
    });

    // prepare worksheet object (A1-based)
    const ws = {};
    const range = { s: {c:0, r:0}, e: {c: Math.max(0, sections.length-1), r: Math.max(0, maxDevices)} };

    // set column widths
    const cols = sections.map(()=>({ wch: 28 })); // width in characters

    // fill sheet: section titles (row 0)
    sections.forEach((sec, colIdx)=>{
      const addr = XLSX.utils.encode_cell({c: colIdx, r: 0});
      const titleVal = "SECTION " + sec;
      ws[addr] = { v: titleVal, t: 's', s: {
        font: { bold: true, color: { rgb: hexToARGB('#FFFFFF') } },
        fill: { fgColor: { rgb: hexToARGB('#003f88') } },
        alignment: { horizontal: 'center', vertical: 'center', wrapText: true }
      }};
    });

    // populate device rows
    sections.forEach((sec, colIdx)=>{
      const devices = (board.sections[sec] || []).slice(); // array of device objects
      for(let rowIdx=0; rowIdx<maxDevices; rowIdx++){
        const addr = XLSX.utils.encode_cell({c: colIdx, r: rowIdx+1});
        const dev = devices[rowIdx];
        if(!dev){
          // empty cell
          ws[addr] = { v: "", t: 's', s: { alignment: { horizontal: 'center', vertical: 'center' } } };
          continue;
        }

        // build text similar to on-screen content
        const parsedDriveId = parseDriveId(dev.driveid);
        const displayDrive = (parsedDriveId.displayText || "");
        const position = dev.position || "";
        const hasDriveOrDevice = Boolean(dev.DriveType || dev.deviceType);

        let lowerLine;
        if((dev.feederType==="INCOMER" || dev.feederType==="BUS_COUPLER" || dev.breakerType) ){
          lowerLine = (dev.breakerType || "");
        } else {
          lowerLine = (dev.DriveType || dev.deviceType || "");
        }

        let text;
        if(!dev.feederType && !hasDriveOrDevice && (ws[addr].v === undefined)){
          text = (position ? position + "\n" : "") + "SPARE";
        } else {
          text = (position ? position + "\n" : "") +
                 (displayDrive ? displayDrive + "\n" : "") +
                 (lowerLine ? lowerLine : "");
        }

        // Create the cell with style approximating on-screen appearance
        const tempDiv = document.createElement('div');
        tempDiv.className = 'cell'; // to use visualColorForDevice detection
        // replicate classes used earlier for type detection
        const feeder = norm(dev.feederType);
        const breaker = norm(dev.breakerType);
        const drive = norm(dev.DriveType || dev.deviceType || "");
        if(dev.feederType && feeder === "INCOMER"){ tempDiv.classList.add('incomer'); }
        else if(feeder === "BUSCOUPLER"){ tempDiv.classList.add('coupler'); }
        else if(feeder === "OUTGOING"){
          if(String(dev.driveid||"").toUpperCase().includes("ACB") || breaker === "ACB" || drive === "ACB"){
            tempDiv.classList.add('outgoing-acb');
          } else if(breaker){
            tempDiv.classList.add('outgoing-breaker');
          } else if(drive === "DOL"){ tempDiv.classList.add('outgoing-dol'); }
          else if(drive === "MCCB"){ tempDiv.classList.add('outgoing-mccb'); }
          else if(drive === "SFU"){ tempDiv.classList.add('outgoing-sfu'); }
          else if(drive === "CONTROLTRANSFORMER" || drive === "CT"){
            tempDiv.classList.add('control-transformer');
          } else { tempDiv.classList.add('outgoing-dol'); }
        } else {
          // spare variants
          if(drive === "DOL") tempDiv.classList.add('spare-dol');
          else if(drive === "SFU") tempDiv.classList.add('spare-sfu');
          else tempDiv.classList.add('spare');
        }
        // set status class
        if(dev.status && String(dev.status).toUpperCase()==="ON"){
          tempDiv.classList.add('status-on');
        } else {
          tempDiv.classList.add('status-off');
        }

        const bg = visualColorForDevice(tempDiv);
        // border color depending on status
        const borderColor = tempDiv.classList.contains('status-on') ? '#cc0000' : '#00aa00';

        ws[addr] = { v: text, t: 's', s: {
          alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
          fill: { fgColor: { rgb: hexToARGB(bg) } },
          border: {
            top: { style: 'thin', color: { rgb: hexToARGB(borderColor) } },
            bottom: { style: 'thin', color: { rgb: hexToARGB(borderColor) } },
            left: { style: 'thin', color: { rgb: hexToARGB(borderColor) } },
            right: { style: 'thin', color: { rgb: hexToARGB(borderColor) } }
          },
          font: { bold: true, color: { rgb: hexToARGB('#222222') } }
        }};
      }
    });

    // set sheet range
    ws['!ref'] = XLSX.utils.encode_range(range);
    ws['!cols'] = cols;
    // set row heights: first row (title) shorter, devices taller
    const rows = [{ hpt: 22 }]; // hpt in points
    for(let i=0;i<maxDevices;i++){
      rows.push({ hpt: 48 });
    }
    ws['!rows'] = rows;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Board-' + boardId);

    const filename = 'Board-' + boardId + '.xlsx';
    XLSX.writeFile(wb, filename);
  } catch (err) {
    console.error(err);
    alert('Failed to generate Excel: ' + err.message);
  }
}

/* Print A4 landscape: open a new window with the board content and print it in A4 landscape.
   Keeps existing styles and adds @page A4 landscape declaration and scales to fit.
*/
function printA4(){
  const boardWrapper = document.getElementById('boardWrapper');
  if(!boardWrapper) { alert('Board not found'); return; }

  // collect styles from the current document (all <style> elements)
  let headHtml = '';
  const styles = document.querySelectorAll('style');
  styles.forEach(s=>{
    headHtml += '<style>' + s.innerHTML + '</style>';
  });

  // A4 landscape: width 297mm, height 210mm. Use small margins and scale to fit width.
  headHtml += `<style>
    @page { size: A4 landscape; margin: 10mm; }
    html, body { width:297mm; height:210mm; margin:0; padding:0; }
    .nav-buttons { display:none !important; }
    .section, .cell { box-shadow:none !important; }
    #boardContainer { transform-origin: top left; }
  </style>`;

  const newWin = window.open('', '_blank', 'top=50,left=50,width=1200,height=900');
  if(!newWin){
    alert('Popup blocked: allow popups for this site to print.');
    return;
  }

  const headerHtml = document.querySelector('.header').outerHTML;
  const bodyHtml = headerHtml + '<div style="padding:8px 12px;"><strong>' + escapeHtml(document.getElementById('title').innerText) + '</strong></div>' + boardWrapper.outerHTML;

  newWin.document.open();
  newWin.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Print - ' + escapeHtml(document.getElementById('title').innerText) + '</title>' + headHtml + '</head><body>' + bodyHtml + '</body></html>');
  newWin.document.close();

  // after content loads, attempt to scale the board to fit available A4 width (landscape)
  newWin.onload = function(){
    try {
      const bc = newWin.document.getElementById('boardContainer');
      if(bc){
        // approximate px/mm conversion (96dpi): 1mm ≈ 3.78px
        const mmToPx = (mm) => mm * 3.78;
        // printable width = A4 width (297mm) - left/right margins (2 * 10mm)
        const targetPx = mmToPx(297 - 20); // 277mm printable width
        const currentW = bc.scrollWidth || bc.offsetWidth || bc.getBoundingClientRect().width;
        const scale = Math.min(1, targetPx / currentW);
        bc.style.transform = 'scale(' + scale + ')';
      }
    } catch(e){
      // ignore
    }
    // small timeout to let layout settle
    setTimeout(()=>{ newWin.focus(); newWin.print(); }, 400);
  };
}

/* Main load function (unchanged logic) */
async function load(){

  const boardId=getParam("id");
  if(!boardId) return;

  document.getElementById("title").innerText =
  "Industrial LT MCC Layout - " + boardId;

  const res=await fetch(JSON_URL);
  const data=await res.json();

  const board=data.boards[boardId];
  if(!board) return;

  const container=document.getElementById("boardContainer");
  container.innerHTML="";

  const sections=Object.keys(board.sections)
    .sort((a,b)=>Number(a)-Number(b));

  const sectionWidth=160;
  container.style.width=(sections.length*sectionWidth)+"px";

  sections.forEach((sec,index)=>{

    const secDiv=document.createElement("div");
    secDiv.className="section";

    const title=document.createElement("div");
    title.className="section-title";
    title.innerText="SECTION "+sec;
    secDiv.appendChild(title);

    const devices=(board.sections[sec]||[])
      .sort((a,b)=> (a.level||"").localeCompare(b.level||""));

    devices.forEach(d=>{

      const cell=document.createElement("div");
      cell.className="cell";

      // status ON / OFF classes
      if(d.status && String(d.status).toUpperCase()==="ON"){
        cell.classList.add("status-on");
      }else{
        cell.classList.add("status-off");
      }

      const feeder = norm(d.feederType);
      const breaker = norm(d.breakerType);
      const drive = norm(d.DriveType || d.deviceType || "");

      // parse driveid now so we can inspect display text for 'ACB'
      const parsedDriveId = parseDriveId(d.driveid);
      const displayDriveRaw = (parsedDriveId.displayText || "").toUpperCase();

      // INCOMER
      if(feeder === "INCOMER"){
        cell.classList.add("incomer","incomer-box","breaker-font");
      }
      // BUS COUPLER
      else if(feeder === "BUSCOUPLER" || feeder === "BUSCOUPLER"){
        cell.classList.add("coupler","breaker-font");

        const bridge=document.createElement("div");
        bridge.className="coupler-bridge";
        bridge.style.left=(index*sectionWidth + 78)+"px";
        container.appendChild(bridge);
      }
      // OUTGOING
      else if(feeder === "OUTGOING"){

        // NEW: If drive display (outside <>) contains 'ACB' anywhere, treat as ACB and use outgoing-acb
        if(displayDriveRaw.includes("ACB")){
          cell.classList.add("outgoing-acb","breaker-font");
        }
        // If breakerType is ACB -> outgoing-acb (explicit)
        else if(breaker === "ACB"){
          cell.classList.add("outgoing-acb","breaker-font");
        }
        // other breaker types present -> outgoing-breaker
        else if(breaker){
          cell.classList.add("outgoing-breaker","breaker-font");
        }
        else {
          // No breakerType: decide by DriveType / deviceType
          if(drive === "DOL"){
            cell.classList.add("outgoing-dol");
          }
          else if(drive === "MCCB"){
            cell.classList.add("outgoing-mccb");
          }
          else if(drive === "SFU"){
            cell.classList.add("outgoing-sfu");
          }
          else if(drive === "ACB"){
            // drive labelled as ACB rather than breakerType
            cell.classList.add("outgoing-acb","breaker-font");
          }
          else if(drive === "CONTROLTRANSFORMER" || drive === "CT" || drive === "CONTROLTRANSFORMER"){
            // If the device itself is a control transformer
            cell.classList.add("control-transformer");
          }
          else{
            cell.classList.add("outgoing-dol");
          }
        }
      }
      // SPARE or other (not incomer/bus/outgoing)
      else{
        // spare handling: prefer DriveType/deviceType to pick spare variant
        if(drive === "DOL"){
          cell.classList.add("spare","spare-dol");
        } else if(drive === "SFU"){
          cell.classList.add("spare","spare-sfu");
        } else {
          cell.classList.add("spare");
        }
      }

      // Additionally, if DriveType specifically indicates CONTROL TRANSFORMER anywhere, ensure its color
      if(d.DriveType && norm(d.DriveType).includes("CONTROLTRANSFORMER")){
        cell.classList.remove("outgoing-dol","outgoing-sfu","outgoing-mccb","outgoing-breaker","outgoing-acb");
        cell.classList.add("control-transformer");
      } else if(d.deviceType && norm(d.deviceType).includes("CONTROLTRANSFORMER")){
        cell.classList.remove("outgoing-dol","outgoing-sfu","outgoing-mccb","outgoing-breaker","outgoing-acb");
        cell.classList.add("control-transformer");
      }

      // --- new parsing behavior for driveid in column D ---
      const parsed = parsedDriveId;
      const displayDrive = escapeHtml(parsed.displayText || "");
      const linkDrive = parsed.linkId; // null if no <...>

      // content: build using parsed displayDrive
      let contentText;
      const hasDriveOrDevice = Boolean(d.DriveType || d.deviceType);

      if(cell.classList.contains("spare") && !hasDriveOrDevice && !d.feederType){
        contentText = "<b>"+(d.position || "")+"</b><br>SPARE";
      } else {
        contentText =
          "<b>"+(d.position || "")+"</b><br>"+
          "<div style='font-size:13px;line-height:1.1;min-height:28px;'>"+ displayDrive + "</div>"+
          "<div style='margin-top:6px;font-weight:600;color:#222;'>"+
          (
            (d.feederType==="INCOMER" ||
             d.feederType==="BUS_COUPLER" ||
             d.breakerType)
            ? (d.breakerType || "")
            : (d.DriveType || d.deviceType || "")
          ) + "</div>";
      }

      cell.innerHTML = contentText;

      // set click target only if linkDrive exists (i.e., <...> was present)
      if(linkDrive){
        cell.style.cursor = "pointer";
        cell.onclick=function(){
          const id = encodeURIComponent(linkDrive);
          location.href=
          "https://08electricaldata.github.io/drive-viewer/index2.html?id="+ id;
        };
      } else {
        // remove any pointer cursor if present and prevent navigation
        cell.style.cursor = "default";
        cell.onclick = null;
      }

      secDiv.appendChild(cell);
    });

    container.appendChild(secDiv);
  });
}

load();

</script>
</body>
</html>
