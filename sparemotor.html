<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spare List — ERS</title>
<style>
  :root{
    --brand:#0d47a1;
    --muted:#6b7280;
    --table-font-size:13px; /* overridden dynamically */
    --cell-padding:8px;     /* overridden dynamically on desktop */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eef6ff,#f7fbff);color:#07203a}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--brand),#0052cc);color:#fff;padding:12px;display:flex;gap:10px;align-items:center}
  .btn{background:#fff;color:var(--brand);border:0;padding:8px 10px;border-radius:8px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .title{flex:1;text-align:center;font-weight:800;font-size:16px}
  main{padding:12px;max-width:1400px;margin:0 auto}
  .meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .count{background:#fff;padding:10px;border-radius:8px;box-shadow:0 8px 20px rgba(3,63,136,0.04);font-weight:800}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .filter{
    display:flex;flex-direction:column;min-width:120px;
    background:#fff;padding:8px;border-radius:8px;box-shadow:0 8px 18px rgba(3,63,136,0.04)
  }
  .filter label{font-size:11px;color:#0b3b74;font-weight:800;margin-bottom:6px}
  .filter input{padding:8px;border:1px solid #e6f0ff;border-radius:6px}
  .controls{display:flex;gap:8px;align-items:center;margin-top:8px}
  .clear-btn{background:#f3f4f6;border:1px solid #e6eefb;padding:8px 10px;border-radius:6px;cursor:pointer}
  .search-info{color:var(--muted);font-size:13px;margin-left:auto}

  .table-wrap{background:#fff;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(3,63,136,0.05)}
  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed; /* ensure fixed layout so columns share width */
  }
  thead th, tbody td{
    padding:var(--cell-padding);
    border:1px solid #eef4ff;
    font-size:var(--table-font-size);
    text-align:left;
    vertical-align:top;
    white-space:normal; /* allow wrapping */
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  thead th{
    position:sticky;top:0;background:linear-gradient(90deg,#003f88,#0052cc);color:#fff;z-index:2;
    font-weight:800;
  }
  tr:nth-child(even){background:#fbfdff}
  .no-data{padding:18px;text-align:center;color:#b91c1c;font-weight:800}

  @media(min-width:1100px){
    :root{
      --cell-padding:6px;
    }
  }

  @media(max-width:900px){
    table{table-layout:auto}
    thead th, tbody td{font-size:13px;padding:8px}
    .filter{min-width:160px}
  }
</style>
</head>
<body>
<header>
  <button class="btn" onclick="history.back()" aria-label="Back">⬅ Back</button>
  <div class="title">Spare List — Filter & Search</div>
  <button class="btn" onclick="location.href='https://08electricaldata.github.io/'" aria-label="Home">🏠 Home</button>
</header>

<main>
  <div class="meta">
    <div class="count">Total rows: <span id="totalRows">0</span></div>
    <div class="count">Showing: <span id="shownRows">0</span></div>
    <div class="search-info" id="statusMsg">Loading...</div>
  </div>

  <div id="filters" class="filters" aria-live="polite"></div>

  <div class="controls">
    <button class="clear-btn" id="clearFiltersBtn">Clear filters</button>
    <div style="margin-left:auto;color:var(--muted);font-size:13px">Type or pick a value to filter</div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table id="dataTable" role="table" aria-label="Spare list table">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script>
const SOURCE_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/sparelist.json";

// For array-of-arrays shape use these indexes (0-based)
const HEADER_ROW_INDEX_FOR_ROWS = 10; // 11th row
const DATA_START_INDEX_FOR_ROWS  = 11; // 12th row

let headers = [];
let dataRows = []; // array of objects

const totalRowsEl = document.getElementById('totalRows');
const shownRowsEl = document.getElementById('shownRows');
const statusMsg = document.getElementById('statusMsg');
const filtersDiv = document.getElementById('filters');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const clearFiltersBtn = document.getElementById('clearFiltersBtn');

const filters = {}; // key -> selected value (string)

// columns to exclude from display
const EXCLUDE_HEADERS = ['col16','col17','rownumber']; // normalized names

function normalizeKey(s){
  return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
}

function escapeHtml(s){
  return String(s===undefined||s===null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function uniqueValuesForColumn(col){
  const set = new Set();
  dataRows.forEach(r => {
    const v = r[col];
    if(v !== undefined && v !== null && String(v).trim() !== '') set.add(String(v));
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
}

function createFilters(){
  filtersDiv.innerHTML = '';
  headers.forEach((h, idx) => {
    const col = h || `Col${idx+1}`;
    const container = document.createElement('div');
    container.className = 'filter';
    const label = document.createElement('label');
    label.textContent = col;
    const input = document.createElement('input');
    input.setAttribute('list', 'dl-'+idx);
    input.placeholder = 'type or pick';
    input.autocomplete = 'off';
    input.addEventListener('input', () => {
      const v = input.value.trim();
      if(v) filters[col] = v; else delete filters[col];
      renderFilteredTable();
    });
    const datalist = document.createElement('datalist');
    datalist.id = 'dl-'+idx;
    const opts = uniqueValuesForColumn(col);
    const optAll = document.createElement('option');
    optAll.value = '';
    datalist.appendChild(optAll);
    opts.forEach(val => {
      const opt = document.createElement('option');
      opt.value = val;
      datalist.appendChild(opt);
    });
    container.appendChild(label);
    container.appendChild(input);
    container.appendChild(datalist);
    filtersDiv.appendChild(container);
  });
}

function renderTableHeader(){
  if(!headers || headers.length===0){
    tableHead.innerHTML = '';
    return;
  }
  const tr = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    const n = String(h||'').toLowerCase();
    if(/problem|issue|description|motorlocation|remarks|comment/.test(n)){
      th.setAttribute('data-col','Problems');
    } else {
      th.setAttribute('data-col', h);
    }
    tr.appendChild(th);
  });
  tableHead.innerHTML = '';
  tableHead.appendChild(tr);
  applyDynamicTableStyling(headers.length);
}

function rowMatchesFilters(rowObj){
  for(const key in filters){
    const want = String(filters[key]||'').toLowerCase();
    if(!want) continue;
    const val = String(rowObj[key]===undefined||rowObj[key]===null ? '' : rowObj[key]).toLowerCase();
    if(!val.includes(want)) return false;
  }
  return true;
}

function renderFilteredTable(){
  tableBody.innerHTML = '';
  let shown = 0;
  const frag = document.createDocumentFragment();
  dataRows.forEach((rowObj) => {
    if(!rowMatchesFilters(rowObj)) return;
    shown++;
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const td = document.createElement('td');
      const raw = rowObj[h];
      const text = escapeHtml(raw);
      td.innerHTML = String(text).replace(/\n/g,'<br>');
      const n = String(h||'').toLowerCase();
      if(/problem|issue|description|motorlocation|remarks|comment/.test(n)){
        td.setAttribute('data-col','Problems');
      } else {
        td.setAttribute('data-col', h);
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tableBody.appendChild(frag);
  totalRowsEl.textContent = dataRows.length;
  shownRowsEl.textContent = shown;
  statusMsg.textContent = shown === 0 ? 'No rows match filters' : 'Showing matching rows';
}

clearFiltersBtn.addEventListener('click', ()=>{
  filtersDiv.querySelectorAll('input').forEach(i=>i.value='');
  for(const k in filters) delete filters[k];
  renderFilteredTable();
});

// dynamically add style to control column widths and font-size
function applyDynamicTableStyling(colCount){
  colCount = Math.max(1, colCount || 1);
  let fontSize;
  if(colCount <= 8) fontSize = 14;
  else if(colCount <= 12) fontSize = 12;
  else if(colCount <= 16) fontSize = 11;
  else if(colCount <= 20) fontSize = 10;
  else fontSize = 9;
  const padding = (colCount > 12) ? '6px' : '8px';
  const pct = (100 / colCount).toFixed(6) + '%';
  let widths = '';
  for(let i=1;i<=colCount;i++){
    widths += `#dataTable th:nth-child(${i}), #dataTable td:nth-child(${i}){width:${pct};}\n`;
  }
  const styleId = 'dynamic-table-style';
  let styleEl = document.getElementById(styleId);
  const css = `
    :root{--table-font-size:${fontSize}px; --cell-padding:${padding};}
    ${widths}
  `;
  if(styleEl){
    styleEl.textContent = css;
  } else {
    styleEl = document.createElement('style');
    styleEl.id = styleId;
    styleEl.textContent = css;
    document.head.appendChild(styleEl);
  }
}

async function loadAndBuild(){
  statusMsg.textContent = 'Loading sparelist...';
  try{
    const res = await fetch(SOURCE_URL);
    if(!res.ok) throw new Error('Fetch failed ' + res.status);
    const json = await res.json();
    console.log('Loaded JSON keys:', Object.keys(json));

    let parsedHeaders = [];
    let parsedRows = [];

    if(json && Array.isArray(json.data) && json.data.length && typeof json.data[0] === 'object' && !Array.isArray(json.data[0])){
      console.log('Detected json.data array-of-objects shape');
      parsedRows = json.data.filter(r => Object.values(r).some(v => v !== "" && v !== null && v !== undefined));
      parsedHeaders = Object.keys(parsedRows[0] || {});
    }
    else if(json && Array.isArray(json.rows) && json.rows.length && Array.isArray(json.rows[0])){
      console.log('Detected json.rows array-of-arrays shape');
      const rawRows = json.rows;
      if(rawRows.length <= HEADER_ROW_INDEX_FOR_ROWS){
        statusMsg.textContent = `Not enough rows in JSON (need at least ${HEADER_ROW_INDEX_FOR_ROWS+1}). Found ${rawRows.length}.`;
        return;
      }
      parsedHeaders = rawRows[HEADER_ROW_INDEX_FOR_ROWS].map(h => String(h===undefined||h===null ? '' : h));
      for(let i = DATA_START_INDEX_FOR_ROWS; i < rawRows.length; i++){
        const r = rawRows[i];
        if(!r) continue;
        const obj = {};
        for(let c=0;c<parsedHeaders.length;c++){
          const key = parsedHeaders[c] || `Col${c+1}`;
          obj[key] = (Array.isArray(r) ? (r[c] === undefined ? '' : r[c]) : r[key] === undefined ? '' : r[key]);
        }
        if(Object.values(obj).some(v => v !== "" && v !== null && v !== undefined)) parsedRows.push(obj);
      }
    }
    else if(json && Array.isArray(json.data) && json.data.length && Array.isArray(json.data[0])){
      console.log('Detected json.data array-of-arrays shape');
      const rawRows = json.data;
      if(rawRows.length <= HEADER_ROW_INDEX_FOR_ROWS){
        statusMsg.textContent = `Not enough rows in JSON (need at least ${HEADER_ROW_INDEX_FOR_ROWS+1}). Found ${rawRows.length}.`;
        return;
      }
      parsedHeaders = rawRows[HEADER_ROW_INDEX_FOR_ROWS].map(h => String(h===undefined||h===null ? '' : h));
      for(let i = DATA_START_INDEX_FOR_ROWS; i < rawRows.length; i++){
        const r = rawRows[i];
        if(!r) continue;
        const obj = {};
        for(let c=0;c<parsedHeaders.length;c++){
          const key = parsedHeaders[c] || `Col${c+1}`;
          obj[key] = r[c] === undefined ? '' : r[c];
        }
        if(Object.values(obj).some(v => v !== "" && v !== null && v !== undefined)) parsedRows.push(obj);
      }
    }
    else {
      let found = false;
      for(const k in json){
        if(Array.isArray(json[k]) && json[k].length && typeof json[k][0] === 'object' && !Array.isArray(json[k][0])){
          console.log('Detected array-of-objects under key', k);
          parsedRows = json[k].filter(r => Object.values(r).some(v => v !== "" && v !== null && v !== undefined));
          parsedHeaders = Object.keys(parsedRows[0] || {});
          found = true;
          break;
        }
      }
      if(!found){
        statusMsg.textContent = 'Unable to find usable data array in JSON.';
        console.warn('JSON structure not recognized', json);
        return;
      }
    }

    // Filter out excluded columns (Col16, Col17, rowNumber) by normalized name
    const excludeSet = new Set(EXCLUDE_HEADERS);
    const filteredHeaders = parsedHeaders.filter(h => {
      const n = normalizeKey(h);
      return !excludeSet.has(n);
    });

    // Rebuild dataRows ensuring only filtered headers are present (preserve original header names)
    dataRows = parsedRows.map(r => {
      const obj = {};
      filteredHeaders.forEach(h => { obj[h] = r[h]; });
      return obj;
    });

    headers = filteredHeaders.map(h => String(h));

    console.log('Final headers count:', headers.length, 'Data rows:', dataRows.length);
    if(!headers || headers.length === 0 || !dataRows || dataRows.length === 0){
      statusMsg.textContent = 'No usable header or data rows found after parsing JSON.';
      return;
    }

    createFilters();
    renderTableHeader();
    renderFilteredTable();
    statusMsg.textContent = 'Loaded';
  }catch(err){
    console.error(err);
    statusMsg.textContent = 'Load failed: ' + (err.message||err);
  }
}

loadAndBuild();

</script>
</body>
</html>
