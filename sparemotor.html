<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spare List — Filterable Table</title>
<style>
  :root{--brand:#0d47a1;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#eef6ff,#f7fbff);color:#07203a}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--brand),#0052cc);color:#fff;padding:12px;display:flex;gap:10px;align-items:center}
  .btn{background:#fff;color:var(--brand);border:0;padding:8px 10px;border-radius:8px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .title{flex:1;text-align:center;font-weight:800;font-size:16px}
  main{padding:12px;max-width:1200px;margin:0 auto}
  .meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .count{background:#fff;padding:10px;border-radius:8px;box-shadow:0 8px 20px rgba(3,63,136,0.04);font-weight:800}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .filter{
    display:flex;flex-direction:column;min-width:120px;
    background:#fff;padding:8px;border-radius:8px;box-shadow:0 8px 18px rgba(3,63,136,0.04)
  }
  .filter label{font-size:11px;color:#0b3b74;font-weight:800;margin-bottom:6px}
  .filter input{padding:8px;border:1px solid #e6f0ff;border-radius:6px}
  .controls{display:flex;gap:8px;align-items:center;margin-top:8px}
  .clear-btn{background:#f3f4f6;border:1px solid #e6eefb;padding:8px 10px;border-radius:6px;cursor:pointer}
  .search-info{color:var(--muted);font-size:13px;margin-left:auto}

  .table-wrap{overflow:auto;background:#fff;border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(3,63,136,0.05)}
  table{width:100%;border-collapse:collapse;min-width:800px}
  th,td{padding:8px 10px;border:1px solid #eef4ff;font-size:13px;text-align:left;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  thead th{position:sticky;top:0;background:linear-gradient(90deg,#003f88,#0052cc);color:#fff;z-index:2}
  th[data-col="Problems"], td[data-col="Problems"]{white-space:normal;word-break:break-word;overflow-wrap:anywhere;max-width:360px}
  tr:nth-child(even){background:#fbfdff}
  .no-data{padding:18px;text-align:center;color:#b91c1c;font-weight:800}

  @media(max-width:760px){
    .filter{min-width:160px}
    table{min-width:100%}
  }
</style>
</head>
<body>
<header>
  <button class="btn" onclick="history.back()" aria-label="Back">⬅ Back</button>
  <div class="title">Spare List — Filter & Search</div>
  <button class="btn" onclick="location.href='https://08electricaldata.github.io/'" aria-label="Home">🏠 Home</button>
</header>

<main>
  <div class="meta">
    <div class="count">Total rows: <span id="totalRows">0</span></div>
    <div class="count">Showing: <span id="shownRows">0</span></div>
    <div class="search-info" id="statusMsg">Loading...</div>
  </div>

  <div id="filters" class="filters" aria-live="polite"></div>

  <div class="controls">
    <button class="clear-btn" id="clearFiltersBtn">Clear filters</button>
    <div style="margin-left:auto;color:var(--muted);font-size:13px">Use any field input (type or pick) to filter the table</div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table id="dataTable" role="table" aria-label="Spare list table">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script>
const SOURCE_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/sparelist.json";

const IGNORE_FIRST = 10; // ignore rows 0..9
const HEADER_ROW_INDEX = 10; // 11th row (index 10) is header
const DATA_START_INDEX = 11; // rows from index 11 onwards are data

let rawRows = [];      // array-of-arrays or array-of-objects depending on JSON
let headers = [];      // array of header strings
let dataRows = [];     // array of objects { header: value }

const totalRowsEl = document.getElementById('totalRows');
const shownRowsEl = document.getElementById('shownRows');
const statusMsg = document.getElementById('statusMsg');
const filtersDiv = document.getElementById('filters');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const clearFiltersBtn = document.getElementById('clearFiltersBtn');

const filters = {}; // key -> selected value (string)

function escapeHtml(s){
  return String(s===undefined||s===null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function detectAndNormalize(json){
  // Prefer json.rows if exists
  if(json && Array.isArray(json.rows) && json.rows.length){
    // rows could be array-of-arrays or array-of-objects
    if(Array.isArray(json.rows[0])){
      rawRows = json.rows;
    } else if(typeof json.rows[0] === 'object'){
      // convert array-of-objects to rows-of-arrays using their keys order
      // but we want to preserve rawRows in array-of-arrays form for ignoring first rows
      // So build rows array with header row as keys and subsequent rows as values
      const keys = Object.keys(json.rows[0]);
      rawRows = [];
      // optionally if json.headers exist, we might use them
      if(Array.isArray(json.headers) && json.headers.length>=1){
        // create header row from json.headers then rows as arrays
        rawRows = [json.headers];
        json.rows.forEach(obj => rawRows.push(keys.map(k=>obj[k]));
      } else {
        rawRows = [keys];
        json.rows.forEach(obj => rawRows.push(keys.map(k=>obj[k])));
      }
    }
    return;
  }

  // If json.data exists and is array-of-objects or array-of-arrays
  if(json && Array.isArray(json.data) && json.data.length){
    if(Array.isArray(json.data[0])){
      rawRows = json.data;
      return;
    } else if(typeof json.data[0] === 'object'){
      // build rows: use keys as header row then values
      const keys = Object.keys(json.data[0]);
      rawRows = [keys];
      json.data.forEach(obj => rawRows.push(keys.map(k=>obj[k]));
      return;
    }
  }

  // If json itself is an array-of-objects (some sheets use that)
  if(Array.isArray(json) && json.length && typeof json[0] === 'object'){
    const keys = Object.keys(json[0]);
    rawRows = [keys];
    json.forEach(obj => rawRows.push(keys.map(k=>obj[k])));
    return;
  }

  // Fallback: find first array inside object
  for(const k in json){
    if(Array.isArray(json[k]) && json[k].length){
      const arr = json[k];
      if(Array.isArray(arr[0])){
        rawRows = arr;
        return;
      } else if(typeof arr[0] === 'object'){
        const keys = Object.keys(arr[0]);
        rawRows = [keys];
        arr.forEach(o => rawRows.push(keys.map(k=>o[k])));
        return;
      }
    }
  }

  // nothing usable
  rawRows = [];
}

// Build headers/dataRows from rawRows following the rule: ignore first 10 rows; 11th is header; rest are data
function buildTableFromRawRows(){
  headers = [];
  dataRows = [];
  if(!rawRows || rawRows.length <= HEADER_ROW_INDEX){
    statusMsg.textContent = 'No usable rows found in JSON (not enough rows).';
    return;
  }
  const hdrRow = rawRows[HEADER_ROW_INDEX];
  // If hdrRow is an object? Usually rows are arrays. If object, convert keys to array:
  if(!Array.isArray(hdrRow) && typeof hdrRow === 'object'){
    headers = Object.values(hdrRow).map(v => String(v||''));
  } else {
    headers = hdrRow.map(h => String(h===undefined||h===null ? '' : h));
  }

  // Build data rows: for i >= DATA_START_INDEX
  for(let i = DATA_START_INDEX; i < rawRows.length; i++){
    const r = rawRows[i];
    if(!r) continue;
    // convert to object keyed by headers
    const obj = {};
    for(let c=0;c<headers.length;c++){
      const key = headers[c] || `Col${c+1}`;
      const val = Array.isArray(r) ? (r[c] === undefined ? '' : r[c]) : (r[key] === undefined ? '' : r[key]);
      obj[key] = val;
    }
    dataRows.push(obj);
  }
}

function uniqueValuesForColumn(col){
  const set = new Set();
  dataRows.forEach(r => {
    const v = r[col];
    if(v !== undefined && v !== null && String(v).trim() !== '') set.add(String(v));
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
}

function createFilters(){
  filtersDiv.innerHTML = '';
  headers.forEach((h, idx) => {
    const col = h || `Col${idx+1}`;
    const container = document.createElement('div');
    container.className = 'filter';
    const label = document.createElement('label');
    label.textContent = col;
    const input = document.createElement('input');
    input.setAttribute('list', 'dl-'+idx);
    input.placeholder = 'type or pick';
    input.autocomplete = 'off';
    input.addEventListener('input', () => {
      const v = input.value.trim();
      if(v) filters[col] = v; else delete filters[col];
      renderFilteredTable();
    });
    // datalist
    const datalist = document.createElement('datalist');
    datalist.id = 'dl-'+idx;
    const opts = uniqueValuesForColumn(col);
    // add small "All" option
    const optAll = document.createElement('option');
    optAll.value = '';
    datalist.appendChild(optAll);
    opts.forEach(val => {
      const opt = document.createElement('option');
      opt.value = val;
      datalist.appendChild(opt);
    });
    container.appendChild(label);
    container.appendChild(input);
    container.appendChild(datalist);
    filtersDiv.appendChild(container);
  });
}

function renderTableHeader(){
  if(!headers || headers.length===0){
    tableHead.innerHTML = '';
    return;
  }
  const tr = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    // mark Problems-like column for wrapping
    const n = String(h||'').toLowerCase();
    if(/problem|issue|description|motorlocation|remarks|comment/.test(n)){
      th.setAttribute('data-col','Problems');
    } else {
      th.setAttribute('data-col', h);
    }
    tr.appendChild(th);
  });
  tableHead.innerHTML = '';
  tableHead.appendChild(tr);
}

function rowMatchesFilters(rowObj){
  for(const key in filters){
    const want = String(filters[key]||'').toLowerCase();
    if(!want) continue;
    const val = String(rowObj[key]===undefined||rowObj[key]===null ? '' : rowObj[key]).toLowerCase();
    // allow partial match
    if(!val.includes(want)) return false;
  }
  return true;
}

function renderFilteredTable(){
  tableBody.innerHTML = '';
  let shown = 0;
  const frag = document.createDocumentFragment();
  dataRows.forEach((rowObj, idx) => {
    if(!rowMatchesFilters(rowObj)) return;
    shown++;
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const td = document.createElement('td');
      const key = h;
      const raw = rowObj[key];
      td.innerHTML = escapeHtml(raw);
      // Problems-like wrap
      const n = String(key||'').toLowerCase();
      if(/problem|issue|description|motorlocation|remarks|comment/.test(n)){
        td.setAttribute('data-col','Problems');
      } else {
        td.setAttribute('data-col', key);
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tableBody.appendChild(frag);
  totalRowsEl.textContent = dataRows.length;
  shownRowsEl.textContent = shown;
  statusMsg.textContent = shown === 0 ? 'No rows match filters' : 'Showing matching rows';
}

clearFiltersBtn.addEventListener('click', ()=>{
  // clear inputs and filters object
  filtersDiv.querySelectorAll('input').forEach(i=>i.value='');
  for(const k in filters) delete filters[k];
  renderFilteredTable();
});

async function loadAndBuild(){
  statusMsg.textContent = 'Loading sparelist...';
  try{
    const res = await fetch(SOURCE_URL);
    if(!res.ok) throw new Error('Fetch failed ' + res.status);
    const json = await res.json();
    // Many sheet JSONs put rows in json.rows or json.data. Expect array-of-arrays.
    if(Array.isArray(json.rows) && json.rows.length && Array.isArray(json.rows[0])){
      rawRows = json.rows;
    } else if(Array.isArray(json.data) && json.data.length && Array.isArray(json.data[0])){
      rawRows = json.data;
    } else if(Array.isArray(json) && json.length && Array.isArray(json[0])){
      rawRows = json;
    } else {
      // attempt detect first array
      let found = false;
      for(const k in json){
        if(Array.isArray(json[k]) && json[k].length && Array.isArray(json[k][0])){
          rawRows = json[k];
          found = true;
          break;
        }
      }
      if(!found){
        // maybe json.data is array of objects: convert to rows with headers (but user asked raw rows)
        if(Array.isArray(json.data) && json.data.length && typeof json.data[0] === 'object'){
          const keys = Object.keys(json.data[0]);
          rawRows = [keys];
          json.data.forEach(obj => rawRows.push(keys.map(k => obj[k] === undefined ? '' : obj[k])));
        } else {
          // fallback: try json.sheet or first array-of-objects
          let arrFound = null;
          for(const k in json) if(Array.isArray(json[k]) && json[k].length) { arrFound = json[k]; break; }
          if(arrFound && typeof arrFound[0] === 'object'){
            const keys = Object.keys(arrFound[0]);
            rawRows = [keys];
            arrFound.forEach(obj => rawRows.push(keys.map(k => obj[k] === undefined ? '' : obj[k])));
          } else {
            rawRows = [];
          }
        }
      }
    }

    if(!rawRows || rawRows.length === 0){
      statusMsg.textContent = 'No rows found in the JSON.';
      return;
    }

    // ensure we have enough rows
    if(rawRows.length <= HEADER_ROW_INDEX){
      statusMsg.textContent = `Not enough rows in JSON (need at least ${HEADER_ROW_INDEX+1}). Found ${rawRows.length}.`;
      return;
    }

    buildTableFromRawRows();
    createFilters();
    renderTableHeader();
    renderFilteredTable();
    statusMsg.textContent = 'Loaded';
  }catch(err){
    console.error(err);
    statusMsg.textContent = 'Load failed: ' + (err.message||err);
  }
}

loadAndBuild();

</script>
</body>
</html>
