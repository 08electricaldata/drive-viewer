<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Details — Debug</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f7ff;color:#102230}
  .wrap{max-width:1100px;margin:12px auto;padding:12px}
  .top-credit{background:#0b3b74;color:#fff;padding:8px;text-align:center;font-weight:700;margin-bottom:8px}
  .header{text-align:center;margin-bottom:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .btn{background:#fff;color:#0b3b74;padding:8px 10px;border-radius:8px;border:1px solid rgba(11,59,116,.12);cursor:pointer}
  .info{background:#fff;padding:10px;border-radius:8px;box-shadow:0 6px 20px rgba(3,63,136,0.04);margin-bottom:8px}
  details{margin-bottom:8px}
  summary{cursor:pointer;padding:8px;background:#eef6ff;border-radius:8px;font-weight:800;color:#0b3b74}
  pre{background:#0b2440;color:#dbe9ff;padding:8px;border-radius:6px;overflow:auto;font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{padding:6px;border:1px solid #e6edf6;text-align:left;font-size:13px}
  .no-data{padding:12px;color:#b91c1c;font-weight:700;text-align:center}
</style>
</head>
<body>
  <div class="top-credit">Designed & Maintained by RAKESH CHANDRA SETHY</div>
  <div class="wrap" id="app"><div class="info">Loading motor details and debugging info…</div></div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/drive.json";

function getID(){ return new URLSearchParams(location.search).get("id") || ""; }
function goBack(){ history.back(); }
function goHome(){ location.href = "https://08electricaldata.github.io/index_mob.html"; }
function goDrive(){ const id=getID(); if(!id) return; location.href = "https://08electricaldata.github.io/drive-viewer/index2.html?id=" + encodeURIComponent(id); }
function goPLC(){ const id=getID(); if(!id) return; location.href = "plc.html?id=" + encodeURIComponent(id); }

function safe(v){ return v===undefined || v===null ? "" : String(v); }
function escapeHtml(s){ return safe(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(v){ if(!v) return 'N/A'; const d=new Date(v); if(isNaN(d)) return v; return d.toLocaleDateString('en-GB'); }

async function loadMotorWithDebug(){
  const app = document.getElementById('app');
  const id = getID().trim();
  if(!id){ app.innerHTML = `<div class="no-data">No Drive ID supplied.</div>`; return; }

  try{
    const res = await fetch(JSON_URL);
    if(!res.ok) throw new Error('Failed to fetch JSON');
    const data = await res.json();

    // find row by equipment number (col index 3)
    let row = null; let rowIndex = -1;
    const rows = data.rows || [];
    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      if(String(r[3]||"").trim().toUpperCase() === id.toUpperCase()){
        row = r; rowIndex = i; break;
      }
    }

    // header area & toolbar
    let html = `
      <div class="header">
        <h2>MOTOR DETAILS — ${escapeHtml(id)}</h2>
        <div style="font-size:13px;color:#556">Last Updated: ${data.updated ? new Date(data.updated).toLocaleString('en-GB') : 'Unknown'}</div>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="goBack()">⬅ Back</button>
        <button class="btn" onclick="goHome()">🏠 Home</button>
        <button class="btn" onclick="goDrive()">Drive Info</button>
        <button class="btn" onclick="goPLC()">PLC</button>
      </div>
    `;

    if(!row){
      html += `<div class="no-data">Motor details not found for <b>${escapeHtml(id)}</b></div>`;
      app.innerHTML = html; return;
    }

    // compact display (same as before)
    const KW = safe(row[5]); const MAKE = safe(row[7]); const FRAME = safe(row[8]);
    const RPM = safe(row[9]); const FLC = safe(row[10]); const MTG = safe(row[11]);

    html += `<div class="info">
      <div style="font-weight:800;margin-bottom:6px">Summary</div>
      <div><strong>KW-${escapeHtml(KW)}</strong> , <strong>FRAME SIZE-${escapeHtml(FRAME)}</strong> , <strong>MAKE-${escapeHtml(MAKE)}</strong></div>
      <div style="margin-top:6px"><strong>RPM-${escapeHtml(RPM)}</strong> , <strong>FLC-${escapeHtml(FLC)}</strong> , <strong>MTG-${escapeHtml(MTG)}</strong></div>
    </div>`;

    // Spare and Pending original code is below — but we will show debug info first to find correct index
    // Debug block: show full row (indices -> values)
    html += `<details open><summary>Raw row data (index → value)</summary><div class="detail-body"><pre id="rawRow"></pre></div></details>`;

    // Show candidate indexes for "pending motors" (try 24,25,26,27,28)
    const candidates = [24,25,26,27,28];
    html += `<details><summary>Pending candidates (indices ${candidates.join(', ')})</summary><div class="detail-body" id="candidatesDiv"></div></details>`;

    // Show parsing attempts with common separators
    html += `<details><summary>Parsing attempts (separators @,|,;,/)</summary><div class="detail-body" id="parsingDiv"></div></details>`;

    app.innerHTML = html;

    // populate rawRow
    const rawPre = document.getElementById('rawRow');
    rawPre.textContent = JSON.stringify(row, null, 2);

    // populate candidatesDiv
    const candDiv = document.getElementById('candidatesDiv');
    candDiv.innerHTML = '';
    candidates.forEach(idx=>{
      const v = safe(row[idx]).trim();
      const p = document.createElement('div');
      p.style.marginBottom = '8px';
      p.innerHTML = `<strong>index ${idx}:</strong> ${v ? `<code style="background:#eee;padding:2px 4px;border-radius:4px">${escapeHtml(v)}</code>` : '<em>(empty)</em>'}`;
      candDiv.appendChild(p);
    });

    // parsing attempts: for each non-empty candidate show split by common separators
    const parsingDiv = document.getElementById('parsingDiv');
    parsingDiv.innerHTML = '';
    const seps = ['@','|',';','/'];
    candidates.forEach(idx=>{
      const v = safe(row[idx]).trim();
      if(!v) return;
      const block = document.createElement('div');
      block.style.marginBottom = '8px';
      block.innerHTML = `<strong>index ${idx} raw:</strong> <code style="background:#eee;padding:2px 4px;border-radius:4px">${escapeHtml(v)}</code>`;
      seps.forEach(sep=>{
        const parts = v.split(sep).map(s=>s.trim()).filter(Boolean);
        if(parts.length>1){
          const sample = parts.slice(0,5).map(p=>escapeHtml(p)).join(' | ');
          const node = document.createElement('div');
          node.style.fontSize='12px';
          node.style.marginTop='4px';
          node.innerHTML = `<em>sep "${sep}" → ${parts.length} items (sample):</em> <code style="background:#f6f9ff;padding:2px 4px;border-radius:4px">${sample}</code>`;
          block.appendChild(node);
        }
      });
      parsingDiv.appendChild(block);
    });

    // Now: fallback behavior — pick first non-empty candidate as pendingData (but show which chosen)
    let chosenIdx = null;
    for(const idx of candidates){
      if((safe(row[idx]).trim()) !== ""){
        chosenIdx = idx; break;
      }
    }

    const chosenInfo = document.createElement('div');
    chosenInfo.style.marginTop='8px';
    if(chosenIdx === null){
      chosenInfo.innerHTML = `<div style="color:#b91c1c;font-weight:700">No pending-candidate indexes (24..28) contain data. Please inspect "Raw row data" above to find the correct column.</div>`;
      app.appendChild(chosenInfo);
      return;
    } else {
      chosenInfo.innerHTML = `<div style="color:#0b3b74;font-weight:800">Using index ${chosenIdx} for Pending Motors (first non-empty candidate)</div>`;
      app.appendChild(chosenInfo);
    }

    // Parse chosen using @ separator if present, otherwise try | or ;
    const pendingRaw = safe(row[chosenIdx]).trim();
    let sepUsed = null;
    if(pendingRaw.includes('@')) sepUsed='@';
    else if(pendingRaw.includes('|')) sepUsed='|';
    else if(pendingRaw.includes(';')) sepUsed=';';
    else if(pendingRaw.includes('/')) sepUsed='/';
    else sepUsed = '@'; // default

    const pendingList = pendingRaw.split(sepUsed).map(s=>s.trim()).filter(Boolean);

    // Build compact pending table
    let pendHtml = `<details open><summary>Pending Motors at ERS — parsed (index ${chosenIdx}, sep="${sepUsed}")</summary><div class="detail-body">`;
    if(pendingList.length===0){
      pendHtml += `<div style="padding:8px;color:#666">No pending items found after parsing index ${chosenIdx}.</div>`;
    } else {
      pendHtml += `<table class="dense-table"><thead><tr><th style="width:28px">#</th><th>W/O</th><th>KW</th><th>MAKE</th><th>FRAME</th><th>RPM</th><th>MTG</th><th>DRIVE</th><th>LOC</th></tr></thead><tbody>`;
      pendingList.forEach((it, idx)=>{
        const parts = it.split('!').map(p=>p? p.trim() : '');
        pendHtml += `<tr><td>${idx+1}</td>
          <td>${escapeHtml(parts[0]||'')}</td>
          <td>${escapeHtml(parts[1]||'')}</td>
          <td>${escapeHtml(parts[2]||'')}</td>
          <td>${escapeHtml(parts[3]||'')}</td>
          <td>${escapeHtml(parts[4]||'')}</td>
          <td>${escapeHtml(parts[5]||'')}</td>
          <td>${escapeHtml(parts[6]||'')}</td>
          <td>${escapeHtml(parts[7]||'')}</td>
        </tr>`;
      });
      pendHtml += `</tbody></table>`;
    }
    pendHtml += `</div></details>`;

    app.insertAdjacentHTML('beforeend', pendHtml);

    // Also show Spare Motor parsing (same detection logic but check index 24)
    const spareRaw = safe(row[24]||"").trim();
    let spareHtml = `<details><summary>Spare Motor parsing (index 24)</summary><div class="detail-body">`;
    if(!spareRaw){
      spareHtml += `<div style="padding:8px;color:#666">No spare motor raw data (index 24 empty)</div>`;
    } else {
      const sepS = spareRaw.includes('@') ? '@' : (spareRaw.includes('|') ? '|' : (spareRaw.includes(';')?';':'@'));
      const spareList = spareRaw.split(sepS).map(s=>s.trim()).filter(Boolean);
      spareHtml += `<div style="font-size:13px;margin-bottom:6px">Detected sep "${sepS}", ${spareList.length} items</div>`;
      spareHtml += `<table class="dense-table"><thead><tr><th>#</th><th>W/O</th><th>KW</th><th>MAKE</th><th>FRAME</th><th>RPM</th><th>MTG</th><th>DRIVE</th><th>LOC</th></tr></thead><tbody>`;
      spareList.forEach((it, idx)=>{
        const parts = it.split('!').map(p=>p? p.trim() : '');
        spareHtml += `<tr><td>${idx+1}</td><td>${escapeHtml(parts[0]||'')}</td><td>${escapeHtml(parts[1]||'')}</td><td>${escapeHtml(parts[2]||'')}</td><td>${escapeHtml(parts[3]||'')}</td><td>${escapeHtml(parts[4]||'')}</td><td>${escapeHtml(parts[5]||'')}</td><td>${escapeHtml(parts[6]||'')}</td><td>${escapeHtml(parts[7]||'')}</td></tr>`;
      });
      spareHtml += `</tbody></table>`;
    }
    spareHtml += `</div></details>`;
    app.insertAdjacentHTML('beforeend', spareHtml);

    // Console log the row for developer inspection
    console.log("Found row (index " + rowIndex + "):", row);
    console.log("Pending candidate values:", candidates.map(i=>({index:i,value:row[i]})));

  } catch(err){
    console.error(err);
    app.innerHTML = `<div class="no-data">Error loading data: ${escapeHtml(err.message || String(err))}</div>`;
  }
}

loadMotorWithDebug();
</script>
</body>
</html>
