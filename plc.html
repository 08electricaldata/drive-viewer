<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLC Address Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg: #f6f9ff;
  --panel: #ffffff;
  --text: #0b2540;
  --muted: #6b7280;
  --accent: #1565d8;
  --accent-2: #0b79d0;
  --pill-border: rgba(21,101,216,0.18);
  --pill-bg: linear-gradient(180deg,#f8fbff,#eef6ff);
  --card-border: rgba(21,101,216,0.08);
  --shadow: 0 12px 30px rgba(11,37,64,0.06);
  --danger: #d32f2f;
}

/* Reset/base */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background: linear-gradient(180deg,#f7fbff 0%, var(--bg) 100%);
  color:var(--text);
  line-height:1.45;
}

/* Top credit stripe */
.top-credit{
  text-align:center;
  padding:10px;
  font-size:13px;
  background: linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  letter-spacing:0.4px;
  font-weight:700;
}

.version-info {
  display:inline-block;
  margin-left:12px;
  background:rgba(255,255,255,0.2); 
  color:white;
  padding:6px 10px; 
  border-radius:6px;
  font-size:12px; 
  font-weight:bold;
}

.status-indicator {
  display:inline-block; 
  width:8px; 
  height:8px;
  border-radius:50%; 
  background:#4caf50;
  margin-right:4px; 
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}

/* Page container */
.container{ max-width:1100px; margin:20px auto; padding:0 16px; }

/* Header area */
.header {
  text-align:center;
  margin:18px 0;
}
.header h2{
  margin:0;
  font-size:20px;
  font-weight:800;
  color:var(--accent);
}
.updated {
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
}

/* Button bar with modern buttons */
.button-bar{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.icon-btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border-radius:10px;
  background: linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  border:none;
  font-weight:700;
  cursor:pointer;
  box-shadow: 0 10px 26px rgba(21,101,216,0.12);
  transition: transform .14s ease, box-shadow .14s ease, opacity .12s;
}
.icon-btn:hover:not(:disabled){ transform: translateY(-3px); box-shadow: 0 18px 36px rgba(21,101,216,0.14); }
.icon-btn:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
.icon-btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px dashed rgba(21,101,216,0.12);
  box-shadow:none;
  font-weight:700;
}

/* Card container for content */
.card{
  position:relative;
  background:var(--panel);
  border-radius:12px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  border: 1px solid var(--card-border);
}

/* Accent stripe on left (cards) */
.card::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:6px;
  border-top-left-radius:12px;
  border-bottom-left-radius:12px;
  background: linear-gradient(180deg,var(--accent),var(--accent-2));
}

/* Section title (for tables) */
.section-title{
  font-weight:800;
  margin:12px 0;
  padding:10px 12px;
  border-radius:8px;
  background: linear-gradient(180deg,#f2f7ff,#eef6ff);
  border-left:4px solid var(--accent);
  color:var(--accent);
}

/* Loader / no-data */
.loader, .no-data {
  text-align:center;
  padding:36px;
  font-weight:700;
  color:var(--muted);
}

/* Signals table styles */
.table-wrap{ overflow:auto; border-radius:10px; border:1px solid rgba(11,37,64,0.04); }
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
  font-size:14px;
}
thead th{
  position:sticky;
  top:0;
  background: linear-gradient(180deg,var(--accent),var(--accent-2));
  color:#fff;
  padding:10px 12px;
  font-weight:800;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.06);
  z-index:10;
}
tbody td{
  padding:10px 12px;
  border-bottom:1px solid rgba(11,37,64,0.04);
  background:#fff;
  vertical-align:middle;
}
tbody tr:nth-child(even) td{ background:#fbfeff; }
tbody tr:hover td{ background:#f2f6ff; }

/* visible small board column width */
table th:nth-child(5),
table td:nth-child(5) { width:120px; }

/* TB No column — keep single line, no wrap, ellipsis if too long */
table th:nth-child(6),
table td:nth-child(6) {
  width:120px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: middle;
  text-align: center;
}

/* small badge link style */
.table-link{
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  background: rgba(21,101,216,0.08);
  color:var(--accent);
  font-weight:700;
  text-decoration:none;
  border:1px solid rgba(21,101,216,0.08);
}

/* Data pills (if you want to present small blocks) */
.pills {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
  gap:12px;
  margin-top:8px;
}
.pill {
  padding:12px;
  border-radius:10px;
  background: var(--pill-bg);
  border: 1.4px solid var(--pill-border);
  box-shadow: 0 8px 18px rgba(11,37,64,0.04), inset 0 1px 0 rgba(255,255,255,0.7);
  animation:fade-in 0.3s ease-out;
}
@keyframes fade-in { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
.pill .k { color:var(--accent); font-weight:800; display:block; margin-bottom:6px; }
.pill .v { font-weight:700; color:#0f2333; }

/* Responsive adjustments */
@media (max-width:980px){
  .container{ padding:0 12px; }
  table{ min-width:700px; font-size:13px; }
}
@media (max-width:640px){
  .header h2{ font-size:18px; }
  .icon-btn{ padding:8px 12px; font-size:13px; }
  table{ min-width:600px; font-size:12px; }
  .pills{ grid-template-columns: 1fr; }
  .version-info { display:block; margin-top:8px; margin-left:0; }
}
</style>
</head>

<body>

<div class="top-credit">
  Designed and Maintained by RAKESH CHANDRA SETHY
  <span class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></span>
</div>

<div class="container">
  <div id="app" class="card">
    <div class="loader">Loading PLC data…</div>
  </div>
</div>

<script>
/* ===== VERSION-BASED CACHE BUSTING ===== */
const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
const JSON_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/plc/plc.json";
const DRAWING_JSON = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drawings/drawings.json";

let currentVersion = "1.0.0";
const versionDisplayEl = document.getElementById("versionDisplay");

/* FETCH VERSION FOR CACHE BUSTING */
async function getVersion() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    currentVersion = data.version || "1.0.0";
    versionDisplayEl.textContent = currentVersion;
    console.log("✓ Version loaded:", currentVersion);
  } catch (err) {
    console.warn("Failed to load version file:", err);
    currentVersion = "1.0.0";
    versionDisplayEl.textContent = currentVersion;
  }
}

/* BUILD URLS WITH VERSION PARAM AND TIMESTAMP */
function buildUrl(baseUrl) {
  return `${baseUrl}?v=${currentVersion}&t=${Date.now()}`;
}

function getDriveFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

function goBack(){ window.history.back(); }

function goHome(){
  window.location.href = "https://08electricaldata.github.io/";
}

function goDriveInfo(){
  const id = getDriveFromURL();
  window.location.href =
  "https://08electricaldata.github.io/drive-viewer/index2.html?id=" +
  encodeURIComponent(id);
}

function goHistory(){
  const id = getDriveFromURL();
  window.location.href =
  "https://08electricaldata.github.io/drive-viewer/history.html?id=" +
  encodeURIComponent(id);
}

function goDrawing(){
  const id = getDriveFromURL();
  window.location.href =
  "https://08electricaldata.github.io/drive-viewer/drawing.html?id=" +
  encodeURIComponent(id);
}

let drawingAvailable = false;

async function checkDrawingAvailability(id){
  try {
    console.log("🎨 Checking drawing availability...");
    const startTime = performance.now();
    
    const j = await (await fetch(buildUrl(DRAWING_JSON))).json();
    const found = j.rows.find(r =>
      String(r.id || "").toUpperCase() === id.toUpperCase()
    );
    
    drawingAvailable = !!found;
    
    const loadTime = performance.now() - startTime;
    console.log(`✓ Drawing check completed in ${loadTime.toFixed(2)}ms (Available: ${drawingAvailable})`);
  } catch(e){
    console.error("Error checking drawing availability:", e);
    drawingAvailable = false;
  }
}

function escapeHtml(s){
  if(!s) return "";
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function createTableElement(title, dataArray){
  const showBoard = dataArray.some(row =>
    row.board && row.board.trim() !== ""
  );

  const card = document.createElement("div");
  card.className = "card";
  
  const sectionTitle = document.createElement("div");
  sectionTitle.className = "section-title";
  sectionTitle.textContent = title;
  card.appendChild(sectionTitle);

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  
  const table = document.createElement("table");
  table.setAttribute("aria-label", title);
  
  /* THEAD */
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");
  
  const headers = ["Signal", "Tag", "Address", "Description", "Panel", "TB No", "RL"];
  if(showBoard) headers.push("Board");
  
  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  
  /* TBODY */
  const tbody = document.createElement("tbody");
  const fragment = document.createDocumentFragment();
  
  dataArray.forEach(row => {
    const tr = document.createElement("tr");
    
    const cells = [
      row.signal || "",
      row.tag || "",
      row.address || "",
      row.description || "",
      row.panel || "",
      row.tb || "",
      row.rl || ""
    ];
    
    if(showBoard) cells.push(row.board || "");
    
    cells.forEach(cellText => {
      const td = document.createElement("td");
      td.textContent = cellText;
      tr.appendChild(td);
    });
    
    fragment.appendChild(tr);
  });
  
  tbody.appendChild(fragment);
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  
  return card;
}

async function loadPLC(){
  const app = document.getElementById("app");
  const driveID = getDriveFromURL();

  if(!driveID){
    app.innerHTML = "<div class='no-data'>No Drive ID provided in URL.</div>";
    return;
  }

  try {
    console.log(`⚡ Loading PLC data for ${driveID}...`);
    const startTime = performance.now();

    /* Parallel load version, drawing check, and PLC data */
    await getVersion();
    
    const [drawingCheckPromise, plcPromise] = await Promise.all([
      checkDrawingAvailability(driveID),
      fetch(buildUrl(JSON_URL)).then(r => {
        if(!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.json();
      })
    ]);

    const data = await plcPromise;
    const drive = data.drives[driveID.toUpperCase()];

    const loadTime = performance.now() - startTime;
    console.log(`✓ PLC data loaded in ${loadTime.toFixed(2)}ms`);

    /* Create app content using DocumentFragment */
    const fragment = document.createDocumentFragment();

    /* HEADER */
    const headerDiv = document.createElement("div");
    headerDiv.className = "header";
    const headerH2 = document.createElement("h2");
    headerH2.textContent = `PLC ADDRESS OF DRIVE — ${escapeHtml(driveID)}`;
    headerDiv.appendChild(headerH2);
    fragment.appendChild(headerDiv);

    /* BUTTONS */
    const buttonBar = document.createElement("div");
    buttonBar.className = "button-bar";
    buttonBar.style.justifyContent = "center";
    buttonBar.style.marginBottom = "8px";

    const buttons = [
      { text: "⬅ Back", onclick: "goBack()" },
      { text: "🏠 Home", onclick: "goHome()" },
      { text: "ℹ️ Drive Info", onclick: "goDriveInfo()" },
      { text: "📜 History", onclick: "goHistory()" },
      { text: "📐 Drawings", onclick: "goDrawing()", id: "drawBtn" }
    ];

    buttons.forEach(btn => {
      const button = document.createElement("button");
      button.className = "icon-btn";
      button.textContent = btn.text;
      button.onclick = eval(`() => ${btn.onclick}`);
      if(btn.id) button.id = btn.id;
      buttonBar.appendChild(button);
    });

    fragment.appendChild(buttonBar);

    /* UPDATED TIMESTAMP */
    if(data.updated){
      const updatedDiv = document.createElement("div");
      updatedDiv.className = "updated";
      updatedDiv.style.textAlign = "center";
      updatedDiv.style.marginBottom = "12px";
      updatedDiv.textContent = `Last Updated: ${new Date(data.updated).toLocaleString("en-GB")}`;
      fragment.appendChild(updatedDiv);
    }

    if(!drive){
      const noDriveDiv = document.createElement("div");
      noDriveDiv.className = "no-data";
      noDriveDiv.textContent = `No PLC data found for: ${escapeHtml(driveID)}`;
      fragment.appendChild(noDriveDiv);
      
      app.innerHTML = "";
      app.appendChild(fragment);
      
      if(!drawingAvailable){
        const btn = document.getElementById("drawBtn");
        if(btn) btn.disabled = true;
      }
      return;
    }

    /* META PILLS */
    const meta = drive.meta || {};
    const metaEntries = [];
    if(meta.model) metaEntries.push({k:"Model", v:meta.model});
    if(meta.manufacturer) metaEntries.push({k:"Manufacturer", v:meta.manufacturer});
    if(meta.note) metaEntries.push({k:"Note", v:meta.note});
    if(meta.address) metaEntries.push({k:"PLC Address", v:meta.address});

    if(metaEntries.length){
      const pillsDiv = document.createElement("div");
      pillsDiv.className = "pills";
      
      metaEntries.forEach(e => {
        const pill = document.createElement("div");
        pill.className = "pill";
        pill.innerHTML = `<div class="k">${escapeHtml(e.k)}</div><div class="v">${escapeHtml(e.v)}</div>`;
        pillsDiv.appendChild(pill);
      });
      
      fragment.appendChild(pillsDiv);
    }

    /* INPUTS TABLE */
    if(drive.inputs && drive.inputs.length){
      fragment.appendChild(createTableElement("INPUT SIGNALS", drive.inputs));
    } else {
      const noInputsCard = document.createElement("div");
      noInputsCard.className = "card";
      noInputsCard.innerHTML = "<div class='no-data'>No input signals available</div>";
      fragment.appendChild(noInputsCard);
    }

    /* OUTPUTS TABLE */
    if(drive.outputs && drive.outputs.length){
      fragment.appendChild(createTableElement("OUTPUT SIGNALS", drive.outputs));
    } else {
      const noOutputsCard = document.createElement("div");
      noOutputsCard.className = "card";
      noOutputsCard.innerHTML = "<div class='no-data'>No output signals available</div>";
      fragment.appendChild(noOutputsCard);
    }

    /* Replace app content */
    app.innerHTML = "";
    app.appendChild(fragment);

    /* Disable drawing button if not available */
    if(!drawingAvailable){
      const btn = document.getElementById("drawBtn");
      if(btn) btn.disabled = true;
    }

    console.log(`✓ PLC page rendered (Inputs: ${drive.inputs?.length || 0}, Outputs: ${drive.outputs?.length || 0})`);

  } catch(err){
    app.innerHTML = "<div class='no-data'>Error loading PLC JSON file.</div>";
    console.error("Error loading PLC data:", err);
  }
}

/* ===== INIT ===== */
(async function(){
  console.log("📥 Initializing PLC address viewer...");
  loadPLC();
})();

</script>

</body>
</html>
