<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Details</title>

<style>
:root{
  --bg: #f4f7ff;
  --panel: #ffffff;
  --text: #222222;
  --muted: #777777;
  --accent: #0d47a1;
  --accent-2: #1565c0;
  --border: #dddddd;
  --shadow: 0 0 10px rgba(0,0,0,.08);
  --danger: #d32f2f;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

.top-credit{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:13px;
  font-weight:bold;
  letter-spacing:0.4px;
}

.version-info {
  display:inline-block;
  margin-left:12px;
  background:rgba(255,255,255,0.2); 
  color:white;
  padding:6px 10px; 
  border-radius:6px;
  font-size:12px; 
  font-weight:bold;
}

.status-indicator {
  display:inline-block; 
  width:8px; 
  height:8px;
  border-radius:50%; 
  background:#4caf50;
  margin-right:4px; 
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}

.header-wrapper{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:30px;
  padding:20px;
}

.header-left{
  flex:1;
  text-align:center;
}

.header-left h2{
  color:var(--accent);
  margin-bottom:5px;
  font-size:22px;
  font-weight:800;
}

.header-left h3{
  color:var(--text);
  font-weight:normal;
  font-size:18px;
}

.updated{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

.header-right{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px 0;
  justify-content:flex-start;
}

.make-info-item{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:12px 16px;
  background:#eaf3ff;
  border-left:3px solid var(--accent);
  border-radius:6px;
  min-width:300px;
}

.make-info-label{
  font-weight:700;
  color:var(--accent);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.make-info-value{
  font-weight:700;
  color:var(--text);
  font-size:16px;
  min-height:18px;
  line-height:1.4;
}

.make-loading{
  color:var(--muted);
  font-style:italic;
  font-size:12px;
}

.button-bar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}

.button-bar button{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:#fff;
  border:none;
  padding:10px 18px;
  cursor:pointer;
  border-radius:5px;
  font-size:15px;
  font-weight:700;
  transition:transform .14s ease, box-shadow .14s ease;
  box-shadow:0 4px 12px rgba(13,71,161,0.15);
}

.button-bar button:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(13,71,161,0.25);
}

.container{width:95%;max-width:1100px;margin:auto;padding-bottom:30px;}

.section-title{
  font-weight:800;
  margin:20px 0 12px 0;
  padding:10px 12px;
  border-radius:8px;
  background:linear-gradient(180deg,#f2f7ff,#eef6ff);
  border-left:4px solid var(--accent);
  color:var(--accent);
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--panel);
  box-shadow:var(--shadow);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:18px;
  animation:fade-in 0.3s ease-out;
}
@keyframes fade-in { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

th{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:white;
  padding:12px;
  font-weight:800;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid var(--border);
  word-break:break-word;
}

tr:nth-child(even) td{background:#fbfcff;}
tr:hover td{background:#f2f6ff;}
tbody tr:last-child td{border-bottom:none;}

.loader{
  padding:40px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:var(--muted);
}

.no-data{
  padding:30px;
  text-align:center;
  color:var(--danger);
  font-size:18px;
  font-weight:bold;
}

@media(max-width:1000px){
  .header-wrapper{
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .header-right{
    width:100%;
  }
  .make-info-item{
    width:100%;
  }
}

@media(max-width:700px){
  table{font-size:12px;}
  th, td{padding:8px;}
  .button-bar{margin:10px 0;}
  .button-bar button{flex:1;min-width:120px;}
  .version-info { display:block; margin-top:8px; margin-left:0; }
  .header-left h2{font-size:20px;}
  .header-left h3{font-size:16px;}
  .make-info-item{min-width:auto;}
  .make-info-value{font-size:14px;}
}
</style>
</head>

<body>

<div class="top-credit">
  Designed & Maintained by RAKESH CHANDRA SETHY
  <span class="version-info"><span class="status-indicator"></span>V: <span id="versionDisplay">—</span></span>
</div>

<div class="container">
  <div id="app">
    <div class="loader">Loading Motor Details…</div>
  </div>
</div>

<script>

/* ===== VERSION-BASED CACHE BUSTING ===== */
const VERSION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/version.json";
const JSON_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/drive.json";
const MOTOR_TRANSACTION_URL = "https://cdn.jsdelivr.net/gh/08electricaldata/08electricaldata-json@main/master/motor_transaction.json";

let currentVersion = "1.0.0";
const versionDisplayEl = document.getElementById("versionDisplay");

let transactionTrMap = new Map();

async function getVersion() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    currentVersion = data.version || "1.0.0";
    versionDisplayEl.textContent = currentVersion;
    console.log("✓ Version loaded:", currentVersion);
  } catch (err) {
    console.warn("Failed to load version file:", err);
    currentVersion = "1.0.0";
    versionDisplayEl.textContent = currentVersion;
  }
}

function buildUrl(baseUrl) {
  return `${baseUrl}?v=${currentVersion}&t=${Date.now()}`;
}

function getID(){ return new URLSearchParams(window.location.search).get("id"); }
function goBack(){ history.back(); }
function goHome(){ window.location.href="https://08electricaldata.github.io/"; }
function goPLC(){ window.location.href="plc.html?id="+encodeURIComponent(getID()); }
function goDrive(){ window.location.href="index2.html?id="+encodeURIComponent(getID()); }
function goHistory(){ window.location.href="history.html?id="+encodeURIComponent(getID()); }

function escapeHtml(s){
  if(!s) return "";
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function formatDate(v){
  if(!v) return "N/A";
  const d = new Date(v);
  if(isNaN(d)) return escapeHtml(v);
  return d.toLocaleDateString("en-GB");
}

function getNormalizedText(v){
  return String(v ?? "").trim().toLowerCase().replace(/\s+/g, " ").replace(/[^a-z0-9]/g, "");
}

function getJsonRows(json){
  if (!json) return [];
  if (Array.isArray(json)) return json;
  if (Array.isArray(json.rows)) return json.rows;
  if (Array.isArray(json.data)) return json.data;
  if (json.table && Array.isArray(json.table.rows)) return json.table.rows;
  return [];
}

function getRowCellValue(row, index){
  if (Array.isArray(row)) return row[index];
  if (row && typeof row === "object") {
    const candidates = [
      Object.keys(row)[index],
      ["W.O No", "W.O number", "W.O#", "W.ONo", "WO No", "WO Number", "WONo"][index] || null
    ];
    for (const key of candidates) {
      if (key && Object.prototype.hasOwnProperty.call(row, key)) return row[key];
    }
  }
  return "";
}

// Build TR map from motor_transaction.json
async function loadTransactionTrMap(){
  try{
    const res = await fetch(buildUrl(MOTOR_TRANSACTION_URL));
    if (!res.ok) throw new Error("Transaction JSON fetch failed");
    const json = await res.json();
    const rows = getJsonRows(json);

    const map = new Map();

    rows.forEach((row) => {
      const trNo = getRowCellValue(row, 0);
      const woNo = getRowCellValue(row, 2);

      if (trNo && woNo) {
        map.set(getNormalizedText(woNo), String(trNo).trim());
      }
    });

    transactionTrMap = map;
    console.log("✓ Loaded TR map entries:", transactionTrMap.size);
  } catch (err) {
    console.error("loadTransactionTrMap error:", err);
    transactionTrMap = new Map();
  }
}

function createTableElement(title, headers, rows){
  const card = document.createElement("div");
  
  if(title){
    const sectionTitle = document.createElement("h2");
    sectionTitle.className = "section-title";
    sectionTitle.textContent = title;
    card.appendChild(sectionTitle);
  }

  const table = document.createElement("table");
  
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");
  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  
  const tbody = document.createElement("tbody");
  const fragment = document.createDocumentFragment();
  
  if(rows.length === 0){
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = headers.length;
    td.textContent = "No data available";
    td.style.textAlign = "center";
    td.style.color = "#999";
    tr.appendChild(td);
    fragment.appendChild(tr);
  } else {
    rows.forEach(row => {
      const tr = document.createElement("tr");
      row.forEach(cellText => {
        const td = document.createElement("td");
        td.textContent = cellText;
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });
  }
  
  tbody.appendChild(fragment);
  table.appendChild(tbody);
  card.appendChild(table);
  
  return card;
}

/* ===== FETCH CURRENT MAKE FROM SHEET ===== */
async function fetchCurrentMakeData(driveID) {
  try {
    const id = String(driveID || "").trim();
    console.log("=== FETCH CURRENT MAKE ===");
    console.log("Drive ID:", id);

    if (!id) return { columnL: "N/A", extracted: "N/A" };

    const idx = id.indexOf("-");
    if (idx === -1) return { columnL: "N/A", extracted: "N/A" };

    const colB = id.substring(0, idx).trim();
    const colC = id.substring(idx + 1).trim();

    console.log("Parsed - B:", colB, "C:", colC);

    const sheetUrl =
      `https://docs.google.com/spreadsheets/d/12cQ1EiZjDm9hbPU30aLGR7DFbbWqEpASAIabCbDXiEI/gviz/tq` +
      `?gid=1041736083&tqx=out:json&t=${Date.now()}`;

    const response = await fetch(sheetUrl, { mode: "cors" });
    if (!response.ok) {
      console.warn("Sheet fetch failed:", response.status);
      return { columnL: "N/A", extracted: "N/A" };
    }

    const text = await response.text();
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}") + 1;

    if (start === -1 || end <= start) {
      console.warn("No JSON in response");
      return { columnL: "N/A", extracted: "N/A" };
    }

    const json = JSON.parse(text.substring(start, end));
    const rows = json?.table?.rows || [];

    let matchedRow = null;

    for (const row of rows) {
      const cells = row.c || [];
      const bValue = String(cells[1]?.v || "").trim();
      const cValue = String(cells[2]?.v || "").trim();

      if (bValue.toUpperCase() === colB.toUpperCase() && 
          cValue.toUpperCase() === colC.toUpperCase()) {
        matchedRow = row;
        break;
      }
    }

    if (!matchedRow) {
      console.warn("No row match");
      return { columnL: "N/A", extracted: "N/A" };
    }

    const cells = matchedRow.c || [];
    const rawColumnL = String(cells[11]?.v || "").trim();
    const extracted = extractMakeValue(rawColumnL);

    return {
      columnL: rawColumnL || "N/A",
      extracted: extracted || "N/A"
    };

  } catch (err) {
    console.error("fetchCurrentMakeData error:", err);
    return { columnL: "N/A", extracted: "N/A" };
  }
}

function extractMakeValue(fullString) {
  const value = String(fullString || "").trim();
  if (!value || value === "N/A") return "N/A";

  const parts = value.split("-");
  if (parts.length >= 3) {
    return parts[2].trim();
  }

  return value;
}

function parsePartsFromItemString(item){
  if (!item) return [];
  return String(item).split("!").map(v => String(v).trim());
}

function getTrNoFromWo(woNo){
  if (!woNo) return "";
  const key = getNormalizedText(woNo);
  return transactionTrMap.get(key) || "";
}

async function loadMotor(){
  const app = document.getElementById("app");
  const id = getID();

  if(!id){
    app.innerHTML = "<div class='no-data'>No Drive ID supplied.</div>";
    return;
  }

  try{
    console.log(`⚡ Loading Motor details for ${id}...`);
    const startTime = performance.now();

    await getVersion();
    await loadTransactionTrMap();

    const response = await fetch(buildUrl(JSON_URL));
    if(!response.ok) throw new Error("Unable to fetch JSON");

    const data = await response.json();
    let row = null;

    for(const r of data.rows){
      if(String(r[3]||"").trim().toUpperCase() === id.trim().toUpperCase()){
        row = r;
        break;
      }
    }

    const loadTime = performance.now() - startTime;
    console.log(`✓ Motor data loaded in ${loadTime.toFixed(2)}ms`);

    const fragment = document.createDocumentFragment();

    const headerWrapper = document.createElement("div");
    headerWrapper.className = "header-wrapper";

    const headerLeft = document.createElement("div");
    headerLeft.className = "header-left";
    
    const h2 = document.createElement("h2");
    h2.textContent = "MOTOR DETAILS";
    headerLeft.appendChild(h2);
    
    const h3 = document.createElement("h3");
    h3.textContent = escapeHtml(id);
    headerLeft.appendChild(h3);
    
    const updatedDiv = document.createElement("div");
    updatedDiv.className = "updated";
    updatedDiv.textContent = "Last Updated : " + new Date(data.updated).toLocaleString("en-GB");
    headerLeft.appendChild(updatedDiv);

    const headerRight = document.createElement("div");
    headerRight.className = "header-right";

    const makeItem = document.createElement("div");
    makeItem.className = "make-info-item";
    
    const makeLabel = document.createElement("div");
    makeLabel.className = "make-info-label";
    makeLabel.textContent = "Current Make:";
    makeItem.appendChild(makeLabel);
    
    const makeValue = document.createElement("div");
    makeValue.id = "extractedMakeValue";
    makeValue.className = "make-info-value make-loading";
    makeValue.textContent = "Loading...";
    makeItem.appendChild(makeValue);

    headerRight.appendChild(makeItem);

    headerWrapper.appendChild(headerLeft);
    headerWrapper.appendChild(headerRight);
    fragment.appendChild(headerWrapper);

    const buttonBar = document.createElement("div");
    buttonBar.className = "button-bar";
    
    const buttons = [
      { text: "⬅ Back", fn: goBack },
      { text: "🏠 Home", fn: goHome },
      { text: "ℹ️ Drive Info", fn: goDrive },
      { text: "📜 History", fn: goHistory },
      { text: "⚡ PLC", fn: goPLC }
    ];
    
    buttons.forEach(btn => {
      const button = document.createElement("button");
      button.textContent = btn.text;
      button.onclick = btn.fn;
      buttonBar.appendChild(button);
    });
    
    fragment.appendChild(buttonBar);

    if(!row){
      const noDriveDiv = document.createElement("div");
      noDriveDiv.className = "no-data";
      noDriveDiv.textContent = "Motor details not found for " + escapeHtml(id);
      fragment.appendChild(noDriveDiv);
      
      app.innerHTML = "";
      app.appendChild(fragment);
      console.warn("No motor found for:", id);
      return;
    }

    const motorHeaders = ["KW", "MAKE", "FRAME SIZE", "RPM", "FLC", "MTG"];
    const motorRows = [[
      escapeHtml(row[5] || ""),
      escapeHtml(row[7] || ""),
      escapeHtml(row[8] || ""),
      escapeHtml(row[9] || ""),
      escapeHtml(row[10] || ""),
      escapeHtml(row[11] || "")
    ]];
    
    fragment.appendChild(createTableElement(null, motorHeaders, motorRows));

    const replacementHeaders = ["Last Motor Replacement", "MOTOR REPLACE DETAILS", "Last Motor PM"];
    const replacementRows = [[
      formatDate(row[37]), 
      "Loading...",
      formatDate(row[38])
    ]];
    const replacementTable = createTableElement(null, replacementHeaders, replacementRows);
    fragment.appendChild(replacementTable);

    const spareHeaders = ["Sl No.", "W/O number", "KW", "MAKE", "FRAME", "RPM", "MTG", "DRIVE", "LOCATION", "TR No"];
    const spareRows = [];
    const spareData = (row[24] || "").trim();
    if(spareData){
      const spareList = spareData.split("@");
      spareList.forEach((item, index) => {
        const parts = parsePartsFromItemString(item);

        const rowData = [String(index + 1)];

        const woNo = (parts[0] || "").trim();
        const kw = (parts[1] || "").trim();
        const make = (parts[2] || "").trim();
        const frame = (parts[3] || "").trim();
        const rpm = (parts[4] || "").trim();
        const mtg = (parts[5] || "").trim();
        const drive = (parts[6] || "").trim();
        const location = (parts[7] || "").trim();
        const trNo = getTrNoFromWo(woNo);

        rowData.push(
          escapeHtml(woNo),
          escapeHtml(kw),
          escapeHtml(make),
          escapeHtml(frame),
          escapeHtml(rpm),
          escapeHtml(mtg),
          escapeHtml(drive),
          escapeHtml(location),
          escapeHtml(trNo)
        );

        spareRows.push(rowData);
      });
    }
    fragment.appendChild(createTableElement("Spare Motor Details", spareHeaders, spareRows));

    const pendingHeaders = ["Sl No.", "W/O Number", "KW", "MAKE", "FRAME", "RPM", "MTG", "DRIVE", "LOCATION", "TR No"];
    const pendingRows = [];
    const pendingData = (row[26] || "").trim();
    if(pendingData){
      const pendingList = pendingData.split("@");
      pendingList.forEach((item, index) => {
        const parts = parsePartsFromItemString(item);

        const rowData = [String(index + 1)];

        const woNo = (parts[0] || "").trim();
        const kw = (parts[1] || "").trim();
        const make = (parts[2] || "").trim();
        const frame = (parts[3] || "").trim();
        const rpm = (parts[4] || "").trim();
        const mtg = (parts[5] || "").trim();
        const drive = (parts[6] || "").trim();
        const location = (parts[7] || "").trim();
        const trNo = getTrNoFromWo(woNo);

        rowData.push(
          escapeHtml(woNo),
          escapeHtml(kw),
          escapeHtml(make),
          escapeHtml(frame),
          escapeHtml(rpm),
          escapeHtml(mtg),
          escapeHtml(drive),
          escapeHtml(location),
          escapeHtml(trNo)
        );

        pendingRows.push(rowData);
      });
    }
    fragment.appendChild(createTableElement("Pending Motors at ERS", pendingHeaders, pendingRows));

    app.innerHTML = "";
    app.appendChild(fragment);

    const makeData = await fetchCurrentMakeData(id);

    const extractedEl = document.getElementById("extractedMakeValue");
    if (extractedEl) {
      extractedEl.textContent = escapeHtml(makeData.extracted);
      extractedEl.classList.remove("make-loading");
    }

    const columnLCell = replacementTable.querySelector("tbody tr td:nth-child(2)");
    if (columnLCell) {
      columnLCell.textContent = escapeHtml(makeData.columnL);
    }

  } catch(err){
    console.error("Error loading motor details:", err);
    app.innerHTML = `<div class='no-data'>Unable to load Motor Details.<br><br>${escapeHtml(err.message)}</div>`;
  }
}

(async function(){
  console.log("📥 Initializing Motor details viewer...");
  loadMotor();
})();
</script>

</body>
</html>
